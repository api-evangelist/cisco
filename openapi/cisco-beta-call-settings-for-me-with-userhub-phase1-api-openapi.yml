        alertType:
          type: string
          enum:
          - SILENT
          - RING_SPLASH
          description: " * `SILENT` - No audible alert is provided for executive screening.\n * `RING_SPLASH` - A short ring (splash) is used as an alert for executive screening.\n"
        alertAnywhereLocationEnabled:
          type: boolean
          description: Indicates if alerts are enabled for Single Number Reach locations.
        alertMobilityLocationEnabled:
