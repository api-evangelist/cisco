components:
  schemas:
    DoNotDisturbPut:
      type: object
      description: Request body for configuring Do Not Disturb settings for a person.
      required:
      - webexGoOverrideEnabled
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if the Do Not Disturb feature is enabled.'
        ringSplashEnabled:
          type: boolean
          description: Enables a Ring Reminder to play a brief tone on your desktop phone when you receive incoming calls.
        webexGoOverrideEnabled:
          type: boolean
          description: '`true` if a mobile device will still ring even if Do Not Disturb is enabled.'
    ExecutiveScreeningPut:
      type: object
      description: Executive screening settings request object for updating call screening and alert preferences.
      properties:
        enabled:
          type: boolean
          description: Set to enable or disable executive screening.
        alertType:
          type: string
          enum:
          - SILENT
          - RING_SPLASH
          description: " * `SILENT` - No audible alert is provided for executive screening.\n * `RING_SPLASH` - A short ring (splash) is used as an alert for executive screening.\n"
        alertAnywhereLocationEnabled:
          type: boolean
          description: Indicates if alerts are enabled for Single Number Reach locations.
        alertMobilityLocationEnabled:
          type: boolean
          description: Indicates if alerts are enabled for Webex Go locations.
        alertSharedCallAppearanceLocationEnabled:
          type: boolean
          description: Indicates if alerts are enabled for Shared Call Appearance locations.
      example:
        enabled: true
        alertType: SILENT
        alertAnywhereLocationEnabled: false
        alertMobilityLocationEnabled: false
        alertSharedCallAppearanceLocationEnabled: false
    ExecutiveCallFilteringCriteriaPatch:
      type: object
      description: Executive call filtering criteria settings request object for updating detailed filter rules and routing configuration.
      properties:
        scheduleName:
          type: string
          description: Name of the schedule associated with this criteria.
        scheduleType:
          type: string
          enum:
          - holidays
          - businessHours
          description: " * `businessHours` - The schedule type that specifies the business or working hours during the day.\n * `holidays` - The schedule type that specifies the day when your organization is not open.\n"
        scheduleLevel:
          type: string
          enum:
          - PEOPLE
          - GROUP
          description: " * `PEOPLE` - The schedule level that specifies that criteria is of People level.\n * `GROUP` - The schedule level that specifies that criteria is of Group (Location) level.\n"
        callsFrom:
          type: string
          enum:
          - ANY_PHONE_NUMBER
          - SELECT_PHONE_NUMBERS
          - ANY_INTERNAL
          - ANY_EXTERNAL
          description: " * `ANY_PHONE_NUMBER` - The criteria applies to any phone number.\n * `SELECT_PHONE_NUMBERS` - The criteria applies to selected phone numbers.\n * `ANY_INTERNAL` - The criteria applies to any internal number.\n * `ANY_EXTERNAL` - The criteria applies to any external number.\n"
        anonymousCallersEnabled:
          type: boolean
          description: Set to enable or disable the criteria for anonymous callers.
        unavailableCallersEnabled:
          type: boolean
          description: Set to enable or disable the criteria for unavailable callers.
        phoneNumbers:
          type: array
          description: The list of phone numbers that this filtering criteria applies to, when `callsFrom` is set to `SELECT_PHONE_NUMBERS`.
          items:
            type: string
            description: Phone number that the criteria applies to based on `callsFrom` selection.
        filterEnabled:
          type: boolean
          description: Controls the action when this criteria matches a call. When `true`, matching calls are filtered and will alert the executive's assistants. When `false`, matching calls are not filtered and will not alert the executive's assistants. Criteria with `filterEnabled` as `false` take precedence over other filtering criteria with `filterEnabled` as `true`, allowing exceptions where certain calls are not filtered to the executive's assistants.
        callsToNumbers:
          type: array
          description: List of numbers for the executive that will match the criteria when called. This may include the executive’s primary number and/or extension, as well as secondary (alternate) numbers (and associated extensions). If the list is empty, any number or extension for the executive matches the criteria when called. If the list is not empty, only the specified numbers and their extensions match the criteria.
          items:
            type: object
            description: Executive phone number that will match the criteria when called.
            properties:
              type:
                type: string
                enum:
                - PRIMARY
                - ALTERNATE
                description: " * `PRIMARY` - Number is assigned as primary to executive.\n * `ALTERNATE` - Number is assigned as alternate (secondary) to the executive.\n"
              phoneNumber:
                type: string
                description: The phone number assigned to the executive that will be used to match criteria.
    ExecutiveAlertPut:
      type: object
      properties:
        alertingMode:
          type: string
          enum:
          - SEQUENTIAL
          - SIMULTANEOUS
          description: " * `SEQUENTIAL` - Alerts assistants one at a time in the defined order.\n * `SIMULTANEOUS` - Alerts all assistants at the same time.\n"
        nextAssistantNumberOfRings:
          type: integer
          description: Number of rings before alerting the next assistant when `alertingMode` is `SEQUENTIAL`.
        rolloverEnabled:
          type: boolean
          description: Controls whether the rollover timer (`rolloverWaitTimeInSecs`) is enabled. When set to `true`, rollover will trigger after the timer expires, even if assistants are still available. When `false`, rollover only occurs when no assistants remain.
        rolloverAction:
          type: string
          enum:
          - VOICE_MESSAGING
          - NO_ANSWER_PROCESSING
          - FORWARD
          description: "Specifies what happens when rollover is triggered.\n * `VOICE_MESSAGING` - The call is sent to the executive's voicemail.\n * `FORWARD` - The call is forwarded to the specified destination (`rolloverForwardToPhoneNumber`).\n * `NO_ANSWER_PROCESSING` - The call is sent to no answer processing which may trigger executive services such as call forwarding or voicemail.\nRollover is always triggered when no assistants remain for a filtered call. If the rollover timer is enabled, rollover can also be triggered when the timer expires, even if assistants are still available."
        rolloverForwardToPhoneNumber:
          type: string
          description: Phone number to forward calls to when rollover action is set to `FORWARD`.
        rolloverWaitTimeInSecs:
          type: integer
          description: Time in seconds to wait before applying the rollover action when `rolloverEnabled` is `true`.
        clidNameMode:
          type: string
          enum:
          - EXECUTIVE_ORIGINATOR
          - ORIGINATOR_EXECUTIVE
          - EXECUTIVE
          - ORIGINATOR
          - CUSTOM
          description: "Controls how Caller ID name is displayed on assistant's phone.\n * `EXECUTIVE_ORIGINATOR` - Display executive name followed by caller name.\n * `ORIGINATOR_EXECUTIVE` - Display caller name followed by executive name.\n * `EXECUTIVE` - Display only executive name.\n * `ORIGINATOR` - Display only caller name.\n * `CUSTOM` - Display a custom name.\n"
        customCLIDName:
          type: string
          description: Custom caller ID name to display when `clidNameMode` is set to `CUSTOM` (deprecated).
        customCLIDNameInUnicode:
          type: string
          description: Unicode Custom caller ID name to display when `clidNameMode` is set to `CUSTOM`.
        clidPhoneNumberMode:
          type: string
          enum:
          - EXECUTIVE
          - ORIGINATOR
          - CUSTOM
          description: "Controls which Caller ID phone number is displayed on assistant's phone.\n * `EXECUTIVE` - Display executive's phone number.\n * `ORIGINATOR` - Display caller's phone number.\n * `CUSTOM` - Display a custom phone number.\n"
        customCLIDPhoneNumber:
          type: string
          description: Custom caller ID phone number to display on assistant's phone when `clidPhoneNumberMode` is set to `CUSTOM`.
    ExecutiveAlertGet:
      type: object
      required:
      - alertingMode
      - rolloverWaitTimeInSecs
      - clidNameMode
      - clidPhoneNumberMode
      properties:
        alertingMode:
          type: string
          enum:
          - SEQUENTIAL
          - SIMULTANEOUS
          description: " * `SEQUENTIAL` - Alerts assistants one at a time in the defined order.\n * `SIMULTANEOUS` - Alerts all assistants at the same time.\n"
        nextAssistantNumberOfRings:
          type: integer
          description: Number of rings before alerting the next assistant when `alertingMode` is `SEQUENTIAL`.
        rolloverEnabled:
          type: boolean
          description: Controls whether the rollover timer (`rolloverWaitTimeInSecs`) is enabled. When set to `true`, rollover will trigger after the timer expires, even if assistants are still available. When `false`, rollover only occurs when no assistants remain.
        rolloverAction:
          type: string
          enum:
          - VOICE_MESSAGING
          - NO_ANSWER_PROCESSING
          - FORWARD
          description: "Specifies what happens when rollover is triggered.\n * `VOICE_MESSAGING` - The call is sent to the executive's voicemail.\n * `FORWARD` - The call is forwarded to the specified destination (`rolloverForwardToPhoneNumber`).\n * `NO_ANSWER_PROCESSING` - The call is sent to no answer processing which may trigger executive services such as call forwarding or voicemail.\nRollover is always triggered when no assistants remain for a filtered call. If the rollover timer is enabled, rollover can also be triggered when the timer expires, even if assistants are still available."
        rolloverForwardToPhoneNumber:
          type: string
          description: Phone number to forward calls to when rollover action is set to `FORWARD`.
        rolloverWaitTimeInSecs:
          type: integer
          description: Time in seconds to wait before applying the rollover action when `rolloverEnabled` is `true`.
        clidNameMode:
          type: string
          enum:
          - EXECUTIVE_ORIGINATOR
          - ORIGINATOR_EXECUTIVE
          - EXECUTIVE
          - ORIGINATOR
          - CUSTOM
          description: "Controls how Caller ID name is displayed on assistant's phone.\n * `EXECUTIVE_ORIGINATOR` - Display executive name followed by caller name.\n * `ORIGINATOR_EXECUTIVE` - Display caller name followed by executive name.\n * `EXECUTIVE` - Display only executive name.\n * `ORIGINATOR` - Display only caller name.\n * `CUSTOM` - Display a custom name.\n"
        customCLIDName:
          type: string
          description: Custom caller ID name to display when `clidNameMode` is set to `CUSTOM` (deprecated).
        customCLIDNameInUnicode:
          type: string
          description: Unicode Custom caller ID name to display when `clidNameMode` is set to `CUSTOM`.
        clidPhoneNumberMode:
          type: string
          enum:
          - EXECUTIVE
          - ORIGINATOR
          - CUSTOM
          description: "Controls which Caller ID phone number is displayed on assistant's phone.\n * `EXECUTIVE` - Display executive's phone number.\n * `ORIGINATOR` - Display caller's phone number.\n * `CUSTOM` - Display a custom phone number.\n"
        customCLIDPhoneNumber:
          type: string
          description: Custom caller ID phone number to display on assistant's phone when `clidPhoneNumberMode` is set to `CUSTOM`.
      example:
        alertingMode: SEQUENTIAL
        nextAssistantNumberOfRings: 3
        rolloverEnabled: true
