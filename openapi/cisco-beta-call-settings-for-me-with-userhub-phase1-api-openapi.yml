    ExecutiveScreeningGet:
      type: object
      description: Executive screening settings response object containing configuration for call screening and alert preferences.
      required:
      - enabled
      - alertType
      - alertAnywhereLocationEnabled
      - alertMobilityLocationEnabled
      - alertSharedCallAppearanceLocationEnabled
