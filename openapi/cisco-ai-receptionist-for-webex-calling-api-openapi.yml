components:
  schemas:
    KnowledgeBaseDocument:
      type: object
      description: A knowledge base document retrieved during tool execution.
      properties:
        id:
          type: string
          description: Unique identifier of the knowledge base document.
        name:
          type: string
          description: Name or filename of the knowledge base document.
        score:
          type: number
          description: Relevance score of the document.
        text:
          type: string
          description: Extracted text content from the document.
    AiEngine:
      type: object
      required:
      - name
      - voices
      properties:
        name:
          type: string
          description: 'AI engine name.

            - PRO — Available in all supported countries.

            - PRO_US — Available in the United States only.'
          enum:
          - PRO
          - PRO_US
          example: PRO
        voices:
          type: array
          items:
            $ref: '#/components/schemas/Voice'
          description: List of available voices for this AI engine.
    IntentTransferTo:
      type: object
      required:
      - contactType
      properties:
        contactType:
          type: string
          description: 'Type of transfer destination.

            - PEOPLE - A person in the organization.

            - RESOURCE_GROUP - A group resource such as a call queue or hunt group.

            - CONTACT - An organization contact.

            - PHONE_NUMBER - A raw phone number or extension.'
          enum:
          - PEOPLE
          - RESOURCE_GROUP
          - CONTACT
          - PHONE_NUMBER
          example: RESOURCE_GROUP
        contactId:
          type: string
          description: Unique identifier for the transfer destination, encoded using the resource type indicated by contactType (PEOPLE, RESOURCE_GROUP, or CONTACT). Not required when contactType is PHONE_NUMBER.
          example: Y2lzY29zcGFyazovL3VzL1JFU09VUkNFX0dST1VQL2Y0MWNkMDUxLTgxN2YtNGQ4MS1hMWNlLTBmZDM5YzFlN2I5Zg
        name:
          type: string
          description: Name of the calling service or contact.
          example: RS Call Queue
        phoneNumber:
          type: string
          description: Phone number of calling service or contact.
          example: '+4765241628'
    IntentTransferToDetails:
      type: object
      description: Transfer destination details for the intent.
      required:
      - contactType
      properties:
        contactType:
          type: string
          description: 'Contact type.

            - PEOPLE - A person in the organization.

            - RESOURCE_GROUP - A group resource such as a call queue or hunt group.

            - CONTACT - An organization contact.

            - PHONE_NUMBER - A raw phone number or extension.'
          enum:
          - PEOPLE
          - RESOURCE_GROUP
          - CONTACT
          - PHONE_NUMBER
          example: PEOPLE
        contactId:
          type: string
          description: Unique identifier for the transfer destination, encoded using the resource type indicated by contactType (PEOPLE, RESOURCE_GROUP, or CONTACT). Not required when contactType is PHONE_NUMBER.
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNDFjZDA1MS04MTdmLTRkODEtYTFjZS0wZmQzOWMxZTdiOWY
        name:
          type: string
          description: Name of the calling service or contact.
          example: John Doe
        phoneNumber:
          type: string
          description: Phone number of calling service or contact.
          example: '+4765241628'
    DirectLineCallerIdName:
      type: object
      required:
      - directLineCallerIdNameSelection
      properties:
        directLineCallerIdNameSelection:
          type: string
          description: 'Field to indicate the option chosen to represent the Caller ID:


            - `DISPLAY_NAME` - Use the AI Receptionist display name as the caller ID.

            - `CUSTOM_NAME` - Use a custom name as the caller ID.'
          enum:
          - DISPLAY_NAME
          - CUSTOM_NAME
          example: CUSTOM_NAME
        customName:
          type: string
          minLength: 1
          maxLength: 50
          description: Carries the customized name when "CUSTOM_NAME" is the chosen option. It can be empty if it's not configured.
          example: Shine Clinic
    CreateAiReceptionistResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: AI Receptionist ID encoded using the Resource Type.
          example: Y2lzY29zcGFyazovL3VzL0FJX1JFQ0VQVElPTklTVC82MDEyNGU1MC03MWNkLTQ2N2QtODkzZS1mMGY5MDc0YWYyYjc
    UpdateKnowledgeBaseDocumentRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: The display name assigned to the Knowledge Base document. Used to identify the document across the platform.
          example: Updated FAQ Document
        content:
          type: string
          description: The content of the document.
          example: This is the updated content for the FAQ document.
      example:
        name: Updated FAQ Document
        content: This is the updated content for the FAQ document.
    UpdateAiVoice:
      type: object
      properties:
        aiEngine:
          type: string
          description: 'AI engine name.


            - `PRO` — Available in all supported countries.

            - `PRO_US` — Available in the United States only.'
          enum:
          - PRO
          - PRO_US
          example: PRO
        displayName:
          type: string
          description: Display name of the AI Receptionist voice.
          example: en-US-Jennifer
        language:
          type: string
          description: Voice language name
          example: English
        languageCode:
          type: string
          description: Voice language locale in BCP 47 format
          example: en-US
    AiReceptionistTemplateListResponse:
      type: object
      required:
      - defaultTransparencyMessage
      properties:
        defaultTransparencyMessage:
          type: string
          description: Default transparency disclosure message for AI Receptionist. This message explicitly informs callers they are interacting with an AI system, ensuring compliance with EU AI Act transparency obligations for Limited Risk AI systems.
          example: Hi, I’m an AI receptionist. This interaction may be recorded and transcribed for troubleshooting purposes.
        templates:
          type: array
          items:
            $ref: '#/components/schemas/AiReceptionistTemplateSummary'
          description: List of AI Receptionist templates.
          example:
          - id: Y2lzY29zcGFyazovL3VzL1RFTVBMQVRFL2EyYjNjNDU2LTc4OTAtMTIzNC01Njc4LTkwYWJjZGVmMTIzNA
            name: Clinic
      example:
        defaultTransparencyMessage: Hi, I’m an AI receptionist. This interaction may be recorded and transcribed for troubleshooting purposes.
        templates:
        - id: Y2lzY29zcGFyazovL3VzL1RFTVBMQVRFL2EyYjNjNDU2LTc4OTAtMTIzNC01Njc4LTkwYWJjZGVmMTIzNA
          name: Clinic
    IntentTransferToRequest:
      type: object
      description: Transfer destination configuration for the intent.
      required:
      - contactType
      properties:
        contactType:
          type: string
          description: 'Contact type.

            - PEOPLE - A person in the organization.

            - RESOURCE_GROUP - A group resource such as a call queue or hunt group.

            - CONTACT - An organization contact.

            - PHONE_NUMBER - A raw phone number or extension.'
          enum:
          - PEOPLE
          - RESOURCE_GROUP
          - CONTACT
          - PHONE_NUMBER
          example: PEOPLE
        contactId:
          type: string
          description: Unique identifier for the transfer destination, encoded using the resource type indicated by contactType (PEOPLE, RESOURCE_GROUP, or CONTACT). Not required when contactType is PHONE_NUMBER.
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNDFjZDA1MS04MTdmLTRkODEtYTFjZS0wZmQzOWMxZTdiOWY
        phoneNumber:
          type: string
          description: Phone number for intent transfer.
          example: '+4765241628'
    CreateAiReceptionistIntentRequest:
      type: object
      required:
      - name
      - description
      - transferTo
      properties:
        name:
          type: string
          description: Name of the intent.
          minLength: 1
          maxLength: 64
          example: Physical Therapy
        description:
          type: string
          description: Description of the intent (Action).
          minLength: 1
          maxLength: 1024
          example: Connect the caller to knowledgeable representative if they seek assistance with Physical Therapy
        transferTo:
          $ref: '#/components/schemas/IntentTransferToRequest'
    CreateKnowledgeBaseDocumentResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Unique identifier of the newly created document.
          example: Y2lzY29zcGFyazovL3VzL0tCX0RPQ1VNRU5ULzY5YzNlY2NjZDc5MzYzZGM2ODliM2UyYw
      example:
        id: Y2lzY29zcGFyazovL3VzL0tCX0RPQ1VNRU5ULzY5YzNlY2NjZDc5MzYzZGM2ODliM2UyYw
    AiAgent:
      type: object
      properties:
        agentId:
          type: string
          description: AI Agent ID from Webex AI Agent Studio
          example: Y2lzY29zcGFyazovL3VzL0FJX0FHRU5ULzY4ZWFlMjI0NDc0NmJkMmUyMmJkZjY4Ng
        voice:
          description: Voice configuration for the AI Agent
          allOf:
          - $ref: '#/components/schemas/AiVoice'
        knowledgeBaseId:
          type: string
          description: Unique identifier for the Knowledge Base used by the AI Agent to answer caller queries.
          example: Y2lzY29zcGFyazovL3VzL0tOT1dMRURHRV9CQVNFL2IzYzRkNTY3LTg5MDEtMjM0NS02Nzg5LTAxYmNkZWYyMzQ1Ng
        guidelines:
          description: AI Agent guidelines
          allOf:
          - $ref: '#/components/schemas/AiGuidelines'
        transparencySettings:
          description: Transparency settings for AI Receptionist. Configures disclosure messages to inform callers they are interacting with an AI system, ensuring compliance with EU AI Act transparency obligations.
          allOf:
          - $ref: '#/components/schemas/TransparencySettingsResponse'
    AiReceptionistIntentDetails:
      type: object
      required:
      - id
      - name
      - description
      - transferTo
      properties:
        id:
          type: string
          description: Unique identifier for a specific AI Receptionist intent within a given location and AI Receptionist instance.
          example: Y2lzY29zcGFyazovL3VzL0lOVEVOVC82OGVhZTIyNDQ3NDZiZDJlMjJiZGY2ODY
        name:
          type: string
          description: Name of the intent.
          example: Physical Therapy
        description:
          type: string
          description: Description of the intent (Action).
          example: Connect the caller to knowledgeable representative if they seek assistance with Physical Therapy
        transferTo:
          $ref: '#/components/schemas/IntentTransferToDetails'
    UploadKnowledgeBaseDocumentResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Unique identifier of the newly uploaded document.
          example: Y2lzY29zcGFyazovL3VzL0tCX0RPQ1VNRU5ULzY5YzNlY2NjZDc5MzYzZGM2ODliM2UyYw
      example:
        id: Y2lzY29zcGFyazovL3VzL0tCX0RPQ1VNRU5ULzY5YzNlY2NjZDc5MzYzZGM2ODliM2UyYw
    TransferTo:
      type: object
      properties:
        contactType:
          type: string
          description: 'Type of contact for the transfer target:


            - `PEOPLE` - A person in the organization.

            - `RESOURCE_GROUP` - A group resource such as a call queue or hunt group.

            - `CONTACT` - An organization contact.

            - `PHONE_NUMBER` - A raw phone number or extension.'
          enum:
          - PEOPLE
          - RESOURCE_GROUP
          - CONTACT
          - PHONE_NUMBER
          example: PEOPLE
        contactId:
          type: string
          description: Identifier of the contact to transfer to. Not applicable when contactType is PHONE_NUMBER meaning contactId is not sent in request for PHONE_NUMBER.
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9hYmNkZWYxMi0zNDU2LTc4OTAtYWJjZC1lZjEyMzQ1Njc4OTA
        phoneNumber:
          type: string
          description: Phone number to transfer the call to.
          example: '+14085550000'
    AudioFile:
      type: object
      properties:
        id:
          type: string
          description: Audio file ID
          example: Y2lzY29zcGFyazovL3VzL0FVRElPX0ZJTEUvYTJiM2M0NTYtNzg5MC0xMjM0LTU2NzgtOTBhYmNkZWYxMjM0
        fileName:
          type: string
          description: Audio file name
          example: greeting.wav
        mediaFileType:
          type: string
          enum:
          - WAV
          description: 'Media file type.

            - `WAV` - WAV File Extension.'
          example: WAV
        level:
          type: string
          enum:
          - ORGANIZATION
          - LOCATION
          - ENTITY
          description: 'Level at which the audio file is stored and shared.


            - `ORGANIZATION` — File is shared across the entire organization.

            - `LOCATION` — File is scoped to a specific location.

            - `ENTITY` — File is scoped to a specific entity (e.g., AI Receptionist).'
          example: ORGANIZATION
        isTextToSpeech:
          type: boolean
          description: Flag indicating if this is a text-to-speech file
          example: false
    AiReceptionistResponse:
      type: object
      required:
      - id
      - name
      - enabled
      - intentCount
      properties:
        id:
          type: string
          description: AI Receptionist ID encoded using the Resource Type.
          example: Y2lzY29zcGFyazovL3VzL0FJX1JFQ0VQVElPTklTVC82MDEyNGU1MC03MWNkLTQ2N2QtODkzZS1mMGY5MDc0YWYyYjc
        name:
          type: string
          description: Name of the AI Receptionist. This has to be unique across location
          example: Shine Healthcare Clinic
        enabled:
          type: boolean
          description: Flag to indicate AI receptionist is enabled or not. When disabled, incoming calls to this AI receptionist will not be answered.
          example: true
        phoneNumber:
          type: string
          description: Phone number of the AI Receptionist. Either phoneNumber or extension is mandatory. At least one is required.
          example: '+13504342182'
        extension:
          type: string
          description: Extension of the AI Receptionist. Either phoneNumber or extension is mandatory. At least one is required.
          example: '2182'
        routingPrefix:
          type: string
          description: Routing prefix of location.
          example: '2345'
        esn:
          type: string
          description: Routing prefix + extension of the AI Receptionist. If the location has no routing prefix, this will only be the extension. If the AI Receptionist has no extension, this field will not be present.
          example: '23452182'
        alternateNumbers:
          type: array
          description: List of alternate phone numbers assigned to the AI Receptionist.
          items:
            $ref: '#/components/schemas/AlternateNumber'
        directLineCallerIdName:
          description: Direct line caller ID name configuration
          allOf:
          - $ref: '#/components/schemas/DirectLineCallerIdName'
        dialByName:
          type: string
          description: A dial by name used for AI Receptionist name dialing. Characters of `%`, `+`, `\`, `"` and Unicode characters are not allowed.
          example: Shine Healthcare
        defaultAction:
          description: Default action configuration for the AI Receptionist
          allOf:
          - $ref: '#/components/schemas/DefaultAction'
        aiAgent:
          description: AI Agent configuration
          allOf:
          - $ref: '#/components/schemas/AiAgent'
        intentCount:
          type: integer
          description: Number of intents configured for this AI Receptionist
          example: 5
      example:
        id: Y2lzY29zcGFyazovL3VzL0FJX1JFQ0VQVElPTklTVC82MDEyNGU1MC03MWNkLTQ2N2QtODkzZS1mMGY5MDc0YWYyYjc
        name: Shine Healthcare Clinic
        enabled: true
        phoneNumber: '+13504342182'
        extension: '2182'
        routingPrefix: '2345'
        esn: '23452182'
        alternateNumbers:
        - phoneNumber: '+12147691003'
          tollFreeNumber: false
          ringPattern: LONG_LONG
        directLineCallerIdName:
          directLineCallerIdNameSelection: CUSTOM_NAME
          customName: Shine Clinic
        dialByName: Shine Healthcare
        defaultAction:
          actionType: PLAY_MESSAGE_AND_DISCONNECT
          audioMessageSelection: CUSTOM
          audioFile:
            id: Y2lzY29zcGFyazovL3VzL0FVRElPX0ZJTEUvYTJiM2M0NTYtNzg5MC0xMjM0LTU2NzgtOTBhYmNkZWYxMjM0
            fileName: greeting.wav
            mediaFileType: WAV
            level: ORGANIZATION
            isTextToSpeech: false
        aiAgent:
          agentId: Y2lzY29zcGFyazovL3VzL0FJX0FHRU5ULzY4ZWFlMjI0NDc0NmJkMmUyMmJkZjY4Ng
          voice:
            aiEngine: PRO
            displayName: en-US-AvaMultilingualNeural
            language: English
            languageCode: en-US
          knowledgeBaseId: Y2lzY29zcGFyazovL3VzL0tOT1dMRURHRV9CQVNFL2IzYzRkNTY3LTg5MDEtMjM0NS02Nzg5LTAxYmNkZWYyMzQ1Ng
          guidelines:
            goal: Assist callers with appointment scheduling
            welcomeMessage: Welcome to Shine Healthcare Clinic
            guideline: Be polite and professional
          transparencySettings:
            enabled: true
            message: Hi, I'm an AI receptionist. This interaction may be recorded and transcribed for troubleshooting purposes.
        intentCount: 5
    ValidateAiReceptionistRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the AI Receptionist.
          example: Shine Healthcare Clinic
