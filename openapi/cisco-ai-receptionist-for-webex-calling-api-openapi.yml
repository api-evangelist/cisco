  /telephony/config/knowledgeBases/{knowledgeBaseId}/documents/{documentId}/actions/download/invoke:
    post:
      summary: Download Knowledge Base Document
      operationId: downloadKnowledgeBaseDocument
      description: 'Download a document from a Knowledge Base.


        Documents are files uploaded to a Knowledge Base that AI Receptionists use to answer caller queries. The response contains the file content with appropriate Content-Type and Content-Disposition headers.


        This API requires a full or read-only administrator auth token with a scope of `spark-admin:telephony_config_read`.


        **WARNING:** This API is not callable using the developer portal web interface due to the lack of support for binary file downloads. This API can be utilized using other tools that support binary responses, such as Postman or curl.'
      tags:
      - AI Receptionist for Webex Calling
      parameters:
      - name: knowledgeBaseId
        in: path
        required: true
        description: Unique identifier for the Knowledge Base.
        example: Y2lzY29zcGFyazovL3VzL0tOT1dMRURHRV9CQVNFLzY5YzNlY2NjZDc5MzYzZGM2ODliM2UyYw
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: documentId
        in: path
        required: true
        description: Unique identifier for the document.
        example: Y2lzY29zcGFyazovL3VzL0tCX0RPQ1VNRU5ULzY5YzNlY2NjZDc5MzYzZGM2ODliM2UyYw
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: orgId
        in: query
        description: Optional target organization identifier. Defaults to token's organization if not provided.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
          minLength: 1
          maxLength: 200
      responses:
        '200':
          description: OK - File content returned
          headers:
            Content-Type:
              description: The MIME type of the document (e.g., application/pdf, text/plain)
              schema:
                type: string
            Content-Disposition:
              description: attachment; filename="<original-filename>"
              schema:
                type: string
            Content-Length:
              description: Size of the file in bytes
              schema:
                type: integer
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: 'Bad Request: The request was invalid or cannot be otherwise served. An accompanying error message will explain further.'
        '401':
          description: 'Unauthorized: Authentication credentials were missing or incorrect.'
        '403':
          description: 'Forbidden: The request is understood, but it has been refused or access is not allowed.'
        '404':
          description: 'Not Found: The URI requested is invalid or the resource requested, such as a user, does not exist. Also returned when the requested format is not supported by the requested method.'
        '405':
          description: 'Method Not Allowed: The request was made to a resource using an HTTP request method that is not supported.'
        '409':
