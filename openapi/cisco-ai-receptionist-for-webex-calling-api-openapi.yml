    CreateAiReceptionistRequest:
      type: object
      required:
      - name
      - enabled
      - defaultAction
      - aiAgent
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Name of the AI Receptionist. This has to be unique across location.
          example: Shine Healthcare Clinic
        enabled:
          type: boolean
          description: Flag to indicate AI receptionist is enabled or not. When disabled, incoming calls to this AI receptionist will not be answered.
          example: true
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 23
          description: Phone number of the AI Receptionist. Either phoneNumber or extension is mandatory. At least one is required.
          example: '+13504342182'
        extension:
          type: string
          minLength: 2
          maxLength: 10
          description: Extension of the AI Receptionist. Either phoneNumber or extension is mandatory. At least one is required.
          example: '2182'
        directLineCallerIdName:
          description: Direct line caller ID name configuration
          allOf:
          - $ref: '#/components/schemas/DirectLineCallerIdName'
        dialByName:
          type: string
          minLength: 1
          maxLength: 128
          description: A dial by name used for AI Receptionist name dialing. Characters of `%`, `+`, `\`, `"` and Unicode characters are not allowed.
          example: Shine Healthcare
        defaultAction:
          description: Default action configuration for the AI Receptionist
          allOf:
          - $ref: '#/components/schemas/CreateDefaultAction'
        aiAgent:
          description: AI Agent configuration
          allOf:
          - $ref: '#/components/schemas/CreateAiAgent'
    CreateDefaultAction:
      type: object
      required:
      - actionType
      properties:
        actionType:
          type: string
          description: 'Default action to be played when call is first received:


            - `PLAY_MESSAGE_AND_DISCONNECT` - Play an audio message and disconnect the call.

            - `TRANSFER_TO_OPERATOR` - Transfer the call to an operator.'
          enum:
          - PLAY_MESSAGE_AND_DISCONNECT
          - TRANSFER_TO_OPERATOR
          example: PLAY_MESSAGE_AND_DISCONNECT
        audioMessageSelection:
          type: string
          description: 'Announcement type to be played. Mandatory if actionType is `PLAY_MESSAGE_AND_DISCONNECT`:


            - `DEFAULT` - Use the system default audio message.

            - `CUSTOM` - Use a custom uploaded audio file.'
          enum:
          - DEFAULT
          - CUSTOM
          example: CUSTOM
        audioFileId:
          type: string
          description: Audio message file ID which is already uploaded. Mandatory if audioMessageSelection is CUSTOM
          example: Y2lzY29zcGFyazovL3VzL0FVRElPX0ZJTEUvYWY3ZTU0YTktZTk3My00ZDVjLWJmZmUtMTAzMDNjMTJiZmNm
        transferToNumber:
          type: string
          minLength: 1
          maxLength: 30
          description: Phone number or extension to transfer call to. Mandatory if actionType is `TRANSFER_TO_OPERATOR`.
          example: '+4765241628'
        transferTo:
          description: Transfer target configuration. Alternative to transferToNumber
          allOf:
          - $ref: '#/components/schemas/TransferTo'
    AiReceptionist:
      type: object
      required:
      - id
      - name
      - location
      properties:
        id:
          type: string
          description: Unique identifier for the AI receptionist.
          example: Y2lzY29zcGFyazovL3VzL0FJX1JFQ0VQVElPTklTVC82MDEyNGU1MC03MWNkLTQ2N2QtODkzZS1mMGY5MDc0YWYyYjc
        name:
          type: string
          description: Name of the AI receptionist. Must be unique within a location.
          example: Shine Healthcare Clinic
        phoneNumber:
          type: string
          description: Phone number of the AI receptionist in E.164 format.
          example: '+13504342182'
        extension:
          type: string
          description: Extension of the AI Receptionist.
          example: '42182'
        routingPrefix:
          type: string
          description: Routing prefix of location.
          example: '1234'
        esn:
          type: string
          description: Routing prefix + extension of the AI Receptionist. If the location has no routing prefix, this will only be the extension. If the AI Receptionist has no extension, this field will not be present.
          example: '123442182'
        location:
          description: Location of the AI Receptionist.
          allOf:
          - $ref: '#/components/schemas/AiReceptionistLocation'
    UpdateAlternateNumber:
      type: object
      properties:
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 23
          description: Alternate phone number.
          example: '+12147691003'
        ringPattern:
          type: string
          description: 'Ring pattern for the alternate number:


            - `NORMAL` - Standard ring pattern.

            - `LONG_LONG` - Two long rings.

            - `SHORT_SHORT_LONG` - Two short rings followed by one long ring.

            - `SHORT_LONG_SHORT` - Short, long, short ring pattern.'
          enum:
          - NORMAL
          - LONG_LONG
          - SHORT_SHORT_LONG
          - SHORT_LONG_SHORT
          example: LONG_LONG
