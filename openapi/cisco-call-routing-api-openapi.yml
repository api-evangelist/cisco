components:
  schemas:
    RouteListNumberPatchResponse:
      type: object
      required:
      - phoneNumber
      - numberStatus
      - message
      properties:
        phoneNumber:
          type: string
          example: '+2147891122'
          description: Phone Number whose status is being reported.
        numberStatus:
          $ref: '#/components/schemas/NumberStatus'
          description: Status of the number. Possible values are `INVALID`, `DUPLICATE`, `DUPLICATE_IN_LIST`, or `UNAVAILABLE`.
        message:
          type: string
          example: Invalid Number
          description: Message of the number add status.
    Organization:
      type: object
      required:
      - name
      - id
      properties:
        name:
          type: string
          example: '''ATLAS_TEST_LIEM_RL'''
          description: Name of the organization.
        id:
          type: string
          example: '''Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi80MWQxNDNiYi1hMjEwLTQ5YTQtOGNkZC1hYzc2YzYxMmE0YzM'''
          description: ID of the organization.
    RouteListNumberPatch:
      type: object
      required:
      - number
      - action
      properties:
        number:
          type: string
          example: '+2147891122'
          description: Number to be deleted/added.
        action:
          $ref: '#/components/schemas/ActionOnRouteList'
          description: Possible value, `ADD` or `DELETE`.
    DialPatternValidateResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/DialPatternValidationStatus'
          description: Overall validation result status.
        dialPatternStatus:
          type: array
          items:
            $ref: '#/components/schemas/DialPatternValidate'
          description: Patterns validation result.
    VirtualExtensionRange:
      type: object
      required:
      - id
      - prefix
      - pattern
      properties:
        id:
          type: string
          example: OTI0NzM1OTQtZGU1Mi00ZjViLTk0YjItN2Y5MzRmY2Y2NDk3
          description: Unique identifier for virtual extension range.
        name:
          type: string
          example: firstName1
          description: Name of the virtual extension range.
        prefix:
          type: string
          example: '+1214555'
          description: 'Prefix that the virtual extension range is associated with (Note: Standard mode must have leading ''+'' in prefix; BCD/Enhanced mode can have any valid prefix).'
        pattern:
          type: string
          example: 2XXX
          description: Pattern associated with the virtual extension range.
        locationName:
          type: string
          example: locationName1
          description: Location name if the virtual extension range is at the location level, empty if it is at the customer level.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzVlZmI5MTFhLThmNmUtNGU2Ny1iOTZkLWNkM2VmNmRhNDE2OA
          description: Location ID if the virtual extension range is at the location level, empty if it is at customer level.
        trunkName:
          type: string
          example: trunkName1
          description: Name of the trunk.
        trunkId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1RSVU5LLzA4Yjc2MmZlLWJmYWItNGFmYi04ODQ1LTNhNzJjNGQ0NjZiOQ
          description: Unique identifier of the trunk.
        routeGroupName:
          type: string
          example: routeGroupName1
          description: Name of the route group.
        routeGroupId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JPVVRFX0dST1VQL2YyODkyMTc0LWYxM2YtNDhjYy1iMmJhLWQ4ZmM4Yzg4MzJhYg
          description: Unique identifier of the route group.
        trunkLocationName:
          type: string
          example: trunkLocationName1
          description: Location of the trunk; required if `trunkName` is returned.
        trunkLocationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzVlZmI5MTFhLThmNmUtNGU2Ny1iOTZkLWNkM2VmNmRhNDE2OA
          description: Location ID of the trunk; required if `trunkName` is returned.
    PbxUser:
      type: object
      required:
      - dialPlanName
      - dialPlanId
      - dialPattern
      properties:
        dialPlanName:
          type: string
          example: dialPlan1
          description: Dial plan name that the called string matches.
        dialPlanId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0RJQUxfUExBTi8wNTlhMjczZS1iYmIwLTExZWMtODQyMi0wMjQyYWMxMjAwMDI
          description: Unique identifier for the dial plan.
        dialPattern:
          type: string
          example: 442xxx
          description: Dial pattern that the called string matches.
        trunkName:
          type: string
          example: trunkName1
          description: Name of the trunk.
        trunkId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1RSVU5LLzA4Yjc2MmZlLWJmYWItNGFmYi04ODQ1LTNhNzJjNGQ0NjZiOQ
          description: Unique identifier of the trunk.
        routeGroupName:
          type: string
          example: routeGroupName1
          description: Name of the route group.
        routeGroupId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JPVVRFX0dST1VQL2YyODkyMTc0LWYxM2YtNDhjYy1iMmJhLWQ4ZmM4Yzg4MzJhYg
          description: Unique identifier of the route group.
        trunkLocationName:
          type: string
          example: trunkLocationName1
          description: Location of the trunk; required if `trunkName` is returned.
        trunkLocationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzVlZmI5MTFhLThmNmUtNGU2Ny1iOTZkLWNkM2VmNmRhNDE2OA
          description: Location ID of the trunk; required if `trunkName` is returned.
    AppliedServices:
      type: object
      properties:
        translationPattern:
          $ref: '#/components/schemas/TranslationPattern'
          description: Returns the details of the Translation Pattern if applied.
        interceptDetails:
          $ref: '#/components/schemas/CallInterceptDetails'
          description: Returns the details of call intercept if applied.
        outgoingCallingPlanPermissionsByType:
          $ref: '#/components/schemas/OutgoingCallingPlanPermissionsByType'
          description: Returns the details of permissions by type configuration if applied under OCP.
        outgoingCallingPlanPermissionsByDigitPattern:
          $ref: '#/components/schemas/OutgoingCallingPlanPermissionsByDigitPattern'
          description: Returns the details of the digit pattern configuration if applied under OCP.
    Customer:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
          description: ID of the customer/organization.
        name:
          type: string
          example: test_org
          description: Name of the customer/organization.
    FeatureAccessCode:
      type: object
      description: Details of a feature access code configured for services that are assigned to the authenticated user.
      example:
        name: Call Forwarding Busy Interrogation
        code: '*67*'
        alternateCode: '*18'
      required:
      - name
      - code
      properties:
        name:
          type: string
          example: Call Forwarding Busy Interrogation
          description: Feature Access Code name.
        code:
          type: string
          example: '*67*'
          description: Feature Access Code.
        alternateCode:
          type: string
          example: '*18'
          description: Alternate Code for the Feature Access Code.
    CallSourceType:
      type: string
      enum:
      - ROUTE_LIST
      - DIAL_PATTERN
      - UNKOWN_EXTENSION
      - UNKOWN_NUMBER
      description: " * `ROUTE_LIST` - Route list is a type of call source.\n * `DIAL_PATTERN` - Dial pattern is a type of call source.\n * `UNKOWN_EXTENSION` - The call source extension is unknown.\n * `UNKOWN_NUMBER` - The call source phone number is unknown.\n"
    DialPlanPost:
      type: object
      required:
      - name
      - routeId
      - routeType
      properties:
        name:
          type: string
          example: dialPlanName
          description: A unique name for the dial plan.
        routeId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JPVVRFX0dST1VQLzA1OWEyNzNlLWJiYjAtMTFlYy04NDIyLTAyNDJhYzEyMDAwMg
          description: ID of route type associated with the dial plan.
        routeType:
          $ref: '#/components/schemas/RouteType'
          description: Route Type associated with the dial plan.
        dialPatterns:
          type: array
          items:
            type: string
            example: +5555,+5556
          description: An Array of dial patterns.
    CallSourceInfo:
      type: object
      required:
      - callSourceType
      properties:
        callSourceType:
          $ref: '#/components/schemas/CallSourceType'
          description: Type of call source.
        routeListName:
          type: string
          example: routeList1
          description: Name of a route list.  When `originatorType` is `trunk`, `originatorId` is a valid trunk and the trunk belongs to a route group which is assigned to a route list with the name `routeListA` and also `originatorNumber` is a number assigned to `routeListA`, then `routeListA` is returned here. This element is returned when `callSourceType` is `ROUTE_LIST`.
        routeListId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JPVVRFX0xJU1QvZDA2YWQ5M2QtY2NkOC00MzI1LTg0YzUtMDA2NThhYTdhMDBj
          description: Unique identifier for the route list.
        dialPlanName:
          type: string
          example: dialPlan1
          description: Name of a dial plan. When `originatorType` is `trunk`, `originatorId` is a valid trunk with the name `trunkA`, `trunkA` belongs to a route group which is assigned to a route list with the name `routeListA`, `trunkA` is also assigned to `dialPlanA` as routing choice, `dialPlanA` has `dialPattern` xxxx assigned. If the `originatorNumber` matches the `dialPattern` `xxxx`, `dialPlanA` is returned. This element is returned when `callSourceType` is `DIAL_PATTERN`.
        dialPattern:
          type: string
          example: '*888'
          description: Pattern given to a dial plan. When `originatorType` is `trunk`, `originatorId` is a valid trunk with the name `trunkA`, `trunkA` belongs to a route group which is assigned to a route list with the name `routeListA`, `trunkA` is also assigned to `dialPlanA` as routing choice, `dialPlanA` has `dialPattern` `xxxx` assigned. If the `originatorNumber` matches the `dialPattern` `xxxx`, `dialPattern` `xxxx` is returned. This element is returned when `callSourceType` is `DIAL_PATTERN`.
        dialPlanId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0RJQUxfUExBTi8wNTlhMjczZS1iYmIwLTExZWMtODQyMi0wMjQyYWMxMjAwMDI
          description: Unique identifier for dial plan.
    LocationTranslationPatternModifyRequest:
      type: object
      properties:
        name:
          type: string
          example: CHNHelpDesk
          description: A name given to a translation pattern for a location.
        matchingPattern:
          type: string
          example: +91[2-7]XX21
          description: A matching pattern given to a translation pattern for a location.
        replacementPattern:
          type: string
          example: '+91352133'
          description: A replacement pattern given to a translation pattern for a location.
    DialPatternStatus:
      type: string
      enum:
      - INVALID
      - DUPLICATE
      - DUPLICATE_IN_LIST
      description: " * `INVALID` - Invalid pattern\n * `DUPLICATE` - Duplicate pattern\n * `DUPLICATE_IN_LIST` - Duplicate in input\n"
    DeviceStatus:
      type: string
      enum:
      - ONLINE
      - OFFLINE
      - UNKNOWN
      description: " * `ONLINE` - Device is online\n * `OFFLINE` - Device is offline\n * `UNKNOWN` - Unknown. Default\n"
    ActionOnRouteList:
      type: string
      enum:
      - ADD
      - DELETE
      description: " * `ADD` - Add a phone number to the Route List.\n * `DELETE` - Delete a phone number from the Route List.\n"
    TrunkGet:
      type: object
      required:
      - name
      - customer
      - status
      - trunkType
      - port
      - pChargeInfoSupportPolicy
      properties:
        name:
          type: string
          example: trunkName
          description: A unique name for the trunk.
        customer:
          $ref: '#/components/schemas/Customer'
          description: Customer associated with the trunk.
        location:
          $ref: '#/components/schemas/Location'
          description: Location associated with the trunk.
        otgDtgId:
          type: string
          example: lg1_sias10_cpapi12446_lgu
          description: Unique Outgoing and Destination trunk group associated with the dial plan.
        linePort:
          type: string
          example: lg1_sias10_cpapi16004_LGU@64941297.int10.bcld.webex.com
          description: The Line/Port identifies a device endpoint in standalone mode or a SIP URI public identity in IMS mode.
        locationsUsingTrunk:
          type: array
          items:
            $ref: '#/components/schemas/Location'
          description: Locations using trunk.
        pilotUserId:
          type: string
          example: lg1_sias10_cpapi12446_LGU@64941297.int10.bcld.webex.com
          description: User ID.
        outboundProxy:
          type: object
          properties: {}
          description: Contains the body of the HTTP response received following the request to Console API and will not be set if the response has no body.
