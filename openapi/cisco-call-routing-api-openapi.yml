      summary: Test Call Routing
      operationId: TestCallRouting
      description: 'Validates that an incoming call can be routed.


        Dial plans route calls to on-premises destinations by use of trunks or route groups.

        They are configured globally for an enterprise and apply to all users, regardless of location.

        A dial plan also specifies the routing choice (trunk or route group) for calls that match any of its dial patterns.

        Specific dial patterns can be defined as part of your dial plan.


        Test call routing requires a full administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - Call Routing
      parameters:
      - name: orgId
        in: query
        description: Organization in which we are validating a call routing.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              originatorId: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8xMWEzZjk5MC1hNjg5LTQ3N2QtYmU2Yi03MTIwMDI1ZDhhYmI
              originatorType: PEOPLE
              destination: '0007'
              includeAppliedServices: true
            schema:
              type: object
              required:
              - originatorId
              - originatorType
              - destination
              properties:
                originatorId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8xMWEzZjk5MC1hNjg5LTQ3N2QtYmU2Yi03MTIwMDI1ZDhhYmI
                  description: This element is used to identify the originating party. It can be a person ID or a trunk ID.
                originatorType:
                  $ref: '#/components/schemas/OriginatorType'
                  description: This element is used to identify if the `originatorId` is of type `PEOPLE` or `TRUNK`.
                originatorNumber:
                  type: string
                  example: '9871568630'
                  description: Only used when `originatorType` is `TRUNK`. The `originatorNumber` can be a phone number or URI.
                destination:
                  type: string
                  example: '0007'
                  description: This element specifies the called party. It can be any dialable string, for example, an ESN number, E.164 number, hosted user DN, extension, extension with location code, URL, or FAC code.
                includeAppliedServices:
                  type: boolean
                  example: true
                  description: This element is used to retrieve if any translation pattern, call intercept, permission by type or permission by digit pattern is present for the called party.
      x-operation-id-source: normalized
      x-operation-id-original: Test Call Routing
