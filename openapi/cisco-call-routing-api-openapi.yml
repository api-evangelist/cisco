      summary: Get Local Gateway Dial Plan Usage for a Trunk
      operationId: GetLocalGatewayDialPlanUsageForATrunk
      description: 'Get Local Gateway Dial Plan Usage for a Trunk.


        A trunk is a connection between Webex Calling and the premises, which terminates on the premises with a local gateway or other supported device.

        The trunk can be assigned to a Route Group which is a group of trunks that allow Webex Calling to distribute calls over multiple trunks or to provide redundancy.


        Retrieving this information requires a full administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - Call Routing
      parameters:
      - name: trunkId
        in: path
        description: ID of the trunk.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0RJQUxfUExBTi8wNTlhMjczZS1iYmIwLTExZWMtODQyMi0wMjQyYWMxMjAwMDI
        schema:
          type: string
      - name: orgId
        in: query
        description: Organization to which the trunk belongs.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching objects.
        example: '0'
        schema:
          type: number
      - name: max
        in: query
        description: Limit the number of objects returned to this maximum count.
        example: '5'
        schema:
          type: number
      - name: order
        in: query
        description: Order the trunks according to the designated fields.  Available sort fields are `name`, and `locationName`. Sort order is ascending by default
        example: name-asc|locationName-desc
        schema:
          type: string
      - name: name
        in: query
        description: Return the list of trunks matching the local gateway names
        example: LG1,LG2
        schema:
          type: array
          items:
            type: string
            example: LG1,LG2
          description: Return the list of trunks matching the local gateway names
      x-operation-id-source: normalized
      x-operation-id-original: Get Local Gateway Dial Plan Usage for a Trunk
