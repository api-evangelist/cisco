      summary: List People
      operationId: ListPeople
      description: 'List people in your organization. For most users, either the `email` or `displayName` parameter is required. Admin users can omit these fields and list all users in their organization.


        Response properties associated with a user''s presence status, such as `status` or `lastActivity`, will only be returned for people within your organization or an organization you manage. Presence information will not be returned if the authenticated user has disabled status sharing. Calling /people frequently to poll `status` information for a large set of users will quickly lead to `429` errors and throttling of such requests and is therefore discouraged.


        Admin users can include `Webex Calling` (BroadCloud) user details in the response by specifying `callingData` parameter as `true`. Admin users can list all users in a location. Admin users will receive an enriched payload with additional administrative fields like `licenses`,`roles`, `locations` etc. These fields are shown when accessing a user via GET /people/{id}, not when doing a GET /people?id=


        Lookup by `email` is only supported for people within the same org or where a partner admin relationship is in place.


        Lookup by `roles` is only supported for Admin users for the people within the same org.


        Long result sets will be split into pages.'
      tags:
      - People
      parameters:
      - name: email
        in: query
        description: List people with this email address. For non-admin requests, either this or `displayName` are required. With the exception of partner admins and a managed org relationship, people lookup by email is only available for users in the same org.
        example: john.andersen@example.com
        schema:
          type: string
      - name: displayName
        in: query
        description: List people whose name starts with this string. For non-admin requests, either this or email are required.
        example: John Andersen
        schema:
          type: string
      - name: id
        in: query
        description: List people by ID. Accepts up to 85 person IDs separated by commas. If this parameter is provided then presence information (such as the `lastActivity` or `status` properties) will not be included in the response.
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
        schema:
          type: string
      - name: orgId
        in: query
        description: List people in this organization. Only admin users of another organization (such as partners) may use this parameter.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: roles
        in: query
        description: List of roleIds separated by commas.
        example: Y2lzY29zcGFyazovL3VzL1JPTEUvYXRsYXMtcG9ydGFsLnBhcnRuZXIuc2FsZXNhZG1pbg
        schema:
          type: string
      - name: callingData
        in: query
        description: Include Webex Calling user details in the response.
        example: true
        schema:
          type: boolean
          default: false
      - name: locationId
        in: query
        description: List people present in this location.
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzYzNzE1
        schema:
          type: string
      - name: max
        in: query
        description: Limit the maximum number of people in the response. If `callingData`=true, then `max` will not be more than 100. If `locationId` is specified then `max` will not be more than 50.
        example: 100
        schema:
          type: number
          default: 100
      - name: excludeStatus
        in: query
        description: Omit people status/availability to enhance query performance.
        example: true
        schema:
          type: boolean
          default: false
      x-operation-id-source: normalized
      x-operation-id-original: List People
