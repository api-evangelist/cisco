      operationId: getWebhookInterestRegistration
      description: 'Returns the webhook interest registration associated with the authenticated user and the client derived from the access token, including the list of interests and the date/time at which the registration expires. The client identifier is not supplied by the caller.


        Registrations are managed for a specific user and client, but registered interests apply to all applicable webhooks in the organization.


