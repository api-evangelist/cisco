      summary: Create a Webhook Interest Registration
      operationId: createWebhookInterestRegistration
      description: 'Adds or updates a webhook interest registration associated with the authenticated user and the client derived from the access token. At least one item in `interests` is required and `duration` is optional. The client identifier is not supplied in the request. If a registration does not already exist for the authenticated user and client, it is created; otherwise, it is updated with the incoming registration information.


        Registrations are managed for a specific user and client, but registered interests apply to all applicable webhooks in the organization.


        This API is reserved for administrators and requires the `spark-admin:calls_read` scope.'
      tags:
      - Webhook Interest Registrations
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              interests:
              - resource: Agent
              - actor: Workspaces
              duration: 30
            schema:
              type: object
              required:
              - interests
              properties:
                interests:
                  type: array
                  description: The collection of webhook interests for this registration. At least one interest is required. Each interest is either resource-based or actor-based (exactly one of `resource` or `actor` is set).
                  items:
                    $ref: '#/components/schemas/Interest'
                duration:
                  type: integer
                  example: 30
                  description: Optional time, in days, after which the registration expires. When omitted, the registration defaults to expire after 60 days.
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required:
                - interests
                - expiresAt
                properties:
                  interests:
                    type: array
                    description: The collection of webhook interests associated with the registration. Each interest is either resource-based or actor-based. At least one interest is always present in a successful response.
                    items:
                      $ref: '#/components/schemas/Interest'
                  expiresAt:
                    type: string
                    format: date-time
                    example: '2026-08-01T00:00:00.000Z'
                    description: The date/time at which the registration expires.
                example:
                  interests:
                  - resource: Agent
                  - actor: Workspaces
                  expiresAt: '2026-08-01T00:00:00.000Z'
              example:
                interests:
                - resource: Agent
                - actor: Workspaces
                expiresAt: '2026-08-01T00:00:00.000Z'
