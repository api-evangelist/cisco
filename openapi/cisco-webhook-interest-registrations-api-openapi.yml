components:
  schemas:
    Interest:
      type: object
      description: A single webhook interest that enables event emission for an actor or resource category. Exactly one of `resource` or `actor` is set per interest entry.
      properties:
        resource:
          type: string
          enum:
          - Hook Status
          - Agent
          - Services
          - Agent Monitoring
          - Queue
          - Queue Monitoring
          example: Agent
          description: 'Resource-based interest. Set exactly one of `resource` or `actor` per interest entry.


            - `Hook Status` - Enables webhook events for the `telephony_hookstatus` resource.

            - `Agent` - Enables webhook events for the `telephony_agent` resource.

            - `Services` - Enables webhook events for the `telephony_services` resource.

            - `Agent Monitoring` - Enables webhook events for the `telephony_agentMonitoring` resource.

            - `Queue` - Enables webhook events for the `telephony_queue` resource.

            - `Queue Monitoring` - Enables webhook events for the `telephony_queueMonitoring` resource.'
        actor:
          type: string
          enum:
          - Workspaces
          - Virtual Lines
          example: Workspaces
          description: 'Actor-based interest. Set exactly one of `resource` or `actor` per interest entry.


            - `Workspaces` - Enables telephony webhook events associated with workspace actors.

            - `Virtual Lines` - Enables telephony webhook events associated with virtual line actors.'
  securitySchemes:
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearerAuth:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
