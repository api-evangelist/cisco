        schema:
          type: string
      - name: autoAttendantId
        in: path
        description: Retrieve announcement files for the auto attendant with this identifier.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0NBTExfUVVFVUUvYUhaaFpUTjJNRzh5YjBBMk5EazBNVEk1Tnk1cGJuUXhNQzVpWTJ4a0xuZGxZbVY0TG1OdmJRPT0
        schema:
          type: string
      - name: orgId
        in: query
        description: Retrieve announcement files for a auto attendant from this organization.
