        schema:
          type: string
      - name: autoAttendantId
        in: path
        description: Update call forwarding settings for this auto attendant.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0FVVE9fQVRURU5EQU5UL2J6QjJlRGd6Ym1GeU5rQm1iR1Y0TWk1amFYTmpieTVqYjIw
        schema:
