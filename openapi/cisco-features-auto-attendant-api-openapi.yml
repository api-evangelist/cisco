      summary: Get Auto Attendant Primary Available Phone Numbers
      operationId: getAutoAttendantPrimaryAvailablePhoneNumbers
      description: 'List the service and standard PSTN numbers that are available to be assigned as the auto attendant''s primary phone number.

        These numbers are associated with the location specified in the request URL, can be active or inactive, and are unassigned.


        The available numbers APIs help identify candidate numbers and their owning entities to simplify the assignment or association of these numbers to members or features.


        Retrieving this list requires a full, read-only or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - 'Features:  Auto Attendant'
      parameters:
      - name: locationId
        in: path
        description: Return the list of phone numbers for this location within the given organization. The maximum length is 36.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2YwYzRhOTcyLWIxNjQtMTFlZS05MWVhLWZiYjliMTkwMjI2Yg
        schema:
          type: string
      - name: orgId
        in: query
        description: List numbers for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: max
        in: query
        description: Limit the number of phone numbers returned to this maximum count. The default is 2000.
        example: '5'
        schema:
          type: number
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching phone numbers. The default is 0.
        example: '0'
        schema:
          type: number
      - name: phoneNumber
        in: query
        description: Filter phone numbers based on the comma-separated list provided in the `phoneNumber` array.
        example: +12056852221,+12056852222
        schema:
          type: array
          items:
            type: string
            example: +12056852221,+12056852222
          description: Filter phone numbers based on the comma-separated list provided in the `phoneNumber` array.
