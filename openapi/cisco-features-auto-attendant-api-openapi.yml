      summary: Switch Mode for Call Forwarding Settings for an Auto Attendant
      operationId: switchAutoAttendantCallForwardingMode
      description: 'Switches the current operating mode of the `Auto Attendant` to the mode as per normal operations.


        Operating modes allow call forwarding to be configured based on predefined schedules, enabling different routing behaviors during business hours, after hours, or holidays.


        Switching operating mode for an `auto attendant` requires a full, or location administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - 'Features:  Auto Attendant'
      parameters:
      - name: locationId
        in: path
        description: '`Location` in which this `auto attendant` exists.'
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2E4Mjg5NzIyLTFiODAtNDFiNy05Njc4LTBlNzdhZThjMTA5OA
        schema:
          type: string
      - name: autoAttendantId
        in: path
        description: Switch operating mode to normal operations for this `auto attendant`.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0FVVE9fQVRURU5EQU5ULzk3ZjJiODY1LTc3NTUtNGVlOC05NDY0LTFjOGU1NGE1OGVjNQ
        schema:
          type: string
      - name: orgId
