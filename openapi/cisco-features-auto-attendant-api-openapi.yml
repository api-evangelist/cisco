                      fileName: AUDIO_FILE.wav
                      mediaFileType: WAV
                      level: ORGANIZATION
                  callTreatment:
                    retryAttemptForNoInput: THREE_TIMES
                    noInputTimer: '60'
                    actionToBePerformed:
                      action: TRANSFER_TO_OPERATOR
                      greeting: CUSTOM
