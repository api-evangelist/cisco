                fileName:
                  type: string
                  example: .wav
                  description: If set to `CUSTOM` for greeting, filename of previously uploaded file.
                newNumber:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                      description: Set to `true` to play new number announcement.
                    destination:
                      type: string
                      example: '2147691003'
                      description: If enabled, set destination phone number.
                  description: Details for new number.
