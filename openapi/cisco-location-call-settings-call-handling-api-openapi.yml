                      description: Set to `true` to transfer to phone number.
                    destination:
                      type: string
                      example: '2147691005'
                      description: Transfer phone number to be called when '0' is dialed.
                  description: Transfer number details.
              description: Announcements details.
          description: Inbound call details.
        outgoing:
          type: object
          properties:
            type:
              type: string
              enum:
              - INTERCEPT_ALL
              - ALLOW_LOCAL_ONLY
              description: "Outbound call options.\n * `INTERCEPT_ALL` - Set to `INTERCEPT_ALL` to intercept all outbound calls.\n * `ALLOW_LOCAL_ONLY` - Set to `ALLOW_LOCAL_ONLY` to allow local outbound calls.\n"
