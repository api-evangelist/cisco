              - INTERCEPT_ALL
              - ALLOW_ALL
              description: "Select inbound call options.\n * `INTERCEPT_ALL` - Set to `INTERCEPT_ALL` to intercept all inbound calls.\n * `ALLOW_ALL` - Set to `ALLOW_ALL` to allow all inbound calls.\n"
            voicemailEnabled:
