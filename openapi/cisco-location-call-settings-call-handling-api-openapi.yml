    GetLocationInterceptObject:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: Enable/disable location intercept. Enable this feature to override any Location's Call Intercept settings that person configures.
        incoming:
          type: object
          properties:
            type:
              type: string
              enum:
              - INTERCEPT_ALL
              - ALLOW_ALL
              description: "Select inbound call options.\n * `INTERCEPT_ALL` - Intercept all inbound calls.\n * `ALLOW_ALL` - Allow all inbound calls.\n"
            voicemailEnabled:
              type: boolean
              example: true
              description: Enable/disable to route voice mail.
            announcements:
              type: object
              properties:
                greeting:
                  type: string
                  enum:
                  - DEFAULT
                  - CUSTOM
                  description: "Greeting type for location intercept.\n * `DEFAULT` - Play default greeting.\n * `CUSTOM` - Play custom greeting.\n"
                fileName:
                  type: string
                  example: .wav
                  description: If set to `CUSTOM` for greeting, filename of previously uploaded file.
                newNumber:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                      description: Enable/disable to play new number announcement.
                    destination:
                      type: string
                      example: '2147691003'
                      description: Incoming destination phone number to be announced.
                  description: Settings for new number announcement.
                zeroTransfer:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                      description: Enable/disable to transfer to phone number.
                    destination:
                      type: string
                      example: '2147691005'
                      description: Transfer phone number to be called when '0' is dialed.
                  description: Transfer number details.
              description: Announcements details.
          description: Inbound call details.
        outgoing:
          type: object
          properties:
            type:
              type: string
              enum:
              - INTERCEPT_ALL
              - ALLOW_LOCAL_ONLY
              description: "Outbound call modes\n * `INTERCEPT_ALL` - Intercept all outbound calls.\n * `ALLOW_LOCAL_ONLY` - Allow local outbound calls.\n"
            transferEnabled:
              type: boolean
              example: true
              description: If `true`, allows transfer and forwarding for the call type.
            destination:
              type: string
              example: '2147691007'
              description: If enabled, set outgoing destination phone number.
          description: Outbound Call details
    LocationOutgoingPermissionDigitPatternPostObject:
      type: object
      required:
      - name
      - pattern
      - action
      - transferEnabled
      properties:
        name:
          type: string
          example: DigitPattern1
          description: A unique name for the digit pattern.
        pattern:
          type: string
          example: 1XXX
          description: The digit pattern to be matched with the input number.
        action:
          type: string
          enum:
          - ALLOW
          - BLOCK
          - AUTH_CODE
          - TRANSFER_NUMBER_1
          - TRANSFER_NUMBER_2
          - TRANSFER_NUMBER_3
          description: "Action to be performed on the input number that matches the digit pattern.\n * `ALLOW` - Allow the designated call type.\n * `BLOCK` - Block the designated call type.\n * `AUTH_CODE` - Allow only via Authorization Code.\n * `TRANSFER_NUMBER_1` - Transfer to Auto Transfer Number 1. The answering person can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_2` - Transfer to Auto Transfer Number 2. The answering person can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_3` - Transfer to Auto Transfer Number 3. The answering person can then approve the call and send it through or reject the call.\n"
        transferEnabled:
          type: boolean
          example: true
          description: If `true`, allows transfer and forwarding for the call type.
    CallingPermissionObject:
      type: object
      required:
      - callType
      - action
      - transferEnabled
      - isCallTypeRestrictionEnabled
      properties:
        callType:
          type: string
          enum:
          - INTERNAL_CALL
          - TOLL_FREE
          - INTERNATIONAL
          - OPERATOR_ASSISTED
          - CHARGEABLE_DIRECTORY_ASSISTED
          - SPECIAL_SERVICES_I
          - SPECIAL_SERVICES_II
          - PREMIUM_SERVICES_I
          - PREMIUM_SERVICES_II
          - NATIONAL
          description: "Below are the call type values.\n * `INTERNAL_CALL` - Controls calls within your own company.\n * `TOLL_FREE` - Controls calls to a telephone number that is billed for all arriving calls instead of incurring charges to the originating caller, usually free of charge from a landline.\n * `INTERNATIONAL` - Controls calls to locations outside of the Long Distance areas that require an international calling code before the number is dialed.\n * `OPERATOR_ASSISTED` - Controls calls requiring Operator Assistance.\n * `CHARGEABLE_DIRECTORY_ASSISTED` - Controls calls to Directory Assistant companies that require a charge to connect the call.\n * `SPECIAL_SERVICES_I` - Controls calls to carrier-specific number assignments to special services or destinations.\n * `SPECIAL_SERVICES_II` - Controls calls to carrier-specific number assignments to special services or destinations.\n * `PREMIUM_SERVICES_I` - Controls calls used to provide information or entertainment for a fee charged directly to the caller.\n * `PREMIUM_SERVICES_II` - Controls calls used to provide information or entertainment for a fee charged directly to the caller.\n * `NATIONAL` - Controls calls that are National.\n"
        action:
          type: string
          enum:
          - ALLOW
          - BLOCK
          - AUTH_CODE
          - TRANSFER_NUMBER_1
          - TRANSFER_NUMBER_2
          - TRANSFER_NUMBER_3
          description: "Allows to configure settings for each call type.\n * `ALLOW` - Callers at this location can make these types of calls.\n * `BLOCK` - Callers at this location can't make these types of calls.\n * `AUTH_CODE` - Callers must enter the authorization code that you set before placing an outgoing call.\n * `TRANSFER_NUMBER_1` - Calls are transferred automatically to the configured auto transfer number `autoTransferNumber1`.\n * `TRANSFER_NUMBER_2` - Calls are transferred automatically to the configured auto transfer number. `autoTransferNumber2`.\n * `TRANSFER_NUMBER_3` - Calls are transferred automatically to the configured auto transfer number. `autoTransferNumber3`.\n"
        transferEnabled:
          type: boolean
          example: true
          description: If `true`, allows transfer and forwarding for the call type.
        isCallTypeRestrictionEnabled:
          type: boolean
          example: true
          description: Indicates if the restriction is enforced by the system for the corresponding call type and cannot be changed. For example, certain call types (such as `INTERNATIONAL`) may be permanently blocked and this field will be `true` to reflect that the restriction is system-controlled and not editable.
    RouteType:
      type: string
      enum:
      - ROUTE_GROUP
      - TRUNK
      description: " * `ROUTE_GROUP` - Route group must include at least one trunk with a maximum of 10 trunks per route group.\n * `TRUNK` - Connection between Webex Calling and the premises.\n"
    PutLocationInterceptObject:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: Enable/disable location intercept. Enable this feature to override any location's Call Intercept settings that a person configures.
        incoming:
