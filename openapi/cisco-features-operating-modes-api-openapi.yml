      summary: Get Operating Mode Call Forward Available Phone Numbers
      operationId: GetOperatingModeCallForwardAvailablePhoneNumbers
      description: 'List the service and standard PSTN numbers that are available to be assigned as a operating mode''s call forward number.


        These numbers are associated with the location specified in the request URL, can be active or inactive, and are assigned to an owning entity.


        The available numbers APIs help identify candidate numbers and their owning entities to simplify the assignment or association of these numbers to members or features.


        Retrieving this list requires a full, read-only or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - 'Features: Operating Modes'
      parameters:
      - name: locationId
        in: path
        description: Return the list of phone numbers for this location within the given organization. The maximum length is 36.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2YwYzRhOTcyLWIxNjQtMTFlZS05MWVhLWZiYjliMTkwMjI2Yg
        schema:
          type: string
      - name: orgId
        in: query
        description: List numbers for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: max
        in: query
        description: Limit the number of phone numbers returned to this maximum count. The default is 2000.
        example: '5'
        schema:
          type: number
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching phone numbers. The default is 0.
        example: '0'
        schema:
          type: number
      - name: phoneNumber
        in: query
        description: Filter phone numbers based on the comma-separated list provided in the `phoneNumber` array.
        example: +12056852221,+12056852222
        schema:
          type: array
          items:
            type: string
            example: +12056852221,+12056852222
          description: Filter phone numbers based on the comma-separated list provided in the `phoneNumber` array.
      - name: ownerName
        in: query
        description: Return the list of phone numbers that are owned by the given `ownerName`. Maximum length is 255.
        example: Test
        schema:
          type: string
      - name: extension
        in: query
        description: Returns the list of PSTN phone numbers with the given `extension`.
        example: '1234'
        schema:
          type: string
      x-operation-id-source: normalized
      x-operation-id-original: Get Operating Mode Call Forward Available Phone Numbers
components:
  schemas:
    OperatingModeHolidayPostRequestObject:
      type: object
      required:
      - name
      - allDayEnabled
      - startDate
      - endDate
      properties:
        name:
          type: string
          example: Christmas
          description: Name of the holiday.
        allDayEnabled:
          type: boolean
          example: true
          description: Specifies if the `operating mode holiday` schedule event is enabled for the entire day. `False` if the flag is not set.
        startDate:
          type: string
          example: '2024-12-25'
          description: Start date of the `operating mode holiday`.
        endDate:
          type: string
          example: '2024-12-26'
          description: End date of the `operating mode holiday`.
        startTime:
          type: string
          example: 09:00
          description: Start time for the `operating mode holiday`. Mandatory if `allDayEnabled` is false.
        endTime:
          type: string
          example: '17:00'
          description: End time for the `operating mode holiday`. Mandatory if `allDayEnabled` is false.
        recurrence:
          $ref: '#/components/schemas/OperatingModeRecurrenceObject'
          description: Recurrence configuration for the `operating mode holiday`.
    NumberOwnerType:
      type: string
      enum:
      - PLACE
      - PEOPLE
      - VIRTUAL_LINE
      - AUTO_ATTENDANT
      - CALL_QUEUE
      - GROUP_PAGING
      - HUNT_GROUP
      - VOICE_MESSAGING
      - OFFICE_ANYWHERE
      - CONTACT_CENTER_LINK
      - CONTACT_CENTER_ADAPTER
      - ROUTE_LIST
      - VOICEMAIL_GROUP
      - COLLABORATE_BRIDGE
      description: " * `PLACE` - PSTN phone number's owner is a workspace.\n * `PEOPLE` - PSTN phone number's owner is a person.\n * `VIRTUAL_LINE` - PSTN phone number's owner is a Virtual Profile.\n * `AUTO_ATTENDANT` - PSTN phone number's owner is an auto-attendant.\n * `CALL_QUEUE` - PSTN phone number's owner is a call queue.\n * `GROUP_PAGING` - PSTN phone number's owner is a group paging.\n * `HUNT_GROUP` - PSTN phone number's owner is a hunt group.\n * `VOICE_MESSAGING` - PSTN phone number's owner is a voice messaging.\n * `OFFICE_ANYWHERE` - PSTN phone number's owner is a Single Number Reach.\n * `CONTACT_CENTER_LINK` - PSTN phone number's owner is a Contact Center link.\n * `CONTACT_CENTER_ADAPTER` - PSTN phone number's owner is a Contact Center adapter.\n * `ROUTE_LIST` - PSTN phone number's owner is a route list.\n * `VOICEMAIL_GROUP` - PSTN phone number's owner is a voicemail group.\n * `COLLABORATE_BRIDGE` - PSTN phone number's owner is a collaborate bridge.\n"
    AvailableOperatingModesObject:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09QRVJBVElOR19NT0RFL2JiOTc1OTcxLTBjZWYtNDdhNi05Yzc5LTliZWFjY2IwYjg4Mg
          description: A unique identifier for the `operating mode`.
        name:
          type: string
          example: Day Operating Mode
          description: Unique name for the `operating mode`.
    OperatingModeScheduleTypeObject:
      type: string
      enum:
      - SAME_HOURS_DAILY
      - DIFFERENT_HOURS_DAILY
      - HOLIDAY
      - NONE
      description: " * `SAME_HOURS_DAILY` - Specifies the `operating mode` is active during the same hours daily (i.e., same schedule for Monday to Friday, and Saturday to Sunday).\n * `DIFFERENT_HOURS_DAILY` - Specifies the `operating mode` is active during different hours for different days of the week.\n * `HOLIDAY` - Specifies the `operating mode` is active during holidays with their own days, and recurrence.\n * `NONE` - Specifies the `operating mode` doesn't have any schedules defined.\n"
    RecurYearlyByDateObject:
      type: object
      required:
      - dayOfMonth
      - month
      properties:
        dayOfMonth:
          type: number
          example: 1
          description: Schedule the event on a specific day of the month.
        month:
          type: string
          enum:
          - JANUARY
          - FEBRUARY
          - MARCH
          - APRIL
          - MAY
          - JUNE
          - JULY
          - AUGUST
          - SEPTEMBER
          - OCTOBER
          - NOVEMBER
          - DECEMBER
          description: Schedule the event on a specific month of the year.
    OperatingModeHolidayGetObject:
