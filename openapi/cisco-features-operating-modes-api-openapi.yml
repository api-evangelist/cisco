        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: Day Operating Mode Updated
              sameHoursDaily:
                mondayToFriday:
                  enabled: true
                  allDayEnabled: true
                saturdayToSunday:
                  enabled: true
                  allDayEnabled: false
                  startTime: 09:00
                  endTime: '17:00'
              callForwarding:
                enabled: true
                destination: '+19705550008'
                destinationVoicemailEnabled: true
            schema:
              $ref: '#/components/schemas/OperatingModePatchObject'
