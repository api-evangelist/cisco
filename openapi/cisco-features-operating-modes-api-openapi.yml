info:
  title: 'Webex Cloud Calling Features: Operating Modes API'
  version: 1.0.0
  description: The Webex Cloud Calling APIs enable comprehensive management of cloud-based calling services, including user provisioning, device assignment, call routing, feature configuration, and number management. These APIs facilitate integration with enterprise directories, automation of telephony workflows, and centralized management of global calling infrastructure. Use cases include automated onboarding, self-service portals, integration with CRM/ERP systems, and real-time monitoring of call quality and usage.
tags:
- name: 'Features: Operating Modes'
paths:
  /telephony/config/operatingModes:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required:
                - operatingModes
                properties:
                  operatingModes:
                    type: array
                    items:
                      $ref: '#/components/schemas/OperatingModeListGetObject'
                    description: Array of `operating modes`.
              example:
                operatingModes:
                - id: Y2lzY29zcGFyazovL3VzL09QRVJBVElOR19NT0RFL2JiOTc1OTcxLTBjZWYtNDdhNi05Yzc5LTliZWFjY2IwYjg4Mg
                  name: Day Operating Mode
                  type: SAME_HOURS_DAILY
                  level: LOCATION
                  location:
                    id: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2E4Mjg5NzIyLTFiODAtNDFiNy05Njc4LTBlNzdhZThjMTA5OA
                    name: Cisco-HQ
                  callForwarding:
                    enabled: true
                    destination: '+19705550006'
                    destinationVoicemailEnabled: false
                - id: Y2lzY29zcGFyazovL3VzL09QRVJBVElOR19NT0RFLzcxYzNjYjA2LWE5YjMtNDc1MS1hZGI1LTdiZDc2MWY5MTAwYg
                  name: Outage Operating Mode
                  type: NONE
                  level: ORGANIZATION
                  callForwarding:
                    enabled: true
                    destination: '+19705550007'
                    destinationVoicemailEnabled: true
        '400':
          description: 'Bad Request: The request was invalid or cannot be otherwise served. An accompanying error message will explain further.'
