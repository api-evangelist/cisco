      summary: Read the List of Operating Modes
      operationId: ReadTheListOfOperatingModes
      description: 'Retrieve `Operating Modes` list defined at location, or organization level. Use query parameters to filter the result set by location or level. The list returned is sorted in ascending order by operating mode name. Long result sets are split into pages.


        `Operating modes` help manage calls more efficiently by routing them based on predefined settings.


        Retrieving this list requires a full, read-only, or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - 'Features: Operating Modes'
      parameters:
      - name: name
        in: query
        description: List `operating modes` whose name contains this string.
        example: Day
        schema:
          type: string
      - name: limitToLocationId
        in: query
        description: Location query parameter to filter the `operating modes` from that location only.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2E4Mjg5NzIyLTFiODAtNDFiNy05Njc4LTBlNzdhZThjMTA5OA
        schema:
          type: string
      - name: limitToOrgLevelEnabled
        in: query
        description: If true, only return `operating modes` defined at the organization level.
        example: 'true'
        schema:
          type: boolean
      - name: max
        in: query
        description: Maximum number of `operating modes` to return in a single page. `max` must be equal to, or greater than `1`, and equal to or less than `100`.
        schema:
          type: number
          default: 10
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching objects.
        example: '0'
        schema:
          type: number
      - name: order
        in: query
        description: Sort the list of `operating modes` based on `name`, either asc, or desc.
        example: name-asc
        schema:
          type: string
      - name: orgId
        in: query
        description: Retrieve `operating modes` list from this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      x-operation-id-source: normalized
      x-operation-id-original: Read the List of Operating Modes
