      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotDeskSessionsResponse'
              example:
                items:
                - sessionId: Y2lzY29...
                  workspaceId: YL34EmB...
                  personId: YL34EmA...
                  bookingStartTime: '2024-08-29T12:00:00Z'
                  bookingEndTime: '2024-08-29T20:00:00Z'
