        autoTransferNumber1:
          type: string
          example: '"+1201203650"'
          description: When calling a specific call type, this workspace will be automatically transferred to another number.
        autoTransferNumber2:
          type: string
          example: '"+1201203651"'
          description: When calling a specific call type, this workspace will be automatically transferred to another number.
        autoTransferNumber3:
          type: string
          example: '"+1201203652"'
          description: When calling a specific call type, this workspace will be automatically transferred to another number.
    UserPlaceAuthorizationCodeListGet:
      type: object
      required:
      - accessCodes
      properties:
        accessCodes:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationCode'
          description: The set of activation codes and description.
    MemberType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      description: " * `PEOPLE` - Indicates the associated member is a person.\n * `PLACE` - Indicates the associated member is a workspace.\n"
    NumberOwnerType:
      type: string
      enum:
      - PLACE
      - PEOPLE
      - VIRTUAL_LINE
      - AUTO_ATTENDANT
      - CALL_QUEUE
      - GROUP_PAGING
      - HUNT_GROUP
      - VOICE_MESSAGING
      - OFFICE_ANYWHERE
      - CONTACT_CENTER_LINK
      - CONTACT_CENTER_ADAPTER
      - ROUTE_LIST
      - VOICEMAIL_GROUP
      - COLLABORATE_BRIDGE
      description: " * `PLACE` - PSTN phone number's owner is a workspace.\n * `PEOPLE` - PSTN phone number's owner is a person.\n * `VIRTUAL_LINE` - PSTN phone number's owner is a Virtual Profile.\n * `AUTO_ATTENDANT` - PSTN phone number's owner is an auto-attendant.\n * `CALL_QUEUE` - PSTN phone number's owner is a call queue.\n * `GROUP_PAGING` - PSTN phone number's owner is a group paging.\n * `HUNT_GROUP` - PSTN phone number's owner is a hunt group.\n * `VOICE_MESSAGING` - PSTN phone number's owner is a voice messaging.\n * `OFFICE_ANYWHERE` - PSTN phone number's owner is a Single Number Reach.\n * `CONTACT_CENTER_LINK` - PSTN phone number's owner is a Contact Center link.\n * `CONTACT_CENTER_ADAPTER` - PSTN phone number's owner is a Contact Center adapter.\n * `ROUTE_LIST` - PSTN phone number's owner is a route list.\n * `VOICEMAIL_GROUP` - PSTN phone number's owner is a voicemail group.\n * `COLLABORATE_BRIDGE` - PSTN phone number's owner is a collaborate bridge.\n"
    VirtualLineCallInterceptAvailableNumberListGetObject:
      type: object
      required:
      - phoneNumbers
      properties:
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/VirtualLineCallInterceptAvailableNumberObject'
          description: Array of phone numbers.
    AuthorizationCode:
      type: object
      properties:
        code:
          type: string
          example: '4856'
          description: Access code.
        description:
          type: string
          example: Marketing's access code
          description: The description of the access code.
    PushToTalkPut:
      type: object
      properties:
        allowAutoAnswer:
          type: boolean
          example: true
          description: '`true` if Push-to-Talk feature is enabled.'
        connectionType:
          $ref: '#/components/schemas/PushToTalkConnectionType'
          description: Specifies the connection type to be used.
        accessType:
          $ref: '#/components/schemas/PushToTalkAccessType'
          description: Specifies the access type to be applied when evaluating the member list.
        members:
          type: array
          items:
            type: string
            example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS82MWU3MDlkNy1hM2IxLTQ2MDctOTBiOC04NmE5MDgxYWFkNmE
          description: List of people that are allowed or disallowed to interact using the Push-to-Talk feature.
    ModifyVoicemailPasscode:
      type: object
      required:
      - passcode
      properties:
        passcode:
          type: string
          example: '1551234'
          description: Voicemail access passcode. The minimum length of the passcode is 6 and the maximum length is 30.
    UserPlaceAuthorizationCodeListPatch:
      type: object
      properties:
        deleteCodes:
          type: array
          items:
            type: string
          description: Access Codes to delete.
    PutAgentCallCallerId:
      type: object
      required:
      - selectedCallerId
      properties:
        selectedCallerId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0hVTlRfR1JPVVAvZWZkN2JjYzAtMjNkNS00NWM2LTk1N2YtZWNhYWEyZDU0M2Uw
          description: The unique identifier of the call queue or hunt group to use for the agent's caller ID. Set to null to use the agent's own caller ID.
    IncomingPermissionSetting:
      type: object
      required:
      - useCustomEnabled
      - externalTransfer
      - internalCallsEnabled
      - collectCallsEnabled
      properties:
        useCustomEnabled:
          type: boolean
          description: When true, indicates that this virtual line uses the specified calling permissions for receiving inbound calls rather than the organizational defaults.
        externalTransfer:
          type: string
          enum:
          - ALLOW_ALL_EXTERNAL
          - ALLOW_ONLY_TRANSFERRED_EXTERNAL
          - BLOCK_ALL_EXTERNAL
          description: "Specifies the transfer behavior for incoming, external calls.\n * `ALLOW_ALL_EXTERNAL` - Allow transfer and forward for all external calls including those which were transferred.\n * `ALLOW_ONLY_TRANSFERRED_EXTERNAL` - Only allow transferred calls to be transferred or forwarded and disallow transfer of other external calls.\n * `BLOCK_ALL_EXTERNAL` - Block all external calls from being transferred or forwarded.\n"
        internalCallsEnabled:
          type: boolean
          example: true
          description: Internal calls are allowed to be received.
        collectCallsEnabled:
          type: boolean
          example: true
          description: Collect calls are allowed to be received.
    VirtualLineFaxMessageAvailableNumberListGetObject:
      type: object
      required:
      - phoneNumbers
      properties:
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/VirtualLineFaxMessageAvailableNumberObject'
          description: Array of phone numbers.
    PushToTalkConnectionType:
      type: string
      enum:
      - ONE_WAY
      - TWO_WAY
      description: " * `ONE_WAY` - Push-to-Talk initiators can chat with this workspace but only in one direction. The workspace you enable Push-to-Talk for cannot respond.\n * `TWO_WAY` - Push-to-Talk initiators can chat with this workspace in a two-way conversation. The workspace you enable Push-to-Talk for can respond.\n"
    AudioAnnouncementFileGetObject:
      type: object
      required:
      - id
      - fileName
      - mediaFileType
      - level
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FVVE9fQVRURU5EQU5UL2QzVjBPWFIxWjJkM2FFQm1iR1Y0TWk1amFYTmpieTVqYjIw
          description: A unique identifier for the announcement.
        fileName:
          type: string
          example: AUDIO_FILE.wav
          description: Audio announcement file name.
        mediaFileType:
          type: string
          enum:
          - WAV
          description: "Audio announcement file type.\n * `WAV` - WAV File Extension.\n"
        level:
          type: string
          enum:
          - ORGANIZATION
          - LOCATION
          description: "Audio announcement file type location.\n * `ORGANIZATION` - Specifies this audio file is configured across the organization.\n * `LOCATION` - Specifies this audio file is configured across the location.\n"
    CallerIdPut:
      type: object
      required:
      - selected
      properties:
        selected:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION_NUMBER
          - CUSTOM
          description: "Specifies which source will be used for the outgoing Caller ID phone number. The allowed values for the current virtual line can be retrieved from the [Read Caller ID Settings for a Virtual Line](/calling/docs/api/v1/virtual-line-call-settings/read-caller-id-settings-for-a-virtual-line) `types` field.\n * `DIRECT_LINE` - Outgoing caller ID will show the caller's direct line number.\n * `LOCATION_NUMBER` - Outgoing caller ID will show the main number for the location.\n * `CUSTOM` - Outgoing caller ID will show the value from the customNumber field.\n"
        customNumber:
          type: string
          example: '2025551212'
          description: Custom number which will be shown if CUSTOM is selected. This value must be a number from the virtual line's location or from another location with the same country, PSTN provider, and zone (only applicable for India locations) as the virtual line's location.
        firstName:
          type: string
          example: Hakim
          description: Virtual line's Caller ID first name. The characters `%`,  `+`, ``, `"` and Unicode characters are not allowed. This field has been deprecated. Please use `directLineCallerIdName` and `dialByFirstName` instead.
        lastName:
          type: string
          example: Gonzales
          description: Virtual line's Caller ID last name. The characters `%`,  `+`, ``, `"` and Unicode characters are not allowed. This field has been deprecated. Please use `directLineCallerIdName` and `dialByLastName` instead.
        blockInForwardCallsEnabled:
          type: boolean
          example: true
          description: Block this virtual line's identity when receiving a call.
        externalCallerIdNamePolicy:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION
          - OTHER
          description: "Designates which type of External Caller ID Name policy is used. Default is DIRECT_LINE.\n * `DIRECT_LINE` - Outgoing caller ID will show the caller's direct line name.\n * `LOCATION` - Outgoing caller ID will show the external caller ID name for the location.\n * `OTHER` - Outgoing caller ID will show the value from the `customExternalCallerIdName` field.\n"
        customExternalCallerIdName:
          type: string
          example: Hakim Custom
          description: Custom external caller ID name which will be shown if external caller ID name policy is `OTHER`.
        additionalExternalCallerIdDirectLineEnabled:
          type: boolean
          example: true
          description: Set the virtual line's direct line number as additional external caller ID.
        additionalExternalCallerIdLocationNumberEnabled:
          type: boolean
          description: Set the Location main number as additional external caller ID for the virtual line.
        additionalExternalCallerIdCustomNumber:
          type: string
          example: '2025552000'
          description: To set a custom number as additional external caller ID for the virtual line. This value must be a number from the virtual line's location or from another location with the same country, PSTN provider, and zone (only applicable for India locations) as the virtual line's location.
        directLineCallerIdName:
          $ref: '#/components/schemas/UserDirectLineCallerIdNameObject'
          description: Settings for the direct line caller ID name to be shown for this virtual line.
        dialByFirstName:
          type: string
          example: Hakim
          description: Sets or clears the first name to be used for dial-by-name functions. To clear the `dialByFirstName`, the attribute must be set to null or empty string. Characters of `%`,  `+`, `\`, `"` and Unicode characters are not allowed.
        dialByLastName:
          type: string
          example: Smith
          description: Sets or clears the last name to be used for dial-by-name functions. To clear the `dialByLastName`, the attribute must be set to null or empty string. Characters of `%`,  `+`, `\`, `"` and Unicode characters are not allowed.
    CallerIdSelectedType:
      type: string
      enum:
      - DIRECT_LINE
      - LOCATION_NUMBER
      - CUSTOM
      description: " * `DIRECT_LINE` - Outgoing caller ID will show the caller's direct line number\n * `LOCATION_NUMBER` - Outgoing caller ID will show the main number for the location.\n * `CUSTOM` - Outgoing caller ID will show the value from the customNumber field.\n"
    CallForwardingInfo:
      type: object
      required:
      - callForwarding
      - businessContinuity
      properties:
        callForwarding:
          type: object
          required:
          - always
          - busy
          - noAnswer
          properties:
            always:
              type: object
              required:
              - enabled
              - ringReminderEnabled
              - destinationVoicemailEnabled
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '"Always" call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for "Always" call forwarding.
                ringReminderEnabled:
                  type: boolean
                  description: If `true`, a brief tone will be played on the virtual line's phone when a call has been forwarded.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Indicates enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
              description: Settings for forwarding all incoming calls to the destination you choose.
            busy:
              type: object
              required:
              - enabled
              - destinationVoicemailEnabled
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '"Busy" call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for "Busy" call forwarding.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Indicates the enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
              description: Settings for forwarding all incoming calls to the destination you chose while the phone is in use or the virtual line is busy.
            noAnswer:
              type: object
              required:
              - enabled
              - numberOfRings
              - systemMaxNumberOfRings
              - destinationVoicemailEnabled
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '"No Answer" call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for "No Answer" call forwarding.
                numberOfRings:
                  type: number
                  example: 3
                  description: Number of rings before the call will be forwarded if unanswered.
                systemMaxNumberOfRings:
                  type: number
                  example: 15
                  description: System-wide maximum number of rings allowed for `numberOfRings` setting.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Indicates the enabled or disabled state of sending incoming calls to destination number's voicemail if the destination is an internal phone number and that number has the voicemail service enabled.
              description: Settings for forwarding which only occurs when you are away or not answering your phone.
          description: Settings related to "Always", "Busy", and "No Answer" call forwarding.
        businessContinuity:
          type: object
          required:
          - enabled
          - destinationVoicemailEnabled
          properties:
            enabled:
              type: boolean
              example: true
              description: Business Continuity is enabled or disabled.
            destination:
              type: string
              example: '2225551212'
              description: Destination for Business Continuity.
            destinationVoicemailEnabled:
              type: boolean
              description: Indicates enabled or disabled state of sending incoming calls to the destination number's voicemail if the destination is an internal phone number and that number has the voicemail service enabled.
          description: Settings for sending calls to a destination of your choice if your phone is not connected to the network for any reason, such as power outage, failed Internet connection, or wiring problem.
    VoicemailInfo:
      type: object
      required:
      - enabled
      - sendAllCalls
      - sendBusyCalls
      - sendUnansweredCalls
      - notifications
      - transferToNumber
      - emailCopyOfMessage
      - messageStorage
      - faxMessage
      properties:
        enabled:
          type: boolean
          example: true
          description: Voicemail is enabled or disabled.
        sendAllCalls:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              example: true
              description: All calls will be sent to voicemail.
          description: Settings for sending all calls to voicemail.
        sendBusyCalls:
          type: object
          required:
          - enabled
          - greeting
          - greetingUploaded
          properties:
            enabled:
              type: boolean
              example: true
              description: Calls will be sent to voicemail when busy.
            greeting:
              type: string
              enum:
              - DEFAULT
              - CUSTOM
              description: "`DEFAULT` indicates the default greeting will be played. `CUSTOM` indicates a custom `.wav` file will be played.\n * `DEFAULT` - The default greeting will be played.\n * `CUSTOM` - Designates that a custom `.wav` file will be played.\n"
            greetingUploaded:
              type: boolean
              example: true
              description: A custom greeting has been uploaded.
          description: Settings for sending calls to voicemail when the line is busy.
        sendUnansweredCalls:
          type: object
          required:
          - enabled
          - greeting
          - greetingUploaded
          - numberOfRings
          - systemMaxNumberOfRings
          properties:
            enabled:
              type: boolean
              example: true
              description: Enables and disables sending unanswered calls to voicemail.
            greeting:
              type: string
              enum:
              - DEFAULT
              - CUSTOM
              description: "`DEFAULT` indicates the default greeting will be played. `CUSTOM` indicates a custom `.wav` file will be played.\n * `DEFAULT` - The default greeting will be played.\n * `CUSTOM` - Designates that a custom `.wav` file will be played.\n"
            greetingUploaded:
              type: boolean
              example: true
              description: A custom greeting has been uploaded
            numberOfRings:
              type: number
              example: 3
              description: Number of rings before unanswered call will be sent to voicemail.
            systemMaxNumberOfRings:
              type: number
              example: 15
              description: System-wide maximum number of rings allowed for `numberOfRings` setting.
        notifications:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              example: true
              description: Notifications for voicemails will be sent if enabled.
            destination:
              type: string
              example: julie@example.com
              description: Email address for notification delivery. For US/Canada text messages, use the `smsDestination` field rather than providing a SMS gateway address like `12025551212@txt.example.net` here.
            smsDestination:
              type: string
              example: '+12025551212'
              description: SMS destination for notification delivery. Must be a US or Canada phone number in E.164 format (e.g., +12025551212).
          description: Settings for notifications when there are any new voicemails.
        transferToNumber:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              example: true
              description: Enabled or disabled state of giving caller option to transfer to destination when pressing zero (0).
            destination:
              type: string
              example: '6527'
              description: Number voicemail caller will be transferred to when they press zero (0).
          description: Settings for voicemail caller to transfer to a different number by pressing zero (0).
        emailCopyOfMessage:
          type: object
          required:
          - enabled
          - emailId
          properties:
            enabled:
              type: boolean
              example: true
              description: When `true` copy of new voicemail message audio will be sent to the designated email.
            emailId:
              type: string
              example: dummy@example.com
              description: Email address to which the new voicemail audio will be sent.
          description: Settings for sending a copy of new voicemail message audio via email.
        messageStorage:
          type: object
          required:
          - mwiEnabled
          - storageType
          - externalEmail
          properties:
            mwiEnabled:
              type: boolean
              example: true
              description: When `true` desktop phone will indicate there are new voicemails.
            storageType:
              type: string
              enum:
              - INTERNAL
              - EXTERNAL
              description: "Designates which type of voicemail message storage is used.\n * `INTERNAL` - For message access via phone or the Calling User Portal.\n * `EXTERNAL` - For sending all messages to the person's email.\n"
            externalEmail:
              type: string
              example: dummy@example.com
              description: External email address to which the new voicemail audio will be sent.  A value for this field must be provided in the request if a `storageType` of `EXTERNAL` is given in the request.
        faxMessage:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              example: true
              description: When `true` FAX messages for new voicemails will be sent to the designated number.
            phoneNumber:
              type: string
              example: '2025551212'
              description: Designates phone number for the FAX. A value for this field must be provided in the request if faxMessage `enabled` field is given as `true` in the request.
            extension:
              type: string
              example: '1234'
              description: Designates optional FAX extension.
    UserDirectLineCallerIdNameObject:
      type: object
      properties:
        selection:
          $ref: '#/components/schemas/UserSelectionObject'
          description: The selection of the direct line caller ID name.
        customName:
          type: string
          example: Hakim Smith
          description: Sets or clears the custom direct line caller ID name.  To clear the `customName`, the attribute must be set to null or empty string. Required if `selection` is set to `CUSTOM_NAME`.
      description: Settings for the direct line caller ID name to be shown for this virtual line.
    SelectionObject:
      type: string
      enum:
      - CUSTOM_NAME
      - DISPLAY_NAME
      description: " * `DISPLAY_NAME` - When this option is selected, `displayName` is to be shown for this workspace.\n * `CUSTOM_NAME` - When this option is selected, `customName` is to be shown for this workspace."
    CallInterceptPut:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if the intercept feature is enabled.'
        incoming:
          type: object
          properties:
            type:
              type: string
              enum:
              - INTERCEPT_ALL
              - ALLOW_ALL
              description: "`INTERCEPT_ALL` indicated incoming calls are intercepted.\n * `INTERCEPT_ALL` - Incoming calls are routed as the destination and voicemail specify.\n * `ALLOW_ALL` - Incoming calls are not intercepted.\n"
            voicemailEnabled:
              type: boolean
              description: If `true`, the destination will be the virtual line's voicemail.
            announcements:
              type: object
              properties:
                greeting:
                  type: string
                  enum:
                  - CUSTOM
                  - DEFAULT
                  description: "`DEFAULT` indicates that a system default message will be placed when incoming calls are intercepted.\n * `CUSTOM` - A custom greeting is played when incoming calls are intercepted.\n * `DEFAULT` - A System default greeting is played when incoming calls are intercepted.\n"
                newNumber:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                      description: If `true`, the caller will hear this new number when a call is intercepted.
                    destination:
                      type: string
                      example: '2225551212'
                      description: New number caller will hear announced.
                  description: Information about the new number announcement.
                zeroTransfer:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                      description: If `true`, the caller will be transferred to destination of when zero (0) is pressed.
                    destination:
                      type: string
                      example: '2225551212'
                      description: Destination to which caller will be transferred when zero is pressed.
                  description: Information about how call will be handled if zero (0) is pressed.
              description: Settings related to how incoming calls are handled when the intercept feature is enabled.
          description: Settings related to how incoming calls are handled when the intercept feature is enabled.
        outgoing:
          type: object
          properties:
            type:
              type: string
              enum:
              - INTERCEPT_ALL
              - ALLOW_LOCAL_ONLY
              description: "`INTERCEPT_ALL` indicated all outgoing calls are intercepted.\n * `INTERCEPT_ALL` - Outgoing calls are routed as the destination and voicemail specify.\n * `ALLOW_LOCAL_ONLY` - Only non-local calls are intercepted.\n"
            transferEnabled:
              type: boolean
              example: true
              description: If `true`, allows transfer and forwarding for the call type.
            destination:
              type: string
              example: '2225551212'
              description: Number to which the outbound call will be transferred.
          description: Settings related to how outgoing calls are handled when the intercept feature is enabled.
    BargeInPut:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
          description: Set to enable or disable the Barge In feature.
        toneEnabled:
          type: boolean
          description: Set to enable or disable a stutter dial tone being played when a virtual line is barging in on the active call.
    PeopleOrPlaceOrVirtualLineType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      - VIRTUAL_LINE
      description: " * `PEOPLE` - Person or list of people.\n * `PLACE` - Workspace that is not assigned to a specific person such as for a shared device in a common area.\n * `VIRTUAL_LINE` - Virtual line or list of virtual lines.\n"
    VirtualLineCallInterceptAvailableNumberObject:
      type: object
      required:
      - state
      - isMainNumber
      - tollFreeNumber
      - telephonyType
      - isServiceNumber
      properties:
        phoneNumber:
          type: string
          example: '+12056350001'
          description: A unique identifier for the PSTN phone number.
        extension:
          type: string
          example: '1235'
          description: Extension for a PSTN phone number.
        state:
          $ref: '#/components/schemas/STATE'
          description: Phone number's state.
        isMainNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is used as a location CLID.
        tollFreeNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a toll-free number.
        telephonyType:
          $ref: '#/components/schemas/TelephonyType'
          description: The telephony type for the number.
        isServiceNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a service number; otherwise, it is a standard number. Service numbers are high-utilization or high-concurrency PSTN phone numbers that are neither mobile nor toll-free.
        owner:
          type: object
          required:
          - id
          - type
          properties:
            id:
              type: string
              example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9jODhiZGIwNC1jZjU5LTRjMjMtODQ4OC00NTNhOTE3ZDFlMjk
              description: Unique identifier of the owner to which the number is assigned.
            type:
              $ref: '#/components/schemas/NumberOwnerType'
              description: Type of the number's owner.
            firstName:
              type: string
              example: Test
              description: First name of the number's owner. This field will be present only when the owner `type` is `PEOPLE` or `VIRTUAL_LINE`.
            lastName:
              type: string
              example: Person
              description: Last name of the number's owner. This field will be present only when the owner `type` is `PEOPLE` or `VIRTUAL_LINE`.
            displayName:
              type: string
              example: TestWorkSpace
              description: Display name of the number's owner.
    PushToTalkNumberObject:
      type: object
      properties:
        external:
          type: string
          example: '+19845551088'
          description: External phone number of the person.
        extension:
          type: string
          example: '1088'
          description: Extension number of the person.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of location.
        esn:
          type: string
          example: '12341088'
          description: Routing prefix + extension of a person or workspace.
        primary:
          type: boolean
          example: true
          description: If `true`, specifies whether the phone number is primary number.
    CallerIdInfo:
      type: object
      required:
      - types
      - selected
      - tollFreeLocationNumber
      - blockInForwardCallsEnabled
      - locationExternalCallerIdName
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/CallerIdSelectedType'
          description: Allowed types for the `selected` field. This field is read-only and cannot be modified.
        selected:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION_NUMBER
          - CUSTOM
          description: "Which type of outgoing Caller ID will be used. This setting is for the number portion.\n * `DIRECT_LINE` - Outgoing caller ID will show the caller's direct line number.\n * `LOCATION_NUMBER` - Outgoing caller ID will show the main number for the location.\n * `CUSTOM` - Outgoing caller ID will show the value from the customNumber field.\n"
        directNumber:
          type: string
          example: '2025551212'
          description: Direct number which will be shown if `DIRECT_LINE` is selected.
        extensionNumber:
          type: string
          example: '3456'
          description: Extension number of the virtual line.
        locationNumber:
          type: string
          example: '2025551212'
          description: Location number which will be shown if `LOCATION_NUMBER` is selected.
        tollFreeLocationNumber:
          type: boolean
          description: Flag to indicate if the location number is toll-free number.
        customNumber:
          type: string
          example: '2025551212'
          description: Custom number which will be shown if CUSTOM is selected. This value must be a number from the virtual line's location or from another location with the same country, PSTN provider, and zone (only applicable for India locations) as the virtual line's location.
        firstName:
          type: string
          example: Hakim
          description: The virtual line's Caller ID first name. The characters `%`,  `+`, ``, `"` and Unicode characters are not allowed. This field has been deprecated. Please use `directLineCallerIdName` and `dialByFirstName` instead.
        lastName:
          type: string
          example: Gonzales
          description: The virtual line's Caller ID last name. The characters `%`,  `+`, ``, `"` and Unicode characters are not allowed. This field has been deprecated. Please use `directLineCallerIdName` and `dialByLastName` instead.
        blockInForwardCallsEnabled:
          type: boolean
          example: true
          description: Block this virtual line's identity when receiving a call.
        externalCallerIdNamePolicy:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION
          - OTHER
          description: "Designates which type of External Caller ID Name policy is used. Default is `DIRECT_LINE`.\n * `DIRECT_LINE` - Outgoing caller ID will show the caller's direct line name.\n * `LOCATION` - Outgoing caller ID will show the external caller ID name for the location.\n * `OTHER` - Outgoing caller ID will show the value from the `customExternalCallerIdName` field.\n"
        customExternalCallerIdName:
          type: string
          example: Hakim custom
          description: Custom external caller ID name which will be shown if external caller ID name policy is `OTHER`.
        locationExternalCallerIdName:
          type: string
          example: Hakim location
          description: Location's external caller ID name which will be shown if external caller ID name policy is `LOCATION`.
        additionalExternalCallerIdDirectLineEnabled:
          type: boolean
          example: true
          description: Flag to indicate the virtual line's direct line number is available as an additional external caller ID for the virtual line.
        additionalExternalCallerIdLocationNumberEnabled:
          type: boolean
          description: Flag to indicate the location main number is available as an additional external caller ID for the virtual line.
        additionalExternalCallerIdCustomNumber:
          type: string
          example: '2025552000'
          description: The custom number available as an additional external caller ID for the virtual line. This value must be a number from the virtual line's location or from another location with the same country, PSTN provider, and zone (only applicable for India locations) as the virtual line's location.
        directLineCallerIdName:
          $ref: '#/components/schemas/DirectLineCallerIdNameObject'
          description: Settings for the direct line caller ID name to be shown for this virtual line.
        dialByFirstName:
          type: string
          example: Hakim
          description: The first name to be used for dial-by-name functions.
        dialByLastName:
          type: string
          example: Smith
          description: The last name to be used for dial-by-name functions.
    CallInterceptInfo:
      type: object
      required:
      - enabled
      - incoming
      - outgoing
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if call intercept is enabled.'
        incoming:
          type: object
          required:
          - type
          - voicemailEnabled
          - announcements
          properties:
            type:
              type: string
              enum:
              - INTERCEPT_ALL
              - ALLOW_ALL
              description: "`INTERCEPT_ALL` indicated incoming calls are intercepted.\n * `INTERCEPT_ALL` - Incoming calls are routed as the destination and voicemail specify.\n * `ALLOW_ALL` - Incoming calls are not intercepted.\n"
            voicemailEnabled:
              type: boolean
              description: If `true`, the destination will be the virtual line's voicemail.
            announcements:
              type: object
              required:
              - greeting
              - filename
              - newNumber
              - zeroTransfer
              properties:
                greeting:
                  type: string
                  enum:
                  - CUSTOM
                  - DEFAULT
                  description: "`DEFAULT` indicates that a system default message will be placed when incoming calls are intercepted.\n * `CUSTOM` - A custom greeting is played when incoming calls are intercepted.\n * `DEFAULT` - A System default greeting will be played when incoming calls are intercepted.\n"
                filename:
                  type: string
                  example: incoming.wav
                  description: Filename of custom greeting; will be an empty string if no custom greeting has been uploaded.
                newNumber:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                      description: If `true`, the caller will hear this new number when the call is intercepted.
                    destination:
                      type: string
                      example: '2225551212'
                      description: New number caller will hear announced.
                  description: Information about the new number announcement.
                zeroTransfer:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                      description: If `true`, the caller will be transferred to destination of when zero (0) is pressed.
                    destination:
                      type: string
                      example: '2225551212'
                      description: Destination to which caller will be transferred when zero is pressed.
                  description: Information about how the call will be handled if zero (0) is pressed.
              description: Settings related to how incoming calls are handled when the intercept feature is enabled.
          description: Settings related to how incoming calls are handled when the intercept feature is enabled.
        outgoing:
          type: object
          required:
          - type
          - transferEnabled
          properties:
            type:
              type: string
              enum:
              - INTERCEPT_ALL
              - ALLOW_LOCAL_ONLY
              description: "`INTERCEPT_ALL` indicated all outgoing calls are intercepted.\n * `INTERCEPT_ALL` - Outgoing calls are routed as the destination and voicemail specify.\n * `ALLOW_LOCAL_ONLY` - Only non-local calls are intercepted.\n"
            transferEnabled:
              type: boolean
              example: true
              description: If `true`, allows transfer and forwarding for the call type.
            destination:
              type: string
              example: '2225551212'
              description: Number to which the outbound call be transferred.
          description: Settings related to how outgoing calls are handled when the intercept feature is enabled.
    OutboundBillingPlan:
      type: object
      example:
        enabled: true
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Set to `true` when Cisco Calling Plan outbound billing is enabled for the workspace.
          example: true
      description: Cisco Calling Plan outbound billing setting for the workspace.
    VirtualLineDoNotDisturbGet:
      type: object
      required:
      - enabled
      - ringSplashEnabled
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if the DoNotDisturb feature is enabled.'
        ringSplashEnabled:
          type: boolean
          example: true
          description: When `true`, enables ring reminder when you receive an incoming call while on Do Not Disturb.
