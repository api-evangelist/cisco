      summary: Read Call Forwarding Settings for a Virtual Line
      operationId: ReadCallForwardingSettingsForAVirtualLine
      description: 'Retrieve a virtual line''s Call Forwarding settings.


        Three types of call forwarding are supported:


        + Always - forwards all incoming calls to the destination you choose.


        + When busy - forwards all incoming calls to the destination you chose while the phone is in use or the virtual line is busy.


        + When no answer - forwarding only occurs when you are away or not answering your phone.


        In addition, the Business Continuity feature will send calls to a destination of your choice if your phone is not connected to the network for any reason, such as a power outage, failed Internet connection, or wiring problem.


        Retrieving the call forwarding settings for a virtual line requires a full, user, read-only administrator, or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - Virtual Line Call Settings
      parameters:
      - name: virtualLineId
        in: path
        description: Retrieve settings for a virtual line with the matching ID.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1ZJUlRVQUxfTElORS85Y2JmYjYxZi00ZGM0LTQ1NWItYmMzYS00NmI4YmY5YjQzNzk
        schema:
          type: string
      - name: orgId
        in: query
        description: ID of the organization in which the virtual line resides. Only admin users of another organization (such as partners) may use this parameter as the default is the same organization as the token used to access API.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
