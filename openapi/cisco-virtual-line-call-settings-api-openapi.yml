      - isPreferredEndpointClearableByPerson
      properties:
        preferredAnswerEndpointId:
          type: string
          description: The unique identifier for the preferred answer endpoint. The companion `preferredAnswerEndpointIdType` identifies the encoded resource type as `APPLICATION`, `CALLING_DEVICE`, or `HOTDESKING_GUEST`.
          example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9DQUxMSU5HX0RFVklDRS82NjY2Nzc3Ny04ODg4LTRhOTQtOGZiZC0wMzM2NzhmMDU5ZjM=
        preferredAnswerEndpointType:
          type: string
          enum:
          - WEBEX_APP_DESKTOP
          - PRIMARY_DEVICE
          - NON_PRIMARY_DEVICE
          - HOTDESK_DEVICE
          - NONE
          description: "The preferred endpoint's behavior category.\n\n * `WEBEX_APP_DESKTOP` - The Webex desktop application answers the call.\n * `PRIMARY_DEVICE` - The virtual line's primary physical device answers the call.\n * `NON_PRIMARY_DEVICE` - A physical device other than the virtual line's primary device answers the call.\n * `HOTDESK_DEVICE` - The device hosting the virtual line for a hot desking guest answers the call.\n * `NONE` - No preferred answer endpoint is selected.\n"
          example: PRIMARY_DEVICE
        preferredAnswerEndpointIdType:
          type: string
          enum:
          - APPLICATION
          - CALLING_DEVICE
          - HOTDESKING_GUEST
          description: "The resource type encoded by `preferredAnswerEndpointId`.\n\n * `APPLICATION` - The identifier represents a Webex application.\n * `CALLING_DEVICE` - The identifier represents a Webex Calling device.\n * `HOTDESKING_GUEST` - The identifier represents a hot desking guest session.\n"
          example: CALLING_DEVICE
        preferredAnswerEndpointRequired:
          type: boolean
          description: Indicates whether the virtual line must have a preferred answer endpoint selected in order for a call to be auto-answered.
          example: true
        autoAnswerEnabled:
          type: boolean
          description: Indicates whether auto answer is enabled for the virtual line.
          example: true
        isPreferredEndpointClearableByPerson:
          type: boolean
          description: Indicates whether the person can clear the preferred endpoint setting by selecting None to disable auto-answer.
          example: false
