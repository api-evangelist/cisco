          firstName: John
          lastName: Smith
          phoneNumber: '+12055552221'
          extension: '2221'
          routingPrefix: '1234'
          esn: '12342221'
          lineType: SHARED_CALL_APPEARANCE
          memberType: PEOPLE
          location:
            id: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzJiNDkyZmZkLTRjNGItNGVmNS04YzAzLWE1MDYyYzM4NDA5Mw
            name: Main Office
    HotDeskingMember:
      type: object
      required:
      - id
      - primaryOwner
      - port
      - lineType
      - lineWeight
      - memberType
      properties:
        id:
          type: string
          description: Unique identifier for the assigned member.
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8wZTQ5NjAzNC1lNTQ1LTRmMmEtODI4ZC03MjhjYjJlNjNlMWQ
        firstName:
          type: string
          description: First name of the assigned member.
          example: Alice
        lastName:
          type: string
          description: Last name of the assigned member.
          example: Gomez
        phoneNumber:
          type: string
          description: Phone number of the assigned member.
          example: '+12055552220'
        extension:
          type: string
          description: Extension of the assigned member.
          example: '2220'
        routingPrefix:
          type: string
          description: Routing prefix of the member's location.
          example: '1234'
        esn:
          type: string
          description: Enterprise significant number for the assigned member.
          example: '12342220'
        primaryOwner:
          type: boolean
          description: Indicates whether this member is the hot desking guest profile owner.
          example: true
        port:
          type: integer
          description: Port assigned to the member.
          example: 1
        t38FaxCompressionEnabled:
          type: boolean
          description: T.38 fax compression setting for the member line.
          example: false
        lineType:
          $ref: '#/components/schemas/HotDeskingLineType'
        lineWeight:
          type: integer
          description: Number of lines configured for the member on the hot desking guest profile endpoint.
          example: 1
        hostIP:
          type: string
          description: Registration home IP address for the line port.
          example: 198.51.100.10
        remoteIP:
          type: string
          description: Registration remote IP address for the line port.
          example: 198.51.100.11
        hotlineEnabled:
          type: boolean
          description: Whether this line automatically calls a predefined number when taken off-hook.
          example: false
        hotlineDestination:
          type: string
          description: Preconfigured number for the hotline. Required when `hotlineEnabled` is `true`.
          example: '2222'
        allowCallDeclineEnabled:
          type: boolean
          description: When enabled, a call decline request is extended to all endpoints on the line. When disabled, the call is declined only at the current endpoint.
          example: true
        memberType:
          $ref: '#/components/schemas/HotDeskingResponseMemberType'
        location:
          $ref: '#/components/schemas/Location'
    HotDeskingAvailableMember:
      type: object
      required:
      - id
      - lineType
      - memberType
      properties:
        id:
          type: string
          description: Unique identifier for the available member.
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9jODhiZGIwNC1jZjU5LTRjMjMtODQ4OC00NTNhOTE3ZDFlMjk
        firstName:
          type: string
          description: First name of the available member.
          example: John
        lastName:
          type: string
          description: Last name of the available member.
          example: Smith
        phoneNumber:
          type: string
          description: Phone number of the available member.
          example: '+12055552221'
        extension:
          type: string
          description: Extension of the available member.
          example: '2221'
        routingPrefix:
          type: string
          description: Routing prefix of the member's location.
          example: '1234'
        esn:
          type: string
          description: Enterprise significant number for the available member.
          example: '12342221'
        lineType:
          $ref: '#/components/schemas/HotDeskingLineType'
        memberType:
          $ref: '#/components/schemas/HotDeskingResponseMemberType'
        location:
          $ref: '#/components/schemas/Location'
    PersonSimultaneousRingCriteriaPut:
      type: object
      properties:
        scheduleName:
          type: string
          example: Business_1
          description: Name of the schedule which determines when the simultaneous ring is in effect.
        scheduleType:
          $ref: '#/components/schemas/PersonScheduleType'
        scheduleLevel:
          $ref: '#/components/schemas/PersonScheduleLevel'
        callsFrom:
          $ref: '#/components/schemas/PersonCallsFromType'
        anonymousCallersEnabled:
          type: boolean
          example: true
          description: When `true`, the criteria applies to calls from anonymous callers. Value for this attribute is required if `callsFrom` is `SELECT_PHONE_NUMBERS`.
        unavailableCallersEnabled:
          type: boolean
          example: true
          description: When `true`, the criteria applies to calls from unavailable callers. Value for this attribute is required if `callsFrom` is `SELECT_PHONE_NUMBERS`.
        phoneNumbers:
          type: array
          items:
            type: string
            example: '+19064441748'
          description: The list of phone numbers that will be checked against incoming calls for a match. Value for this attribute is required if `callsFrom` is `SELECT_PHONE_NUMBERS`.
        ringEnabled:
          type: boolean
          example: true
          description: When set to `true` simultaneous ringing is enabled for calls that meet this criteria. Criteria with `ringEnabled` set to `false` take priority.
    PersonScheduleLevel:
      type: string
      enum:
      - LOCATION
      - PEOPLE
      description: " * `LOCATION` - Indicates the schedule is configured at the location level.\n * `PEOPLE` - Indicates the schedule is configured at the person level.\n"
      example: LOCATION
    HotDeskingMembersPut:
      type: object
      description: Request body used to update the members assigned to a person's hot desking guest profile.
      required:
      - members
      properties:
        members:
          type: array
