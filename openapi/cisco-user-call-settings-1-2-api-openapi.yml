          description: If `true`, the tablet Webex Calling application is enabled for use.
        mobileClientEnabled:
          type: boolean
          example: true
          description: If `true`, the mobile Webex Calling application is enabled for use.
    PushToTalkPut:
      type: object
      properties:
        allowAutoAnswer:
          type: boolean
          example: true
          description: '`true` if Push-to-Talk feature is enabled.'
        connectionType:
          $ref: '#/components/schemas/PushToTalkConnectionType'
          description: Specifies the connection type to be used.
        accessType:
          $ref: '#/components/schemas/PushToTalkAccessType'
          description: Specifies the access type to be applied when evaluating the member list.
        members:
