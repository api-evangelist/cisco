                  enabled: false
                  destination: ''
                  ringReminderEnabled: false
                  destinationVoicemailEnabled: false
                busy:
                  enabled: true
                  destination: '9075551333'
                  destinationVoicemailEnabled: true
                noAnswer:
                  enabled: false
                  destination: ''
                  numberOfRings: 2
                  destinationVoicemailEnabled: false
              businessContinuity:
                enabled: false
                destination: ''
                destinationVoicemailEnabled: false
            schema:
              $ref: '#/components/schemas/CallForwardingPut'
      x-operation-id-source: normalized
