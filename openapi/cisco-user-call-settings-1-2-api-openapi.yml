          example: Alice
          description: First name of the person.
        displayName:
          type: string
          example: Alice Little
          description: Display name of the person.
        type:
          $ref: '#/components/schemas/PeopleOrPlaceOrVirtualLineType'
          description: Type usually indicates `PEOPLE`, `PLACE` or `VIRTUAL_LINE`. Push-to-Talk and Privacy features only supports `PEOPLE`.
        email:
          type: string
          example: alice@example.com
          description: Email address of the person.
        numbers:
          type: array
          items:
            $ref: '#/components/schemas/PushToTalkNumberObject'
          description: List of phone numbers of the person.
    UserSelectionObject:
      type: string
      enum:
      - CUSTOM_NAME
      - FIRSTNAME_LASTNAME
      - LASTNAME_FIRSTNAME
      - DISPLAY_NAME
      description: " * `DISPLAY_NAME` - When this option is selected, `displayName` is to be shown for this virtual line.\n * `FIRSTNAME_LASTNAME` - When this option is selected, `firstName` and `lastName` are to be shown for this virtual line.\n * `LASTNAME_FIRSTNAME` - When this option is selected, `lastName` and `firstName` are to be shown for this virtual line.\n * `CUSTOM_NAME` - When this option is selected, `customName` is to be shown for this virtual line."
    HotelingInfo:
      type: object
      description: Hoteling settings for a person.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: When `true`, allow this person to connect to a Hoteling host device.
    DirectLineCallerIdNameObject:
      type: object
      properties:
        selection:
          $ref: '#/components/schemas/SelectionObject'
          description: The selection of the direct line caller ID name. Defaults to `DISPLAY_NAME`.
        customName:
          type: string
          example: Hakim Smith
          description: The custom direct line caller ID name. Required if `selection` is set to `CUSTOM_NAME`.
      description: Settings for the direct line caller ID name to be shown for this workspace.
    CallRecordingInfo:
      type: object
      required:
      - enabled
      - record
      - recordVoicemailEnabled
      - notification
      - repeat
      - serviceProvider
      - externalGroup
      - externalIdentifier
      - startStopAnnouncement
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if call recording is enabled.'
        record:
          type: string
          enum:
          - Always
          - Never
          - Always with Pause/Resume
          - On Demand with User Initiated Start
          description: "Call recording scenario.\n * `Always` - Incoming and outgoing calls will be recorded with no control to start, stop, pause, or resume.\n * `Never` - Calls will not be recorded.\n * `Always with Pause/Resume` - Calls are always recorded, but user can pause or resume the recording. Stop recording is not supported.\n * `On Demand with User Initiated Start` - Records only the portion of the call after the recording start (`*44`) has been entered. Pause, resume, and stop controls are supported.\n"
        recordVoicemailEnabled:
          type: boolean
          description: When `true`, voicemail messages are also recorded.
        notification:
          type: object
          required:
          - type
          - enabled
          properties:
            type:
              type: string
              enum:
              - None
              - Beep
              - Play Announcement
              description: "Type of pause/resume notification.\n * `None` - No notification sound played when call recording is paused or resumed.\n * `Beep` - A beep sound is played when call recording is paused or resumed.\n * `Play Announcement` - A verbal announcement is played when call recording is paused or resumed.\n"
            enabled:
              type: boolean
              description: '`true` when the notification feature is in effect. `false` indicates notification is disabled.'
          description: Pause/resume notification settings.
        repeat:
          type: object
          required:
          - interval
          - enabled
          properties:
            interval:
              type: number
              example: 15
              description: Interval at which warning tone "beep" will be played. This interval is an integer from 10 to 1800 seconds
            enabled:
              type: boolean
              description: '`true` when ongoing call recording tone will be played at the designated interval. `false` indicates no warning tone will be played.'
          description: Beep sound plays periodically.
        serviceProvider:
          type: string
          example: WSWYZ25455
          description: Name of the service provider providing call recording service.
        externalGroup:
          type: string
          example: WSWYZ25455L31161
          description: Group utilized by the service provider providing call recording service.
        externalIdentifier:
          type: string
          example: a34iidrh5o@64941297.int10.bcld.webex.com
          description: Unique person identifier utilized by the service provider providing call recording service.
        startStopAnnouncement:
          type: object
          required:
          - internalCallsEnabled
          - pstnCallsEnabled
          properties:
            internalCallsEnabled:
              type: boolean
              description: When `true`, an announcement is played when call recording starts and an announcement is played when call recording ends for internal calls.
            pstnCallsEnabled:
              type: boolean
              description: When `true`, an announcement is played when call recording starts and an announcement is played when call recording ends for PSTN calls.
          description: Call Recording starts and stops announcement settings.
        selectiveCallRecordingSettings:
          type: object
          required:
          - recordInboundInternalCallsEnabled
          - recordInboundExternalCallsEnabled
          - recordOutboundInternalCallsEnabled
          - recordOutboundExternalCallsEnabled
          properties:
            recordInboundInternalCallsEnabled:
              type: boolean
              description: When `true`, inbound internal calls are recorded.
            recordInboundExternalCallsEnabled:
              type: boolean
              description: When `true`, inbound external calls are recorded.
            recordOutboundInternalCallsEnabled:
              type: boolean
              description: When `true`, outbound internal calls are recorded.
            recordOutboundExternalCallsEnabled:
              type: boolean
              description: When `true`, outbound external calls are recorded.
          description: Settings for selective call recording based on call direction and type.
    OutgoingCallingPermissionsSettingGet:
      type: object
      required:
      - useCustomPermissions
      - callingPermissions
      properties:
        useCustomEnabled:
          type: boolean
          example: true
          description: When true, indicates that this user uses the shared control that applies to all outgoing call settings categories when placing outbound calls.
        useCustomPermissions:
          type: boolean
          example: true
          description: When true, indicates that this user uses the specified outgoing calling permissions when placing outbound calls.
        callingPermissions:
          type: array
          items:
            type: object
            required:
            - transferEnabled
            - isCallTypeRestrictionEnabled
            properties:
              callType:
                type: string
                enum:
                - INTERNAL_CALL
                - TOLL_FREE
                - INTERNATIONAL
                - OPERATOR_ASSISTED
                - CHARGEABLE_DIRECTORY_ASSISTED
                - SPECIAL_SERVICES_I
                - SPECIAL_SERVICES_II
                - PREMIUM_SERVICES_I
                - PREMIUM_SERVICES_II
                - NATIONAL
                description: "Designates the action to be taken for each call type and if transferring the call type is allowed.\n * `INTERNAL_CALL` - Controls calls within your own company.\n * `TOLL_FREE` - Controls calls to a telephone number that is billed for all arriving calls instead of incurring charges to the originating caller, usually free of charge from a landline.\n * `INTERNATIONAL` - Controls calls to locations outside of the Long Distance areas that require an international calling code before the number is dialed.\n * `OPERATOR_ASSISTED` - Controls calls requiring Operator Assistance.\n * `CHARGEABLE_DIRECTORY_ASSISTED` - Controls calls to Directory Assistant companies that require a charge to connect the call.\n * `SPECIAL_SERVICES_I` - Controls calls to carrier-specific number assignments to special services or destinations.\n * `SPECIAL_SERVICES_II` - Controls calls to carrier-specific number assignments to special services or destinations.\n * `PREMIUM_SERVICES_I` - Controls calls used to provide information or entertainment for a fee charged directly to the caller.\n * `PREMIUM_SERVICES_II` - Controls calls used to provide information or entertainment for a fee charged directly to the caller.\n * `NATIONAL` - Controls calls that are within your country of origin, both within and outside of your local area code.\n"
              action:
                type: string
                enum:
                - ALLOW
                - BLOCK
                - AUTH_CODE
                - TRANSFER_NUMBER_1
                - TRANSFER_NUMBER_2
                - TRANSFER_NUMBER_3
                description: "Action on the given `callType`.\n * `ALLOW` - Allow the designated call type.\n * `BLOCK` - Block the designated call type.\n * `AUTH_CODE` - Allow only via Authorization Code.\n * `TRANSFER_NUMBER_1` - Transfer to Auto Transfer Number 1. The answering virtual line can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_2` - Transfer to Auto Transfer Number 2. The answering virtual line can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_3` - Transfer to Auto Transfer Number 3. The answering virtual line can then approve the call and send it through or reject the call.\n"
              transferEnabled:
                type: boolean
                example: true
                description: If `true`, allows transfer and forwarding for the call type.
              isCallTypeRestrictionEnabled:
                type: boolean
                example: true
                description: Indicates if the restriction is enforced by the system for the corresponding call type and cannot be changed. For example, certain call types (such as `INTERNATIONAL`) may be permanently blocked and this field will be `true` to reflect that the restriction is system-controlled and not editable.
          description: Specifies the outbound calling permissions settings.
