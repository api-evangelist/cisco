            $ref: '#/components/schemas/EventLongDetails'
          description: A list of events.
    PushToTalkAccessType:
      type: string
      enum:
      - ALLOW_MEMBERS
      - BLOCK_MEMBERS
      description: " * `ALLOW_MEMBERS` - List of people/workspaces that are allowed to use the Push-to-Talk feature to interact with the workspace being configured.\n * `BLOCK_MEMBERS` - List of people/workspaces that are disallowed to interact using the Push-to-Talk feature with the workspace being configured.\n"
    PutEvent:
      type: object
      description: Request body for updating an event in a schedule.
      required:
      - newName
      - name
      - startDate
      - endDate
      - startTime
      - endTime
      properties:
        newName:
          type: string
          example: Central_Zone_Day_Shift
          description: New name for the event.
        name:
          type: string
          example: Day_Shift
          description: Name for the event.
        startDate:
          type: string
          example: '2020-03-18'
          description: Start date of the event, or first occurrence if repeating, in the format of YYYY-MM-DD.  This field is required if the `allDayEnabled` field is present.
        endDate:
          type: string
          example: '2020-03-18'
          description: End date of the event, or first occurrence if repeating, in the format of YYYY-MM-DD.  This field is required if the `allDayEnabled` field is present.
        startTime:
          type: string
          example: 08:00
          description: Start time of the event in the format of HH:MM (24 hours format).  This field is required if the `allDayEnabled` field is false or omitted.
        endTime:
          type: string
          example: '17:00'
          description: End time of the event in the format of HH:MM (24 hours format).  This field is required if the `allDayEnabled` field is false or omitted.
        allDayEnabled:
          type: boolean
          description: True if it is all-day event.
        recurrence:
          type: object
          properties:
            recurForEver:
              type: boolean
              example: true
              description: True if the event repeats forever. Requires either `recurDaily` or `recurWeekly` to be specified.
            recurEndDate:
              type: string
              example: '2020-03-18'
              description: End date for the recurring event in the format of YYYY-MM-DD. Requires either `recurDaily` or `recurWeekly` to be specified.
            recurEndOccurrence:
              type: number
              example: 1
              description: End recurrence after the event has repeated the specified number of times. Requires either `recurDaily` or `recurWeekly` to be specified.
            recurDaily:
              type: object
              required:
              - recurInterval
              properties:
                recurInterval:
                  type: number
                  example: 1
                  description: Recurring interval in days. The number of days after the start when an event will repeat.  Repetitions cannot overlap.
              description: Specifies the number of days between the start of each recurrence and is not allowed with `recurWeekly`.
            recurWeekly:
              type: object
              required:
              - recurInterval
              properties:
                recurInterval:
                  type: number
                  example: 1
                  description: Specifies the number of weeks between the start of each recurrence.
                sunday:
                  type: boolean
                  description: The Event occurs weekly on Sunday.
                monday:
                  type: boolean
                  description: The Event occurs weekly on Monday.
                tuesday:
                  type: boolean
                  description: The Event occurs weekly on Tuesday.
                wednesday:
                  type: boolean
                  example: true
                  description: The Event occurs weekly on Wednesday.
                thursday:
                  type: boolean
                  description: The Event occurs weekly on Thursday.
                friday:
                  type: boolean
                  description: The Event occurs weekly on Friday.
                saturday:
                  type: boolean
                  description: The Event occurs weekly on Saturday.
              description: Specifies the event recurs weekly on the designated days of the week and is not allowed with `recurDaily`.
          description: Recurrance scheme for an event.
    PatchCallingBehaviorObject:
      type: object
      description: Request body for configuring calling behavior for a person.
      properties:
        behaviorType:
          type:
          - string
          - 'null'
          enum:
          - NATIVE_WEBEX_TEAMS_CALLING
          - CALL_WITH_APP_REGISTERED_FOR_CISCOTEL
          - CALL_WITH_APP_REGISTERED_FOR_TEL
          - CALL_WITH_APP_REGISTERED_FOR_WEBEXCALLTEL
          - NATIVE_SIP_CALL_TO_UCM
          description: "The new Calling Behavior setting for the person (case-insensitive). If `null`, the effective Calling Behavior will be the Organization's current default.\n * `NATIVE_WEBEX_TEAMS_CALLING` - Calling in Webex or Hybrid Calling.\n * `CALL_WITH_APP_REGISTERED_FOR_CISCOTEL` - Cisco Jabber app\n * `CALL_WITH_APP_REGISTERED_FOR_TEL` - Third-Party app\n * `CALL_WITH_APP_REGISTERED_FOR_WEBEXCALLTEL` - Webex Calling app\n * `NATIVE_SIP_CALL_TO_UCM` - Calling in Webex (Unified CM)\n"
        profileId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExJTkdfUFJPRklMRS9iMzdmMmZiYS0yZTdjLTExZWItYTM2OC1kYmU0Yjc2NzFmZTk
          description: The UC Manager Profile ID. Specifying null results in the organizational default being applied. In addition, when `behaviorType` is set to `CALL_WITH_APP_REGISTERED_FOR_CISCOTEL`, then the profile ID value will be cleared irrespective of any value being passed.
    PushToTalkInfo:
      type: object
      required:
      - allowAutoAnswer
      - connectionType
      - accessType
      properties:
        allowAutoAnswer:
          type: boolean
          example: true
          description: Set to `true` to enable the Push-to-Talk feature.  When enabled, a workspace receives a Push-to-Talk call and answers the call automatically.
        connectionType:
          $ref: '#/components/schemas/PushToTalkConnectionType'
          description: Specifies the connection type to be used.
        accessType:
          $ref: '#/components/schemas/PushToTalkAccessType'
          description: Specifies the access type to be applied when evaluating the member list.
        members:
          type: array
          items:
            $ref: '#/components/schemas/MonitoredPersonObject'
          description: List of people/workspaces that are allowed or disallowed to interact using the Push-to-Talk feature.
    ScheduleLevel:
      type: string
      enum:
      - PEOPLE
      - GROUP
      description: " * `PEOPLE` - The schedule level that specifies that criteria is of People level.\n * `GROUP` - The schedule level that specifies that criteria is of Group level.\n"
    ScheduleUpdateRequest:
      type: object
      description: Request body for updating a schedule for a person.
      required:
      - newName
      - name
      - type
      properties:
        newName:
          type: string
          example: Richardson_Office_Hours
          description: New name for the schedule.
        name:
          type: string
          example: Dallas_Office_Hours
          description: Name for the schedule.
        type:
          $ref: '#/components/schemas/ScheduleType'
          description: The Schedule type whether `businessHours` or `holidays`.
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventLongDetails'
          description: List of events.
    DoNotDisturbPut:
      type: object
      description: Request body for configuring Do Not Disturb settings for a person.
      required:
      - webexGoOverrideEnabled
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if the Do Not Disturb feature is enabled.'
        ringSplashEnabled:
          type: boolean
          description: Enables a Ring Reminder to play a brief tone on your desktop phone when you receive incoming calls.
        webexGoOverrideEnabled:
          type: boolean
          description: '`true` if a mobile device will still ring even if Do Not Disturb is enabled.'
    OutgoingCallingPermissionsSettingPut:
      type: object
      required:
      - callingPermissions
      properties:
        useCustomEnabled:
          type: boolean
          example: true
          description: When true, indicates that this user uses the shared control that applies to all outgoing call settings categories when placing outbound calls.
        useCustomPermissions:
          type: boolean
          example: true
          description: When true, indicates that this user uses the specified outgoing calling permissions when placing outbound calls.
        callingPermissions:
          type: array
          items:
            type: object
            required:
            - transferEnabled
            properties:
              callType:
                type: string
                enum:
                - INTERNAL_CALL
                - TOLL_FREE
                - INTERNATIONAL
                - OPERATOR_ASSISTED
                - CHARGEABLE_DIRECTORY_ASSISTED
                - SPECIAL_SERVICES_I
                - SPECIAL_SERVICES_II
                - PREMIUM_SERVICES_I
                - PREMIUM_SERVICES_II
                - NATIONAL
                description: "Designates the action to be taken for each call type and if transferring the call type is allowed.\n * `INTERNAL_CALL` - Controls calls within your own company.\n * `TOLL_FREE` - Controls calls to a telephone number that is billed for all arriving calls instead of incurring charges to the originating caller, usually free of charge from a landline.\n * `INTERNATIONAL` - Controls calls to locations outside of the Long Distance areas that require an international calling code before the number is dialed.\n * `OPERATOR_ASSISTED` - Controls calls requiring Operator Assistance.\n * `CHARGEABLE_DIRECTORY_ASSISTED` - Controls calls to Directory Assistant companies that require a charge to connect the call.\n * `SPECIAL_SERVICES_I` - Controls calls to carrier-specific number assignments to special services or destinations.\n * `SPECIAL_SERVICES_II` - Controls calls to carrier-specific number assignments to special services or destinations.\n * `PREMIUM_SERVICES_I` - Controls calls used to provide information or entertainment for a fee charged directly to the caller.\n * `PREMIUM_SERVICES_II` - Controls calls used to provide information or entertainment for a fee charged directly to the caller.\n * `NATIONAL` - Controls calls that are within your country of origin, both within and outside of your local area code.\n"
              action:
                type: string
                enum:
                - ALLOW
                - BLOCK
                - AUTH_CODE
                - TRANSFER_NUMBER_1
                - TRANSFER_NUMBER_2
                - TRANSFER_NUMBER_3
                description: "Action on the given `callType`.\n * `ALLOW` - Allow the designated call type.\n * `BLOCK` - Block the designated call type.\n * `AUTH_CODE` - Allow only via Authorization Code.\n * `TRANSFER_NUMBER_1` - Transfer to Auto Transfer Number 1. The answering virtual line can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_2` - Transfer to Auto Transfer Number 2. The answering virtual line can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_3` - Transfer to Auto Transfer Number 3. The answering virtual line can then approve the call and send it through or reject the call.\n"
              transferEnabled:
                type: boolean
                description: Allow the virtual line to transfer or forward a call of the specified call type.
          description: Specifies the outbound calling permissions settings.
    IncomingPermissionSetting:
      type: object
      required:
      - useCustomEnabled
      - externalTransfer
      - internalCallsEnabled
      - collectCallsEnabled
      properties:
        useCustomEnabled:
          type: boolean
          description: When true, indicates that this virtual line uses the specified calling permissions for receiving inbound calls rather than the organizational defaults.
        externalTransfer:
          type: string
          enum:
          - ALLOW_ALL_EXTERNAL
          - ALLOW_ONLY_TRANSFERRED_EXTERNAL
          - BLOCK_ALL_EXTERNAL
          description: "Specifies the transfer behavior for incoming, external calls.\n * `ALLOW_ALL_EXTERNAL` - Allow transfer and forward for all external calls including those which were transferred.\n * `ALLOW_ONLY_TRANSFERRED_EXTERNAL` - Only allow transferred calls to be transferred or forwarded and disallow transfer of other external calls.\n * `BLOCK_ALL_EXTERNAL` - Block all external calls from being transferred or forwarded.\n"
        internalCallsEnabled:
          type: boolean
          example: true
          description: Internal calls are allowed to be received.
        collectCallsEnabled:
          type: boolean
          example: true
          description: Collect calls are allowed to be received.
    PushToTalkConnectionType:
      type: string
      enum:
      - ONE_WAY
      - TWO_WAY
      description: " * `ONE_WAY` - Push-to-Talk initiators can chat with this workspace but only in one direction. The workspace you enable Push-to-Talk for cannot respond.\n * `TWO_WAY` - Push-to-Talk initiators can chat with this workspace in a two-way conversation. The workspace you enable Push-to-Talk for can respond.\n"
    ScheduleType:
      type: string
      enum:
      - businessHours
      - holidays
      description: " * `businessHours` - The schedule type that specifies the business or working hours during the day.\n * `holidays` - The schedule type that specifies the day when your organization is not open.\n"
    BargeInInfo:
      type: object
      required:
      - enabled
      - toneEnabled
      properties:
        enabled:
          type: boolean
          example: true
          description: Indicates if the Barge In feature is enabled.
        toneEnabled:
          type: boolean
          description: Indicates that a stutter dial tone will be played when a virtual line is barging in on the active call.
    GetCallingBehaviorObject:
      type: object
      description: Calling behavior settings for a person.
      required:
      - effectiveBehaviorType
      properties:
        behaviorType:
          type:
          - string
          - 'null'
          enum:
          - NATIVE_WEBEX_TEAMS_CALLING
          - CALL_WITH_APP_REGISTERED_FOR_CISCOTEL
          - CALL_WITH_APP_REGISTERED_FOR_TEL
          - CALL_WITH_APP_REGISTERED_FOR_WEBEXCALLTEL
          - NATIVE_SIP_CALL_TO_UCM
          description: "The current Calling Behavior setting for the person. If `null`, the effective Calling Behavior will be the Organization's current default.\n * `NATIVE_WEBEX_TEAMS_CALLING` - Calling in Webex or Hybrid Calling.\n * `CALL_WITH_APP_REGISTERED_FOR_CISCOTEL` - Cisco Jabber app\n * `CALL_WITH_APP_REGISTERED_FOR_TEL` - Third-Party app\n * `CALL_WITH_APP_REGISTERED_FOR_WEBEXCALLTEL` - Webex Calling app\n * `NATIVE_SIP_CALL_TO_UCM` - Calling in Webex (Unified CM)\n"
        effectiveBehaviorType:
          type: string
          enum:
          - NATIVE_WEBEX_TEAMS_CALLING
          - CALL_WITH_APP_REGISTERED_FOR_CISCOTEL
          - CALL_WITH_APP_REGISTERED_FOR_TEL
          - CALL_WITH_APP_REGISTERED_FOR_WEBEXCALLTEL
          - NATIVE_SIP_CALL_TO_UCM
          description: "The effective Calling Behavior setting for the person, will be the organization's default Calling Behavior if the user's `behaviorType` is set to `null`.\n * `NATIVE_WEBEX_TEAMS_CALLING` - Calling in Webex or Hybrid Calling.\n * `CALL_WITH_APP_REGISTERED_FOR_CISCOTEL` - Cisco Jabber app\n * `CALL_WITH_APP_REGISTERED_FOR_TEL` - Third-Party app\n * `CALL_WITH_APP_REGISTERED_FOR_WEBEXCALLTEL` - Webex Calling app\n * `NATIVE_SIP_CALL_TO_UCM` - Calling in Webex (Unified CM)\n"
        profileId:
          type:
          - string
          - 'null'
          example: Y2lzY29zcGFyazovL3VzL0NBTExJTkdfUFJPRklMRS9iMzdmMmZiYS0yZTdjLTExZWItYTM2OC1kYmU0Yjc2NzFmZTk
          description: The UC Manager Profile ID.
    CallerIdPut:
      type: object
      required:
      - selected
      properties:
        selected:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION_NUMBER
          - CUSTOM
          description: "Specifies which source will be used for the outgoing Caller ID phone number. The allowed values for the current virtual line can be retrieved from the [Read Caller ID Settings for a Virtual Line](/calling/docs/api/v1/virtual-line-call-settings/read-caller-id-settings-for-a-virtual-line) `types` field.\n * `DIRECT_LINE` - Outgoing caller ID will show the caller's direct line number.\n * `LOCATION_NUMBER` - Outgoing caller ID will show the main number for the location.\n * `CUSTOM` - Outgoing caller ID will show the value from the customNumber field.\n"
        customNumber:
          type: string
          example: '2025551212'
          description: Custom number which will be shown if CUSTOM is selected. This value must be a number from the virtual line's location or from another location with the same country, PSTN provider, and zone (only applicable for India locations) as the virtual line's location.
        firstName:
          type: string
          example: Hakim
          description: Virtual line's Caller ID first name. The characters `%`,  `+`, ``, `"` and Unicode characters are not allowed. This field has been deprecated. Please use `directLineCallerIdName` and `dialByFirstName` instead.
        lastName:
          type: string
          example: Gonzales
          description: Virtual line's Caller ID last name. The characters `%`,  `+`, ``, `"` and Unicode characters are not allowed. This field has been deprecated. Please use `directLineCallerIdName` and `dialByLastName` instead.
        blockInForwardCallsEnabled:
          type: boolean
          example: true
          description: Block this virtual line's identity when receiving a call.
        externalCallerIdNamePolicy:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION
          - OTHER
          description: "Designates which type of External Caller ID Name policy is used. Default is DIRECT_LINE.\n * `DIRECT_LINE` - Outgoing caller ID will show the caller's direct line name.\n * `LOCATION` - Outgoing caller ID will show the external caller ID name for the location.\n * `OTHER` - Outgoing caller ID will show the value from the `customExternalCallerIdName` field.\n"
        customExternalCallerIdName:
          type: string
          example: Hakim Custom
          description: Custom external caller ID name which will be shown if external caller ID name policy is `OTHER`.
        additionalExternalCallerIdDirectLineEnabled:
          type: boolean
          example: true
          description: Set the virtual line's direct line number as additional external caller ID.
        additionalExternalCallerIdLocationNumberEnabled:
          type: boolean
          description: Set the Location main number as additional external caller ID for the virtual line.
        additionalExternalCallerIdCustomNumber:
          type: string
          example: '2025552000'
          description: To set a custom number as additional external caller ID for the virtual line. This value must be a number from the virtual line's location or from another location with the same country, PSTN provider, and zone (only applicable for India locations) as the virtual line's location.
        directLineCallerIdName:
          $ref: '#/components/schemas/UserDirectLineCallerIdNameObject'
          description: Settings for the direct line caller ID name to be shown for this virtual line.
        dialByFirstName:
          type: string
          example: Hakim
          description: Sets or clears the first name to be used for dial-by-name functions. To clear the `dialByFirstName`, the attribute must be set to null or empty string. Characters of `%`,  `+`, `\`, `"` and Unicode characters are not allowed.
        dialByLastName:
          type: string
          example: Smith
          description: Sets or clears the last name to be used for dial-by-name functions. To clear the `dialByLastName`, the attribute must be set to null or empty string. Characters of `%`,  `+`, `\`, `"` and Unicode characters are not allowed.
    EventResponseWithId:
      type: object
      description: Response body for creating an event, containing the event identifier.
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1VTRVJfU0NIRURVTEVfRVZFTlQvUkdGNVgxTm9hV1ow
          description: Identifier for a event.
    CallerIdSelectedType:
      type: string
      enum:
      - DIRECT_LINE
      - LOCATION_NUMBER
      - CUSTOM
      description: " * `DIRECT_LINE` - Outgoing caller ID will show the caller's direct line number\n * `LOCATION_NUMBER` - Outgoing caller ID will show the main number for the location.\n * `CUSTOM` - Outgoing caller ID will show the value from the customNumber field.\n"
    ReceptionInfo:
      type: object
      description: Receptionist Client settings for a person.
      required:
      - receptionEnabled
      properties:
        receptionEnabled:
          type: boolean
          example: true
          description: Set to `true` to enable the Receptionist Client feature.
        monitoredMembers:
          type: array
          items:
            $ref: '#/components/schemas/MonitoredMemberObject'
          description: List of people, workspaces or virtual lines to monitor.
    CallForwardingInfo:
      type: object
      required:
      - callForwarding
      - businessContinuity
      properties:
        callForwarding:
          type: object
          required:
          - always
          - busy
          - noAnswer
          properties:
            always:
              type: object
              required:
              - enabled
              - ringReminderEnabled
              - destinationVoicemailEnabled
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '"Always" call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for "Always" call forwarding.
                ringReminderEnabled:
                  type: boolean
                  description: If `true`, a brief tone will be played on the virtual line's phone when a call has been forwarded.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Indicates enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
              description: Settings for forwarding all incoming calls to the destination you choose.
            busy:
              type: object
              required:
              - enabled
              - destinationVoicemailEnabled
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '"Busy" call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for "Busy" call forwarding.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Indicates the enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
              description: Settings for forwarding all incoming calls to the destination you chose while the phone is in use or the virtual line is busy.
            noAnswer:
              type: object
              required:
              - enabled
              - numberOfRings
              - systemMaxNumberOfRings
              - destinationVoicemailEnabled
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '"No Answer" call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for "No Answer" call forwarding.
                numberOfRings:
                  type: number
                  example: 3
                  description: Number of rings before the call will be forwarded if unanswered.
                systemMaxNumberOfRings:
                  type: number
                  example: 15
                  description: System-wide maximum number of rings allowed for `numberOfRings` setting.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Indicates the enabled or disabled state of sending incoming calls to destination number's voicemail if the destination is an internal phone number and that number has the voicemail service enabled.
              description: Settings for forwarding which only occurs when you are away or not answering your phone.
          description: Settings related to "Always", "Busy", and "No Answer" call forwarding.
        businessContinuity:
          type: object
          required:
          - enabled
          - destinationVoicemailEnabled
          properties:
            enabled:
              type: boolean
              example: true
              description: Business Continuity is enabled or disabled.
            destination:
              type: string
              example: '2225551212'
              description: Destination for Business Continuity.
            destinationVoicemailEnabled:
              type: boolean
              description: Indicates enabled or disabled state of sending incoming calls to the destination number's voicemail if the destination is an internal phone number and that number has the voicemail service enabled.
