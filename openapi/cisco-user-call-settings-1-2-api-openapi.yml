          type: array
          items:
            $ref: '#/components/schemas/MonitoredPersonObject'
          description: List of people that are being monitored.
    MonitoredPersonObject:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS82MWU3MDlkNy1hM2IxLTQ2MDctOTBiOC04NmE5MDgxYWFkNmE
          description: Unique identifier of the person.
