      summary: Reset Voicemail PIN
      operationId: ResetVoicemailPIN
      description: 'Reset a voicemail PIN for a person.


        The voicemail feature transfers callers to voicemail based on your settings. You can then retrieve voice messages via Voicemail. A voicemail PIN is used to retrieve your voicemail messages.


        This API requires a full or user administrator or location administrator auth token with the `spark-admin:people_write` scope.


        **NOTE**: This API is expected to have an empty request body and Content-Type header should be set to `application/json`.'
      tags:
      - User Call Settings (1/2)
      parameters:
      - name: personId
        in: path
        description: Unique identifier for the person.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8xMWEzZjk5MC1hNjg5LTQ3N2QtYmU2Yi03MTIwMDI1ZDhhYmI
        schema:
          type: string
      - name: orgId
        in: query
        description: ID of the organization in which the person resides. Only admin users of another organization (such as partners) may use this parameter as the default is the same organization as the token used to access API.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example: {}
            schema:
              type: object
              properties: {}
