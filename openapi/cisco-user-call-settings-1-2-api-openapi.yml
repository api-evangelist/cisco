      summary: Read Forwarding Settings for a Person
      operationId: ReadForwardingSettingsForAPerson
      description: 'Retrieve a person''s Call Forwarding settings.


        Three types of call forwarding are supported:


        + Always - forwards all incoming calls to the destination you choose.


        + When busy - forwards all incoming calls to the destination you chose while the phone is in use or the person is busy.


        + When no answer - forwarding only occurs when you are away or not answering your phone.


        In addition, the Business Continuity feature will send calls to a destination of your choice if your phone is not connected to the network for any reason, such as a power outage, failed Internet connection, or wiring problem.


        This API requires a full, user, or read-only administrator or location administrator auth token with a scope of `spark-admin:people_read` or a user auth token with `spark:people_read` scope can be used by a person to read their own settings.'
      tags:
      - User Call Settings (1/2)
      parameters:
      - name: personId
        in: path
        description: Unique identifier for the person.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8xMWEzZjk5MC1hNjg5LTQ3N2QtYmU2Yi03MTIwMDI1ZDhhYmI
        schema:
          type: string
      - name: orgId
        in: query
        description: ID of the organization in which the person resides. Only admin users of another organization (such as partners) may use this parameter as the default is the same organization as the token used to access API.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      x-operation-id-source: normalized
      x-operation-id-original: Read Forwarding Settings for a Person
