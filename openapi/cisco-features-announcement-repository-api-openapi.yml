components:
  schemas:
    LocationObject:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1Njc4OTAxMjM0NTY3ODkw
          description: The ID of the location.
        name:
          type: string
          example: San Jose
          description: The name of the location.
    TtsUsageResponse:
      type: object
      description: Response containing text-to-speech usage information.
      example:
        maxAllowedApiCalls: 150
        noOfApiCalls: 25
        usageResetTimestamp: '2024-01-01T00:00:00.000Z'
      required:
      - noOfApiCalls
      - maxAllowedApiCalls
      properties:
        noOfApiCalls:
          type: integer
          example: 25
          description: The number of text-to-speech API calls made in the current time window.
        maxAllowedApiCalls:
          type: integer
          example: 150
          description: The maximum number of text-to-speech API calls allowed in the current time window.
        usageResetTimestamp:
          type: string
          example: '2026-01-01T00:00:00.000Z'
          description: The timestamp when the usage counter will reset. It will be returned when reaching the maximum allowed API calls in the time window.
    FeatureReferenceObject:
      type: object
      description: Metadata describing a call feature that references an announcement.
      required:
      - id
      - name
      - type
      - locationId
      - locationName
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FVVE9fQVRURU5EQU5UL2QzVjBPWFIxWjJkM2FFQm1iR1Y0TWk1amFYTmpieTVqYjIw
          description: Unique identifier of the call feature referenced. The call Feature can be Auto Attendant, Call Queue or Music On hold.
        name:
          type: string
          example: Main Line AA - Test
          description: Name of the call feature referenced.
        type:
          type: string
          example: Auto Attendant
          description: Resource Type of the call feature.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi81ZTk3MzFlNy1iOWQ0LTRmMWQtYjYyMi05NDgwMDhhMjkzMzM
          description: Unique identifier of the location.
        locationName:
          type: string
          example: RCDN
          description: Location name of the announcement file.
    TtsVoice:
      type: object
      description: Text-to-Speech voice metadata.
      example:
        id: ashley
        label: Ashley-Female
        languageCode: en_us
      required:
      - id
      - label
      - languageCode
      properties:
        id:
          type: string
          example: ashley
          description: The voice ID used to generate the audio prompt.
        label:
          type: string
          example: Ashley-Female
          description: The voice label, including the voice name and gender.
        languageCode:
          type: string
          example: en_us
          description: The language code supported by the voice.
    AnnouncementFileUriResponse:
      type: object
      description: Response containing the URI of an announcement media file.
      required:
      - fileUri
      properties:
        fileUri:
          type: string
          example: cmf://customers/bf01164f-ed87-44d9-bc41-f63f26fb9663/media/urls/tmp/af01164f-ed87-44d9-bc41-f63f26fb8663
          description: URI of the announcement media file URLs. Use this value with the Get Media Download URL API to get URLs for downloading the announcement media file.
      example:
        fileUri: cmf://customers/bf01164f-ed87-44d9-bc41-f63f26fb9663/media/urls/tmp/af01164f-ed87-44d9-bc41-f63f26fb8663
    GenerateTtsRequest:
      type: object
      description: Request payload for generating a text-to-speech audio prompt.
      required:
      - voice
      - text
      - languageCode
      properties:
        voice:
          type: string
          example: ashley
          description: The voice ID used to generate the audio prompt. Use the List Text-to-Speech Voices API to retrieve available voices.
        text:
          type: string
          example: Welcome to our service. Please hold while we connect you.
          description: The text to convert to speech.
        languageCode:
          type: string
          example: en_us
          description: The language code used to generate the audio prompt. Use the List Text-to-Speech Voices API to retrieve the language code supported by the selected voice.
    PlaylistObject:
      type: object
      description: Basic playlist metadata available for announcement selection.
      required:
      - id
      - name
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC9iYzZjOTYwYi01ZDJjLTRiM2QtYjRlZC0wNWY1ZmFhMTJjZjA
          description: A unique identifier for the playlist.
        name:
          type: string
          example: testingAnnouncementPlaylist
          description: Unique name for the playlist.
    AnnouncementRequestBody:
      type: object
      description: Request payload for uploading or updating an announcement in the repository.
      required:
      - name
      - fileUri
      - fileName
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          example: Public_Announcement
          description: Name of the announcement.
        fileUri:
          type: string
          minLength: 1
          maxLength: 256
          example: https://example.com/announcements/greeting.wav
          description: URI of the announcement file.
        fileName:
          type: string
          minLength: 1
          maxLength: 80
          example: greeting.wav
          description: File name of the announcement.
        isTextToSpeech:
          type:
          - boolean
          - 'null'
          example: false
          description: Indicates whether the announcement is text-to-speech. If omitted or set to null or false, the announcement is stored as non-text-to-speech and text-to-speech metadata, such as the text, voice, and language, is not retained.
    GenerateUploadUrlResponse:
      type: object
      description: Response containing the information required to encrypt and upload an announcement media file.
      required:
      - preSignedUrl
      - kmsKeyUri
      - fileUri
      properties:
        preSignedUrl:
          type: string
          description: A pre-signed S3 URL for uploading the announcement media file. The URL is time-limited and should be used promptly.
