              schema:
                type: object
                required:
                - announcements
                properties:
                  announcements:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnnouncementsListResponse'
                    description: Array of announcements.
              example:
                announcements:
                - id: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC8zMjAxNjRmNC1lNWEzLTQxZmYtYTMyNi02N2MwOThlNDFkMWQ
