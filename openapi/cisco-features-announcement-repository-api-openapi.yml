  /telephony/config/media/urls/{s3Path}:
    get:
      summary: Get Media Download URL
      operationId: getMediaDownloadUrl
      description: 'Retrieve a pre-signed S3 download URL and KMS encryption key for a previously uploaded announcement media file identified by its S3 path.


        To preview the announcement media file:


        1. Download the KMS key - Use the Webex Node.js SDK and provide `kmsKeyUri` to download the key from KMS.


        2. Download the encrypted media file - The encrypted media file content is stored in cloud and can be retrieved using `preSignedUrl`.


        3. Decrypt the media content - Use the jose library to decrypt the content downloaded from `preSignedUrl` using the downloaded key.


        This API is part of the Announcement Repository with Media URLs feature, which optimizes the media file upload process and adds the ability to preview existing announcement audio files by generating pre-signed S3 download URLs.


        This API requires a full or read-only administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - 'Features: Announcement Repository'
      parameters:
      - name: s3Path
        in: path
        description: The storage path of the announcement media file. Use the value after `/media/urls/` in the `fileUri` returned by the Get Announcement File URI or Get Location Announcement File URI API. For example, if `fileUri` is `cmf://customers/bf01164f-ed87-44d9-bc41-f63f26fb9663/media/urls/tmp/af01164f-ed87-44d9-bc41-f63f26fb8663`, then `s3Path` is `tmp/af01164f-ed87-44d9-bc41-f63f26fb8663`.
        required: true
        example: tmp/af01164f-ed87-44d9-bc41-f63f26fb8663
        schema:
          type: string
      - name: orgId
        in: query
        description: Retrieve the media download URL for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMediaUrlResponse'
              example:
                preSignedUrl: https://s3.amazonaws.com/wxc-media/customers/bf01164f-ed87-44d9-bc41-f63f26fb9663/media/af01164f-ed87-44d9-bc41-f63f26fb8663?X-Amz-Signature=def456
                kmsKeyUri: kms://kms-cisco.wbx2.com/keys/b56642f3-d597-420c-8a55-41aaa8c5b6e7
