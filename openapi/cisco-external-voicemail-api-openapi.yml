      summary: Set or Clear Message Waiting Indicator (MWI) Status
      operationId: postExternalVoicemailMwi
      description: 'Enables an external voicemail service to SET or CLEAR the Message Waiting Indicator (MWI) for a person or workspace.


        Invoke the API using a bearer token from a Service App in the target organization, created by a full admin with the scope `spark-admin:calls_write`.


        Specify the target user or workspace with the required `id` query parameter.


        Optionally, use the orgId parameter to indicate the organization; if omitted, the Service App’s organization is used.


        If `orgId` is provided, it must match the Service App’s organization or be a managed organization.


        Set the desired action (SET or CLEAR) in the message body’s action field.


        Learn more about using Webex Service Apps.'
      tags:
      - External Voicemail
      parameters:
      - name: id
        in: query
        description: Unique identifier for the user or workspace.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9QTEFDRS8xNzdmNTNlZC1hNzY2LTRkYTAtOGQ3OC03MjE0MjhjMmFjZTQ=
      - name: orgId
        in: query
        description: Id of the organization to which the user or workspace belongs. If not provided, the orgId of the Service App is used. If provided, the organization must be the same as or managed by the Service App's organization.
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE=
      requestBody:
        required: true
        content:
          application/json:
            example:
              action: SET
            schema:
              $ref: '#/components/schemas/ExternalVoicemailMwiRequest'
