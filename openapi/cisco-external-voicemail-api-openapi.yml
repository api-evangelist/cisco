      - External Voicemail
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              endpointId: Y2lzY29z...
              lineOwnerId: Y2lzY29z...
            schema:
              type: object
              properties:
                endpointId:
                  type: string
                  example: Y2lzY29z...
                  description: The ID of the device or application to use for the retrieval. The `endpointId` must be one of the endpointIds returned by the [Get Preferred Answer Endpoint API](/docs/api/v1/user-call-settings-2-2/get-preferred-answer-endpoint).
                lineOwnerId:
                  type: string
                  example: Y2lzY29z...Y
