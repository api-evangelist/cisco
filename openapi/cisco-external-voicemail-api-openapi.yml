      summary: Pickup
      operationId: pickup
      description: Picks up an incoming call to another user. A new call is initiated to perform the pickup in a similar manner to the dial command. When target is not present, the API pickups up a call from the user's call pickup group. When target is present, the API pickups an incoming call from the specified target user.
      tags:
      - External Voicemail
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              target: '1000'
              endpointId: Y2lzY29z...
              singleNumberReachPhoneNumber: '+12223334444'
              lineOwnerId: Y2lzY29z...
            schema:
              type: object
              properties:
                target:
                  type: string
                  example: '1000'
                  description: 'Identifies the user to pickup an incoming call from. If not provided, an incoming call to the user''s call pickup group is picked up. The target can be digits or a URI. Some examples for target include: `1234`, `2223334444`, `+12223334444`, `tel:+12223334444`, `user@company.domain`, `sip:user@company.domain`'
                endpointId:
                  type: string
                  example: Y2lzY29z...
                  description: The ID of the device or application to use for the pickup. The `endpointId` must be one of the endpointIds returned by the [Get Preferred Answer Endpoint API](/docs/api/v1/user-call-settings-2-2/get-preferred-answer-endpoint). Mutually exclusive with `singleNumberReachPhoneNumber`.
                singleNumberReachPhoneNumber:
                  type: string
                  example: '+12223334444'
                  description: The Single Number Reach phone number to use for the pickup. Mutually exclusive with `endpointId`.
                lineOwnerId:
                  type: string
                  example: Y2lzY29z...
                  description: The ID of a user, workspace, or virtual line for which there is a secondary line on a device owned by the user invoking the API.
