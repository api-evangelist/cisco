      summary: Answer
      operationId: answer
      description: Answer an incoming call. When no endpointId is specified, the call is answered on the user's primary device. When an endpointId is specified, the call is answered on the device or application identified by the endpointId. The answer API is rejected if the device is not alerting for the call or the device does not support answer via API.
      tags:
      - External Voicemail
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              callId: Y2lzY29zcGFyazovL3VzL0NBTEwvQkNMRC9jYWxsaGFsZi00ODg6MA
              endpointId: Y2lzY29z...
              lineOwnerId: Y2lzY29z...
            schema:
              type: object
              required:
              - callId
              properties:
                callId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL0NBTEwvQkNMRC9jYWxsaGFsZi00ODg6MA
                  description: The call identifier of the call to be answered.
                endpointId:
                  type: string
                  example: Y2lzY29z...
                  description: The ID of the device or application to answer the call on. The `endpointId` must be one of the endpointIds returned by the [Get Preferred Answer Endpoint API](/docs/api/v1/user-call-settings-2-2/get-preferred-answer-endpoint).
                lineOwnerId:
                  type: string
                  example: Y2lzY29z...
                  description: The ID of a user, workspace, or virtual line for which there is a secondary line on a device owned by the user invoking the API.
