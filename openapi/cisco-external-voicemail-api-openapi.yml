        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE=
      requestBody:
        required: true
        content:
          application/json:
            example:
              action: SET
            schema:
              $ref: '#/components/schemas/ExternalVoicemailMwiRequest'
components:
  schemas:
    CallHistoryRecordTypeEnum:
      type: string
      enum:
      - placed
      - missed
      - received
      description: " * `placed` - A call history record for an outgoing call placed by the user.\n * `missed` - A call history record for an incoming call to the user that was not answered.\n * `received` - A call history record for an incoming call to the user that was answered.\n"
    CallPersonalityEnum:
      type: string
      enum:
      - originator
      - terminator
      - clickToDial
      description: " * `originator` - An outgoing call originated by the user.\n * `terminator` - An incoming call received by the user.\n * `clickToDial` - A call that is alerting the user's devices for a Click to Dial action. When the user answers on one of these alerting devices, the call's personality is updated to originator.\n"
    CallTypeEnum:
      type: string
      enum:
      - location
      - organization
      - external
      - emergency
      - repair
      - other
      description: " * `location` - The party is within the same location.\n * `organization` - The party is within the same organization but not within the same location.\n * `external` - The party is outside the organization.\n * `emergency` - The party is an emergency call destination.\n * `repair` - The party is a repair call destination.\n * `other` - The party does not belong to one of the defined call types. For example, a call to a Call Forwarding Always feature activation code.\n"
    RedirectionReasonEnum:
      type: string
      enum:
      - busy
      - noAnswer
      - unavailable
      - unconditional
      - timeOfDay
      - divert
      - followMe
      - huntGroup
      - callQueue
      - unknown
      description: " * `busy` - The call was redirected on a busy condition. For example, the call was forwarded by Call Forwarding Busy.\n * `noAnswer` - The call was redirected on a no answer condition. For example, the call was forwarded by Call Forwarding No Answer.\n * `unavailable` - The call was redirected on an unavailable condition. For example, the call was forwarded by Business Continuity.\n * `unconditional` - The call was redirected unconditionally. For example, the call was forwarded by Call Forwarding Always.\n * `timeOfDay` - The call was redirected by a service schedule. For example, the call was forwarded by Selective Call Forwarding.\n * `divert` - The call was redirected by divert action.\n * `followMe` - The call was redirected by a follow me service. For example, the call was redirected by Simultaneous Ring.\n * `huntGroup` - The call was redirected by Hunt Group routing.\n * `callQueue` - The call was redirected by Call Queue routing.\n * `unknown` - The call was redirected on an unknown condition.\n"
    Call:
      type: object
      required:
      - id
      - callSessionId
      - personality
      - state
      - remoteParty
      - created
      - muteCapable
      - muted
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTEwvQkNMRC9jYWxsaGFsZi00ODg6MA
          description: The call identifier of the call.
        callSessionId:
          type: string
          example: MmFmNThiZjktYWE3Ny00NWE5LThiMDEtYzI4NDMxZWYwNzRm
          description: The call session identifier of the call session the call belongs to. This can be used to correlate multiple calls that are part of the same call session.
        personality:
          allOf:
          - $ref: '#/components/schemas/CallPersonalityEnum'
          description: ' The personality of the call.'
        state:
          allOf:
          - $ref: '#/components/schemas/CallStateEnum'
          description: The current state of the call.
        remoteParty:
          allOf:
          - $ref: '#/components/schemas/PartyInformation'
          description: The remote party's details. For example, if user A calls user B then B is the remote party in A's outgoing call details and A is the remote party in B's incoming call details.
        appearance:
          type: number
          example: 1
          description: The appearance value for the call. The appearance value can be used to display the user's calls in an order consistent with the user's devices. Only present when the call has an appearance value assigned.
        created:
          type: string
          example: '2016-04-21T17:00:00.000Z'
          description: The date and time the call was created.
        answered:
          type: string
          example: '2016-04-21T17:00:00.000Z'
          description: The date and time the call was answered. Only present when the call has been answered.
        redirections:
          type: array
          items:
            $ref: '#/components/schemas/RedirectionInformation'
          description: The list of details for previous redirections of the incoming call ordered from most recent to least recent. For example, if user B forwards an incoming call to user C, then a redirection entry is present for B's forwarding in C's incoming call details. Only present when there were previous redirections and the incoming call's state is alerting.
        recall:
          allOf:
          - $ref: '#/components/schemas/RecallInformation'
          description: The recall details for the incoming call. Only present when the incoming call is for a recall.
        recordingState:
          allOf:
          - $ref: '#/components/schemas/RecordingStateEnum'
          description: The call's current recording state. Only present when the user's call recording has been invoked during the life of the call.
        muteCapable:
          type: boolean
          description: Indicates whether the call is capable of using the [mute](/docs/api/v1/call-controls/mute) and [unmute](/docs/api/v1/call-controls/unmute) APIs.
        muted:
          type: boolean
          description: Indicates whether the call is currently muted.
      example:
        id: string
        callSessionId: string
        personality: originator
        state: connecting
        remoteParty:
          name: string
          number: string
          personId: string
          placeId: string
          privacyEnabled: true
          callType: location
        appearance: 1.23
        created: string
        answered: string
        redirections:
        - reason: busy
          redirectingParty:
            status: ok
            privacyEnabled: false
            callType: external
        recall:
          type: park
          party:
            status: ok
            privacyEnabled: false
            callType: external
        recordingState: pending
        muteCapable: true
        muted: true
    CallQueueCall:
      type: object
      required:
      - callId
      - callSessionId
      - remoteParty
      properties:
        callId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTEwvQkNMRC9jYWxsaGFsZi00ODg6MA
          description: The call identifier of the call currently in the queue.
        origCallId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTEwvQkNMRC9jYWxsaGFsZi00ODg6MQ
          description: The call identifier of the original call that entered the queue. This differs from `callId` when the call currently in the queue is a new call leg derived from the original call - for example, a Call Queue callback, where `callId` is the new callback call and `origCallId` is the original call that entered the queue. Only present when it differs from the call's `callId`.
        callSessionId:
          type: string
          example: MmFmNThiZjktYWE3Ny00NWE5LThiMDEtYzI4NDMxZWYwNzRm
          description: A unique identifier for the call session the call belongs to. This can be used to correlate multiple calls that are part of the same call session.
        remoteParty:
          allOf:
          - $ref: '#/components/schemas/PartyInformation'
          description: The remote party's details for the call waiting in the queue.
        addTime:
          type: string
          example: '2016-04-21T17:00:00.000Z'
          description: The date and time the call was added to the queue.
        removeTime:
          type: string
          example: '2016-04-21T17:00:00.000Z'
          description: The date and time the call was removed from the queue. Only present when the call has been removed from the queue.
        mandatoryEntrance:
          type: boolean
          description: Indicates whether the call entered the queue as a mandatory entrance.
        bounced:
          type: boolean
          description: Indicates whether the call has been bounced from an agent back to the queue.
        reordered:
          type: boolean
          description: Indicates whether the call has been reordered within the queue.
        preservedWaitTime:
          type: integer
          example: 12000
          description: The wait time, in milliseconds, preserved for the call when it was moved between queues.
        queueNumber:
          type: string
          example: '+15559998888'
          description: The phone number of the Call Queue the call is waiting in.
        queueName:
          type: string
          example: Support Queue
          description: The name of the Call Queue the call is waiting in.
        priority:
          type: string
          enum:
          - highest
          - high
          - medium
          - low
          example: medium
          description: The priority of the call within the queue. Only present for premium Call Queues that assign a priority.
        answeringAgentId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9hMTlkODJhMi00ZTY5LTU5YWEtOWYyZi1iY2E2MzEwMTNhNjg=
          description: The identifier of the agent (person, workspace, or virtual line) who is answering, or has answered, the call. The resource type of this identifier is indicated by `answeringAgentType`. Only present when the call is being answered.
        answeringAgentType:
          type: string
          enum:
          - PEOPLE
          - PLACE
          - VIRTUAL_LINE
          example: PEOPLE
          description: 'The type of agent identified by `answeringAgentId`: `PEOPLE` for a user, `PLACE` for a workspace, and `VIRTUAL_LINE` for a virtual line. Only present when the call is being answered.'
        answeringCallId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTEwvQkNMRC9jYWxsaGFsZi00ODg6Mg
          description: The call identifier of the answering agent's terminating call. Use this value to correlate the queue call with other call events associated with the agent. Only present when the call is being answered.
        answeringNetworkCallId:
          type: string
          example: BW125602794300726-545022669@10.70.16.166
          description: The SIP Call-ID of the answering call. Only present when the call is being answered.
    CallStateEnum:
      type: string
      enum:
      - connecting
      - alerting
      - connected
      - held
      - remoteHeld
      - disconnected
      description: " * `connecting` - The remote party is being alerted.\n * `alerting` - The user's devices are alerting for the incoming or Click to Dial call.\n * `connected` - The call is connected.\n * `held` - The user has placed the call on hold.\n * `remoteHeld` - The remote party within the same organization has placed the call on hold.\n * `disconnected` - The call has been disconnected.\n"
    PartyInformation:
      type: object
      required:
      - privacyEnabled
      - callType
      properties:
        name:
          type: string
          example: John Smith
          description: The party's name. Only present when the name is available and privacy is not enabled.
        number:
          type: string
          example: '+12223334444'
          description: 'The party''s number. Only present when the number is available and privacy is not enabled. The number can be digits or a URI. Some examples for number include: `1234`, `2223334444`, `+12223334444`, `*73`, `user@company.domain`'
        personId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9hMTlkODJhMi00ZTY5LTU5YWEtOWYyZi1iY2E2MzEwMTNhNjg=
          description: The party's person ID. Only present when the person ID is available and privacy is not enabled.
        placeId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BMQUNFL2ExOWQ4MmEyLTRlNjktNTlhYS05ZjJmLWJjYTYzMTAxM2E2OA==
          description: The party's place ID. Only present when the place ID is available and privacy is not enabled.
        privacyEnabled:
          type: boolean
          description: Indicates whether privacy is enabled for the name, number and personId/placeId.
        callType:
          allOf:
          - $ref: '#/components/schemas/CallTypeEnum'
          description: The call type for the party.
    RecordingStateEnum:
      type: string
      enum:
      - pending
      - started
      - paused
      - stopped
      - failed
      description: " * `pending` - Recording has been requested for the call but has not yet started.\n * `started` - Recording is active for the call.\n * `paused` - Recording has been paused for the call.\n * `stopped` - Recording has been stopped for the call.\n * `failed` - Recording failed for the call.\n"
    RecallInformation:
      type: object
      required:
      - type
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/RecallTypeEnum'
          description: The type of recall the incoming call is for. Park is the only type of recall currently supported but additional values may be added in the future.
        party:
          allOf:
          - $ref: '#/components/schemas/PartyInformation'
          description: If the type is park, contains the details of where the call was parked. For example, if user A parks a call against user B and A is recalled for the park, then this field contains B's information in A's incoming call details. Only present when the type is park.
    RedirectionInformation:
      type: object
      required:
      - reason
      - redirectingParty
      properties:
        reason:
          allOf:
          - $ref: '#/components/schemas/RedirectionReasonEnum'
          description: The reason the incoming call was redirected.
        redirectingParty:
          allOf:
          - $ref: '#/components/schemas/PartyInformation'
          description: The details of a party who redirected the incoming call.
    RecallTypeEnum:
      type: string
      enum:
      - park
      description: ' * `park` - The user is being recalled for a call park they initiated.

        '
    RejectActionEnum:
      type: string
      enum:
      - busy
      - temporarilyUnavailable
      - ignore
      description: " * `busy` - Send the call to busy.\n * `temporarilyUnavailable` - Send the call to temporarily unavailable.\n * `ignore` - Ignore the call by continuing ringback to the caller while no longer alerting the called user's devices.\n"
    CallHistoryRecord:
      type: object
      required:
      - type
      - privacyEnabled
      - time
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/CallHistoryRecordTypeEnum'
          description: The type of call history record.
        name:
          type: string
          example: John Smith
          description: The name of the called/calling party. Only present when the name is available and privacy is not enabled.
        number:
          type: string
          example: '+12225554444'
          description: 'The number of the called/calling party. Only present when the number is available and privacy is not enabled. The number can be digits or a URI. Some examples for number include: `1234`, `2223334444`, `+12223334444`, `*73`, `user@company.domain`'
        privacyEnabled:
          type: boolean
          description: Indicates whether privacy is enabled for the name and number.
        time:
          type: string
          example: '2016-04-21T17:00:00.000Z'
          description: The date and time the call history record was created. For a placed call history record, this is when the call was placed. For a missed call history record, this is when the call was disconnected. For a received call history record, this is when the call was answered.
    ExternalVoicemailMwiRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - SET
          - CLEAR
          description: Indicates whether to SET or CLEAR the MWI status.
          example: SET
  securitySchemes:
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearerAuth:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
