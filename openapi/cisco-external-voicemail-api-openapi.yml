          description: 'Gateway Timeout: An upstream server failed to respond on time. If your query uses max parameter, please try to reduce it.'
      summary: Dial
      operationId: dial
      description: Initiate an outbound call to a specified destination. This is also commonly referred to as Click to Call or Click to Dial. Alerts occur on all the devices belonging to a user unless an optional endpointId is specified in which case only the device or application identified by the endpointId is alerted. When a user answers an alerting device, an outbound call is placed from that device to the destination.
      tags:
      - External Voicemail
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              destination: '+12223334444'
              endpointId: Y2lzY29z...
              singleNumberReachPhoneNumber: '+12223334444'
              lineOwnerId: Y2lzY29z...
            schema:
              type: object
              required:
              - destination
              properties:
                destination:
                  type: string
                  example: '+12223334444'
                  description: 'The destination to be dialed. The destination can be digits or a URI. Some examples for destination include: `1234`, `2223334444`, `+12223334444`, `*73`, `tel:+12223334444`, `user@company.domain`, and `sip:user@company.domain`.'
                endpointId:
                  type: string
                  example: Y2lzY29z...
                  description: The ID of the device or application to use for the call. The `endpointId` must be one of the endpointIds returned by the [Get Preferred Answer Endpoint API](/docs/api/v1/user-call-settings-2-2/get-preferred-answer-endpoint). Mutually exclusive with `singleNumberReachPhoneNumber`.
                singleNumberReachPhoneNumber:
                  type: string
                  example: '+12223334444'
                  description: The Single Number Reach phone number to use for the call. Mutually exclusive with `endpointId`.
                lineOwnerId:
                  type: string
                  example: Y2lzY29z...
                  description: The ID of a user, workspace, or virtual line for which there is a secondary line on a device owned by the user invoking the API.
