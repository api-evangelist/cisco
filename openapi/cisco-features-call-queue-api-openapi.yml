          - CUSTOM
          description: "The type of announcements to be played when announcementMode is set to NORMAL.`MANUAL`.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        manualAudioFiles:
