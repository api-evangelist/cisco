        schema:
          type: string
      - name: max
        in: query
        description: Limit the number of objects returned to this maximum count.
        example: '5'
        schema:
          type: number
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching objects.
        example: '0'
        schema:
          type: number
      - name: name
        in: query
        description: Only return the supervisors that match the given name.
        example: John
        schema:
          type: string
      - name: phoneNumber
        in: query
        description: Only return the supervisors that match the given phone number, extension, or ESN.
        example: '+19845550186'
        schema:
          type: string
