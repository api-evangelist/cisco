          description: Level at which the announcement is defined.
    ListCallQueueEssentialsObject:
      type: object
      required:
      - id
      - name
      - locationName
      - locationId
      - enabled
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfUVVFVUUvNTU1MzY4Y2QtZDg5Mi00YzFlLTk0YjYtNzdjNjRiYWQ3NWMx
          description: A unique identifier for the call queue.
        name:
          type: string
          example: '5714328359'
          description: Unique name for the call queue.
        hasCxEssentials:
          type: boolean
          example: true
          description: Denotes if the call queue has Customer Assist license.
        locationName:
          type: string
          example: WXCSIVDKCPAPIC4S1
          description: Name of location for call queue.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
          description: ID of location for call queue.
        phoneNumber:
          type: string
          example: '+15558675309'
          description: Primary phone number of the call queue.
        extension:
          type: string
          example: '7781'
          description: Primary phone extension of the call queue.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of location.
        esn:
          type: string
          example: '12347781'
          description: Routing prefix + extension of the call queue.
        enabled:
          type: boolean
          example: true
          description: Whether or not the call queue is enabled.
        tollFreeNumber:
          type: boolean
          example: true
          description: Indicate if the number is toll free.
        department:
          $ref: '#/components/schemas/DepartmentObject'
        digitalInboxEnabled:
          type: boolean
          description: Digital Inbox enabled for Queue. This field is applicable for queue which has `hasCxEssentials=true`.
    CreateCallQueueEssentialsObject:
      type: object
      required:
      - name
      - callPolicies
      - queueSettings
      - agents
      properties:
        name:
          type: string
          example: CallQueue-1
          description: Unique name for the call queue.
        phoneNumber:
          type: string
          example: '+12225555309'
          description: Primary phone number of the call queue. Either a `phoneNumber` or `extension` is mandatory.
        extension:
          type: string
          example: '5309'
          description: Primary phone extension of the call queue. Either a `phoneNumber` or extension is mandatory.
        languageCode:
          type: string
          example: en-US
          description: Language code.
        firstName:
          type: string
          example: Hakim
          description: First name to be shown when calls are forwarded out of this call queue. Defaults to ".". This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        lastName:
          type: string
          example: Smith
          description: Last name to be shown when calls are forwarded out of this call queue. Defaults to `phoneNumber` if set, otherwise defaults to call group name. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        timeZone:
          type: string
          example: America/Chicago
          description: Time zone for the call queue.
        callPolicies:
          $ref: '#/components/schemas/PostCallQueueEssentialCallPolicyObject'
          description: Policy controlling how calls are routed to `agents`.
        queueSettings:
          $ref: '#/components/schemas/CallQueueQueueSettingsObject'
          description: Overall call queue settings.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/PostPersonPlaceVirtualLineCallQueueObject'
          description: People, workspaces and virtual lines that are eligible to receive calls.
        callingLineIdPolicy:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION_NUMBER
          - CUSTOM
          description: "Which type of Calling Line ID Policy Selected for Call Queue.\n * `DIRECT_LINE` - Calling Line ID Policy will show the caller's direct line number.\n * `LOCATION_NUMBER` - Calling Line ID Policy will show the main number for the location.\n * `CUSTOM` - Calling Line ID Policy will show the value from the `callingLineIdPhoneNumber` field.\n"
        callingLineIdPhoneNumber:
          type: string
          example: '+12072342368'
          description: Calling line ID Phone number which will be shown if CUSTOM is selected.
        allowCallWaitingForAgentsEnabled:
          type: boolean
          description: Flag to indicate whether call waiting is enabled for agents.
        allowAgentJoinEnabled:
          type: boolean
          description: Whether or not to allow agents to join or unjoin a queue.
        phoneNumberForOutgoingCallsEnabled:
          type: boolean
          example: true
          description: When `true`, indicates that the agent's configuration allows them to use the queue's Caller ID for outgoing calls.
        directLineCallerIdName:
          $ref: '#/components/schemas/DirectLineCallerIdNameObject'
          description: Settings for the direct line caller ID name to be shown for this call queue.
        dialByName:
          type: string
          example: Hakim Smith
          description: The name to be used for dial by name functions. Characters of `%`,  `+`, `\`, `"` and Unicode characters are not allowed.
        digitalInboxEnabled:
          type: boolean
          description: Digital Inbox enabled for Queue. This field is applicable for queue which has `hasCxEssentials=true`.
    DnisSettings:
      type: object
      required:
      - distinctiveRingingEnabled
      - displayDnisNameAndNumberEnabled
      example:
        distinctiveRingingEnabled: true
        displayDnisNameAndNumberEnabled: true
      properties:
        distinctiveRingingEnabled:
          type: boolean
          example: true
          description: Whether distinctive ringing is enabled for the queue.
        displayDnisNameAndNumberEnabled:
          type: boolean
          example: true
          description: Whether the DNIS name and number is displayed to agents.
    AvailableAgentListGetObject:
      type: object
      required:
      - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AvailableAgentObject'
          description: Array of available agents.
    GetForwardingRuleObject:
      type: object
      required:
      - name
      - id
      - callsFrom
      - callsTo
      properties:
        name:
          type: string
          example: New Selective Rule
          description: Unique name for the selective rule in the hunt group.
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfRk9SV0FSRElOR19TRUxFQ1RJVkVfUlVMRS9kR1Z6ZEZKMWJHVTA
          description: Unique ID for the rule.
        enabled:
          type: boolean
          example: true
          description: Reflects if rule is enabled.
        holidaySchedule:
          type: string
          example: HolidayScheduleOne
          description: Name of the location's holiday schedule which determines when this selective call forwarding rule is in effect.
        businessSchedule:
          type: string
          example: BusinessScheduleTwo
          description: Name of the location's business schedule which determines when this selective call forwarding rule is in effect.
        forwardTo:
          type: object
          required:
          - selection
          properties:
            selection:
              type: string
              enum:
              - FORWARD_TO_DEFAULT_NUMBER
              - FORWARD_TO_SPECIFIED_NUMBER
              - DO_NOT_FORWARD
              description: "Controls what happens when the rule matches.\n * `FORWARD_TO_DEFAULT_NUMBER` - When the rule matches, forward to the destination for the hunt group.\n * `FORWARD_TO_SPECIFIED_NUMBER` - When the rule matches, forward to the destination for this rule.\n * `DO_NOT_FORWARD` - When the rule matches, do not forward to another number.\n"
            phoneNumber:
              type: string
              example: '+15558675309'
              description: Phone number used if selection is `FORWARD_TO_SPECIFIED_NUMBER`.
          description: Controls what happens when the rule matches including the destination number for the call forwarding.
        callsFrom:
          type: object
          required:
          - selection
          - customNumbers
          properties:
            selection:
              type: string
              enum:
              - ANY
              - CUSTOM
              description: "If `CUSTOM`, use `customNumbers` to specify which incoming caller ID values cause this rule to match. `ANY` means any incoming call matches assuming the rule is in effect based on the associated schedules.\n * `ANY` - Rule matches for calls from any number.\n * `CUSTOM` - Rule matches based on the numbers and options in `customNumbers`.\n"
            customNumbers:
              type: object
              required:
              - privateNumberEnabled
              - unavailableNumberEnabled
              properties:
                privateNumberEnabled:
                  type: boolean
                  description: Match if caller ID indicates the call is from a private number.
                unavailableNumberEnabled:
                  type: boolean
                  description: Match if caller ID is unavailable.
                numbers:
                  type: array
                  items:
                    type: string
                  description: Array of number strings to be matched against incoming caller ID.
              description: Custom rules for matching incoming caller ID information.
          description: Settings related to the rule matching based on incoming caller ID.
        callsTo:
          type: object
          properties:
            numbers:
              type: array
              items:
                $ref: '#/components/schemas/CallForwardingNumbers'
              description: Array of numbers to be matched against the calling destination number.
          description: Settings related to the rule matching based on the destination number.
    DnisAnnouncementsModify:
