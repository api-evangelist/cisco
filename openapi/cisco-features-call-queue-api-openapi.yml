      summary: Update Call Forwarding Settings for a Call Queue
      operationId: updateCallQueueCallForwardingSettings
      description: 'Update Call Forwarding settings for the designated Call Queue.


        The call forwarding feature allows you to direct all incoming calls based on specific criteria that you define.

        Below are the available options for configuring your call forwarding:

        1. Always forward calls to a designated number.

        2. Forward calls to a designated number based on certain criteria.

        3. Forward calls using different modes.


        Updating call forwarding settings for a call queue requires a full administrator or location administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - 'Features:  Call Queue'
      parameters:
      - name: locationId
        in: path
        description: Location in which this call queue exists.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
        schema:
          type: string
      - name: queueId
        in: path
        description: Update call forwarding settings for this call queue.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0NBTExfUVVFVUUvNDI0OTlmZjUtYWI1ZC00NzU4LTliMWItZjg3MTVhM2UwNmVh
        schema:
          type: string
      - name: orgId
        in: query
        description: Update call queue forwarding settings from this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              callForwarding:
                always:
                  enabled: false
                  destination: ''
                selective:
                  enabled: true
                  destination: '35556'
                  destinationVoicemailEnabled: true
                rules:
                - id: Y2lzY29zcGFyazovL3VzL0NBTExfRk9SV0FSRElOR19TRUxFQ1RJVkVfUlVMRS9RbTlpVW1WdVlXMWw
                  enabled: true
