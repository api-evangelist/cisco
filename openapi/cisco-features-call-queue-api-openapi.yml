      summary: Get Call Queue Available Agents
      operationId: getCallQueueAvailableAgents
      description: 'List all available users, workspaces, or virtual lines that can be assigned as call queue agents.


        Available agents are users (excluding users with Webex Calling Standard license), workspaces, or virtual lines that can be assigned to a call queue.

        Calls from the call queue are routed to assigned agents based on configuration.

        An agent can be assigned to one or more call queues and can be managed by supervisors.


        Retrieving this list requires a full, read-only or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - 'Features:  Call Queue'
      parameters:
      - name: locationId
        in: query
        description: The location ID of the call queue. Temporary mandatory query parameter, used for performance reasons only and not a filter.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
        schema:
          type: string
      - name: orgId
        in: query
        description: List available agents for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: max
        in: query
        description: Limit the number of objects returned to this maximum count.
        example: '5'
        schema:
          type: number
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching objects.
        example: '0'
        schema:
          type: number
      - name: name
        in: query
        description: Search based on name (user first and last name combination).
        example: Customer Support
        schema:
          type: string
      - name: phoneNumber
        in: query
        description: Search based on number or extension.
        example: '+15558675309'
        schema:
          type: string
      - name: order
        in: query
        description: 'Order the available agents according to the designated fields. Up to three comma-separated sort order fields may be specified. Available sort fields are: `userId`, `fname`, `firstname`, `lname`, `lastname`, `dn`, and `extension`. Sort order can be added together with each field using a hyphen, `-`. Available sort orders are: `asc`, and `desc`.'
        example: lname-asc,fname-desc,extension
        schema:
          type: string
