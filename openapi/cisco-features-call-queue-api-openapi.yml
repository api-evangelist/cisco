          example: true
          description: Whether or not the call queue holiday service routing policy is enabled.
        action:
          type: string
          enum:
          - BUSY
          - TRANSFER
          description: "The call processing action type.\n * `BUSY` - The caller hears a fast-busy tone.\n * `TRANSFER` - Transfers the call to number specified in `transferPhoneNumber`.\n"
        holidayScheduleLevel:
          type: string
          enum:
          - LOCATION
          - ORGANIZATION
          description: "The schedule mentioned in `holidayScheduleName` is org or location specific. (Must be from `holidaySchedules` list)\n * `LOCATION` - Schedule is configured across a location.\n * `ORGANIZATION` - Schedule is configured across an organization.\n"
        holidayScheduleName:
          type: string
          example: 2022 Holidays Period
          description: Name of the schedule configured for a holiday service as one of from `holidaySchedules` list.
        transferPhoneNumber:
          type: string
          example: '1235557890'
          description: Call gets transferred to this number when action is set to `TRANSFER`. This can also be an extension.
        playAnnouncementBeforeEnabled:
          type: boolean
          example: true
          description: Indicates whether an announcement plays to callers before the action is applied.
        audioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcement to be played.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        audioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureGetObject'
          description: List of Announcement Audio Files when `audioMessageSelection` is `CUSTOM`.
        holidaySchedules:
          type: array
          items:
            $ref: '#/components/schemas/CallQueueHolidaySchedulesObject'
          description: Lists the pre-configured holiday schedules.
    UserType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      - VIRTUAL_LINE
      description: " * `PEOPLE` - The associated member is a person.\n * `PLACE` - The associated member is a workspace.\n * `VIRTUAL_LINE` - The associated member is a virtual line.\n"
    BulkDeleteDnisRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: string
          maxItems: 99
          example:
          - Y2lzY29zcGFyazovL3VzL0ROSVMvZTQ0NTE5OWEtNzlkYS00NWE1LTkyY2EtNDI1YzRmMzA0ZDk5
          description: Array of DNIS IDs to be deleted.
    GetCallQueueStrandedCallsObject:
      type: object
      required:
      - action
      - audioMessageSelection
      properties:
        action:
          type: string
          enum:
          - NONE
          - BUSY
          - TRANSFER
          - NIGHT_SERVICE
          - RINGING
          - ANNOUNCEMENT
          description: "The call processing action type.\n * `NONE` - Call remains in the queue.\n * `BUSY` - Calls are removed from the queue and are provided with the Busy treatment. If the queue is configured with the Call Forwarding Busy or the Voice Messaging service, then the call is handled accordingly.\n * `TRANSFER` - Calls are removed from the queue and are transferred to the configured `transferPhoneNumber`.\n * `NIGHT_SERVICE` - Calls are handled according to the Night Service configuration. If the Night Service action is set to `none`, then this is equivalent to this policy being set to `none` (that is, calls remain in the queue).\n * `RINGING` - Calls are removed from the queue and are provided with ringing until the caller releases the call. The ringback tone played to the caller is localized according to the country code of the caller.\n * `ANNOUNCEMENT` - Calls are removed from the queue and are provided with an announcement that is played in a loop until the caller releases the call.\n"
        transferPhoneNumber:
          type: string
          example: '1235557890'
          description: Call gets transferred to this number when action is set to `TRANSFER`. This can also be an extension.
        audioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcement to be played.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        audioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureGetObject'
          description: List of Announcement Audio Files when `audioMessageSelection` is `CUSTOM`.
        triggerPolicyWhenAllAgentsAreUnreachableEnabled:
          type: boolean
          example: true
          description: Trigger stranded calls queue policy when all agents are unreachable.
    AvailableNumbersResponse:
      type: object
      example:
        phoneNumbers:
        - phoneNumber: '+12134567895'
          state: ACTIVE
          isMainNumber: false
          telephonyType: PSTN_NUMBER
          tollFreeNumber: false
          isServiceNumber: false
      properties:
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/AvailablePhoneNumber'
          description: List of available phone numbers.
          example:
          - phoneNumber: '+12134567895'
            state: ACTIVE
            isMainNumber: false
            telephonyType: PSTN_NUMBER
            tollFreeNumber: false
            isServiceNumber: false
    ModifyCallQueueObject:
      type: object
      required:
      - queueSettings
      properties:
        enabled:
          type: boolean
          example: true
          description: Whether or not the call queue is enabled.
        name:
          type: string
          example: CallQueue-1
          description: Unique name for the call queue.
        languageCode:
          type: string
          example: en-US
          description: Language code.
        firstName:
          type: string
          example: Hakim
          description: First name to be shown when calls are forwarded out of this call queue. Defaults to `.`. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        lastName:
          type: string
          example: Smith
          description: Last name to be shown when calls are forwarded out of this call queue. Defaults to the `phoneNumber` if set, otherwise defaults to call group name. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        timeZone:
          type: string
          example: America/Chicago
          description: Time zone for the hunt group.
        phoneNumber:
          type: string
          example: '+12225555309'
          description: Primary phone number of the call queue.
        extension:
          type: string
          example: '5309'
          description: Extension of the call queue.
        alternateNumberSettings:
          type: object
          properties:
            distinctiveRingEnabled:
              type: boolean
              example: true
              description: Distinctive Ringing selected for the alternate numbers in the call queue overrides the normal ringing patterns set for Alternate Numbers.
            alternateNumbers:
              type: array
              items:
                $ref: '#/components/schemas/AlternateNumbersWithPattern'
              description: Allows up to 10 numbers, each with an optional distinctive ring setting override.
          description: The alternate numbers feature allows you to assign multiple phone numbers or extensions to a call queue. Each number will reach the same greeting and each menu will function identically to the main number. The alternate numbers option enables you to have up to ten (10) phone numbers ring into the call queue.
        callPolicies:
          $ref: '#/components/schemas/ModifyCallQueueCallPolicyObject'
          description: Policy controlling how calls are routed to agents.
        callingLineIdPolicy:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION_NUMBER
          - CUSTOM
          description: "Which type of Calling Line ID Policy Selected for Call Queue.\n * `DIRECT_LINE` - Calling Line ID Policy will show the caller's direct line number.\n * `LOCATION_NUMBER` - Calling Line ID Policy will show the main number for the location.\n * `CUSTOM` - Calling Line ID Policy will show the value from the `callingLineIdPhoneNumber` field.\n"
        callingLineIdPhoneNumber:
          type: string
          example: '+12072342368'
          description: Calling line ID Phone number which will be shown if CUSTOM is selected.
        queueSettings:
          $ref: '#/components/schemas/CallQueueQueueSettingsObject'
          description: Overall call queue settings.
        allowCallWaitingForAgentsEnabled:
          type: boolean
          description: Flag to indicate whether call waiting is enabled for agents.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/ModifyPersonPlaceVirtualLineCallQueueObject'
          description: People, workspaces and virtual lines that are eligible to receive calls.
        allowAgentJoinEnabled:
          type: boolean
          description: Whether or not to allow agents to join or unjoin a queue.
        phoneNumberForOutgoingCallsEnabled:
          type: boolean
          example: true
          description: When `true`, indicates that the agent's configuration allows them to use the queue's Caller ID for outgoing calls.
        directLineCallerIdName:
          $ref: '#/components/schemas/DirectLineCallerIdNameObjectForPut'
          description: Settings for the direct line caller ID name to be shown for this call queue.
        dialByName:
          type: string
          example: Hakim Smith
          description: Sets or clears the name to be used for dial by name functions. To clear the `dialByName`, the attribute must be set to null or empty string. Characters of `%`,  `+`, `\`, `"` and Unicode characters are not allowed.
        digitalInboxEnabled:
          type: boolean
          description: Digital Inbox enabled for Queue. This field is applicable for queue which has `hasCxEssentials=true`.
    CallForwardRulesGet:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfRk9SV0FSRElOR19TRUxFQ1RJVkVfUlVMRS9kR1Z6ZEZKMWJHVTA
          description: Unique ID for the rule.
        name:
          type: string
          example: My Rule
          description: Unique name of rule.
        callFrom:
          type: string
          example: Any private Number,2025551212
          description: Comma-separated list of incoming call numbers that, when matched, will not be forwarded. A Limit of 12 numbers is allowed. Use `Any private Number` in the comma-separated value to indicate rules that match incoming calls from a private number. Use `Any unavailable number` in the comma-separated value to match incoming calls from an unavailable number.
        callsTo:
          type: string
          example: Primary
          description: Comma-separated list of the types of numbers being matched for incoming call destination.
        forwardTo:
          type: string
          example: '2025557736'
          description: Number to which calls will be forwarded if the rule is of type "Forward To" and the incoming call is matched.
        enabled:
          type: boolean
          example: true
          description: Reflects if rule is enabled.
    ModesPatch:
      type: object
      required:
      - normalOperationEnabled
      - id
      - forwardTo
      properties:
        normalOperationEnabled:
          type: boolean
          example: true
          description: Normal operation is enabled or disabled.
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09QRVJBVElOR19NT0RFL2JiOTc1OTcxLTBjZWYtNDdhNi05Yzc5LTliZWFjY2IwYjg4Mg
          description: The ID of the operating mode.
        forwardTo:
          type: object
          required:
          - selection
          properties:
            selection:
              type: string
              enum:
              - FORWARD_TO_DEFAULT_NUMBER
              - FORWARD_TO_SPECIFIED_NUMBER
              - DO_NOT_FORWARD
              description: "The selection for forwarding.\n * `FORWARD_TO_DEFAULT_NUMBER` - When the rule matches, forward to the destination for the hunt group.\n * `FORWARD_TO_SPECIFIED_NUMBER` - When the rule matches, forward to the destination for this rule.\n * `DO_NOT_FORWARD` - When the rule matches, do not forward to another number.\n"
            destination:
              type: string
              example: '+19705550006'
              description: The destination for forwarding. Required when the selection is set to `FORWARD_TO_SPECIFIED_NUMBER`.
            destinationVoicemailEnabled:
              type: boolean
              description: Sending incoming calls to voicemail is enabled/disabled when the destination is an internal phone number and that number has the voicemail service enabled.
          description: Forward to settings.
    AudioAnnouncementFileFeatureObject:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FVVE9fQVRURU5EQU5UL2QzVjBPWFIxWjJkM2FFQm1iR1Y0TWk1amFYTmpieTVqYjIw
          description: A unique identifier for the announcement. `name`, `mediaFileType`, `level` are mandatory if `id` is not provided for uploading an announcement.
        fileName:
