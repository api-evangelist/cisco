              description: Whether callback option is enabled.
            minimumEstimatedCallbackTime:
              type: integer
              description: Minimum estimated callback time in minutes.
            internationalCallbackEnabled:
              type: boolean
              description: Whether international callback is enabled.
            playUpdatedEstimatedWaitMessage:
              type: boolean
              description: Whether to play updated estimated wait message.
        whisperMessage:
