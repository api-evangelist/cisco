                    level: LOCATION
                waitMessage:
                  enabled: true
                  waitMode: POSITION
                  handlingTime: 100
                  defaultHandlingTime: 100
                  queuePosition: 100
                  highVolumeMessageEnabled: false
                  estimatedWaitingTime: 600
                  playUpdatedEstimatedWaitMessage: true
                comfortMessage:
                  enabled: true
                  timeBetweenMessages: 10
                  greeting: DEFAULT
