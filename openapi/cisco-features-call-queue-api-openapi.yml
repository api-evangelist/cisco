        level:
          type: string
          enum:
          - ORGANIZATION
          - LOCATION
          - ENTITY
          description: "Audio announcement file type location.\n * `ORGANIZATION` - Audio file is configured across organisation.\n * `LOCATION` - Audio file is configured across location.\n * `ENTITY` - Audio file is configured on instance level.\n"
    TelephonyType:
      type: string
      enum:
      - PSTN_NUMBER
      description: ' * `PSTN_NUMBER` - The object is a PSTN number.

        '
    AlternateNumbersWithPattern:
