      summary: Read the List of Call Queue or Customer Assist Queues
      operationId: listCallQueues
      description: 'List all Call Queues for the organization.


        Call queues temporarily hold calls in the cloud, when all agents

        assigned to receive calls from the queue are unavailable. Queued calls are routed to

        an available agent, when not on an active call. Each call queue is assigned a lead number, which is a telephone

        number that external callers can dial to reach the users assigned to the call queue.

        Call queues are also assigned an internal extension, which can be dialed

        internally to reach the users assigned to the call queue.


        Retrieving this list requires a full or read-only administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - 'Features:  Call Queue'
      parameters:
      - name: orgId
        in: query
        description: Returns the list of call queues in this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: locationId
        in: query
        description: Returns the list of call queues in this location.
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
        schema:
          type: string
      - name: max
        in: query
        description: Limit the number of objects returned to this maximum count.
        example: '5'
        schema:
          type: number
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching objects.
        example: '0'
        schema:
          type: number
      - name: name
        in: query
        description: Returns only the call queues matching the given name.
        example: Customer Support
        schema:
          type: string
      - name: phoneNumber
        in: query
        description: Returns only the call queues matching the given primary phone number or extension.
        example: '+15558675309'
        schema:
          type: string
      - name: departmentId
        in: query
        description: Returns only call queues matching the given department ID.
        example: Y2lzY29zcGFyazovL3VzL1NDSU1fR1JPVVAvZjA2ZWRiOGMtMjMxNC00ZTcxLWIzNzgtZTdiMmQwNjk3OTliOjk2YWJjMmFhLTNkY2MtMTFlNS1hMTUyLWZlMzQ4MTljZGM5YQ
        schema:
          type: string
      - name: departmentName
        in: query
        description: Returns only call queues matching the given department name.
        example: HR
        schema:
          type: string
      - name: hasCxEssentials
        in: query
        description: Returns only the list of call queues with Customer Assist license when `true`, otherwise returns the list of Customer Experience Basic call queues.
        example: true
        schema:
          type: boolean
      - name: digitalInboxEnabled
        in: query
        description: Returns only the list of call queues with digital inbox enabled when `true`, or disabled when `false`. This query parameter is only valid when `hasCxEssentials` is `true`.
        example: true
        schema:
          type: boolean
