              required:
              - enabled
              - modes
              properties:
                enabled:
                  type: boolean
                  description: Indicates whether operating modes forwarding is enabled.
                modes:
                  type: array
                  items:
                    $ref: '#/components/schemas/ModesPatch'
                  description: List of operating mode configurations.
          description: Settings related to `Always`, `Busy`, and `No Answer` call forwarding.
    CallQueuePrimaryAvailableNumberObject:
      type: object
      required:
      - phoneNumber
      - state
      - isMainNumber
      - tollFreeNumber
      - telephonyType
      - isServiceNumber
      properties:
        phoneNumber:
          type: string
          example: '+12056350001'
          description: A unique identifier for the PSTN phone number.
        state:
          $ref: '#/components/schemas/STATE'
          description: Phone number's state.
        isMainNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is used as a location CLID.
        tollFreeNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a toll-free number.
        telephonyType:
          $ref: '#/components/schemas/TelephonyType'
          description: The telephony type for the number.
        isServiceNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a service number; otherwise, it is a standard number. Service numbers are high-utilization or high-concurrency PSTN phone numbers that are neither mobile nor toll-free.
    HuntRoutingTypeSelection:
      type: string
      enum:
      - PRIORITY_BASED
      - SKILL_BASED
      description: " * `PRIORITY_BASED` - Default routing type which directly uses the routing policy to dispatch calls to the agents.\n * `SKILL_BASED` - This option uses skill level as the criteria to route calls to agents. When there is more than one agent with the same skill level, the selected `policy` helps dispatch the calls to the agents.\n"
    AvailablePhoneNumber:
      type: object
      properties:
        phoneNumber:
          type: string
          example: '+12134567895'
          description: The phone number.
        state:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          example: ACTIVE
          description: Defines whether the number is active or not.
        isMainNumber:
          type: boolean
          example: false
          description: Flag to indicate if the number is used as location main number.
        telephonyType:
          type: string
          example: PSTN_NUMBER
          description: Define type of number. Currently API supports only PSTN_NUMBER.
        tollFreeNumber:
          type: boolean
          example: false
          description: Flag to indicate if the number is toll free.
        isServiceNumber:
          type: boolean
          example: false
          description: Flag to indicate if the number is a Service Number.
    AgentAction:
      type: string
      enum:
      - ADD
      - DELETE
      description: " * `ADD` - Assign an agent to a supervisor.\n * `DELETE` - Remove an agent from a supervisor.\n"
    MohMessageSource:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
          description: Whether the source is enabled.
        greeting:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          - PLAYLIST
          example: DEFAULT
          description: The greeting type.
        audioAnnouncementFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFile'
          description: List of audio announcement files.
          example:
          - id: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC9jZWRkODcwYS1lMTkzLTQxNmQtYmM3OS1mNzkyYmUyMzlhOGI
            fileName: AUDIO_FILE.wav
            mediaFileType: WAV
            level: ORGANIZATION
            isTextToSpeech: false
        audioPlaylistId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BMQVlMSVNULzEyMzQ1Njc4OTBhYmNkZWY
          description: Audio playlist ID.
        audioPlaylistName:
          type: string
          example: Default Playlist
          description: Audio playlist name.
    CreateDnisRequest:
      type: object
      required:
      - name
      - ringPattern
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          example: Support Line
          description: Name of the DNIS. Must be unique across the call queue.
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 23
          example: '+15551234567'
          description: Phone number of the DNIS. Must be a valid phone number from the same location. Either phoneNumber or extension is required.
        extension:
          type: string
          minLength: 2
          maxLength: 20
          example: '1000'
          description: Extension of the DNIS. Either phoneNumber or extension is required.
        ringPattern:
          type: string
          enum:
          - NORMAL
          - LONG_LONG
          - SHORT_SHORT_LONG
          - SHORT_LONG_SHORT
          example: NORMAL
          description: Ring pattern of the DNIS.
    NumberOwnerType:
      type: string
      enum:
      - PLACE
      - PEOPLE
      - VIRTUAL_LINE
      - AUTO_ATTENDANT
      - CALL_QUEUE
      - GROUP_PAGING
      - HUNT_GROUP
      - VOICE_MESSAGING
      - OFFICE_ANYWHERE
      - CONTACT_CENTER_LINK
      - CONTACT_CENTER_ADAPTER
      - ROUTE_LIST
      - VOICEMAIL_GROUP
      - COLLABORATE_BRIDGE
      description: " * `PLACE` - PSTN phone number's owner is a workspace.\n * `PEOPLE` - PSTN phone number's owner is a person.\n * `VIRTUAL_LINE` - PSTN phone number's owner is a Virtual Profile.\n * `AUTO_ATTENDANT` - PSTN phone number's owner is an auto-attendant.\n * `CALL_QUEUE` - PSTN phone number's owner is a call queue.\n * `GROUP_PAGING` - PSTN phone number's owner is a group paging.\n * `HUNT_GROUP` - PSTN phone number's owner is a hunt group.\n * `VOICE_MESSAGING` - PSTN phone number's owner is a voice messaging.\n * `OFFICE_ANYWHERE` - PSTN phone number's owner is a Single Number Reach.\n * `CONTACT_CENTER_LINK` - PSTN phone number's owner is a Contact Center link.\n * `CONTACT_CENTER_ADAPTER` - PSTN phone number's owner is a Contact Center adapter.\n * `ROUTE_LIST` - PSTN phone number's owner is a route list.\n * `VOICEMAIL_GROUP` - PSTN phone number's owner is a voicemail group.\n * `COLLABORATE_BRIDGE` - PSTN phone number's owner is a collaborate bridge.\n"
    CreateAgentObject:
      type: object
      required:
      - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/PutPersonPlaceVirtualLineAgentObject'
          description: 'People, workspaces and virtual lines that are eligible to receive calls. **WARNING**: The `id` returned is in UUID format, since we don''t have agentType from OCI response. This will be converting to Hydra type in future release.'
    GetCallQueueEssentialsCallPolicyObject:
      type: object
      required:
      - policy
      - callBounce
      - distinctiveRing
      properties:
        policy:
          $ref: '#/components/schemas/HuntPolicyEssentialSelection'
          description: Call routing policy to use to dispatch calls to agents.
        callBounce:
          type: object
          required:
          - callBounceEnabled
          - callBounceMaxRings
          - agentUnavailableEnabled
          - alertAgentEnabled
          - alertAgentMaxSeconds
          - callBounceOnHoldEnabled
          - callBounceOnHoldMaxSeconds
          properties:
            callBounceEnabled:
              type: boolean
              example: true
              description: If enabled, bounce calls after the set number of rings.
            callBounceMaxRings:
              type: number
              example: 5
              description: Number of rings after which to bounce call, if call bounce is enabled.
            agentUnavailableEnabled:
              type: boolean
              example: true
              description: Bounce if agent becomes unavailable.
            alertAgentEnabled:
              type: boolean
              example: true
              description: Alert agent if call on hold more than alertAgentMaxSeconds.
            alertAgentMaxSeconds:
              type: number
              example: 20
              description: Number of second after which to alert agent if alertAgentEnabled.
            callBounceOnHoldEnabled:
              type: boolean
              example: true
              description: Bounce if call on hold more than callBounceMaxSeconds.
            callBounceOnHoldMaxSeconds:
              type: number
              example: 20
              description: Number of second after which to bounce if callBounceEnabled.
          description: Settings for when the call into the call queue is not answered.
        distinctiveRing:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              example: true
              description: Whether or not the distinctive ring is enabled.
            ringPattern:
              $ref: '#/components/schemas/RingPatternObject'
              description: Ring pattern for when this callqueue is called. Only available when `distinctiveRing` is enabled for the call queue.
          description: Whether or not the call queue has the distinctive ring option enabled.
        routingType:
          $ref: '#/components/schemas/HuntRoutingTypeSelection'
          description: Call routing type to use to dispatch calls to agents.
    AudioAnnouncementFileModify:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC9jZWRkODcwYS1lMTkzLTQxNmQtYmM3OS1mNzkyYmUyMzlhOGI
          description: Announcement file ID.
        fileName:
          type: string
