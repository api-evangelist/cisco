        transferPhoneNumber:
          type: string
          example: '1234'
          description: Call gets transferred to this number when action is set to `TRANSFER`. This can also be an extension.
        playAnnouncementBeforeEnabled:
          type: boolean
          example: true
          description: Indicates whether an announcement plays to callers before the action is applied.
        announcementMode:
          type: string
          enum:
          - NORMAL
          - MANUAL
          description: "The type of announcements to played.\n * `NORMAL` - Plays announcement as per `audioMessageSelection`.\n * `MANUAL` - Plays announcement as per `manualAudioMessageSelection`.\n"
        audioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcements to be played when announcementMode is set to `NORMAL`.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        audioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureObject'
          description: List of pre-configured Announcement Audio Files when `audioMessageSelection` is `CUSTOM`.
        businessHoursName:
          type: string
          example: Working Hour
          description: Name of the schedule configured for a night service as one of from `businessHourSchedules` list.
        businessHoursLevel:
          type: string
          enum:
          - ORGANIZATION
          - LOCATION
          description: "The above mentioned schedule is org or location specific. (Must be from `businessHourSchedules` list)\n * `ORGANIZATION` - Schedule is configured across an organization.\n * `LOCATION` - Schedule is configured across a location.\n"
        forceNightServiceEnabled:
          type: boolean
          example: true
          description: Force night service regardless of business hour schedule.
        manualAudioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcements to be played when announcementMode is set to `MANUAL`.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        manualAudioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureObject'
          description: List Of pre-configured Audio Files.
    SelectionObject:
      type: string
      enum:
      - CUSTOM_NAME
      - DISPLAY_NAME
      description: " * `DISPLAY_NAME` - When this option is selected, `displayName` is to be shown for this workspace.\n * `CUSTOM_NAME` - When this option is selected, `customName` is to be shown for this workspace."
    ModifyCallQueueHolidayObject:
      type: object
      required:
      - holidayServiceEnabled
      - action
      - holidayScheduleLevel
      - playAnnouncementBeforeEnabled
      - audioMessageSelection
      properties:
        holidayServiceEnabled:
          type: boolean
          example: true
          description: Enable or Disable the call queue holiday service routing policy.
        action:
          type: string
          enum:
          - BUSY
          - TRANSFER
          description: "The call processing action type.\n * `BUSY` - The caller hears a fast-busy tone.\n * `TRANSFER` - Transfers the call to number specified in `transferPhoneNumber`.\n"
        holidayScheduleLevel:
          type: string
          enum:
          - LOCATION
          - ORGANIZATION
          description: "The schedule mentioned in `holidayScheduleName` is org or location specific. (Must be from `holidaySchedules` list)\n * `LOCATION` - Schedule is configured across a location.\n * `ORGANIZATION` - Schedule is configured across an organization.\n"
        holidayScheduleName:
          type: string
          example: 2022 Holidays Period
          description: Name of the schedule configured for a holiday service as one of from `holidaySchedules` list.
        transferPhoneNumber:
          type: string
          example: '1235557890'
          description: Call gets transferred to this number when action is set to `TRANSFER`. This can also be an extension.
        playAnnouncementBeforeEnabled:
          type: boolean
          example: true
          description: Indicates whether an announcement plays to callers before the action is applied.
        audioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcement to be played.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        audioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureObject'
          description: List of pre-configured Announcement Audio Files when `audioMessageSelection` is `CUSTOM`.
    GetCallQueueEssentialsObject:
      type: object
      required:
      - id
      - name
      - enabled
      - alternateNumberSettings
      - callPolicies
      - queueSettings
      - agents
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfUVVFVUUvNTU1MzY4Y2QtZDg5Mi00YzFlLTk0YjYtNzdjNjRiYWQ3NWMx
          description: A unique identifier for the call queue.
        name:
          type: string
          example: CallQueue-1
          description: Unique name for the call queue.
        hasCxEssentials:
          type: boolean
          example: true
          description: Denotes if the call queue has Customer Assist license.
        enabled:
          type: boolean
          example: true
          description: Whether or not the call queue is enabled.
        language:
          type: string
          example: English
          description: Language for call queue.
        languageCode:
          type: string
          example: en-US
          description: Language code for call queue.
        firstName:
          type: string
          example: Hakim
          description: First name to be shown when calls are forwarded out of this call queue. Defaults to `.`. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        lastName:
          type: string
          example: Smith
          description: Last name to be shown when calls are forwarded out of this call queue. Defaults to the `phoneNumber` if set, otherwise defaults to call group name. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        timeZone:
          type: string
          example: America/Chicago
          description: Time zone for the call queue.
        phoneNumber:
          type: string
          example: '+15558675309'
          description: Primary phone number of the call queue.
        numberUsageType:
          type: string
          example: SERVICE_NUMBER
          enum:
          - PSTN_NUMBER
          - MOBILE_NUMBER
          - SERVICE_NUMBER
          - ELIN
          description: "Number type of primary number assigned to queue.\n * `PSTN_NUMBER` - Public Switched Telephone Network (PSTN) number.\n * `MOBILE_NUMBER` - Mobile number.\n * `SERVICE_NUMBER` - A number used in high-volume service.\n * `ELIN` - Emergency Location Identification Number (ELIN), numbers can be used to place emergency calls from a location.\n"
        businessTextingEnabled:
          type: boolean
          description: Indicates whether business texting is enabled for the primary number assigned to the queue. This field is read-only and cannot be modified through the queue APIs.
        extension:
          type: string
          example: '7781'
          description: Extension of the call queue.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of location.
        esn:
          type: string
          example: '12347781'
          description: Routing prefix + extension of the call queue.
        tollFreeNumber:
          type: boolean
          description: Indicate if the number is toll free.
        phoneNumberForOutgoingCallsEnabled:
          type: boolean
          example: true
          description: When true, indicates that the agent's configuration allows them to use the queue's Caller ID for outgoing calls.
        callingLineIdPolicy:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION_NUMBER
          - CUSTOM
          description: "Which type of Calling Line ID Policy Selected for Call Queue.\n * `DIRECT_LINE` - Calling Line ID Policy will show the caller's direct line number.\n * `LOCATION_NUMBER` - Calling Line ID Policy will show the main number for the location.\n * `CUSTOM` - Calling Line ID Policy will show the value from the `callingLineIdPhoneNumber` field.\n"
        callingLineIdPhoneNumber:
          type: string
          example: '+12072342368'
          description: Calling line ID Phone number which will be shown if CUSTOM is selected.
        alternateNumberSettings:
          type: object
          required:
          - distinctiveRingEnabled
          - alternateNumbers
          properties:
            distinctiveRingEnabled:
              type: boolean
              example: true
              description: Distinctive Ringing selected for the alternate numbers in the call queue overrides the normal ringing patterns set for Alternate Number.
            alternateNumbers:
              type: array
              items:
                $ref: '#/components/schemas/AlternateNumbersWithPattern'
              description: Allows up to 10 numbers, each with an optional distinctive ring setting override.
          description: The alternate numbers feature allows you to assign multiple phone numbers or extensions to a call queue. Each number will reach the same greeting and each menu will function identically to the main number. The alternate numbers option enables you to have up to ten (10) phone numbers ring into the call queue.
        callPolicies:
          $ref: '#/components/schemas/GetCallQueueEssentialsCallPolicyObject'
          description: Policy controlling how calls are routed to agents.
        queueSettings:
          $ref: '#/components/schemas/CallQueueQueueEssentialsSettingsObject'
          description: Overall call queue settings.
        allowCallWaitingForAgentsEnabled:
          type: boolean
          description: Flag to indicate whether call waiting is enabled for agents.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/GetPersonPlaceVirtualLineCallQueueObject'
          description: People, workspaces and virtual lines that are eligible to receive calls.
        allowAgentJoinEnabled:
          type: boolean
          description: Whether or not to allow agents to join or unjoin a queue.
        department:
          $ref: '#/components/schemas/DepartmentObject'
        directLineCallerIdName:
          $ref: '#/components/schemas/DirectLineCallerIdNameObject'
          description: Settings for the direct line caller ID name to be shown for this call queue.
        dialByName:
          type: string
          example: Hakim Smith
          description: The name to be used for dial by name functions.
        digitalInboxEnabled:
          type: boolean
          description: Digital Inbox enabled for Queue. This field is applicable for queue which has `hasCxEssentials=true`.
    CallQueuePrimaryAvailableNumberListGetObject:
      type: object
      required:
      - phoneNumbers
      properties:
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/CallQueuePrimaryAvailableNumberObject'
          description: Array of phone numbers.
    ModifyDnisRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          example: Support Line
          description: Name of the DNIS. Must be unique across the call queue.
        phoneNumber:
          type:
          - string
          - 'null'
          maxLength: 23
          example: '+15551234567'
          description: Phone number of the DNIS. Set to `null` to remove the phone number.
        extension:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 20
          example: '1000'
          description: Extension of the DNIS. Set to `null` to remove the extension.
        ringPattern:
          type: string
          enum:
          - NORMAL
          - LONG_LONG
          - SHORT_SHORT_LONG
          - SHORT_LONG_SHORT
          example: NORMAL
          description: Ring pattern of the DNIS.
        customDnisAnnouncementSettingsEnabled:
          type: boolean
          example: false
          description: Use custom announcement settings for the DNIS.
    DirectLineCallerIdNameObjectForPut:
      type: object
      properties:
        selection:
          $ref: '#/components/schemas/SelectionObject'
          description: The selection of the direct line caller ID name.
        customName:
          type: string
          example: Hakim Smith
          description: Sets or clears the custom direct line caller ID name.  To clear the `customName`, the attribute must be set to null or empty string. Required if `selection` is set to `CUSTOM_NAME`.
      description: Settings for the direct line caller ID name to be shown for this workspace.
    CreateSupervisorObject:
      type: object
      required:
      - id
      - agents
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS81OGVkZTIwNi0yNTM5LTQ1ZjQtODg4Ny05M2E3ZWIwZWI3ZDI
          description: A unique identifier for the supervisor.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/PostPersonPlaceVirtualLineSupervisorObject'
          description: People, workspaces and virtual lines that are eligible to receive calls.
  securitySchemes:
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearerAuth:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
