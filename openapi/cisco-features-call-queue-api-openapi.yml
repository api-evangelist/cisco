      summary: Get Available Phone Numbers for DNIS
      operationId: getAvailablePhoneNumbersForDnis
      description: 'Get the list of available phone numbers that can be assigned to a DNIS for call queues at a location.


        Retrieving available numbers requires a full or read-only administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - 'Features:  Call Queue'
      parameters:
      - name: locationId
        in: path
        description: The location ID.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: orgId
        in: query
        description: The organization ID of the customer.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: max
        in: query
        description: Limit the number of records returned per page.
        example: 10
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: start
        in: query
        description: Offset for pagination.
        example: 0
        schema:
          type: integer
          minimum: 0
          maximum: 10000
      - name: phoneNumber
        in: query
        description: Filter by phone number.
        example: '+12134567895'
        schema:
          type: string
          minLength: 1
          maxLength: 20
components:
  schemas:
    CallQueueCallForwardAvailableNumberObject:
      type: object
      required:
      - state
      - isMainNumber
      - tollFreeNumber
      - telephonyType
      - isServiceNumber
      properties:
        phoneNumber:
          type: string
          example: '+12056350001'
          description: A unique identifier for the PSTN phone number.
        extension:
          type: string
          example: '1235'
          description: Extension for a number.
        state:
          $ref: '#/components/schemas/STATE'
          description: Phone number's state.
        isMainNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is used as a location CLID.
        tollFreeNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a toll-free number.
        telephonyType:
          $ref: '#/components/schemas/TelephonyType'
          description: The telephony type for the number.
        isServiceNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a service number; otherwise, it is a standard number. Service numbers are high-utilization or high-concurrency PSTN phone numbers that are neither mobile nor toll-free.
        owner:
          type: object
          required:
          - id
          - type
          properties:
            id:
              type: string
              example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9jODhiZGIwNC1jZjU5LTRjMjMtODQ4OC00NTNhOTE3ZDFlMjk
              description: Unique identifier of the owner to which the number is assigned.
            type:
              $ref: '#/components/schemas/NumberOwnerType'
              description: Type of the number's owner.
            firstName:
              type: string
              example: Test
              description: First name of the number's owner. This field will be present only when the owner `type` is `PEOPLE` or `VIRTUAL_LINE`.
            lastName:
              type: string
              example: Person
              description: Last name of the number's owner. This field will be present only when the owner `type` is `PEOPLE` or `VIRTUAL_LINE`.
            displayName:
              type: string
              example: TestWorkSpace
              description: Display name of the number's owner.
    ModifyCallQueueForcedForwardObject:
      type: object
      required:
      - forcedForwardEnabled
      - playAnnouncementBeforeEnabled
      - audioMessageSelection
      properties:
        forcedForwardEnabled:
          type: boolean
          example: true
          description: Enable or disable call forced forward service routing policy.
        transferPhoneNumber:
          type: string
          example: '1235557890'
          description: Call gets transferred to this number when action is set to `TRANSFER`. This can also be an extension.
        playAnnouncementBeforeEnabled:
          type: boolean
          example: true
          description: Indicates whether an announcement plays to callers before the action is applied.
        audioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcement to be played.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        audioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureObject'
          description: List of pre-configured Announcement Audio Files when `audioMessageSelection` is `CUSTOM`.
    PostCallQueueEssentialCallPolicyObject:
      type: object
      required:
      - routingType
      - policy
      - callBounce
      - distinctiveRing
      properties:
        routingType:
          $ref: '#/components/schemas/HuntRoutingTypeSelection'
          description: Call routing type to use to dispatch calls to agents. The routing type should be `SKILL_BASED` if you want to assign skill level to `agents`. Only certain `policy` are allowed in `SKILL_BASED` type.
        policy:
          $ref: '#/components/schemas/HuntPolicyEssentialSelection'
          description: Call routing policy to use to dispatch calls to `agents`.
        callBounce:
          type: object
          properties:
            callBounceEnabled:
              type: boolean
              example: true
              description: If enabled, bounce calls after the set number of rings.
            callBounceMaxRings:
              type: number
              example: 5
              description: Number of rings after which to bounce call, if `callBounce` is enabled.
            agentUnavailableEnabled:
              type: boolean
              example: true
              description: Bounce if agent becomes unavailable.
            alertAgentEnabled:
              type: boolean
              example: true
              description: Alert agent if call on hold more than `alertAgentMaxSeconds`.
            alertAgentMaxSeconds:
              type: number
              example: 20
              description: Number of second after which to alert agent if `alertAgentEnabled`.
            callBounceOnHoldEnabled:
              type: boolean
              example: true
              description: Bounce if call on hold more than `callBounceMaxSeconds`.
            callBounceOnHoldMaxSeconds:
              type: number
              example: 20
              description: Number of second after which to bounce if `callBounceEnabled`.
          description: Settings for when the call into the hunt group is not answered.
        distinctiveRing:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              example: true
              description: Whether or not the `distinctiveRing` is enabled.
            ringPattern:
              $ref: '#/components/schemas/RingPatternObject'
              description: Ring pattern for when this call queue is called. Only available when `distinctiveRing` is enabled for the call queue.
          description: Whether or not the call queue has the `distinctiveRing` option enabled.
    ModifyDnisSettings:
      type: object
      properties:
        distinctiveRingingEnabled:
          type: boolean
          example: true
          description: Whether distinctive ringing is enabled for the queue.
        displayDnisNameAndNumberEnabled:
          type: boolean
          example: true
          description: Whether the DNIS name and number is displayed to agents.
    AnnouncementAudioFile:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC8zMjAxNjRmNC1lNWEzLTQxZmYtYTMyNi02N2MwOThlNDFkMWQ
          description: Unique identifier of the Announcement file.
        name:
          type: string
          example: Public_Announcement.wav
          description: Name of the announcement file. `name`, `mediaFileType`, `level` are mandatory if `id` is not provided for uploading an announcement.
        mediaFileType:
          type: string
          example: WAV
          description: Media file type of announcement file.
        level:
          type: string
          enum:
          - LOCATION
          - ORGANIZATION
          - ENTITY
          description: The level at which this announcement exists.
    CallQueueSettingsGet:
      type: object
      required:
      - maintainQueuePositionForSimRingEnabled
      - forceAgentUnavailableOnBouncedEnabled
      - playToneToAgentForBargeInEnabled
      - playToneToAgentForSilentMonitoringEnabled
      - playToneToAgentForSupervisorCoachingEnabled
      properties:
        maintainQueuePositionForSimRingEnabled:
          type: boolean
          description: Indicates whether callers keep their queue position when simultaneous ringing routes a call to multiple agents.
        forceAgentUnavailableOnBouncedEnabled:
          type: boolean
          description: Indicates whether Customer Assist agents are changed to unavailable after bounced calls.
        playToneToAgentForBargeInEnabled:
          type: boolean
          example: true
          description: Organization-wide default that plays a tone to agents when a supervisor joins an active call using barge in.
        playToneToAgentForSilentMonitoringEnabled:
          type: boolean
          example: true
          description: Organization-wide default that plays a tone to agents when a supervisor monitors their active call without joining.
        playToneToAgentForSupervisorCoachingEnabled:
          type: boolean
          example: true
          description: Organization-wide default that plays a tone to agents when a supervisor coaches an agent during an active call.
    PostPersonPlaceVirtualLineCallQueueObject:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80NDVkMzMzMC1mNjE3LTExZWItOWQyZS01NzViODE3ZGE1NmE
          description: ID of person, workspace or virtual line.
        weight:
          type: string
          example: '50'
          description: Weight of person, workspace or virtual line. Only applied when call policy is `WEIGHTED`.
        skillLevel:
          type: number
          example: 1
          description: Skill level of person, workspace or virtual line. Only applied when call routing type is `SKILL_BASED`.
    CallQueueSettingsPatch:
      type: object
      properties:
        maintainQueuePositionForSimRingEnabled:
          type: boolean
          description: Indicates whether callers keep their queue position when simultaneous ringing routes a call to multiple agents.
        forceAgentUnavailableOnBouncedEnabled:
          type: boolean
          description: Indicates whether Customer Assist agents are changed to unavailable after bounced calls.
        playToneToAgentForBargeInEnabled:
          type: boolean
          example: true
          description: Organization-wide default that plays a tone to agents when a supervisor joins an active call using barge in.
        playToneToAgentForSilentMonitoringEnabled:
          type: boolean
          example: true
          description: Organization-wide default that plays a tone to agents when a supervisor monitors their active call without joining.
        playToneToAgentForSupervisorCoachingEnabled:
          type: boolean
          example: true
          description: Organization-wide default that plays a tone to agents when a supervisor coaches an agent during an active call.
    ListSupervisorAgentStatusObject:
      type: object
      required:
      - id
      - status
      - message
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS85NTA4OTc4ZC05YmFkLTRmYWEtYTljNC0wOWQ4NWQ4ZmRjZTY
          description: 'ID of person, workspace or virtual line. **WARNING**: The `id` returned is in UUID format, since we don''t have agentType from OCI response. This will be converting to Hydra type in future release.'
        status:
          type: string
          example: DUPLICATE
          description: status of the agent.
        message:
          type: string
          example: '[Error 6612] Agent 9508978d-9bad-4faa-a9c4-09d85d8fdce6 is already assigned to the supervisor.'
          description: Detailed message for the status.
    ModifyCallQueueStrandedCallsObject:
      type: object
      required:
      - action
      - audioMessageSelection
      properties:
        action:
          type: string
          enum:
          - NONE
          - BUSY
          - TRANSFER
          - NIGHT_SERVICE
          - RINGING
          - ANNOUNCEMENT
          description: "The call processing action type.\n * `NONE` - Call remains in the queue.\n * `BUSY` - Calls are removed from the queue and are provided with the Busy treatment. If the queue is configured with the Call Forwarding Busy or the Voice Messaging service, then the call is handled accordingly.\n * `TRANSFER` - Calls are removed from the queue and are transferred to the configured `transferPhoneNumber`.\n * `NIGHT_SERVICE` - Calls are handled according to the Night Service configuration. If the Night Service action is set to `none`, then this is equivalent to this policy being set to `none` (that is, calls remain in the queue).\n * `RINGING` - Calls are removed from the queue and are provided with ringing until the caller releases the call. The ringback tone played to the caller is localized according to the country code of the caller.\n * `ANNOUNCEMENT` - Calls are removed from the queue and are provided with an announcement that is played in a loop until the caller releases the call.\n"
        transferPhoneNumber:
          type: string
          example: '1235557890'
          description: Call gets transferred to this number when action is set to `TRANSFER`. This can also be an extension.
        audioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcement to be played.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        audioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureObject'
          description: List of pre-configured Announcement Audio Files when `audioMessageSelection` is `CUSTOM`.
        triggerPolicyWhenAllAgentsAreUnreachableEnabled:
          type: boolean
          example: true
          description: Trigger stranded calls queue policy when all agents are unreachable.
    CallQueueAlternateAvailableNumberObject:
      type: object
      required:
      - phoneNumber
      - state
      - isMainNumber
      - tollFreeNumber
      - telephonyType
      - isServiceNumber
      properties:
        phoneNumber:
          type: string
          example: '+12056350001'
          description: A unique identifier for the PSTN phone number.
        state:
          $ref: '#/components/schemas/STATE'
          description: Phone number's state.
        isMainNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is used as a location CLID.
        tollFreeNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a toll-free number.
        telephonyType:
          $ref: '#/components/schemas/TelephonyType'
          description: The telephony type for the number.
        isServiceNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a service number; otherwise, it is a standard number. Service numbers are high-utilization or high-concurrency PSTN phone numbers that are neither mobile nor toll-free.
    CallForwardingNumbers:
      type: object
      required:
      - type
      properties:
        phoneNumber:
          type: string
          example: '+15558675309'
          description: Only return call queues with matching primary phone number or extension.
        extension:
          type: string
          example: '7781'
          description: Primary phone extension of the call queue.
        type:
          type: string
          enum:
          - PRIMARY
          - ALTERNATE
          description: "Type of\n * `PRIMARY` - Indicates that the given `phoneNumber` or `extension` associated with this rule's containing object is a primary number or extension.\n * `ALTERNATE` - Indicates that the given `phoneNumber` or `extension` associated with this rule's containing object is an alternate number or extension.\n"
    CreateForwardingRuleObject:
      type: object
      required:
      - name
      - callsFrom
      - callsTo
      properties:
        name:
          type: string
          example: New Selective Rule
          description: Unique name for the selective rule in the hunt group.
        enabled:
          type: boolean
          example: true
          description: Reflects if rule is enabled.
        holidaySchedule:
          type: string
          example: HolidayScheduleOne
          description: Name of the location's holiday schedule which determines when this selective call forwarding rule is in effect.
        businessSchedule:
          type: string
          example: BusinessScheduleTwo
          description: Name of the location's business schedule which determines when this selective call forwarding rule is in effect.
        forwardTo:
          type: object
          required:
          - selection
          properties:
            selection:
              type: string
              enum:
              - FORWARD_TO_DEFAULT_NUMBER
              - FORWARD_TO_SPECIFIED_NUMBER
              - DO_NOT_FORWARD
              description: "Controls what happens when the rule matches.\n * `FORWARD_TO_DEFAULT_NUMBER` - When the rule matches, forward to the destination for the hunt group.\n * `FORWARD_TO_SPECIFIED_NUMBER` - When the rule matches, forward to the destination for this rule.\n * `DO_NOT_FORWARD` - When the rule matches, do not forward to another number.\n"
            phoneNumber:
              type: string
              example: '+15558675309'
              description: Phone number to forward calls to. Required when selection is `FORWARD_TO_SPECIFIED_NUMBER`.
          description: Controls what happens when the rule matches including the destination number for the call forwarding.
        callsFrom:
          type: object
          required:
          - selection
          - customNumbers
          properties:
            selection:
              type: string
              enum:
              - ANY
              - CUSTOM
              description: "If `CUSTOM`, use `customNumbers` to specify which incoming caller ID values cause this rule to match. `ANY` means any incoming call matches assuming the rule is in effect based on the associated schedules.\n * `ANY` - Rule matches for calls from any number.\n * `CUSTOM` - Rule matches based on the numbers and options in `customNumbers`.\n"
            customNumbers:
              type: object
              required:
              - privateNumberEnabled
              - unavailableNumberEnabled
              properties:
                privateNumberEnabled:
                  type: boolean
                  description: Match if caller ID indicates the call is from a private number.
                unavailableNumberEnabled:
                  type: boolean
                  description: Match if caller ID is unavailable.
                numbers:
                  type: array
                  items:
                    type: string
                  description: Array of number strings to be matched against incoming caller ID.
              description: Custom rules for matching incoming caller ID information.
          description: Settings related to the rule matching based on incoming caller ID.
        callsTo:
          type: object
          properties:
            numbers:
              type: array
              items:
                $ref: '#/components/schemas/CallForwardingNumbers'
              description: Array of numbers to be matched against the calling destination number.
          description: Settings related to the rule matching based on the destination number.
    ListSupervisorAgentObject:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS85NTA4OTc4ZC05YmFkLTRmYWEtYTljNC0wOWQ4NWQ4ZmRjZTY
          description: ID of person, workspace or virtual line.
        lastName:
          type: string
          example: user
          description: Last name of the agent.
        firstName:
          type: string
          example: test
          description: First name of the agent.
        extension:
          type: string
          example: '0020'
          description: Primary phone extension of the agent.
        esn:
          type: string
          example: '0020'
          description: Routing prefix + extension of a agent.
        phoneNumber:
          type: string
          example: '+1972998998'
          description: Primary phone number of the agent.
        location:
          type: object
          properties:
            id:
              type: string
              example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2E4Nzg4MGFjLTQ4NDItNGZlMy1hOWZlLWFlMzU5ZTgzOGY2Mw
              description: Agent's location ID.
            name:
              type: string
              example: San Jose
              description: Agent's location name.
          description: Location of the agent.
    GetCallQueueAgentObject:
      type: object
      required:
      - agent
      - queues
      properties:
        agent:
          type: object
          required:
          - id
          - location
          - type
          properties:
            id:
              type: string
              example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8xZmNiMjczZS0wYzdmLTQ1ZGUtYmNlOC0yMWE3YzFlYjVjYmY
              description: A unique identifier for the call queue agent.
            firstName:
              type: string
              example: Arthur
              description: First name for the call queue agent.
            lastName:
              type: string
              example: Murray
              description: last name for the call queue agent.
            phoneNumber:
              type: string
              example: '19728881234'
              description: Primary phone number of the call queue agent.
            extension:
              type: string
              example: '34543'
              description: Primary phone extension of the call queue agent.
            routingPrefix:
              type: string
              example: '1234'
              description: Routing prefix of the location of the call queue agent.
            esn:
              type: string
              example: '34543180'
              description: Routing prefix + extension of a agent.
            location:
              type: object
              required:
              - name
              - id
              properties:
                name:
                  type: string
                  example: RCDN
                  description: The location name where the call queue agent resides.
                id:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzZhZjk4ZGViLWVlZGItNGFmYi1hMDAzLTEzNzgyYjdjODAxYw
                  description: ID of location for call queue agent.
              description: The location information.
            type:
              type: string
              example: PEOPLE
              description: The type of the call queue agent.
            agentACDState:
              type: string
              example: AVAILABLE
              enum:
              - SIGN_IN
              - SIGN_OUT
              - AVAILABLE
              - UNAVAILABLE
              - WRAP_UP
              description: "The Automatic Call Distribution (ACD) state of the call queue agent.\n * `SIGN_IN` - Agent has signed in.\n * `SIGN_OUT` - Agent has signed out.\n * `AVAILABLE` - Agent is available.\n * `UNAVAILABLE` - Agent is unavailable.\n * `WRAP_UP` - Agent has wrapped up.\n"
        queues:
          type: array
          items:
            type: object
            required:
            - id
            - name
            - locationId
            - locationName
            - joinEnabled
            properties:
              id:
                type: string
                example: Y2lzY29zcGFyazovL3VzL0NBTExfUVVFVUUvZjM4NDIxZGYtN2MxOC00NGI1LThlNmQtNDFmZTEyMTFlZDFk
                description: Unique identifier of the call queue.
              name:
                type: string
                example: YU7
                description: Unique name for the call queue.
              phoneNumber:
                type: string
                example: '12144184002'
                description: Primary phone number of the call queue.
              extension:
                type: string
                example: '4002'
                description: Primary phone extension of the call queue.
              routingPrefix:
                type: string
                example: '34543'
                description: The routing prefix for the call queue.
              esn:
                type: string
                example: '345434002'
                description: Routing prefix + extension of the call queue.
              locationId:
                type: string
                example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzZhZjk4ZGViLWVlZGItNGFmYi1hMDAzLTEzNzgyYjdjODAxYw
                description: The location identifier of the call queue.
              locationName:
                type: string
                example: RCDN
                description: The location name where the call queue resides.
              joinEnabled:
                type: boolean
                example: true
                description: Whether or not the call queue is enabled.
    CallForwardRulesSet:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfRk9SV0FSRElOR19TRUxFQ1RJVkVfUlVMRS9kR1Z6ZEZKMWJHVTA
          description: Unique ID for the rule.
        enabled:
          type: boolean
          example: true
          description: Reflects if rule is enabled.
    STATE:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      description: " * `ACTIVE` - Phone number is in the active state.\n * `INACTIVE` - Phone number is in the inactive state.\n"
    BulkSupervisorsDelete:
      type: object
      required:
      - supervisorIds
      properties:
        supervisorIds:
          type: array
          items:
            type: string
            example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80Y2I1M2ZmMy01NWViLTQ2MzYtYTE4ZC05NWVjZmFhM2E4NmY,Y2lzY29zcGFyazovL3VzL1BFT1BMRS8wNzY2ZDNjNC0xZTg1LTQ4YzgtYTFkZi1mMWUzYTAyMDg1MWE
          description: Array of supervisors IDs to be deleted.
        hasCxEssentials:
          type: boolean
          example: true
          description: Delete the Customer Assist supervisors, when `true`. Otherwise delete the Call Queue supervisors. The default value is `false`.
