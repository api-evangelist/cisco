      summary: List Report Templates
      operationId: listReportTemplates
      description: 'List report templates. Report templates are available for use with the Partner Reports API.


        To access this endpoint, you must use an administrator token with `spark-admin:reports_read` and `identity:people_read` scopes. The authenticated user must be a Partner full administrator or Partner read-only administrator of the organization.'
