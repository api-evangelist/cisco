          description: 'Service Unavailable: Server is overloaded with requests. Try again later.'
        '504':
          description: 'Gateway Timeout: An upstream server failed to respond on time. If your query uses max parameter, please try to reduce it.'
      summary: Create a Report
      operationId: createAReport
      description: 'Create a new report. A new report can be created using `templateId` available from the _List Report Templates_ API. For each `templateId`, there are a set of validation rules that need to be followed.


        The `templateId` parameter is a number. However, it is a limitation of developer.webex.com platform that it is passed as a string when you try to test the API from here.


        To access this endpoint, you must use an administrator token with `spark-admin:reports_write` and `identity:people_read` scopes.


        **Notes**:


        CSV reports for Webex suite services are only created for organizations in the specified region. Organizations based in a different region will require a separate request with region specified.


        When no region is specified, the request defaults to Partner organization''s home region. A request against a region where there are no organizations will return blank CSV files.'
      tags:
      - Partner Reports/Templates
      parameters:
      - name: onBehalfOfSubPartnerOrgId
        in: query
        description: The encoded organization ID for the sub partner.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8wZTE4MmUxNS05ZmNhLTQ0NzgtYmEzOC1jNGFiMmUyN2FlZDA=
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              templateId: 5
              startDate: '2024-05-01'
              endDate: '2024-05-05'
              regionId: US
            schema:
              type: object
              required:
              - templateId
              - startDate
              - endDate
              properties:
                templateId:
                  type: number
                  example: 5
                  description: Unique ID representing valid report templates.
                startDate:
                  type: string
                  example: '2024-05-01'
                  description: Data in the report will be from this date onwards.
                endDate:
                  type: string
                  example: '2024-05-05'
                  description: Data in the report will be until this date.
                regionId:
                  type: string
                  example: US
                  description: Data in the report will be from organizations in this region, for example, US, CA, or EU.
