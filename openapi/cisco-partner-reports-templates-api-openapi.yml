          description: 'Gateway Timeout: An upstream server failed to respond on time. If your query uses max parameter, please try to reduce it.'
      summary: List Reports
      operationId: listReports
      description: 'Lists all reports previously generated from a given region. Use query parameters to filter the response. The parameters are optional.


        To access this endpoint, you must use an administrator token with `spark-admin:reports_read` and `identity:people_read` scopes.


        CSV reports for Webex suite services are only supported for organizations based in one region per API request. Organizations based in a different region will require a separate request with region specified.


        When no region is specified, the request defaults to Partner organization''s home region.


        Reports are usually provided in zip format. A content-header application/zip or application/octet-stream does indicate the zip format. There is usually no .zip file extension.'
      tags:
      - Partner Reports/Templates
      parameters:
      - name: service
        in: query
        description: List reports which use this service.
        example: Webex
        schema:
          type: string
      - name: templateId
        in: query
        description: List reports with this report template ID.
        example: 5
        schema:
          type: number
      - name: from
        in: query
        description: List reports that were created on or after this date.
        example: '2024-05-01'
        schema:
          type: string
      - name: to
        in: query
        description: List reports that were created before this date.
        example: '2024-05-05'
        schema:
          type: string
      - name: regionId
        in: query
        description: Data in the report will be from organizations in this region, for example, US, CA, or EU.
        example: US
        schema:
          type: string
      - name: onBehalfOfSubPartnerOrgId
        in: query
        description: The encoded organization ID for the sub partner.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8wZTE4MmUxNS05ZmNhLTQ0NzgtYmEzOC1jNGFiMmUyN2FlZDA=
        schema:
          type: string
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId:
                    type: string
                    example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mYzhjMWFhMS00OTM5LTQ2NjEtODAwMy1hYWE0MzFmZWM0ZmE
                    description: The unique identifier for the report.
                  createdTime:
                    type: string
                    example: '2024-05-27 17:02:43'
                    description: The time of report creation.
              example:
                reportId: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9SRVBPUlQvYWQwZDIwNTc1ZGEwNDVhNDhmYWQ0N2Q5NzRhYjQxZjI
                createdTime: '2024-05-27 17:02:43'
        '400':
