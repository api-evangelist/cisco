      operationId: getSettingsGroups
      summary: Get Settings Groups
      description: 'This API returns the `settingsGroups` that define the structure and association of tags for device dynamic settings.


        The `settingsGroups` are used to organize the tags into logical groups, making it easier to manage and configure device dynamic settings.'
      parameters:
      - name: orgId
        in: query
        description: Settings groups for devices in this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: familyOrModelDisplayName
        in: query
        description: Device family or model display name to filter the `settingsGroups`.
        example: Poly
        schema:
          type: string
      - name: includeSettingsType
        in: query
        description: To show groups or tabs or both. Query param is case insensitive. Default is `ALL`.
        example: ALL
        schema:
          type: string
          enum:
          - TABS
          - GROUPS
          - ALL
      tags:
      - Device Call Settings With Device Dynamic Settings
