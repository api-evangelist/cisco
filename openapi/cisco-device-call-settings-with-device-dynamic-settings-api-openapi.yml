components:
  schemas:
    Action:
      type: string
      enum:
      - ADD
      - DELETE
      description: " * `ADD` - Add action.\n * `DELETE` - Delete action.\n"
    DevicePostResponseTag:
      type: object
      required:
      - familyOrModelDisplayName
      - tag
      properties:
        familyOrModelDisplayName:
          type: string
          description: The display name of the device family or model associated with the returned tag.
          example: Poly
        tag:
          type: string
          description: The unique identifier for the device setting.
          example: '%G711U_ORDER%'
        value:
          type: string
          description: The current value of the setting at device level. If the tag value is not set at the device level, this field will not be included in the response.
          example: '4'
        parentValue:
          type: string
          description: The setting value at the next available `parentLevel`. It is used if `value` is not set and is omitted when no parent level exists for the tag.
          example: '3'
        parentLevel:
          $ref: '#/components/schemas/DeviceParentLevel'
    DeviceDynamicSettingsSettingsGroupsGet:
      type: object
      example:
        settingsGroups:
        - path: Voice.Codec Preferences
          friendlyName: voice.codecPref.G711Mu
          tab: Poly
          familyOrModelDisplayName: Poly
          tags:
          - tagBlock:
            - '%G711U_ORDER%'
        settingsTabs:
        - Poly
        - MPP
      properties:
        settingsGroups:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSettingsGroup'
          description: Array of settings groups defining structure and association of tags.
        settingsTabs:
          type: array
          items:
            type: string
          description: Array of settings tabs names. Can be filtered using the `includeSettingsType` parameter.
    CustomerDeviceDynamicSettingsListPostRequest:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Optional array of device tag identifiers to request settings for. Each identifier must have a length between 1 and 64 characters.
          minItems: 0
    DeviceSettingsGroupTag:
      type: object
      properties:
        tagBlock:
          type: array
          items:
            type: string
          description: Array of tags associated with the settings group.
          example:
          - '%G711U_ORDER%'
    DeviceSettingsGroup:
      type: object
      properties:
        path:
          type: string
          description: Path of the settings group. Creates an easily navigable settings hierarchy.
          example: Voice.Codec Preferences
        friendlyName:
          type: string
          description: Friendly name of the settings group.
          example: voice.codecPref.G711Mu
        tab:
          type: string
          description: Tab name associated with the settings group.
          example: Poly
        familyOrModelDisplayName:
          type: string
          description: Family or model display name associated with the settings group.
          example: Poly
        tags:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSettingsGroupTag'
          description: List of `tagBlock` objects associated with the settings group.
    MemberType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      description: " * `PEOPLE` - Indicates the associated member is a person.\n * `PLACE` - Indicates the associated member is a workspace.\n"
    UpgradeChannelObject:
      type: string
      enum:
      - STABLE
      - STABLE_DELAY
      - PREVIEW
      - BETA
      - TESTING
    stepExecutionStatusesObject:
      type: object
      required:
      - id
      - lastUpdated
      - statusMessage
      - name
      - timeElapsed
      properties:
        id:
          type: number
          example: 3624681
          description: Unique identifier that identifies each step in a job.
        startTime:
          type: string
          example: '2023-05-30T13:04:00.469Z'
          description: The date and time with seconds, the step execution has started in UTC format.
        endTime:
          type: string
          example: '2023-05-30T13:04:03.245Z'
          description: The date and time with seconds, the step execution has ended in UTC format.
        lastUpdated:
          type: string
          example: '2023-05-30T13:04:03.574Z'
          description: The date and time with seconds, the step has last updated in UTC format.
        statusMessage:
          type: string
          enum:
          - STARTING
          - STARTED
          - COMPLETED
          - FAILED
          - UNKNOWN
          - ABANDONED
          description: "Displays status for a step.\n * `STARTING` - Job has started.\n * `STARTED` - Job is in progress.\n * `COMPLETED` - Job has completed.\n * `FAILED` - Job has failed.\n * `UNKNOWN` - Job status is unknown.\n * `ABANDONED` - Job has been abandoned (manually stopped).\n"
        exitCode:
          type: string
          enum:
          - UNKNOWN
          - COMPLETED
          - FAILED
          - STOPPED
          - COMPLETED_WITH_ERRORS
          - COMPLETED_WITH_PENDING_ORDERS
          description: "Exit Code for a step.\n * `UNKNOWN` - Job is in progress.\n * `COMPLETED` - Job has completed successfully.\n * `FAILED` - Job has failed.\n * `STOPPED` - Job has been stopped.\n * `COMPLETED_WITH_ERRORS` - Job has completed with errors.\n * `COMPLETED_WITH_PENDING_ORDERS` - Job has completed with pending number orders.\n"
        name:
          type: string
          example: moveusersvalidateAndMove
          description: Step name.
        timeElapsed:
          type: string
          example: PT2.752S
          description: Time lapsed in seconds since the job execution started.
    ErrorObject:
      type: object
      properties:
        key:
          type: string
          description: HTTP error code.
        message:
          type: array
          items:
            $ref: '#/components/schemas/ErrorMessageObject'
          description: Message string with further error information.
    ErrorResponseObject:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemObject'
    DynamicSettingsUpdateJobDevicePostItem:
      type: object
      required:
      - familyOrModelDisplayName
      - tag
      - action
      properties:
        familyOrModelDisplayName:
          type: string
          description: The `familyOrModelDisplayName` of the device to which the tag applies. This value must exist in the validation schema.
          example: Poly
          minLength: 1
          maxLength: 40
        tag:
          type: string
          description: The unique identifier for the setting to be updated.
          example: '%G711U_ORDER%'
          minLength: 1
