                - model: 2N Customer Managed
                  displayName: 2N Customer Managed
                  type: GENERIC_SIP
                  manufacturer: THIRD_PARTY
                  managedBy: CUSTOMER
                  supportedFor:
                  - PEOPLE
                  - PLACE
