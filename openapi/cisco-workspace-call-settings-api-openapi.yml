      summary: Get Available Speed Dials for Workspace Monitoring
      operationId: getAvailableSpeedDialsForWorkspaceMonitoring
      description: 'Get available speed dials for Workspace monitoring configuration. This API allows administrators to retrieve a list of members that can be added as speed dials for monitoring a specific workspace.


        This API requires a full, user, or read-only administrator or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - Workspace Call Settings
      parameters:
      - name: workspaceId
        in: path
        description: Unique identifier for the workspace.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9QTEFDRS8xNzdmNTNlZC1hNzY2LTRkYTAtOGQ3OC03MjE0MjhjMmFjZTQ=
      - name: orgId
        in: query
        description: ID of the organization within which the workspace resides. Only admin users of another organization (such as partners) may use this parameter as the default is the same organization as the token used to access the API.
        required: false
        schema:
          type: string
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
      - name: locationId
        in: query
        description: Search for the available speed dials in the location ID.
        required: false
        schema:
          type: string
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1Njc4OTAxMjM0NTY3ODkw
      - name: memberName
        in: query
        description: Search for available members by name.
        required: false
        schema:
          type: string
        example: John
      - name: phoneNumber
        in: query
        description: Search for available members by number or extension.
        required: false
        schema:
          type: string
        example: '1234'
      - name: order
        in: query
        description: Sort response based on `firstName` or `lastName` with sort direction `asc` or `desc`.
        required: false
        schema:
          type: array
          items:
            type: string
        example:
        - lastName-asc
      - name: start
        in: query
        description: Number of records to skip for pagination.
        required: false
        schema:
          type: integer
          minimum: 0
        example: 0
      - name: max
        in: query
        description: 'Number of records per page for pagination. Default: 2000. Maximum: 2000.'
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 2000
          default: 2000
        example: 100
