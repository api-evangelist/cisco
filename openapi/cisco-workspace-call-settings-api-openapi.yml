      summary: Get Available Members for Workspace Monitoring
      operationId: getAvailableMembersForWorkspaceMonitoring
      description: 'Get available members for workspace monitoring. This API allows administrators to retrieve a list of members that can be added to the monitoring list for a specific workspace.


        This API requires a full, user, or read-only administrator or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - Workspace Call Settings
      parameters:
      - name: workspaceId
        in: path
        description: Unique identifier for the workspace.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9QTEFDRS8xNzdmNTNlZC1hNzY2LTRkYTAtOGQ3OC03MjE0MjhjMmFjZTQ=
