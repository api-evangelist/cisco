components:
  schemas:
    LocationObject:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1Njc4OTAxMjM0NTY3ODkw
          description: The ID of the location.
        name:
          type: string
          example: San Jose
          description: The name of the location.
    WorkspaceMonitoringPatch:
      type: object
      properties:
        enableCallParkNotification:
          type: boolean
          example: true
          description: Call park notification is enabled or disabled.
        monitoredElements:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MonitoredElementItemPatch'
          description: Array of monitored elements. Maximum 50 elements.
    MonitoredElementItemPatch:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80NDVkMzMzMC1mNjE3LTExZWItOWQyZS01NzViODE3ZGE2NmE
          description: The identifier of the monitored element.
        type:
          type: string
          enum:
          - MEMBER
          - CALL_PARK_EXTENSION
          - SPEED_DIAL
          description: "The type of the monitored element.\n * `MEMBER` - Monitored element is a person, place, or virtual line.\n * `CALL_PARK_EXTENSION` - Monitored element is a call park extension.\n * `SPEED_DIAL` - Monitored element is a speed dial.\n"
        lineKeyLabel:
          type: string
          example: Sr Manager
          description: Customizable line key label for speed dial.
        phoneNumber:
          type: string
          example: '+19075552859'
          description: Phone number for the speed dial.
    MonitoredElementSpeedDial:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80NDVkMzMzMC1mNjE3LTExZWItOWQyZS01NzViODE3ZGE2NmE
          description: The identifier of the speed dial.
        displayName:
          type: string
          example: John Brown
          description: The display name of the speed dial.
        type:
          type: string
          enum:
          - PEOPLE
          - PLACE
          - VIRTUAL_LINE
          description: "The type of the speed dial.\n * `PEOPLE` - Object is a user.\n * `PLACE` - Object is a workspace.\n * `VIRTUAL_LINE` - Object is a virtual line.\n"
        lineKeyLabel:
          type: string
          example: Manager
          description: Customizable line key label for speed dial.
        phoneNumber:
          type: string
          example: '+19075552859'
          description: The phone number of the speed dial.
        location:
          type: string
          example: Richardson
          description: The location name where the speed dial is.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1
          description: The ID for the location.
    AvailableMemberObject:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS85ODhiYTQyOC0zMjMyLTRmNjItYjUyNy1hZGEyNTRlMTk0MjE
          description: The identifier of the available member.
        firstName:
          type: string
          example: John
          description: The first name of the available member.
        lastName:
          type: string
          example: Doe
          description: The last name of the available member.
        displayName:
          type: string
          example: John Doe
          description: The display name of the available member.
        phoneNumber:
          type: string
          example: '+14085551234'
          description: The phone number of the available member.
        extension:
          type: string
          example: '1234'
          description: The extension of the available member.
        type:
          type: string
          enum:
          - PEOPLE
          - PLACE
          - VIRTUAL_LINE
          description: "The type of the available member.\n * `PEOPLE` - Object is a user.\n * `PLACE` - Object is a workspace.\n * `VIRTUAL_LINE` - Object is a virtual line.\n"
        location:
          $ref: '#/components/schemas/LocationObject'
          description: The location of the available member.
    UserMonitoringGet:
      type: object
      required:
      - callParkNotificationEnabled
      properties:
        callParkNotificationEnabled:
          type: boolean
          example: true
          description: Call park notification enabled or disabled.
        availableEntriesCount:
          type: integer
          example: 5
          description: Number of available entries for monitoring.
        monitoredElements:
          type: array
          items:
            $ref: '#/components/schemas/MonitoredElementItem'
          description: Monitored element items.
    MonitoredElementUser:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80NDVkMzMzMC1mNjE3LTExZWItOWQyZS01NzViODE3ZGE2NmE
