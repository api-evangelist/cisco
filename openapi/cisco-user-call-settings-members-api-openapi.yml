      summary: List Voice Message Memberships
      operationId: listVoiceMessageMembershipsByMemberId
      description: 'Retrieves the list of shared voicemail memberships for the specified member. Each membership represents a group calling feature (Call Queue, Hunt Group, or Auto Attendant) whose shared voicemail box the member has access to.


        A service may have a phoneNumber, an extension, both, or neither, so any of these optional fields may be absent from a given entry.


        This API requires the `spark-admin:calls_read` or `spark-admin:calls_write` scope.'
      tags:
      - User Call Settings Members
      parameters:
      - name: memberId
        in: path
        description: 'Unique identifier for the member. Member ID can be one of the following: person, workspace, virtual line, hunt group, call queue, or auto attendant'
        required: true
        schema:
          type: string
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
      - name: orgId
        in: query
        description: Id of the organization to which the member belongs. If not provided, the orgId of the Service App is used. If provided, the organization must be the same as or managed by the Service App's organization.
        required: false
        schema:
          type: string
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE=
