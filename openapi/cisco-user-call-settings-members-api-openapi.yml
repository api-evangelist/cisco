        name:
          type: string
          example: John Smith
          description: The party's name. Only present when the name is available and privacy is not enabled.
        number:
          type: string
          example: '+12223334444'
          description: 'The party''s number. Only present when the number is available and privacy is not enabled. The number can be digits or a URI. Some examples for number include: `1234`, `2223334444`, `+12223334444`, `*73`, and `user@company.domain`.'
        personId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9hMTlkODJhMi00ZTY5LTU5YWEtOWYyZi1iY2E2MzEwMTNhNjg=
          description: The party's person ID. Only present when the person ID is available and privacy is not enabled.
        placeId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BMQUNFL2ExOWQ3MWEyLTRlOTItOTFhYi05ZjJmLWJjYTEzNTAxM2ExNA==
          description: The party's place ID. Only present when the place ID is available and privacy is not enabled.
        privacyEnabled:
          type: boolean
          description: if `true`, denotes privacy is enabled for the name, number and `personId`/`placeId`.
    VoiceMessageDetails:
      type: object
      required:
      - id
      - callingParty
      - created
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL01FU1NBR0UvNmQ0MTgyMTItZjUwNi00Yzk4LTk5MTItNmI1MmE1ZmU2ODgx
          description: The message identifier of the voicemail message.
        duration:
          type: number
          example: 38
          description: ' The duration (in seconds) of the voicemail message.  Duration is not present for a FAX message.'
        callingParty:
          $ref: '#/components/schemas/VoiceMailPartyInformation'
          description: The calling party's details. For example, if user A calls user B and leaves a voicemail message, then A is the calling party.
        urgent:
          type: boolean
          description: '`true` if the voicemail message is urgent.'
        confidential:
          type: boolean
          description: '`true` if the voicemail message is confidential.'
        read:
          type: boolean
          example: true
          description: '`true` if the voicemail message has been read.'
        faxPageCount:
          type: number
          example: 2
          description: Number of pages for the FAX.  Only set for a FAX.
        created:
          type: string
          example: '2021-11-14T17:00:00.000Z'
          description: The date and time the voicemail message was created.
  securitySchemes:
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearerAuth:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
