      summary: Mark As Read by Member ID
      operationId: markAsReadByMemberId
      description: 'Update the voicemail message(s) as read for the user.


        If the `messageId` is provided, then only mark that message as read. Otherwise, all messages for the user are marked as read.'
      tags:
      - User Call Settings Members
      parameters:
      - name: memberId
        in: path
        description: 'Unique identifier for the member. Member ID can be one of the following: person, workspace, virtual line, hunt group, call queue, or auto attendant'
        required: true
        schema:
          type: string
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
      - name: orgId
