  /telephony/voiceMessages/members/{memberId}/memberships:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required:
                - memberOf
                properties:
                  memberOf:
                    type: array
                    description: Array of shared voicemail membership entries.
                    items:
                      type: object
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          example: Y2lzY29zcGFyazovL3VzL0hVTlRfR1JPVVAvNmU1NTVjZDAtNjM0MS00MmI4LWEyMWMtZTc1ZjIxNDQ4Mjc1
                          description: Unique identifier for the membership.
                        type:
                          type: string
                          enum:
                          - CALL_QUEUE
                          - HUNT_GROUP
                          - AUTO_ATTENDANT
                          example: CALL_QUEUE
                          description: Type of the membership. One of CALL_QUEUE, HUNT_GROUP, or AUTO_ATTENDANT.
                        name:
                          type: string
                          example: Engineering Call Center
                          description: Display name of the call queue, hunt group, or auto attendant.
                        phoneNumber:
                          type: string
                          example: '+14085550101'
                          description: Phone number in E.164 format. Omitted when the service has no phone number.
                        extension:
                          type: string
                          example: '1001'
                          description: Extension number. Omitted when the service has no extension.
                        routingPrefix:
                          type: string
                          example: '8888'
                          description: Location dialing code (routing prefix). Omitted when not set.
                        esn:
                          type: string
                          example: '88881001'
                          description: Enterprise Significant Number, the concatenation of routingPrefix and extension. Omitted when not set.
              example:
                memberOf:
                - id: Y2lzY29zcGFyazovL3VzL0NBTExfUVVFVUUvYm1kMmVIcHNabTgwWVVBMk5EazBNVEk1Tnk1cGJuUXhNQzVpWTJ4a0xuZGxZbVY0TG1OdmJRPT0
                  type: CALL_QUEUE
                  name: Engineering Call Center
                  phoneNumber: '+14085550101'
                  extension: '1001'
                  routingPrefix: '8888'
                  esn: '88881001'
                - id: Y2lzY29zcGFyazovL3VzL0hVTlRfR1JPVVAvNmU1NTVjZDAtNjM0MS00MmI4LWEyMWMtZTc1ZjIxNDQ4Mjc1
                  type: HUNT_GROUP
                  name: Sales Hunt Group
                  phoneNumber: '+14085550102'
                - id: Y2lzY29zcGFyazovL3VzL0FVVE9fQVRURU5EQU5ULzA1NTJmNjdiLTU5YTktNDFiYi04NzM2LTFiMDQxZDFkZGQ1ZQ
                  type: AUTO_ATTENDANT
                  name: Support Auto Attendant
                  extension: '3003'
                  routingPrefix: '9999'
                  esn: '99993003'
        '204':
          description: No Content - Returned when there are no memberships.
          headers: {}
          content: {}
