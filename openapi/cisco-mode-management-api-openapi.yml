  /telephony/config/people/me/settings/modeManagement/features/{featureId}/actions/extendMode/invoke:
    post:
      tags:
      - Mode Management
      summary: Extend Current Operating Mode Duration
      description: 'Extends the duration of the current operating mode by adding additional time before it expires or reverts to scheduled operation. This API allows managers to prolong a temporary mode change without having to switch modes again.


        Extension time can be specified in 30-minute increments up to 720 minutes (12 hours). If no extension time is provided, the mode is extended with a manual switchback exception, meaning it will remain active until manually changed.


        This API requires a user auth token with the `spark:telephony_config_write` scope. The authenticated user must be a mode manager for the specified feature.'
      operationId: extendMode
      parameters:
      - name: featureId
        in: path
        description: Unique identifier for the feature.
        required: true
        schema:
          type: string
        example: Y2lzY29zcGFyazovL3VzL0ZFQVRVUkUvYjQzMmI2NmQtM2VkYy00ZGNkLTg4ODctNDZlOGU2NWQwYzIw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendModeRequest'
      responses:
        '204':
          description: Mode extended successfully
        '400':
