      summary: Modify Music On Hold Settings for a Workspace
      operationId: ModifyMusicOnHoldSettingsForAWorkspace
      description: 'Modify music on hold settings for a Workspace.


        Music on hold is played when a caller is put on hold, or the call is parked.


        To configure music on hold setting for a workspace, music on hold setting must be enabled for this location.


        This API requires a full or device administrator or location administrator auth token with the `spark-admin:telephony_config_write` scope.'
      tags:
      - Workspace Call Settings (2/2)
      parameters:
      - name: workspaceId
        in: path
        description: Unique identifier for the workspace.
        required: true
        example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9QTEFDRS8xNzdmNTNlZC1hNzY2LTRkYTAtOGQ3OC03MjE0MjhjMmFjZTQ=
        schema:
          type: string
      - name: orgId
        in: query
        description: ID of the organization in which the person resides. Only admin users of another organization (such as partners) may use this parameter as the default is the same organization as the token used to access the API.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              mohEnabled: true
              greeting: CUSTOM
              audioAnnouncementFile:
                id: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC9jZWRkODcwYS1lMTkzLTQxNmQtYmM3OS1mNzkyYmUyMzlhOGI
                fileName: AUDIO_FILE.wav
                mediaFileType: WAV
                level: ORGANIZATION
            schema:
              $ref: '#/components/schemas/PutMusicOnHoldObject'
      x-operation-id-source: normalized
      x-operation-id-original: Modify Music On Hold Settings for a Workspace
