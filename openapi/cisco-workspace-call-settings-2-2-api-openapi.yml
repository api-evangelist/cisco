components:
  schemas:
    PrivacyGet:
      type: object
      properties:
        aaExtensionDialingEnabled:
          type: boolean
          example: true
          description: When `true` auto attendant extension dialing is enabled.
        aaNamingDialingEnabled:
          type: boolean
          example: true
          description: When `true` auto attendant dialing by first or last name is enabled.
        enablePhoneStatusDirectoryPrivacy:
          type: boolean
          example: true
          description: When `true` phone status directory privacy is enabled.
        enablePhoneStatusPickupBargeInPrivacy:
          type: boolean
          example: true
          description: When `true` privacy is enforced for call pickup and barge-in. Only members specified by `monitoringAgents` can pickup or barge-in on the call.
        monitoringAgents:
          type: array
          items:
            $ref: '#/components/schemas/MonitoredPersonObject'
          description: List of people that are being monitored.
    Action:
      type: string
      enum:
      - ADD
      - DELETE
      description: " * `ADD` - Add action.\n * `DELETE` - Delete action.\n"
    CallRecordingInfo:
      type: object
      required:
      - enabled
      - record
      - recordVoicemailEnabled
      - notification
      - repeat
      - serviceProvider
      - externalGroup
      - externalIdentifier
      - startStopAnnouncement
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if call recording is enabled.'
        record:
          type: string
          enum:
          - Always
          - Never
          - Always with Pause/Resume
          - On Demand with User Initiated Start
          description: "Call recording scenario.\n * `Always` - Incoming and outgoing calls will be recorded with no control to start, stop, pause, or resume.\n * `Never` - Calls will not be recorded.\n * `Always with Pause/Resume` - Calls are always recorded, but user can pause or resume the recording. Stop recording is not supported.\n * `On Demand with User Initiated Start` - Records only the portion of the call after the recording start (`*44`) has been entered. Pause, resume, and stop controls are supported.\n"
        recordVoicemailEnabled:
          type: boolean
          description: When `true`, voicemail messages are also recorded.
        notification:
          type: object
          required:
          - type
          - enabled
          properties:
            type:
              type: string
              enum:
              - None
              - Beep
              - Play Announcement
              description: "Type of pause/resume notification.\n * `None` - No notification sound played when call recording is paused or resumed.\n * `Beep` - A beep sound is played when call recording is paused or resumed.\n * `Play Announcement` - A verbal announcement is played when call recording is paused or resumed.\n"
            enabled:
              type: boolean
              description: '`true` when the notification feature is in effect. `false` indicates notification is disabled.'
          description: Pause/resume notification settings.
        repeat:
          type: object
          required:
          - interval
          - enabled
          properties:
            interval:
              type: number
              example: 15
              description: Interval at which warning tone "beep" will be played. This interval is an integer from 10 to 1800 seconds
            enabled:
              type: boolean
              description: '`true` when ongoing call recording tone will be played at the designated interval. `false` indicates no warning tone will be played.'
          description: Beep sound plays periodically.
        serviceProvider:
          type: string
          example: WSWYZ25455
          description: Name of the service provider providing call recording service.
        externalGroup:
          type: string
          example: WSWYZ25455L31161
          description: Group utilized by the service provider providing call recording service.
        externalIdentifier:
          type: string
          example: a34iidrh5o@64941297.int10.bcld.webex.com
          description: Unique person identifier utilized by the service provider providing call recording service.
        startStopAnnouncement:
          type: object
          required:
          - internalCallsEnabled
          - pstnCallsEnabled
          properties:
            internalCallsEnabled:
              type: boolean
              description: When `true`, an announcement is played when call recording starts and an announcement is played when call recording ends for internal calls.
            pstnCallsEnabled:
              type: boolean
              description: When `true`, an announcement is played when call recording starts and an announcement is played when call recording ends for PSTN calls.
          description: Call Recording starts and stops announcement settings.
        selectiveCallRecordingSettings:
          type: object
          required:
          - recordInboundInternalCallsEnabled
          - recordInboundExternalCallsEnabled
          - recordOutboundInternalCallsEnabled
          - recordOutboundExternalCallsEnabled
          properties:
            recordInboundInternalCallsEnabled:
              type: boolean
              description: When `true`, inbound internal calls are recorded.
            recordInboundExternalCallsEnabled:
              type: boolean
              description: When `true`, inbound external calls are recorded.
            recordOutboundInternalCallsEnabled:
              type: boolean
              description: When `true`, outbound internal calls are recorded.
            recordOutboundExternalCallsEnabled:
              type: boolean
              description: When `true`, outbound external calls are recorded.
          description: Settings for selective call recording based on call direction and type.
    PlaceSelectiveAcceptCallCriteriaPatch:
      type: object
      properties:
        scheduleName:
          type: string
          example: Business Vacation
          description: Name of the location's schedule which determines when the selective accept is in effect.
        scheduleType:
          $ref: '#/components/schemas/ScheduleTypeSelection'
          description: The Schedule type whether `businessHours` or `holidays`.
        scheduleLevel:
          $ref: '#/components/schemas/PlaceScheduleLevel'
          description: The Schedule level i.e, Group.
        callsFrom:
          $ref: '#/components/schemas/SelectiveAcceptCallCallsFromType'
          description: Indicates whether to apply the selective accept criteria for calls from Any Phone Number, Select Phone Numbers or Forwarded ones.
        anonymousCallersEnabled:
          type: boolean
          example: true
          description: When `true`, enables calls from anonymous callers.
        unavailableCallersEnabled:
          type: boolean
          example: true
          description: When `true`, enables calls even if callers are unavailable.
        phoneNumbers:
          type: array
          items:
            type: string
            example: +19064441748,+19186663950
          description: the list of phone numbers that will checked against incoming calls for a match.
        acceptEnabled:
          type: boolean
          example: true
          description: Choose to accept (if `acceptEnabled` = `true`) or not to accept (if `acceptEnabled` = `false`) the calls that fit within these parameters.
    WorkspaceDigitPatternObject:
      type: object
      required:
      - id
      - name
      - pattern
      - action
      - transferEnabled
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1NDSEVEVUxFL1FWVlVUMEZVVkVWT1JFRk9WQzFDVlZOSlRrVlRVeTFJVDFWU1V3
          description: A unique identifier for the digit pattern.
        name:
          type: string
          example: DigitPattern1
          description: A unique name for the digit pattern.
        pattern:
          type: string
          example: 1XXX
          description: The digit pattern to be matched with the input number.
        action:
          type: string
          enum:
          - ALLOW
          - BLOCK
          - AUTH_CODE
          - TRANSFER_NUMBER_1
          - TRANSFER_NUMBER_2
          - TRANSFER_NUMBER_3
          description: "Action to be performed on the input number that matches the digit pattern.\n * `ALLOW` - Allow the designated call type.\n * `BLOCK` - Block the designated call type.\n * `AUTH_CODE` - Allow only via Authorization Code.\n * `TRANSFER_NUMBER_1` - Transfer to Auto Transfer Number 1. The answering person can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_2` - Transfer to Auto Transfer Number 2. The answering person can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_3` - Transfer to Auto Transfer Number 3. The answering person can then approve the call and send it through or reject the call.\n"
        transferEnabled:
          type: boolean
          example: true
          description: If `true`, allows transfer and forwarding for the call type.
    SelectiveAcceptCallGet:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if the Selective Accept feature is enabled.'
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/SelectiveAcceptCallCriteria'
          description: A list of criteria specifying conditions when selective accept is in effect.
    AudioAnnouncementFileObject:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FVVE9fQVRURU5EQU5UL2QzVjBPWFIxWjJkM2FFQm1iR1Y0TWk1amFYTmpieTVqYjIw
          description: A unique identifier for the [announcement](/docs/api/v1/features-announcement-repository). `name`, `mediaFileType`, `level` are mandatory if `id` is not provided for uploading an announcement. If all four fields are provided, file with given `id` is used and other fields are ignored.
        fileName:
          type: string
          example: AUDIO_FILE.wav
          description: Audio announcement file name.
        mediaFileType:
          type: string
          enum:
          - WAV
          description: "Audio announcement file type.\n * `WAV` - WAV File Extension.\n"
        level:
          type: string
          enum:
          - ORGANIZATION
          - LOCATION
          description: "Audio announcement file type location.\n * `ORGANIZATION` - Specifies this audio file is configured across the organization.\n * `LOCATION` - Specifies this audio file is configured across the location.\n"
    PlaceSimultaneousRingCriteriaPatch:
      type: object
      properties:
        scheduleName:
          type: string
          example: Business Vacation
          description: Name of the location's schedule which determines when the simultaneous ring is in effect.
        scheduleType:
          $ref: '#/components/schemas/ScheduleTypeSelection'
          description: The Schedule type whether `businessHours` or `holidays`.
        scheduleLevel:
          $ref: '#/components/schemas/PlaceScheduleLevel'
          description: The Schedule level i.e, Group.
        callsFrom:
          $ref: '#/components/schemas/CallsFromType'
          description: Indicates whether to apply simultaneously ring for calls from Any Phone Number or Select Phone Numbers.
        anonymousCallersEnabled:
          type: boolean
          example: true
          description: When `true`, enables calls from anonymous callers.
        unavailableCallersEnabled:
          type: boolean
          example: true
          description: When `true`, enables calls even if callers are unavailable.
        phoneNumbers:
          type: array
          items:
            type: string
            example: +19064441748,+19186663950
          description: the list of phone numbers that will checked against incoming calls for a match.
        ringEnabled:
          type: boolean
          example: true
          description: When set to `true` simultaneous ringing criteria is enabled for calls that meet the current criteria. Criteria with `ringEnabled` set to `false` take priority.
    SelectiveAcceptCallCriteria:
      type: object
      required:
      - id
      - scheduleName
      - source
      - acceptEnabled
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NSSVRFUklBLzg2NTAxZDFlLTg1MWMtNDgwYi1hZmE2LTA5MTU4NzQ3NzdmZQ
          description: Unique identifier for criteria.
        scheduleName:
          type: string
          example: Business Vacation
          description: Name of the location's schedule which determines when the selective reject is in effect.
        source:
          $ref: '#/components/schemas/SelectiveAcceptCallSource'
          description: If criteria are applicable for calls from any phone number, specific phone number or forwarded ones.
        acceptEnabled:
          type: boolean
          example: true
          description: This setting specifies to choose to accept or not to accept the calls that fit within these parameters.
    PriorityAlertGet:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if the Priority Alert feature is enabled.'
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/PriorityAlertCriteria'
          description: A list of criteria specifying conditions when priority alert is in effect.
    PlacePriorityAlertCriteriaPatch:
      type: object
      properties:
        scheduleName:
          type: string
