        sendAllCalls:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: All calls will be sent to voicemail.
          description: Settings for sending all calls to voicemail.
        sendBusyCalls:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: Calls will be sent to voicemail when busy.
            greeting:
              type: string
              enum:
              - DEFAULT
              - CUSTOM
              description: "`DEFAULT` indicates the default greeting will be played. `CUSTOM` indicates a custom `.wav` file will be played.\n * `DEFAULT` - The default greeting will be played.\n * `CUSTOM` - Designates that a custom `.wav` file will be played.\n"
          description: Settings for sending calls to voicemail when the line is busy.
        sendUnansweredCalls:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: Unanswered call sending to voicemail is enabled or disabled.
            greeting:
              type: string
              enum:
              - DEFAULT
              - CUSTOM
              description: "`DEFAULT` indicates the default greeting will be played. `CUSTOM` indicates a custom `.wav` file will be played.\n * `DEFAULT` - The default greeting will be played.\n * `CUSTOM` - Designates that a custom `.wav` file will be played.\n"
            numberOfRings:
              type: number
              example: 3
              description: Number of rings before an unanswered call will be sent to voicemail. `numberOfRings` must be between 2 and 20, inclusive.
        notifications:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: Notifications for voicemails will be sent if enabled. At least one of the destination or smsDestination fields must be configured when enabled.
            destination:
              type: string
              example: julie@example.com
              description: Email address for notification delivery. For US/Canada text messages, use the `smsDestination` field rather than providing a SMS gateway address like `12025551212@txt.example.net` here.
            smsDestination:
              type: string
              example: '+12025551212'
              description: SMS destination for notification delivery. Must be a US or Canada phone number in E.164 format (e.g., +12025551212).
          description: Settings for notifications when there are any new voicemails.
        transferToNumber:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
