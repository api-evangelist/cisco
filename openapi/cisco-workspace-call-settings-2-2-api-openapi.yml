      summary: Delete a Specific Access Code for a Workspace
      operationId: DeleteASpecificAccessCodeForAWorkspace
      description: 'Deletes a specific access code for the given workspace.


        Access codes are used to bypass permissions.


        This API requires a full, device or location administrator auth token with the scope of `spark-admin:telephony_config_write`.'
      tags:
      - Workspace Call Settings (2/2)
      parameters:
      - name: workspaceId
        in: path
        description: Unique identifier for the workspace.
        required: true
        example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9QTEFDRS8xNzdmNTNlZC1hNzY2LTRkYTAtOGQ3OC03MjE0MjhjMmFjZTQ=
        schema:
          type: string
      - name: orgId
