      summary: Retrieve Music On Hold Settings for a Workspace
      operationId: RetrieveMusicOnHoldSettingsForAWorkspace
      description: 'Retrieve Music On Hold Settings for a Workspace.


        Music on hold is played when a caller is put on hold, or the call is parked.


        Retrieving a workspace''s music on hold settings requires a full, device or read-only administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - Workspace Call Settings (2/2)
      parameters:
      - name: workspaceId
        in: path
        description: Unique identifier for the workspace.
        required: true
        example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9QTEFDRS8xNzdmNTNlZC1hNzY2LTRkYTAtOGQ3OC03MjE0MjhjMmFjZTQ=
        schema:
          type: string
      - name: orgId
        in: query
        description: ID of the organization in which the person resides. Only admin users of another organization (such as partners) may use this parameter as the default is the same organization as the token used to access the API.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      x-operation-id-source: normalized
      x-operation-id-original: Retrieve Music On Hold Settings for a Workspace
