              type: string
              example: '+12025551212'
              description: SMS destination for notification delivery. Must be a US or Canada phone number in E.164 format (e.g., +12025551212).
          description: Settings for notifications when there are any new voicemails.
        transferToNumber:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              example: true
              description: Enabled or disabled state of giving caller option to transfer to destination when pressing zero (0).
            destination:
              type: string
              example: '6527'
              description: Number voicemail caller will be transferred to when they press zero (0).
          description: Settings for voicemail caller to transfer to a different number by pressing zero (0).
        emailCopyOfMessage:
          type: object
          required:
          - enabled
          - emailId
          properties:
            enabled:
              type: boolean
              example: true
              description: When `true` copy of new voicemail message audio will be sent to the designated email.
            emailId:
              type: string
              example: dummy@example.com
              description: Email address to which the new voicemail audio will be sent.
          description: Settings for sending a copy of new voicemail message audio via email.
        messageStorage:
          type: object
          required:
          - mwiEnabled
          - storageType
          - externalEmail
          properties:
            mwiEnabled:
              type: boolean
              example: true
              description: When `true` desktop phone will indicate there are new voicemails.
            storageType:
              type: string
              enum:
              - INTERNAL
              - EXTERNAL
              description: "Designates which type of voicemail message storage is used.\n * `INTERNAL` - For message access via phone or the Calling User Portal.\n * `EXTERNAL` - For sending all messages to the person's email.\n"
            externalEmail:
              type: string
              example: dummy@example.com
              description: External email address to which the new voicemail audio will be sent.  A value for this field must be provided in the request if a `storageType` of `EXTERNAL` is given in the request.
        faxMessage:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              example: true
              description: When `true` FAX messages for new voicemails will be sent to the designated number.
            phoneNumber:
              type: string
              example: '2025551212'
              description: Designates phone number for the FAX. A value for this field must be provided in the request if faxMessage `enabled` field is given as `true` in the request.
            extension:
              type: string
              example: '1234'
              description: Designates optional FAX extension.
    PriorityAlertPatch:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: '`true` if the Priority Alert feature is enabled.'
    PlacePriorityAlertCriteriaPost:
      type: object
      required:
      - scheduleName
      - scheduleType
      - scheduleLevel
      - callsFrom
      - notificationEnabled
      properties:
        scheduleName:
          type: string
          example: Business Vacation
          description: Name of the location's schedule which determines when the priority alert is in effect.
        scheduleType:
          $ref: '#/components/schemas/ScheduleTypeSelection'
          description: The Schedule type whether `businessHours` or `holidays`.
        scheduleLevel:
          $ref: '#/components/schemas/PlaceScheduleLevel'
          description: The Schedule level i.e. Group.
        callsFrom:
          $ref: '#/components/schemas/CallsFromType'
          description: Indicates whether to apply priority alert for calls from Any Phone Number or Select Phone Numbers.
        anonymousCallersEnabled:
          type: boolean
          example: true
          description: When `true`, enables calls from anonymous callers. Value for this attribute is required if `callsFrom` is `SELECT_PHONE_NUMBERS`.
        unavailableCallersEnabled:
          type: boolean
          example: true
          description: When `true`, enables calls even if callers are unavailable. Value for this attribute is required if `callsFrom` is `SELECT_PHONE_NUMBERS`.
        phoneNumbers:
          type: array
          items:
            type: string
            example: +19064441748,+19186663950
          description: the list of phone numbers that will checked against incoming calls for a match. Value for this attribute is required if `callsFrom` is `SELECT_PHONE_NUMBERS`.
        notificationEnabled:
          type: boolean
          example: true
          description: When set to `true` priority alerting criteria is enabled for calls that meet the current criteria. Criteria with `notificationEnabled` set to `false` take priority.
    PeopleOrPlaceOrVirtualLineType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      - VIRTUAL_LINE
      description: " * `PEOPLE` - Person or list of people.\n * `PLACE` - Workspace that is not assigned to a specific person such as for a shared device in a common area.\n * `VIRTUAL_LINE` - Virtual line or list of virtual lines.\n"
    PushToTalkNumberObject:
      type: object
      properties:
        external:
          type: string
          example: '+19845551088'
          description: External phone number of the person.
        extension:
          type: string
          example: '1088'
          description: Extension number of the person.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of location.
        esn:
          type: string
          example: '12341088'
          description: Routing prefix + extension of a person or workspace.
        primary:
          type: boolean
          example: true
          description: If `true`, specifies whether the phone number is primary number.
    UserBargeInPatch:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: '`true` if the Barge In feature is enabled.'
        toneEnabled:
          type: boolean
          description: When `true`, a tone is played when someone barges into a call.
    SelectiveAcceptCallSettingPatch:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: indicates whether selective accept is enabled or not.
    SimultaneousRingPatch:
      type: object
      required:
      - criteriasEnabled
      properties:
        enabled:
          type: boolean
          example: true
          description: Simultaneous Ring is enabled or not.
        doNotRingIfOnCallEnabled:
          type: boolean
          example: true
          description: When set to `true`, the configured phone numbers won't ring when on a call.
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/SimultaneousRingNumber'
          description: Enter up to 10 phone numbers to ring simultaneously when a workspace phone receives an incoming call.
        criteriasEnabled:
          type: boolean
          example: true
          description: When `true`, enables the selected schedule for simultaneous ring.
    OutboundBillingPlan:
      type: object
      example:
        enabled: true
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Set to `true` when Cisco Calling Plan outbound billing is enabled for the workspace.
          example: true
      description: Cisco Calling Plan outbound billing setting for the workspace.
    AnonymousCallRejectionGet:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if the Anonymous Call Rejection feature is enabled.'
    WorkspaceCallInterceptAvailableNumberObject:
      type: object
      required:
      - state
      - isMainNumber
      - tollFreeNumber
      - telephonyType
      - isServiceNumber
      - owner
      properties:
        phoneNumber:
          type: string
          example: '+12056350001'
          description: A unique identifier for the PSTN phone number.
        extension:
          type: string
          example: '1235'
          description: Extension for the PSTN phone number.
        state:
          $ref: '#/components/schemas/STATE'
          description: Phone number's state.
        isMainNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is used as a location CLID.
        tollFreeNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a toll-free number.
        telephonyType:
          $ref: '#/components/schemas/TelephonyType'
          description: The telephony type for the number.
        isServiceNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a service number; otherwise, it is a standard number. Service numbers are high-utilization or high-concurrency PSTN phone numbers that are neither mobile nor toll-free.
        owner:
          $ref: '#/components/schemas/NumberOwnerObject'
          description: Owner details for the phone number.
    UserCallPoliciesGet:
      type: object
      required:
      - connectedLineIdPrivacyOnRedirectedCalls
      properties:
        connectedLineIdPrivacyOnRedirectedCalls:
          type: string
          enum:
          - NO_PRIVACY
          - PRIVACY_FOR_EXTERNAL_CALLS
          - PRIVACY_FOR_ALL_CALLS
          description: "Specifies the connection type to be used.\n * `NO_PRIVACY` - Connected line identification is not blocked on redirected calls.\n * `PRIVACY_FOR_EXTERNAL_CALLS` - Connected line identification is blocked on redirected calls to external numbers.\n * `PRIVACY_FOR_ALL_CALLS` - Connected line identification is blocked on all redirected calls.\n"
