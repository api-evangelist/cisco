      summary: Create a Device Activation Code
      operationId: CreateADeviceActivationCode
      description: 'Generate an activation code for a device in a specific workspace by `workspaceId` or for a person by `personId`. This requires an auth token with the `spark-admin:devices_write` scope, and either `identity:placeonetimepassword_create` (allows creating activation codes for workspaces only) or `identity:one_time_password` (allows creating activation codes for workspaces or persons).


        * Adding a device to a workspace with calling type `none` or `thirdPartySipCalling` will reset the workspace calling type to `freeCalling`.


        * Either `workspaceId` or `personId` should be provided. If both are supplied, the request will be invalid.


        * If no `model` is supplied, the `code` returned will only be accepted on RoomOS devices.


        * If your device is a phone, you must provide the `model` as a field. You can get the `model` from the supported devices API.


        Adding a device to a person with a Webex Calling Standard license will disable Webex Calling across their Webex mobile, tablet, desktop, and browser applications.


        When adding devices to a Webex Calling Professional licensed person or workspace, wait for each API call to finish before starting the next. This prevents race conditions that can cause errors when assigning primary versus secondary device status.'
      tags:
      - Devices
      parameters:
      - name: orgId
        in: query
        description: The organization associated with the activation code generated. If left empty, the organization associated with the caller will be used.
        example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLXdlc3QtMl9yL09SR0FOSVpBVElPTi9mN2I3MzYwYy1lMDcxLTQwN2EtYTU1Ny04NDI4YmIyMjhlODQ
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              workspaceId: Y2lzY29zcGFyazovL3VzL1BFT1BMRS83MTZlOWQxYy1jYTQ0LTRmZWQtOGZjYS05ZGY0YjRmNDE3ZjU
              model: DMS Cisco 8865
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS83MTZlOWQxYy1jYTQ0LTRmZWQtOGZjYS05ZGY0YjRmNDE3ZjU
                  description: The ID of the workspace where the device will be activated.
                personId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS83MTZlOWQxYy1jYTQ0LTRmZWQtOGZjYS05ZGY0YjRmNDE3ZjU
                  description: The ID of the person who will own the device once activated.
                model:
                  type: string
                  example: DMS Cisco 8865
                  description: The model of the device being created. The corresponding device model display name sometimes called the product name, can also be used to specify the model.
