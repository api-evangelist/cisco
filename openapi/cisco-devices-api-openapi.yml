      summary: Modify Device Tags
      operationId: ModifyDeviceTags
      description: 'Create, delete or update tags on a device. For your own device, this requires an auth token with the `spark:devices_write` scope. An auth token with the `spark-admin:devices_write` scope is required to operate on other devices within the organization.


        Specify the device ID in the `deviceId` parameter in the URI.


        Include only the tag array in the request body, no other device attributes can be changed. This action will overwrite any previous tags. A common approach is to first GET the devices''s details, make changes to the `tags` array, and then PATCH the new complete array with this endpoint.'
      tags:
      - Devices
      parameters:
      - name: deviceId
        in: path
        description: Unique identifier for the device.
        required: true
        example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9ERVZJQ0UvNTEwMUIwN0ItNEY4Ri00RUY3LUI1NjUtREIxOUM3QjcyM0Y3
        schema:
          type: string
      - name: orgId
        in: query
        description: The organization associated with the device. If left empty, the organization associated with the caller will be used.
        example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLXdlc3QtMl9yL09SR0FOSVpBVElPTi9mN2I3MzYwYy1lMDcxLTQwN2EtYTU1Ny04NDI4YmIyMjhlODQ
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            example:
            - op: replace
              path: tags
              value:
              - First Tag
              - Second Tag
            schema:
              type: object
              properties:
                op:
                  type: string
                  enum:
                  - add
                  - remove
                  - replace
                  description: " * `add` - Add all specified tags to the existing device tags list.\n * `remove` - Remove all tags that the device currently has.\n * `replace` - Replace the tags currently on the device with the specified list.\n"
                path:
                  type: string
                  example: tags
                  description: Only the tags path is supported to patch.
                value:
                  type: array
                  items:
                    type: string
                    example: First Tag,Second Tag
      x-operation-id-source: normalized
      x-operation-id-original: Modify Device Tags
