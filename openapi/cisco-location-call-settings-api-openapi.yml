          description: Array of phone numbers.
    CallBackMemberType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      - VIRTUAL_LINE
      - HUNT_GROUP
      description: " * `PEOPLE` - Associated member is a person.\n * `PLACE` - Associated member is a workspace.\n * `VIRTUAL_LINE` - Associated member is a virtual line.\n * `HUNT_GROUP` - Associated member is a hunt group.\n"
    PostLocationCallingRequest:
      type: object
      required:
      - id
      - name
      - timeZone
      - preferredLanguage
      - announcementLanguage
      - address
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzljYTNhZmQ3LTE5MjYtNGQ0ZS05ZDA3LTk5ZDJjMGU4OGFhMA
          description: A unique identifier for the location.
        name:
          type: string
          example: '''Denver'''
          description: The name of the location.
        timeZone:
          type: string
          example: '''America/Chicago'''
          description: Time zone associated with this location. Refer to this link (https://developer.webex.com/docs/api/guides/webex-for-broadworks-developers-guide#webex-meetings-site-timezone) for the format.
        preferredLanguage:
          type: string
          example: '''en_us'''
          description: Default email language.
        announcementLanguage:
          type: string
          example: '''fr_fr'''
          description: Location's phone announcement language.
        address:
          type: object
          required:
          - address1
          - city
          - state
          - postalCode
          - country
          properties:
            address1:
              type: string
              example: 771 Alder Drive
              description: Address 1 of the location.
            address2:
              type: string
              example: Cisco Site 5
              description: Address 2 of the location.
            city:
              type: string
              example: Milpitas
              description: City of the location.
            state:
              type: string
              example: CA
              description: State code of the location.
            postalCode:
              type: string
              example: '95035'
              description: Postal code of the location.
            country:
              type: string
              example: US
              description: ISO-3166 2-Letter country code of the location.
          description: The address of the location.
    WebexGoAvailableNumberObject:
      type: object
      required:
      - phoneNumber
      - state
      - isMainNumber
      - telephonyType
      - isServiceNumber
      properties:
        phoneNumber:
          type: string
          example: '+12056350001'
          description: A unique identifier for the phone number.
        state:
          $ref: '#/components/schemas/STATE'
          description: Phone number's state.
        isMainNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is used as a location CLID.
        telephonyType:
          $ref: '#/components/schemas/TelephonyType'
          description: The telephony type for the number.
        isServiceNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a service number; otherwise, it is a standard number. Service numbers are high-utilization or high-concurrency PSTN phone numbers that are neither mobile nor toll-free.
    ExtensionStatusObject:
      type: object
      required:
      - state
      properties:
        extension:
          type: string
          example: '407721'
          description: Unique extension which will be validated at the location level.
        state:
          type: string
          enum:
          - VALID
          - DUPLICATE
          - DUPLICATE_IN_LIST
          - INVALID
          description: "State of the extension after it was validated.\n * `VALID` - Extension is valid.\n * `DUPLICATE` - Extension already assigned to another group.\n * `DUPLICATE_IN_LIST` - Extension already exists in the request body and was already verified.\n * `INVALID` - Extension is invalid.\n"
        errorCode:
          type: number
          example: 9495
          description: Error code of the state in case extension is not valid.
        message:
          type: string
          example: '[Error 9495] The extension is not available. It is already assigned as a Call Park Extension: 407721.'
          description: Message assigned to the error code.
    GetLocationCallCaptionsObject:
      type: object
      required:
      - locationClosedCaptionsEnabled
      - locationTranscriptsEnabled
      - orgClosedCaptionsEnabled
      - orgTranscriptsEnabled
      - useOrgSettingsEnabled
      properties:
        locationClosedCaptionsEnabled:
          type: boolean
          example: true
          description: Location-level closed captions are enabled or disabled.
        locationTranscriptsEnabled:
          type: boolean
          example: true
          description: Location-level transcripts are enabled or disabled.
        orgClosedCaptionsEnabled:
          type: boolean
          example: true
          description: Organization closed captions are enabled or disabled.
        orgTranscriptsEnabled:
          type: boolean
          example: true
          description: Organization transcripts are enabled or disabled.
        useOrgSettingsEnabled:
          type: boolean
          example: true
