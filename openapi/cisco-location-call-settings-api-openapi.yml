            application/json:
              schema:
                type: object
                required:
                - dialPatterns
                properties:
                  dialPatterns:
                    type: array
                    items:
                      type: string
                    description: Array of dial patterns. An enterprise dial pattern is represented by a sequence of digits (1-9), followed by optional wildcard characters.
              example:
                dialPatterns: []
