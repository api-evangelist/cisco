          enum:
          - SUNDAY
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          description: Schedule the event on a specific day.
        week:
          type: string
          enum:
          - FIRST
          - SECOND
          - THIRD
          - FOURTH
          - LAST
          description: Schedule the event on a specific week.
        month:
          type: string
          enum:
          - JANUARY
          - FEBRUARY
          - MARCH
          - APRIL
          - MAY
          - JUNE
          - JULY
          - AUGUST
          - SEPTEMBER
          - OCTOBER
          - NOVEMBER
          - DECEMBER
          description: Schedule the event on a specific month.
