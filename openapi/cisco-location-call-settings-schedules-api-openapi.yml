components:
  schemas:
    ScheduleEventObject:
      type: object
      required:
      - name
      - startDate
      - endDate
      properties:
        name:
          type: string
          example: MondaySchedule
          description: Name for the event.
        startDate:
          type: string
          example: '2021-11-01'
          description: Start date of event.
        endDate:
          type: string
          example: '2021-11-30'
          description: End date of event.
        startTime:
          type: string
          example: '12:20'
          description: Start time of event. Mandatory if the event is not all day.
        endTime:
          type: string
          example: '14:20'
          description: End time of event. Mandatory if the event is not all day.
        allDayEnabled:
          type: boolean
          description: An indication of whether given event is an all-day event or not. Mandatory if the `startTime` and `endTime` are not defined.
        recurrence:
          $ref: '#/components/schemas/RecurrenceObject'
          description: Recurrence definition.
    RecurWeeklyObject:
      type: object
      required:
      - sunday
      properties:
        sunday:
          type: boolean
          example: true
          description: Frequency of occurrence in weeks and select the day - Sunday.
        monday:
          type: boolean
          example: true
          description: Frequency of occurrence in weeks and select the day - Monday.
        tuesday:
          type: boolean
          example: true
          description: Frequency of occurrence in weeks and select the day - Tuesday.
        wednesday:
          type: boolean
          example: true
          description: Frequency of occurrence in weeks and select the day - Wednesday.
        thursday:
          type: boolean
          example: true
          description: Frequency of occurrence in weeks and select the day - Thursday.
        friday:
          type: boolean
          example: true
          description: Frequency of occurrence in weeks and select the day - Friday.
        saturday:
          type: boolean
          example: true
          description: Frequency of occurrence in weeks and select the day - Saturday.
    ModifyScheduleObject:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: AUTOATTENDANT-BUSINESS-HOURS
          description: Unique name for the schedule.
        events:
          type: array
          items:
            $ref: '#/components/schemas/ModifyScheduleEventListObject'
          description: List of schedule events.
    PostScheduleObject:
      type: object
      required:
      - type
      - name
      properties:
        type:
          type: string
          enum:
          - businessHours
          - holidays
          description: "Type of the schedule.\n * `businessHours` - Business hours schedule type.\n * `holidays` - Holidays schedule type.\n"
        name:
          type: string
          example: AUTOATTENDANT-BUSINESS-HOURS
          description: Unique name for the schedule.
        events:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleEventObject'
          description: List of schedule events.
    RecurrenceObject:
      type: object
      properties:
        recurForEver:
          type: boolean
          description: Flag to indicate if event will recur forever.
        recurEndDate:
          type: string
          example: '2021-11-30'
          description: End date of recurrence.
        recurWeekly:
          $ref: '#/components/schemas/RecurWeeklyObject'
          description: Weekly recurrence definition.
        recurYearlyByDate:
          $ref: '#/components/schemas/RecurYearlyByDateObject'
          description: Recurrence definition yearly by date.
        recurYearlyByDay:
          $ref: '#/components/schemas/RecurYearlyByDayObject'
          description: Recurrence definition yearly by day.
    ModifyScheduleEventObject:
      type: object
      required:
      - name
      - startDate
      - endDate
      properties:
        name:
          type: string
          example: MondaySchedule
          description: Name for the event.
        startDate:
          type: string
          example: '2021-11-01'
          description: Start date of event.
        endDate:
          type: string
          example: '2021-11-30'
          description: End date of event.
        startTime:
          type: string
          example: '12:20'
          description: Start time of event. Mandatory if the event is not all day.
        endTime:
          type: string
          example: '14:20'
          description: End time of event. Mandatory if the event is not all day.
        allDayEnabled:
          type: boolean
          description: An indication of whether given event is an all-day event or not. Mandatory if the `startTime` and `endTime` are not defined.
        recurrence:
          $ref: '#/components/schemas/RecurrenceObject'
          description: Recurrence definition.
    RecurYearlyByDayObject:
      type: object
      required:
