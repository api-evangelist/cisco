      summary: Read the List of Schedules
      operationId: ReadTheListOfSchedules
      description: 'List all schedules for the given location of the organization.


        A time schedule establishes a set of times during the day or holidays in the year in which a feature, for example auto attendants, can perform a specific action.


        Retrieving this list requires a full or read-only administrator or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - 'Location Call Settings:  Schedules'
      parameters:
      - name: locationId
        in: path
        description: Return the list of schedules for this location.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
        schema:
          type: string
      - name: orgId
        in: query
        description: List schedules for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: max
        in: query
        description: Limit the number of objects returned to this maximum count.
        example: '5'
        schema:
          type: number
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching objects.
        example: '0'
        schema:
          type: number
      - name: name
        in: query
        description: Only return schedules with the matching name.
        example: AUTOATTENDANT-BUSINESS-HOURS
        schema:
          type: string
      - name: type
        in: query
        description: Type of the schedule.
        example: businessHours
        schema:
          type: string
          enum:
          - businessHours
          - holidays
      x-operation-id-source: normalized
      x-operation-id-original: Read the List of Schedules
