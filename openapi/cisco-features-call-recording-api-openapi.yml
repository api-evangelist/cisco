      summary: Update Call Recording Compliance Announcement for the Location
      operationId: updateCallRecordingComplianceAnnouncementForTheLocation
      description: 'Update the location compliance announcement.


        The Compliance Announcement feature interacts with the Call Recording feature, specifically with the playback of the start/stop announcement. When the compliance announcement is played to the PSTN party, and the PSTN party is connected to a party with call recording enabled, then the start/stop announcement is inhibited.


        Updating the location compliance announcement requires a full or location administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - 'Features: Call Recording'
      parameters:
      - name: locationId
        in: path
        description: Update the compliance announcement settings for this location.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1
        schema:
          type: string
      - name: orgId
        in: query
        description: Update the compliance announcement setting from this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              inboundPSTNCallsEnabled: true
              useOrgSettingsEnabled: true
              outboundPSTNCallsEnabled: false
              outboundPSTNCallsDelayEnabled: false
              delayInSeconds: 10
              useOrgLevelAnnouncementEnabled: false
              customComplianceAnnouncement:
                type: CUSTOM
                audioAnnouncementFileId: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC82YTcwZWQ4MS1hZGM5LTQ4OWEtODhjOC0zMWI3ODllODQ1ODU
