components:
  schemas:
    GetOrgComplianceAnnouncementObject:
      type: object
      required:
      - inboundPSTNCallsEnabled
      - outboundPSTNCallsEnabled
      - outboundPSTNCallsDelayEnabled
      - delayInSeconds
      - useCustomAnnouncementEnabled
      - audioAnnouncementFile
      properties:
        inboundPSTNCallsEnabled:
          type: boolean
          example: true
          description: Flag to indicate whether the call recording START/STOP announcement is played to an inbound caller.
        outboundPSTNCallsEnabled:
          type: boolean
          description: Flag to indicate whether the call recording START/STOP announcement is played to an outbound caller.
        outboundPSTNCallsDelayEnabled:
          type: boolean
          description: Flag to indicate whether compliance announcement is played after a specified delay in seconds.
        delayInSeconds:
          type: number
          example: 10
          description: Number of seconds to wait before playing the compliance announcement.
        useCustomAnnouncementEnabled:
          type: boolean
          example: true
          description: Flag to indicate whether to use the custom compliance announcement. If true it uses the organization's custom compliance announcement file, and if false default compliance announcement used.
        audioAnnouncementFile:
          type: object
          description: The custom audio announcement file to be played.
          properties:
            id:
              type: string
              example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC82YTcwZWQ4MS1hZGM5LTQ4OWEtODhjOC0zMWI3ODllODQ1ODU
              description: Unique identifier for the custom audio announcement file.
            fileName:
              type: string
              example: SampleAnnouncement
              description: The original file name of the uploaded custom audio announcement.
            mediaFileType:
              type: string
              enum:
              - WAV
              example: WAV
              description: Type of the announcement file. Type is an enum with supported values WAV
            level:
              type: string
              enum:
              - ORGANIZATION
              - LOCATION
              description: Announcement audio file level.
              example: ORGANIZATION
            isTextToSpeech:
              type: boolean
              example: true
              description: Indicates if the announcement is created by TTS.
    MemberType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      description: " * `PEOPLE` - Indicates the associated member is a person.\n * `PLACE` - Indicates the associated member is a workspace.\n"
    CallRecordingVendorPatch:
      type: object
      required:
      - vendorId
      properties:
        vendorId:
          type: string
          description: Unique identifier of the vendor.
        failureBehavior:
          description: Call recording failure behavior.
          allOf:
          - $ref: '#/components/schemas/FailureBehavior'
    stepExecutionStatusesObject:
      type: object
      required:
      - id
      - lastUpdated
      - statusMessage
      - name
      - timeElapsed
      properties:
        id:
          type: number
          example: 3624681
          description: Unique identifier that identifies each step in a job.
        startTime:
          type: string
          example: '2023-05-30T13:04:00.469Z'
          description: The date and time with seconds, the step execution has started in UTC format.
        endTime:
          type: string
          example: '2023-05-30T13:04:03.245Z'
          description: The date and time with seconds, the step execution has ended in UTC format.
        lastUpdated:
          type: string
          example: '2023-05-30T13:04:03.574Z'
          description: The date and time with seconds, the step has last updated in UTC format.
        statusMessage:
          type: string
          enum:
          - STARTING
          - STARTED
          - COMPLETED
          - FAILED
          - UNKNOWN
          - ABANDONED
          description: "Displays status for a step.\n * `STARTING` - Job has started.\n * `STARTED` - Job is in progress.\n * `COMPLETED` - Job has completed.\n * `FAILED` - Job has failed.\n * `UNKNOWN` - Job status is unknown.\n * `ABANDONED` - Job has been abandoned (manually stopped).\n"
        exitCode:
          type: string
          enum:
          - UNKNOWN
          - COMPLETED
          - FAILED
          - STOPPED
          - COMPLETED_WITH_ERRORS
          - COMPLETED_WITH_PENDING_ORDERS
          description: "Exit Code for a step.\n * `UNKNOWN` - Job is in progress.\n * `COMPLETED` - Job has completed successfully.\n * `FAILED` - Job has failed.\n * `STOPPED` - Job has been stopped.\n * `COMPLETED_WITH_ERRORS` - Job has completed with errors.\n * `COMPLETED_WITH_PENDING_ORDERS` - Job has completed with pending number orders.\n"
        name:
          type: string
          example: moveusersvalidateAndMove
          description: Step name.
        timeElapsed:
          type: string
          example: PT2.752S
          description: Time lapsed in seconds since the job execution started.
    FailureBehavior:
      type: string
      enum:
      - PROCEED_WITH_CALL_NO_ANNOUNCEMENT
      - PROCEED_CALL_WITH_ANNOUNCEMENT
      - END_CALL_WITH_ANNOUNCEMENT
      description: " * `PROCEED_WITH_CALL_NO_ANNOUNCEMENT` - Failure behavior will make sure that the call proceeds without announcement.\n * `PROCEED_CALL_WITH_ANNOUNCEMENT` - Failure behavior will make sure that the call proceeds with an announcement.\n * `END_CALL_WITH_ANNOUNCEMENT` - Failure behavior will make sure that the call ends with an announcement.\n"
    ErrorObject:
      type: object
      properties:
        key:
          type: string
          description: HTTP error code.
        message:
          type: array
          items:
            $ref: '#/components/schemas/ErrorMessageObject'
          description: Message string with further error information.
    CallRecordingRegionsResponse:
      type: object
      required:
      - regions
      properties:
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Regions'
          description: Contains region details.
    ModifyCallRecordingSettingsObject:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: Whether or not the call recording is enabled.
    CallRecordingJobStatus:
      type: object
      required:
      - id
      - trackingId
      - sourceUserId
      - sourceCustomerId
      - targetCustomerId
      - instanceId
      - latestExecutionStatus
      - vendorId
      - counts
      properties:
        name:
          type: string
          example: managecallrecordingprovider
          description: Name of the job.
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0pPQl9JRC8wNjZkOTQzNC1kODEyLTQzODItODVhMC00MjBlOTFlODg3ZTY
          description: Unique identifier of the job.
        trackingId:
          type: string
          example: ADMINBATCHCLIENT_a02c7b0c-4d28-4e98-b47b-0a135a4b287f_0
          description: Unique identifier to track the flow of HTTP requests.
        sourceUserId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9jODA2NzZhZC0yNjRlLTRmMWMtYmIwYS1jMWZiNmQ0ODlmZTI
          description: Unique identifier of the user who has run the job.
        sourceCustomerId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8zNDEyODExZi0xMWI4LTQ2YTAtYWExNS1lZmEwMjRjODI5ODM
          description: Unique identifier of the customer who has run the job.
        targetCustomerId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8zNDEyODExZi0xMWI4LTQ2YTAtYWExNS1lZmEwMjRjODI5ODM
          description: Unique identifier of the customer for which the job was run.
        instanceId:
          type: number
          example: 637210
          description: Unique identifier to identify the instance of the job.
        jobExecutionStatus:
          type: array
          items:
            $ref: '#/components/schemas/JobExecutionStatusObject'
          description: Displays the most recent step's execution status. Contains execution statuses of all the steps involved in the execution of the job.
        latestExecutionStatus:
          description: Most recent status of the job at the time of invocation.
          allOf:
          - $ref: '#/components/schemas/LatestExecutionStatus'
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzlmZTFmZDllLTlkM2QtNDUxZi04MDEwLTMwY2U1ZjRlNTYyNQ
          description: Unique identifier of a location.
        vendorId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JFQ09SRElOR19WRU5ET1IvZmYzNzMzOTYtMGVmMC00N2NiLTk5NzEtNzg0MDI5YzZjMTQ3
          description: Unique identifier of a vendor.
