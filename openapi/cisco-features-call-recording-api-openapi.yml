      summary: Update Call Recording Settings
      operationId: updateCallRecordingSettings
      description: 'Update call recording settings for the organization.


        The Call Recording feature enables authorized agents to record any active call that Webex Contact Center manages.


        Updating call recording settings requires a full administrator auth token with a scope of `spark-admin:telephony_config_write`.


        **NOTE**: This API is for Cisco partners only.'
      tags:
      - 'Features: Call Recording'
      parameters:
      - name: orgId
        in: query
        description: Retrieve call recording settings from this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi9lNTEzMTg1Zi01YTJmLTQ0OTUtYjM1Yi03MDY3YmY3Y2U0OGU
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              enabled: true
            schema:
              $ref: '#/components/schemas/ModifyCallRecordingSettingsObject'
