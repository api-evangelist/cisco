      summary: Read the List of Call Parks
      operationId: ReadTheListOfCallParks
      description: 'List all Call Parks for the organization.


        Call Park allows call recipients to place a call on hold so that it can be retrieved from another device.


        Retrieving this list requires a full or read-only administrator or location administrator auth token with a scope of `spark-admin:telephony_config_read`.


        **NOTE**: The Call Park ID will change upon modification of the Call Park name.'
      tags:
      - 'Features:  Call Park'
      parameters:
      - name: locationId
        in: path
        description: Return the list of call parks for this location.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1
        schema:
          type: string
      - name: orgId
        in: query
        description: List call parks for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: max
        in: query
        description: Limit the number of call parks returned to this maximum count. Default is 2000.
        example: '5'
        schema:
          type: number
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching call parks. Default is 0.
        example: '0'
        schema:
          type: number
      - name: order
        in: query
        description: Sort the list of call parks by name, either ASC or DSC. Default is ASC.
        example: ASC
        schema:
          type: string
      - name: name
        in: query
        description: Return the list of call parks that contains the given name. The maximum length is 80.
        example: technical support
        schema:
          type: string
      x-operation-id-source: normalized
      x-operation-id-original: Read the List of Call Parks
