          description: Name of the location for the call park.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1
          description: ID of the location for the call park.
    ListCPCallParkExtensionObject:
      type: object
      required:
      - id
      - extension
      - name
      properties:
        id:
          type: string
