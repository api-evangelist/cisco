          description: Unique identifier for the call park extension.
        extension:
          type: string
          example: '1415'
          description: The extension for the call park.
        name:
          type: string
          example: '14159265'
          description: A unique name for the call park extension.
    GetPersonPlaceVirtualLineCallParksObject:
      type: object
      required:
      - id
      - type
      - email
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80NDVkMzMzMC1mNjE3LTExZWItOWQyZS01NzViODE3ZGE2NmE
          description: ID of a person, workspace or virtual line.
        firstName:
          type: string
          example: John
          description: First name of a person, workspace or virtual line.
        lastName:
          type: string
          example: Brown
          description: Last name of a person, workspace or virtual line.
        displayName:
          type: string
          example: johnBrown
          description: Display name of a person, workspace or virtual line.
        type:
          type: string
          enum:
          - PEOPLE
          - PLACE
          - VIRTUAL_LINE
          description: "Type of the person, workspace or virtual line.\n * `PEOPLE` - Indicates that this object is a user.\n * `PLACE` - Indicates that this object is a place.\n * `VIRTUAL_LINE` - Indicates that this object is a virtual line.\n"
        email:
          type: string
          example: john.brown@example.com
          description: Email of a person or workspace.
        numbers:
          type: array
          items:
            $ref: '#/components/schemas/GetUserNumberItemObject'
          description: List of phone numbers of a person, workspace or virtual line.
    GetAvailableRecallHuntGroupsObject:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0hVTlRfR1JPVVAvZEdWamFHNXBZMkZzTFhOMWNIQnZjblF0TlRVMU9EWTNOVE13T1VCbmJXRnBiQzVqYjIwPQ
          description: A unique identifier for the hunt group.
        name:
          type: string
          example: Technical Support Group - 5558675309
          description: Unique name for the hunt group.
    GetRecallHuntGroupObject:
      type: object
      required:
      - option
      properties:
        huntGroupId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0hVTlRfR1JPVVAvZEdWamFHNXBZMkZzTFhOMWNIQnZjblF0TlRVMU9EWTNOVE13T1VCbmJXRnBiQzVqYjIwPQ
          description: Alternate user which is a hunt group ID for call park recall alternate destination.
        huntGroupName:
          type: string
          example: Technical Support Group - 5558675309
          description: Unique name for the hunt group.
        option:
          type: string
          enum:
          - ALERT_PARKING_USER_ONLY
          - ALERT_PARKING_USER_FIRST_THEN_HUNT_GROUP
          - ALERT_HUNT_GROUP_ONLY
          description: "Call park recall options.\n * `ALERT_PARKING_USER_ONLY` - Alert parking user only.\n * `ALERT_PARKING_USER_FIRST_THEN_HUNT_GROUP` - Alert parking user first, then hunt group.\n * `ALERT_HUNT_GROUP_ONLY` - Alert hunt group only.\n"
    PutRecallHuntGroupObject:
      type: object
      required:
      - option
      properties:
        huntGroupId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0hVTlRfR1JPVVAvZEdWamFHNXBZMkZzTFhOMWNIQnZjblF0TlRVMU9EWTNOVE13T1VCbmJXRnBiQzVqYjIwPQ
          description: Alternate user which is a hunt group ID for call park recall alternate destination.
        option:
          type: string
          enum:
          - ALERT_PARKING_USER_ONLY
          - ALERT_PARKING_USER_FIRST_THEN_HUNT_GROUP
          - ALERT_HUNT_GROUP_ONLY
          description: "Call park recall options.\n * `ALERT_PARKING_USER_ONLY` - Alert parking user only.\n * `ALERT_PARKING_USER_FIRST_THEN_HUNT_GROUP` - Alert parking user first, then hunt group.\n * `ALERT_HUNT_GROUP_ONLY` - Alert hunt group only.\n"
    ListCallParkExtensionObject:
      type: object
      required:
      - id
      - extension
      - name
      - locationId
      - locationName
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfUEFSS19FWFRFTlNJT04vMGYzZTkwNGItYzliNC00ODNmLWI4MWItZmI0ZjkyMWcxNDUzCg
          description: Unique identifier for the call park extension.
        extension:
          type: string
          example: '1415'
          description: The extension for the call park extension.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of location.
        esn:
          type: string
          example: '12341415'
          description: Routing prefix + extension of a person or workspace.
        name:
          type: string
          example: '14159265'
          description: A unique name for the call park extension.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
          description: ID of location for call park extension.
        locationName:
          type: string
          example: WXCSIVDKCPAPIC4S1
          description: Name of location for call park extension.
    PostCallParkObject:
      type: object
      required:
      - name
      - recall
      properties:
        name:
          type: string
          example: technical support - insurance - customer 1
          description: Unique name for the call park. The maximum length is 80.
        recall:
          $ref: '#/components/schemas/PutRecallHuntGroupObject'
          description: Recall options that are added to the call park.
        agents:
          type: array
          items:
            type: string
          description: Array of ID strings of people, workspaces and virtual lines that are added to the call park.
        parkOnAgentsEnabled:
          type: boolean
          description: Whether or not the calls will be parked on agents as a destination.
        callParkExtensions:
          type: array
          items:
            type: string
          description: Array of ID strings of call park extensions assigned to a call park.
    GetCallParkSettingsObject:
      type: object
      required:
      - callParkRecall
      - callParkSettings
      properties:
        callParkRecall:
          $ref: '#/components/schemas/GetRecallHuntGroupObject'
          description: Recall options that are added to call park.
        callParkSettings:
          $ref: '#/components/schemas/CallParkSettingsObject'
          description: Setting controlling call park behavior.
    PostCallParkExtensionObject:
      type: object
      required:
      - name
      - extension
      properties:
        name:
          type: string
          example: Illinois, Call Park Extension
          description: Name for the call park extension. The maximum length is 30.
        extension:
          type: string
          example: '407721'
          description: Unique extension which will be assigned to call park extension. The minimum length is 2, maximum length is 10.
    GetCallParkExtensionObject:
      type: object
      required:
      - extension
      - name
      properties:
        extension:
          type: string
          example: '1415'
          description: The extension for the call park extension.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of location.
        esn:
          type: string
          example: '12341415'
          description: Routing prefix + extension of a person or workspace.
        name:
          type: string
          example: '14159265'
          description: Unique name for the call park extension.
    CallParkSettingsObject:
      type: object
      required:
      - ringPattern
      properties:
        ringPattern:
          type: string
          enum:
          - NORMAL
          - LONG_LONG
          - SHORT_SHORT_LONG
          - SHORT_LONG_SHORT
          description: "Ring pattern for when this callpark is called.\n * `NORMAL` - Normal incoming ring pattern.\n * `LONG_LONG` - Incoming ring pattern of two long rings.\n * `SHORT_SHORT_LONG` - Incoming ring pattern of two short rings, followed by a short ring.\n * `SHORT_LONG_SHORT` - Incoming ring pattern of a short ring, followed by a long ring, followed by a short ring.\n"
        recallTime:
          type: number
          example: 60
          description: Amount of time within 30 and 600 seconds the Call Park will be parked. If the call isn't picked up within the set time, then the call will be recalled based on the Call Park Recall setting.
        huntWaitTime:
          type: number
          example: 60
          description: Amount of time within 30 and 600 seconds the Call Park will be parked. If the call isn't picked up, the call will revert back to the hunt group (after the person who parked the call is alerted).
    ModifyCallParkObject:
      type: object
      properties:
        name:
          type: string
          example: technical support - insurance - customer 1
          description: Unique name for the call park. The maximum length is 80.
        recall:
          $ref: '#/components/schemas/PutRecallHuntGroupObject'
          description: Recall options that are added to call park.
        agents:
          type: array
          items:
            type: string
          description: Array of ID strings of people, workspaces and virtual lines that are added to call park. The new list of `agents` will replace any existing call park agents list.
        parkOnAgentsEnabled:
          type: boolean
          description: Whether or not the calls will be parked on agents as a destination.
        callParkExtensions:
          type: array
          items:
            type: string
          description: Array of ID strings of call park extensions assigned to a call park.
    GetCallParkObject:
      type: object
      required:
      - id
      - name
      - recall
      - parkOnAgentsEnabled
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfUEFSSy9kR1ZqYUc1cFkyRnNJSE4xY0hCdmNuUWdMU0JwYm5OMWNtRnVZMlVnTFNCamRYTjBiMjFsY2lBeA==
          description: A unique identifier for the call park.
        name:
          type: string
          example: technical support - insurance - customer 1
          description: Unique name for the call park. The maximum length is 80.
        recall:
          $ref: '#/components/schemas/GetRecallHuntGroupObject'
          description: Recall options that are added to call park.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/GetPersonPlaceVirtualLineCallParksObject'
          description: People, workspaces and virtual lines that are eligible to receive calls.
        parkOnAgentsEnabled:
          type: boolean
          description: Whether or not the calls will be parked on agents as a destination.
        callParkExtensions:
          type: array
          items:
            $ref: '#/components/schemas/ListCPCallParkExtensionObject'
          description: Array of call park extensions assigned to a call park.
    ModifyCallExtensionParkObject:
      type: object
      properties:
        name:
          type: string
          example: Illinois, Call Park Extension
          description: Name for the call park extension. The maximum length is 30.
        extension:
          type: string
          example: '407721'
          description: Unique extension which will be assigned to call park extension. The minimum length is 2, maximum length is 10.
    GetUserNumberItemObject:
      type: object
      properties:
        external:
          type: string
          example: '+12143456103'
          description: Phone number of a person.
        extension:
          type: string
          example: '23234'
          description: Extension of a person.
    ModifyCallParkSettingsObject:
      type: object
      properties:
        callParkRecall:
          $ref: '#/components/schemas/PutRecallHuntGroupObject'
          description: Recall options that are added to call park.
        callParkSettings:
          $ref: '#/components/schemas/CallParkSettingsObject'
          description: Setting controlling call park behavior.
