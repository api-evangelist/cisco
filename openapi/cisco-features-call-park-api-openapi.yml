      summary: Create a Call Park
      operationId: CreateACallPark
      description: 'Create new Call Parks for the given location.


        Call Park allows call recipients to place a call on hold so that it can be retrieved from another device.


        Creating a call park requires a full administrator or location administrator auth token with a scope of `spark-admin:telephony_config_write`.


        **NOTE**: The Call Park ID will change upon modification of the Call Park name.'
      tags:
      - 'Features:  Call Park'
      parameters:
      - name: locationId
        in: path
        description: Create the call park for this location.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzhmZjMwMjg5LWVhMzMtNDc1Ny1iMTBmLWQ2MWIyNzFhMDVlZg
        schema:
          type: string
      - name: orgId
        in: query
        description: Create the call park for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: technical support - insurance - customer 1
              recall:
                huntGroupId: Y2lzY29zcGFyazovL3VzL0hVTlRfR1JPVVAvZEdWamFHNXBZMkZzTFhOMWNIQnZjblF0TlRVMU9EWTNOVE13T1VCbmJXRnBiQzVqYjIwPQ
                option: ALERT_PARKING_USER_FIRST_THEN_HUNT_GROUP
              agents:
              - Y2lzY29zcGFyazovL3VzL1BFT1BMRS80NDVkMzMzMC1mNjE3LTExZWItOWQyZS01NzViODE3ZGE2NmE
              - Y2lzY29zcGFyazovL3VzL1BFT1BMRS83MGY2MzYzMC1mZjlmLTExZWItODU5YS0xZjhiYjRjNzc1MWQ
              parkOnAgentsEnabled: false
              callParkExtensions:
              - Y3lzY29zcGFyazovL3VzL1BFT1BMRS83MGY2MzYzMC1mZjlmLTExZWItODU5YS0xZjhiYjRjNzc2MWQ
            schema:
              $ref: '#/components/schemas/PostCallParkObject'
      x-operation-id-source: normalized
      x-operation-id-original: Create a Call Park
