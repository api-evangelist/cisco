      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required:
                - callParks
                properties:
                  callParks:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListCallParkObject'
                    description: Array of call parks.
              example:
                callParks:
                - name: technical support - cards - customer 1
                  id: Y2lzY29zcGFyazovL3VzL0NBTExfUEFSSy9kR1ZqYUc1cFkyRnNJSE4xY0hCdmNuUWdMU0JqWVhKa2N5QXRJR04xYzNSdmJXVnlJREU9
