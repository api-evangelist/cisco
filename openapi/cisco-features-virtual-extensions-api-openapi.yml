        displayName:
          type: string
          example: John Smith
          description: Display name of the person at the virtual extension.
        phoneNumber:
          type: string
          example: '+17011558169'
          description: Directory number of the virtual extension.
        extension:
          type: string
          example: '9133'
          description: Extension of the virtual extension.
