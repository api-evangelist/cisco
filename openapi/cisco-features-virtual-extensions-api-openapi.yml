      summary: Read the List of Virtual Extensions
      operationId: ReadTheListOfVirtualExtensions
      description: 'Retrieve virtual extensions associated with a specific customer.


        The GET Virtual Extensions API allows administrators to retrieve a list of virtual extensions configured within their organization. Virtual extensions enable users to dial extension numbers that route to external phone numbers, such as those of remote workers or frequently contacted clients.

        This API returns key information including the extension, associated phone number (in E.164 format), display name, and the location to which the virtual extension belongs

        The API supports filtering by various parameters, such as extension number, phone number, and location name. The results can be paginated using the `max` and `start` parameters, and the order of the results can be specified using the `order` parameter.


        Retrieving a Virtual Extension requires a full or read-only administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - 'Features: Virtual Extensions'
      parameters:
      - name: orgId
        in: query
        description: Unique identifier for the organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: max
        in: query
        description: Limit the number of virtual extensions returned to this maximum count. Default is 10.
        example: '10'
        schema:
          type: number
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching virtual extensions. Default is 0.
        example: '0'
        schema:
          type: number
      - name: order
        in: query
        description: Order the list of virtual extensions in ascending or descending order. Default is ascending.
        example: ASC
        schema:
          type: string
      - name: extension
        in: query
        description: Filter the list of virtual extensions by extension number.
        example: '5001'
        schema:
          type: string
      - name: phoneNumber
        in: query
        description: Filter the list of virtual extensions by phone number.
        example: '+17011558169'
        schema:
          type: string
      - name: name
        in: query
        description: Filter the list of virtual extensions by name. This can be either first name or last name.
        example: John
        schema:
          type: string
      - name: locationName
        in: query
        description: Filter the list of virtual extensions by location name.(Only one of the locationName, locationId, and OrgLevelOnly query parameters is allowed at the same time.)
        example: Test1
        schema:
          type: string
      - name: locationId
        in: query
        description: Filter the list of virtual extensions by location ID.
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2E4Mjg5NzIyLTFiODAtNDFiNy05Njc4LTBlNzdhZThjMTA5OA
        schema:
          type: string
      - name: orgLevelOnly
        in: query
        description: Filter the list of virtual extensions by organization level. If orgLevelOnly is true, return only the organization level virtual extensions.
        example: 'true'
        schema:
          type: boolean
      x-operation-id-source: normalized
      x-operation-id-original: Read the List of Virtual Extensions
