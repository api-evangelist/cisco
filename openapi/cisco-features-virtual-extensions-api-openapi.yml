      summary: Validate the prefix and extension pattern for a Virtual Extension Range
      operationId: ValidateThePrefixAndExtensionPatternForAVirtualExtensionRange
      description: 'Validate the prefix and extension pattern for a Virtual Extension Range.


        Virtual extension ranges integrate remote workers on a separate telephony system into Webex Calling and enable extension dialing. Using these ranges, you can define patterns that can be used to route calls at a location level or an organization level. You are allowed to define virtual extensions ranges in addition to individual virtual extensions.

        This works in both Standard and Enhanced modes


        Validating a prefix and extension pattern for a Virtual Extension Range requires a full administrator or location administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - 'Features: Virtual Extensions'
      parameters:
      - name: orgId
        in: query
        description: Unique identifier for the organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              locationId: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2E4Mjg5NzIyLTFiODAtNDFiNy05Njc4LTBlNzdhZThjMTA5OA
              name: SalesVirtualExtensionRange
              prefix: '+14089'
              patterns:
              - 12XXXX
              rangeId: Y2lzY29zcGFyazovL3VzL1ZJUlRVQUxfRVhURU5TSU9OLzZkNmYwNmVlLTdkNDEtNDQ4Yy05MjgwLWZkM2ZiMDhmOGUyMA
            schema:
              $ref: '#/components/schemas/ValidateVirtualExtensionRangeRequestObject'
      x-operation-id-source: normalized
      x-operation-id-original: Validate the prefix and extension pattern for a Virtual Extension Range
components:
  schemas:
    PostVirtualExtensionRangeObject:
      type: object
      required:
      - name
      - prefix
      properties:
        name:
          type: string
          example: SalesVirtualExtensionRange
          description: Name of the virtual extension range. This is a unique name for the virtual extension range.
        prefix:
          type: string
          example: '+1234'
          description: Prefix used for a virtual extension range. Prefix works in Standard and Enhanced modes. In Standard mode, it must be E.164 and unique. In Enhanced mode, it can be E.164 or non-E.164.
        patterns:
          type: array
          items:
            type: string
          description: List of virtual extension patterns. You can add up to 100 patterns at a time. Extension patterns can include one or more right-justified wildcards “X” matching any digit.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2E4Mjg5NzIyLTFiODAtNDFiNy05Njc4LTBlNzdhZThjMTA5OA
          description: ID of the location to which the virtual extension range is assigned. The location ID is a unique identifier for the location in Webex Calling. This is set only when location level virtual extension range is added.
    GetVirtualExtensionSettingsObject:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - STANDARD
          description: "Mode of the virtual extension. It can be either `STANDARD` or `ENHANCED`.\n\n    + `STANDARD` -  Standard virtual extension mode in which virtual extensions must be associated with a valid E.164 number, but this requires no enhanced signaling support from the PSTN provider.\n    + `ENHANCED` - Enhanced signaling mode: only a few PSTN providers support this special network signaling extension."
    VirtualExtensionPatchRequestObject:
      type: object
      properties:
        firstName:
          type: string
          example: John
          description: First name of the person at the virtual extension.
        lastName:
          type: string
