        description: The ID of a user, workspace, or virtual line for which there is a secondary line on a device owned by the user invoking the API.
        example: Y2lzY29z...
        schema:
          type: string
      x-operation-id-source: normalized
      x-operation-id-original: Resume
components:
  schemas:
    ConferenceTypeEnum:
      type: string
      enum:
      - bargeIn
      - silentMonitoring
      - coaching
    ConferenceParticipant:
      type: object
      required:
      - callId
      - muted
      - deafened
      properties:
        callId:
          type: string
          example: Y2lzY29z...
          description: The callId of the call.
        muted:
          type: boolean
          example: true
          description: Indicates if the participant has been muted.
        deafened:
          type: boolean
          example: true
          description: Indicates if the participant has been deafened (i.e. media stream is not being transmitting to the participant)
    ConferenceDetails:
      type: object
      required:
      - state
      - created
      - muted
      properties:
        state:
          $ref: '#/components/schemas/ConferenceStateEnum'
          description: The state of the conference.
        appearance:
          type: number
          example: 2
          description: The appearance index for the conference leg. Only present when the conference has an appearance value assigned.
        created:
          type: string
          example: '2023-03-02T15:00:00.000Z'
          description: 'The conference start time in ISO 8601 format. '
        muted:
          type: boolean
          description: Indicates if the host of the conference has been muted.
        type:
          $ref: '#/components/schemas/ConferenceTypeEnum'
          description: The type of conference for a non-standard conference.
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ConferenceParticipant'
          description: The participants in the conference.
    ConferenceStateEnum:
      type: string
      enum:
      - connected
      - held
      - disconnected
      description: " * `connected` - The controller is an active participant.\n * `held` - The controller has held the conference and so is no longer an active participant.\n * `disconnected` - The conference has been released.\n"
  securitySchemes:
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearerAuth:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
