      summary: Mute
      operationId: Mute
      description: Mutes the host or a participant. Mutes the host when no request body is provided (i.e. media stream from the host will not be transmitted to the conference). Mutes a participant when the request body contains the participant's call ID (i.e. media stream from the participant will not be transmitted to the conference).
      tags:
      - Conference Controls
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              callId: Y2lzY29z...
            schema:
              type: object
              properties:
                callId:
                  type: string
                  example: Y2lzY29z...
                  description: The call identifier of the participant to mute. The conference host is muted when this attribute is not provided.
