    ExecutiveCallFilteringPatch:
      type: object
      description: Executive call filtering settings request object for updating the filter configuration and criteria activation.
      properties:
        enabled:
          type: boolean
          description: Set to `true` to enable executive call filtering or `false` to disable it.
        filterType:
          type: string
          enum:
          - CUSTOM_CALL_FILTERS
          - ALL_CALLS
          - ALL_INTERNAL_CALLS
          - ALL_EXTERNAL_CALLS
          description: " * `CUSTOM_CALL_FILTERS` - Choose this option to ensure that only specific calls are sent to the executive assistant.\n * `ALL_CALLS` - Choose this option to send both internal and external calls to the executive assistant.\n * `ALL_INTERNAL_CALLS` - Choose this option to send all internal calls to the executive assistant.\n * `ALL_EXTERNAL_CALLS` - Choose this option to send all external calls to the executive assistant.\n"
        criteriaActivation:
          type: array
          description: The list of criteria activation settings to update for executive call filtering.
          items:
            type: object
            required:
            - id
            - activationEnabled
            description: The activation configuration for an individual filter criterion.
            properties:
              id:
                type: string
                description: Unique identifier for the filter criteria.
              activationEnabled:
                type: boolean
                description: Controls whether this filter criteria is active. When `true`, the criteria is evaluated for incoming calls. When `false`, the criteria is completely ignored and has no effect on call filtering.
    UserOutgoingPermissionDigitPatternPatchObject:
      type: object
      properties:
        name:
          type: string
          example: DigitPattern1
          description: A unique name for the digit pattern.
        pattern:
          type: string
          example: 1XXX
          description: The digit pattern to be matched with the input number.
        action:
          type: string
          enum:
          - ALLOW
          - BLOCK
          - AUTH_CODE
          - TRANSFER_NUMBER_1
          - TRANSFER_NUMBER_2
          - TRANSFER_NUMBER_3
          description: "Action to be performed on the input number that matches the digit pattern.\n * `ALLOW` - Allow the designated call type.\n * `BLOCK` - Block the designated call type.\n * `AUTH_CODE` - Allow only via Authorization Code.\n * `TRANSFER_NUMBER_1` - Transfer to Auto Transfer Number 1. The answering person can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_2` - Transfer to Auto Transfer Number 2. The answering person can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_3` - Transfer to Auto Transfer Number 3. The answering person can then approve the call and send it through or reject the call.\n"
        transferEnabled:
          type: boolean
          example: true
          description: If `true`, allows transfer and forwarding for the call type.
