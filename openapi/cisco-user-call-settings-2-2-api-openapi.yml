              description: "Type of the number's owner.\n * `PLACE` - Number's owner is a workspace.\n * `PEOPLE` - Number's owner is a person.\n * `VIRTUAL_LINE` - Number's owner is a Virtual Line.\n * `HUNT_GROUP` - Number's owner is a Hunt Group.\n"
