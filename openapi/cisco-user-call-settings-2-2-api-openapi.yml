      summary: List Move Users Jobs
      operationId: listMoveUsersJobs
      description: 'Lists all the Move Users jobs for the given organization in order of most recent job to oldest job irrespective of its status.


        This API requires a full or read-only administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - User Call Settings (2/2)
      parameters:
      - name: orgId
        in: query
        description: Retrieve list of Move Users jobs for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8wMjEyNGVlZi04YWY3LTQ4OWMtODA1Yi0zNjNjYzY0MDE4OTM
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: start
        in: query
        description: Start at the zero-based offset in the list of jobs. Default is 0.
        example: 0
        schema:
          type: number
          minimum: 0
      - name: max
        in: query
        description: Limit the number of jobs returned to this maximum count. Default is 2000.
        example: 2000
        schema:
          type: number
          minimum: 0
