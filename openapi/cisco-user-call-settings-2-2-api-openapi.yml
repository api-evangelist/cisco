      summary: Validate or Initiate Move Users Job
      operationId: validateOrInitiateMoveUsersJob
      description: 'This API allows the user to perform one of the following operations:


        * Setting the `validate` attribute to `true` validates the user move. * Setting the `validate` attribute to `false` performs the user move. Notes:


        * A maximum of `100` users can be moved at a time. * Setting the `validate` attribute to `true` only allowed for calling user. * When a single non calling user is moved, it will be moved synchronously without creating any job. Errors occurring during the initial API request validation are captured directly in the error response, along with the appropriate HTTP status code. Below is a list of possible error `code` values and their associated `message`, which can be found in the `errors` array during initial API request validation, regardless of the `validate` attribute value:


        * BATCH-400 - Attribute ''User ID'' is required. * BATCH-400 - Users list should not be empty. * BATCH-400 - Users should not be empty. * 1026006 - Attribute ''Validate'' is required. * 1026010 - User is not a valid Calling User. * 1026011 - Users list should not be empty. * 1026012 - Users should not be empty. * 1026013 - The source and the target location cannot be the same. * 1026014 - Error occurred while processing the move users request. * 1026015 - Error occurred while moving user number to target location. * 1026016 - User should have either phone number or extension. * 1026017 - Phone number is not in e164 format. * 1026018 - Selected Users list exceeds the maximum limit. * 1026019 - Duplicate entry for user is not allowed. * 1026020 - Validate ''true'' is supported only for single user. * 1026021 - Attribute location id is required for Calling user. * 1026022 - Validate ''true'' is supported for calling users only. * 1026023 - Extension and phone number is supported for calling users only. * 2150012 - User was not found


        When the `validate` attribute is set to true, the API identifies and returns the `errors` and `impacts` associated with the user move in the response. Below is a list of possible error `code` values and their associated `message`, which can be found in the `errors` array, when `validate` attribute is set to be true:


        * 4003 - `User Not Found`


        * 4007 - `User Not Found`


        * 4152 - `Location Not Found`


        * 5620 - `Location Not Found`


        * 4202 - `The extension is not available. It is already assigned to a user : {0}`


        * 8264 - `Routing profile is different with new group: {0}`


        * 19600 - `User has to be within an enterprise to be moved.`


        * 19601 - `User can only be moved to a different group within the same enterprise.`


        * 19602 - `Only regular end user can be moved. Service instance virtual user cannot be moved.`


        * 19603 - `New group already reaches maximum number of user limits.`


        * 19604 - `The {0} number of the user is the same as the calling line ID of the group.`


        * 19605 - `User is assigned services not authorized to the new group: {0}.`


        * 19606 - `User is in an active hoteling/flexible seating association.`


        * 19607 - `User is pilot user of a trunk group.`


        * 19608 - `User is using group level device profiles which is used by other users in current group.'
      tags:
      - User Call Settings (2/2)
      parameters:
      - name: orgId
        in: query
