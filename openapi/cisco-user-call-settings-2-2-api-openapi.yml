components:
  schemas:
    UserModeManagementFeatureObject:
      type: object
      required:
      - id
      - name
      - type
      - modeBasedForwardingEnabled
      - exceptionType
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FVVE9fQVRURU5EQU5ULzA1NTJmNjdiLTU5YTktNDFiYi04NzM2LTFiMDQxZDFkZGQ1ZQ
          description: A unique identifier for the feature.
        name:
          type: string
          example: Test Feature
          description: Unique name for the feature.
        type:
          $ref: '#/components/schemas/ModeManagementFeatureTypeObject'
          description: Defines the scheduling of the operating mode.
        phoneNumber:
          type: string
          example: '+19705550028'
          description: The primary phone number configured for the feature.
        extension:
          type: string
          example: 0028
          description: The extension configured for the feature.
        modeBasedForwardingEnabled:
          type: boolean
          example: true
          description: A flag to indicate whether mode-based call forwarding is enabled for the feature.
        forwardDestination:
          type: string
          example: '+19705550028'
          description: The destination for call forwarding if mode-based call forwarding is enabled.
        currentOperatingModeName:
          type: string
          example: Day Operating Mode
          description: Name of the current operating mode.
        currentOperatingModeId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09QRVJBVElOR19NT0RFLzIxM2I1ZTIwLTljMjAtNDUwNi1iYWE3LTE0OGE0NWQyZWY4OQ
          description: Unique identifier for the current operating mode.
        exceptionType:
          $ref: '#/components/schemas/ExceptionTypeObject'
          description: Defines the exception through which the current operating mode is set as active for the feature.
        location:
          $ref: '#/components/schemas/location'
          description: Location object that has a unique identifier for the location and its name.
    Action:
      type: string
      enum:
      - ADD
      - DELETE
      description: " * `ADD` - Add action.\n * `DELETE` - Delete action.\n"
    ApplicationAvailableSharedLineMemberList:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationAvailableSharedLineMemberItem'
          description: List of members available for shared-line assignment to a Webex Calling Apps.
      description: List of members available for shared-line assignment to a Webex Calling Apps.
    PersonCallForwardAvailableNumberObject:
      type: object
      required:
      - state
      - isMainNumber
      - tollFreeNumber
      - telephonyType
      - isServiceNumber
      properties:
        phoneNumber:
          type: string
          example: '+12056350001'
          description: A unique identifier for the PSTN phone number.
        extension:
          type: string
          example: '1235'
          description: Extension for a PSTN phone number.
        state:
          $ref: '#/components/schemas/STATE'
          description: Phone number's state.
        isMainNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is used as a location CLID.
        tollFreeNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a toll-free number.
        telephonyType:
          $ref: '#/components/schemas/TelephonyType'
          description: The telephony type for the number.
        isServiceNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a service number; otherwise, it is a standard number. Service numbers are high-utilization or high-concurrency PSTN phone numbers that are neither mobile nor toll-free.
        owner:
          type: object
          required:
          - id
          - type
          properties:
            id:
              type: string
              example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9jODhiZGIwNC1jZjU5LTRjMjMtODQ4OC00NTNhOTE3ZDFlMjk
              description: Unique identifier of the owner to which the number is assigned.
            type:
              $ref: '#/components/schemas/NumberOwnerType'
              description: Type of the number's owner.
            firstName:
              type: string
              example: Test
              description: First name of the number's owner. This field will be present only when the owner `type` is `PEOPLE` or `VIRTUAL_LINE`.
            lastName:
              type: string
              example: Person
              description: Last name of the number's owner. This field will be present only when the owner `type` is `PEOPLE` or `VIRTUAL_LINE`.
            displayName:
              type: string
              example: TestWorkSpace
              description: Display name of the number's owner.
    SelectiveAcceptCallGet:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if the Selective Accept feature is enabled.'
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/SelectiveAcceptCallCriteria'
          description: A list of criteria specifying conditions when selective accept is in effect.
    AudioAnnouncementFileObject:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FVVE9fQVRURU5EQU5UL2QzVjBPWFIxWjJkM2FFQm1iR1Y0TWk1amFYTmpieTVqYjIw
          description: A unique identifier for the [announcement](/docs/api/v1/features-announcement-repository). `name`, `mediaFileType`, `level` are mandatory if `id` is not provided for uploading an announcement. If all four fields are provided, file with given `id` is used and other fields are ignored.
        fileName:
          type: string
          example: AUDIO_FILE.wav
          description: Audio announcement file name.
        mediaFileType:
          type: string
          enum:
          - WAV
          description: "Audio announcement file type.\n * `WAV` - WAV File Extension.\n"
        level:
          type: string
          enum:
          - ORGANIZATION
          - LOCATION
          description: "Audio announcement file type location.\n * `ORGANIZATION` - Specifies this audio file is configured across the organization.\n * `LOCATION` - Specifies this audio file is configured across the location.\n"
    JobDetailsResponse:
      type: object
      required:
      - id
      - trackingId
      - sourceUserId
      - sourceCustomerId
      - targetCustomerId
      - instanceId
      - latestExecutionStatus
      - counts
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0pPQl9JRC9mZjBlN2Q2Ni05MDRlLTRkZGItYjJlNS05ZGM0ODk0ZDY5OTk
          description: Unique identifier of the job.
        trackingId:
          type: string
          example: ROUTER_ebb52b5b-d060-4164-9757-48b383423d73
          description: Unique identifier to track the flow of HTTP requests.
        sourceUserId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS85YzJhMDUxMC0wOTUwLTQ1MmYtODFmZi05YTVkMjM2OTJkZTY
          description: Unique identifier to identify which user has run the job.
        sourceCustomerId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8wMjEyNGVlZi04YWY3LTQ4OWMtODA1Yi0zNjNjYzY0MDE4OTM
          description: Unique identifier to identify the customer who has run the job.
        targetCustomerId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8wMjEyNGVlZi04YWY3LTQ4OWMtODA1Yi0zNjNjYzY0MDE4OTM
          description: Unique identifier to identify the customer for which the job was run.
        instanceId:
          type: number
          example: 10
          description: Unique identifier to identify the instance of the job.
        jobExecutionStatus:
          type: array
          items:
            $ref: '#/components/schemas/JobExecutionStatusObject'
          description: Displays the most recent step's execution status. Contains execution statuses of all the steps involved in the execution of the job.
        latestExecutionStatus:
          type: string
          enum:
          - STARTING
          - STARTED
          - COMPLETED
          - FAILED
          - UNKNOWN
          - ABANDONED
          description: "Most recent status of the job at the time of invocation.\n * `STARTING` - Job has started.\n * `STARTED` - Job is in progress.\n * `COMPLETED` - Job has completed.\n * `FAILED` - Job has failed.\n * `UNKNOWN` - Job status is unknown.\n * `ABANDONED` - Job has been abandoned (manually stopped).\n"
        latestExecutionExitCode:
          type: string
          enum:
          - UNKNOWN
          - COMPLETED
          - FAILED
          - STOPPED
          - COMPLETED_WITH_ERRORS
          - COMPLETED_WITH_PENDING_ORDERS
          description: "Most recent exit code of the job at the time of invocation.\n * `UNKNOWN` - Job is in progress.\n * `COMPLETED` - Job has completed successfully.\n * `FAILED` - Job has failed.\n * `STOPPED` - Job has been stopped.\n * `COMPLETED_WITH_ERRORS` - Job has completed with errors.\n * `COMPLETED_WITH_PENDING_ORDERS` - Job has completed with pending number orders.\n"
        counts:
          $ref: '#/components/schemas/CountObject'
          description: Job statistics.
        csvFile:
          type: string
          example: 02124eef-7be6-489c-805b-363cc6401893/cbf865e9-d069-4004-bb57-2a39f5bfb5fe_d1fde6bf944c40ed8ffbab14e6ca6a12
          description: Reference ID for the file that holds the errors and impacts.
        csvFileExpiryTime:
          type: string
          example: '2023-07-12T12:20:33.503Z'
          description: Date and time with seconds, the file expires in UTC format.
        fileFormat:
          type: string
          example: text/csv
          description: Format of the file generated.
    ExecutiveCallFilteringCriteriaGet:
      type: object
      description: Executive call filtering criteria detailed settings response object that contains the schedule, phone numbers, and routing configuration.
      required:
      - id
      - filterName
      - callsFrom
      - filterEnabled
      properties:
        id:
          type: string
          description: Unique identifier for the filter criteria.
        filterName:
          type: string
          description: Name of the criteria.
        scheduleName:
          type: string
          description: Name of the schedule associated with this criteria.
        scheduleType:
          type: string
          enum:
          - holidays
          - businessHours
          description: " * `businessHours` - The schedule type that specifies the business or working hours during the day.\n * `holidays` - The schedule type that specifies the day when your organization is not open.\n"
        scheduleLevel:
          type: string
          enum:
          - PEOPLE
          - GROUP
          description: " * `PEOPLE` - The schedule level that specifies that criteria is of People level.\n * `GROUP` - The schedule level that specifies that criteria is of Group (Location) level.\n"
        callsFrom:
          type: string
          enum:
          - ANY_PHONE_NUMBER
          - SELECT_PHONE_NUMBERS
          - ANY_INTERNAL
          - ANY_EXTERNAL
          description: " * `ANY_PHONE_NUMBER` - The criteria applies to any phone number.\n * `SELECT_PHONE_NUMBERS` - The criteria applies to selected phone numbers.\n * `ANY_INTERNAL` - The criteria applies to any internal number.\n * `ANY_EXTERNAL` - The criteria applies to any external number.\n"
        anonymousCallersEnabled:
          type: boolean
          description: Indicates if the criteria applies to anonymous callers.
        unavailableCallersEnabled:
          type: boolean
          description: Indicates if the criteria applies to unavailable callers.
        phoneNumbers:
          type: array
          description: The list of phone numbers that this filtering criteria applies to, when `callsFrom` is set to `SELECT_PHONE_NUMBERS`.
          items:
            type: string
            description: Phone number that the criteria applies to based on `callsFrom` selection.
        filterEnabled:
          type: boolean
          description: Controls the action when this criteria matches a call. When `true`, matching calls are filtered and will alert the executive's assistants. When `false`, matching calls are not filtered and will not alert the executive's assistants. Criteria with `filterEnabled` as `false` take precedence over other filtering criteria with `filterEnabled` as `true`, allowing exceptions where certain calls are not filtered to the executive's assistants.
        callsToNumbers:
          type: array
          description: List of numbers for the executive that will match the criteria when called. This may include the executive’s primary number and/or extension, as well as secondary (alternate) numbers (and associated extensions). If the list is empty, any number or extension for the executive matches the criteria when called. If the list is not empty, only the specified numbers and their extensions match the criteria.
          items:
            type: object
            description: Executive phone number that will match the criteria when called.
            properties:
              type:
                type: string
                enum:
                - PRIMARY
                - ALTERNATE
                description: " * `PRIMARY` - Number is assigned as primary to executive.\n * `ALTERNATE` - Number is assigned as alternate (secondary) to the executive.\n"
              phoneNumber:
                type: string
                description: The phone number assigned to the executive that will be used to match criteria.
      example:
        id: Y2lzY29zcGFyazovL3VzL0NSSVRFUklBL2RHVnpkRjltYVd4MFpYST0
        filterName: VIP Callers
        scheduleName: Business Hours
        scheduleType: businessHours
        scheduleLevel: PEOPLE
        callsFrom: SELECT_PHONE_NUMBERS
        anonymousCallersEnabled: false
        unavailableCallersEnabled: false
        phoneNumbers:
        - '+14085551234'
        - '+14085551235'
        filterEnabled: true
        callsToNumbers:
        - type: PRIMARY
          phoneNumber: '+14085556789'
    ApplicationAvailableSharedLineMemberItem:
      type: object
      required:
      - id
      - firstName
      - lastName
      - lineType
