      summary: Assign or Unassign numbers to a person
      operationId: assignOrUnassignNumbersToAPerson
      description: 'Assign or unassign alternate phone numbers to a person.


        Each location has a set of phone numbers that can be assigned to people, workspaces, or features. Phone numbers must follow the E.164 format for all countries, except for the United States, which can also follow the National format. Active phone numbers are in service.


        Assigning or unassigning an alternate phone number to a person requires a full administrator or location administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - User Call Settings (2/2)
      parameters:
      - name: personId
        in: path
        description: Unique identitfier of the person.
        required: true
        example: '''Y2lzY29zcGFyazovL3VzL1BFT1BMRS9iNTcwZGY3ZC00MjBkLTQ4NGYtYWE5OS1kMzcxOGZjNDUxZDA='''
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: orgId
        in: query
        description: Organization of the Route Group.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        content:
          application/json:
            example:
              enableDistinctiveRingPattern: true
              phoneNumbers:
              - directNumber: '+12145553567'
                extension: '0007'
                primary: false
                action: ADD
                ringPattern: SHORT_LONG_SHORT
              - directNumber: '+12145553569'
                extension: 0009
                primary: false
                action: DELETE
