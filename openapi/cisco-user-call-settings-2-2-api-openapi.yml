          description: Location object having a unique identifier for the location and its name.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of location.
        esn:
          type: string
          example: '12348080'
          description: Routing prefix + extension of a person or workspace.
      description: Member available for shared-line assignment to a Webex Calling Apps.
    SelectiveAcceptCallCriteria:
      type: object
      required:
      - id
      - scheduleName
      - source
      - acceptEnabled
