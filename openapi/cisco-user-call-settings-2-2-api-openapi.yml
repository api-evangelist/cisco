          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzUyMjNiYmVkLTQyYzktNDU0ZC1hMWYzLTdmYWQ1Y2M3ZTZlMw
          description: User ID associated with the validation response.
        impacts:
          type: array
          items:
            $ref: '#/components/schemas/ErrorOrImpactItem'
          description: List of impacts for the user moves.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorOrImpactItem'
          description: List of errors for the user moves.
    Assistant:
      type: object
      description: Details of an executive assistant.
      example:
        id: Y2lzY29zcGFyazovL3VzL1BFT1BMRS82ZTU1NWNkMC02MzQxLTQyYjgtYTIxYy1lNzVmMjE0NDgyNzU
        firstName: doe
        lastName: John
        phoneNumber: +91-6557765419
        extension: '10079'
        optInEnabled: true
        location:
          name: Bangalore
          id: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzkzMGMzYTNlLTA3Y2EtNDNmOS1iZjE4LTZlZGM2OGE1Y2Y3Yg
      required:
      - id
      - optInEnabled
      - location
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS82ZTU1NWNkMC02MzQxLTQyYjgtYTIxYy1lNzVmMjE0NDgyNzU
          description: Unique identifier of the assistant.
        firstName:
          type: string
          example: doe
          description: Unicode first name of the assistant. Is null if not available or if name is a single '.' or '-'.
        lastName:
          type: string
          example: John
          description: Unicode last name of the assistant. Is null if not available or if name is a single '.' or '-'.
        directNumber:
          type: string
          example: +91-6557765419
          description: Direct number of the assistant.
        extension:
          type: string
          example: '10079'
          description: Extension number of the assistant.
        optInEnabled:
          type: boolean
          example: true
          description: If `true`, the assistant has opted in to handle calls for the executive. If `false`, the assistant has not opted in.
        location:
          $ref: '#/components/schemas/Location'
    ApplicationPutSharedLineMemberList:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationPutSharedLineMemberItem'
          description: List of members to be added or modified for shared-line assignment to a Webex Calling Apps.
      description: List of members to be added or modified for shared-line assignment to a Webex Calling Apps.
    PersonCallInterceptAvailableNumberObject:
      type: object
      required:
      - state
      - isMainNumber
      - tollFreeNumber
      - telephonyType
      - isServiceNumber
      properties:
        phoneNumber:
          type: string
          example: '+12056350001'
          description: A unique identifier for the PSTN phone number.
        extension:
          type: string
          example: '1235'
          description: Extension for a PSTN phone number.
        state:
          $ref: '#/components/schemas/STATE'
          description: Phone number's state.
        isMainNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is used as a location CLID.
        tollFreeNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a toll-free number.
        telephonyType:
          $ref: '#/components/schemas/TelephonyType'
          description: The telephony type for the number.
        isServiceNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a service number; otherwise, it is a standard number. Service numbers are high-utilization or high-concurrency PSTN phone numbers that are neither mobile nor toll-free.
        owner:
          type: object
          required:
          - id
          - type
          properties:
            id:
              type: string
              example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9jODhiZGIwNC1jZjU5LTRjMjMtODQ4OC00NTNhOTE3ZDFlMjk
              description: Unique identifier of the owner to which the number is assigned.
            type:
              $ref: '#/components/schemas/NumberOwnerType'
              description: Type of the number's owner.
            firstName:
              type: string
              example: Test
              description: First name of the number's owner. This field will be present only when the owner `type` is `PEOPLE` or `VIRTUAL_LINE`.
            lastName:
              type: string
              example: Person
              description: Last name of the number's owner. This field will be present only when the owner `type` is `PEOPLE` or `VIRTUAL_LINE`.
            displayName:
              type: string
              example: TestWorkSpace
              description: Display name of the number's owner.
    PutPersonDetailsObject:
      type: object
      properties:
        announcementLanguage:
          type: string
          example: English
          description: Person's phone announcement language.
        timeZone:
          type: string
          example: America/Los_Angeles
          description: Timezone associated with the person for calling configuration. Refer to the Get Country Configuration API to retrieve the list of available timezones for a specific country.
    CountObject:
      type: object
      required:
      - totalMoves
      - moved
      - failed
      - pending
      - skipped
      properties:
        totalMoves:
          type: number
          example: 100
          description: Total number of user moves requested.
        moved:
          type: number
          example: 50
          description: Total number of user moves completed successfully.
        failed:
          type: number
          example: 50
          description: Total number of user moves that were completed with failures.
        pending:
          type: number
          example: 50
          description: Total number of user moves that were pending with number orders.
        skipped:
          type: number
          example: 50
          description: Total number of user moves that were skipped.
    Executive:
      type: object
      description: Details of an executive for whom the assistant can manage calls.
      example:
        id: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8zZWQzNDg0MS0yZTkwLTQ4OGEtYmVmZi1iNTk0OTA1ODFkNWM
        firstName: John
        lastName: Doe
        directNumber: +91-6557765419
        extension: '10079'
        optInEnabled: true
      required:
      - id
      - directNumber
      - extension
      - optInEnabled
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8zZWQzNDg0MS0yZTkwLTQ4OGEtYmVmZi1iNTk0OTA1ODFkNWM
          description: Unique identifier of the executive.
        firstName:
          type: string
          example: John
          description: Unicode first name of the executive. Is null if not available or if the name is a single ‘.’ or ‘-’.
        lastName:
          type: string
          example: Doe
          description: Unicode last name of the executive. Is null if not available or if the name is a single ‘.’ or ‘-’.
        directNumber:
          type: string
          example: '+916557765419'
          description: Direct number of the executive.
        extension:
          type: string
          example: '10079'
          description: Extension number of the executive.
        optInEnabled:
          type: boolean
          example: true
          description: If `true`, the assistant has opted in to handle calls for the executive.
    SelectiveRejectCallCriteriaGet:
      type: object
      required:
      - callsFrom
      - rejectEnabled
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NSSVRFUklBL1oxNzI5NzA4NzUwMTY4MDI
          description: Criteria ID.
        scheduleName:
          type: string
          example: CFS-Criteria-F-2
          description: Name of the schedule to which the criteria is created.
        scheduleType:
          $ref: '#/components/schemas/ScheduleType'
          description: The schedule type.
        scheduleLevel:
          $ref: '#/components/schemas/ScheduleLevel'
          description: The schedule level of the criteria.
        callsFrom:
          $ref: '#/components/schemas/CallsFrom'
          description: Reject calls selection.
        anonymousCallersEnabled:
          type: boolean
          description: Boolean flag indicating if calls from custom numbers, private numbers are enabled.
        unavailableCallersEnabled:
          type: boolean
          description: Boolean flag indicating if calls from custom numbers, unavailable numbers are enabled.
        phoneNumbers:
          type: array
          items:
            type: string
            example: '["+1986751234","+1986751234"]'
          description: List of phone numbers. It does not include extensions. In some regions phone numbers are not returned in E.164 format. This will be supported in a future update.
        rejectEnabled:
          type: boolean
          example: true
          description: Boolean flag to enable/disable rejection.
    SelectiveAcceptCallSettingPatch:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: indicates whether selective accept is enabled or not.
    ExecutiveCallFilteringGet:
      type: object
      description: Executive call filtering settings response object that contains the filter configuration and criteria.
      required:
      - enabled
      - filterType
      properties:
        enabled:
          type: boolean
          description: Indicates whether executive call filtering is enabled.
        filterType:
          type: string
          enum:
          - CUSTOM_CALL_FILTERS
          - ALL_CALLS
          - ALL_INTERNAL_CALLS
          - ALL_EXTERNAL_CALLS
          description: " * `CUSTOM_CALL_FILTERS` - Choose this option to ensure that only specific calls are sent to the executive assistant.\n * `ALL_CALLS` - Choose this option to send both internal and external calls to the executive assistant.\n * `ALL_INTERNAL_CALLS` - Choose this option to send all internal calls to the executive assistant.\n * `ALL_EXTERNAL_CALLS` - Choose this option to send all external calls to the executive assistant.\n"
        criteria:
          type: array
          description: The list of call filtering criteria configured for executive call filtering.
          items:
            type: object
            description: The configuration for an individual call filtering criterion.
            required:
            - id
            - filterName
            - source
            - activationEnabled
            - filterEnabled
            properties:
              id:
                type: string
                description: Unique identifier for the filter criteria.
              filterName:
                type: string
                description: Name of the criteria.
              source:
                type: string
                enum:
                - ANY_PHONE_NUMBER
                - SELECT_PHONE_NUMBERS
                - ANY_INTERNAL
                - ANY_EXTERNAL
                description: " * `ANY_PHONE_NUMBER` - The criteria applies to any phone number.\n * `SELECT_PHONE_NUMBERS` - The criteria applies to selected phone numbers.\n * `ANY_INTERNAL` - The criteria applies to any internal number.\n * `ANY_EXTERNAL` - The criteria applies to any external number.\n"
              activationEnabled:
                type: boolean
                description: Controls whether this filter criteria is active. When `true`, the criteria is evaluated for incoming calls. When `false`, the criteria is completely ignored and has no effect on call filtering.
              filterEnabled:
                type: boolean
                description: Controls the action when this criteria matches a call. When `true`, matching calls are filtered and will alert the executive's assistants. When `false`, matching calls are not filtered and will not alert the executive's assistants. Criteria with `filterEnabled` as `false` take precedence over other filtering criteria with `filterEnabled` as `true`, allowing exceptions where certain calls are not filtered to the executive's assistants.
      example:
        enabled: true
        filterType: CUSTOM_CALL_FILTERS
        criteria:
        - id: Y2lzY29zcGFyazovL3VzL0NSSVRFUklBL1FtVjNORE15TXc9PQ
          filterName: VIP Callers
          source: SELECT_PHONE_NUMBERS
          activationEnabled: true
          filterEnabled: true
    CallsFromSelectiveAccept:
      type: string
      enum:
      - ANY_PHONE_NUMBER
      - SELECT_PHONE_NUMBERS
      description: " * `ANY_PHONE_NUMBER` - Criteria applies for any incoming number.\n * `SELECT_PHONE_NUMBERS` - Criteria applies for selected incoming numbers.\n"
    ExecutiveAlertGet:
      type: object
      required:
      - alertingMode
      - rolloverWaitTimeInSecs
      - clidNameMode
      - clidPhoneNumberMode
      properties:
        alertingMode:
          type: string
          enum:
          - SEQUENTIAL
          - SIMULTANEOUS
          description: " * `SEQUENTIAL` - Alerts assistants one at a time in the defined order.\n * `SIMULTANEOUS` - Alerts all assistants at the same time.\n"
        nextAssistantNumberOfRings:
          type: integer
          description: Number of rings before alerting the next assistant when `alertingMode` is `SEQUENTIAL`.
        rolloverEnabled:
          type: boolean
          description: Controls whether the rollover timer (`rolloverWaitTimeInSecs`) is enabled. When set to `true`, rollover will trigger after the timer expires, even if assistants are still available. When `false`, rollover only occurs when no assistants remain.
        rolloverAction:
          type: string
          enum:
          - VOICE_MESSAGING
          - NO_ANSWER_PROCESSING
          - FORWARD
          description: "Specifies what happens when rollover is triggered.\n * `VOICE_MESSAGING` - The call is sent to the executive's voicemail.\n * `FORWARD` - The call is forwarded to the specified destination (`rolloverForwardToPhoneNumber`).\n * `NO_ANSWER_PROCESSING` - The call is sent to no answer processing which may trigger executive services such as call forwarding or voicemail.\nRollover is always triggered when no assistants remain for a filtered call. If the rollover timer is enabled, rollover can also be triggered when the timer expires, even if assistants are still available."
        rolloverForwardToPhoneNumber:
          type: string
          description: Phone number to forward calls to when rollover action is set to `FORWARD`.
        rolloverWaitTimeInSecs:
          type: integer
          description: Time in seconds to wait before applying the rollover action when `rolloverEnabled` is `true`.
        clidNameMode:
          type: string
          enum:
          - EXECUTIVE_ORIGINATOR
          - ORIGINATOR_EXECUTIVE
          - EXECUTIVE
          - ORIGINATOR
          - CUSTOM
          description: "Controls how Caller ID name is displayed on assistant's phone.\n * `EXECUTIVE_ORIGINATOR` - Display executive name followed by caller name.\n * `ORIGINATOR_EXECUTIVE` - Display caller name followed by executive name.\n * `EXECUTIVE` - Display only executive name.\n * `ORIGINATOR` - Display only caller name.\n * `CUSTOM` - Display a custom name.\n"
        customCLIDName:
          type: string
          description: Custom caller ID name to display when `clidNameMode` is set to `CUSTOM` (deprecated).
        customCLIDNameInUnicode:
          type: string
          description: Unicode Custom caller ID name to display when `clidNameMode` is set to `CUSTOM`.
        clidPhoneNumberMode:
          type: string
          enum:
          - EXECUTIVE
          - ORIGINATOR
          - CUSTOM
          description: "Controls which Caller ID phone number is displayed on assistant's phone.\n * `EXECUTIVE` - Display executive's phone number.\n * `ORIGINATOR` - Display caller's phone number.\n * `CUSTOM` - Display a custom phone number.\n"
        customCLIDPhoneNumber:
          type: string
          description: Custom caller ID phone number to display on assistant's phone when `clidPhoneNumberMode` is set to `CUSTOM`.
      example:
        alertingMode: SEQUENTIAL
        nextAssistantNumberOfRings: 3
        rolloverEnabled: true
        rolloverAction: VOICE_MESSAGING
        rolloverForwardToPhoneNumber: '+14085267209'
        rolloverWaitTimeInSecs: 60
        clidNameMode: EXECUTIVE_ORIGINATOR
        customCLIDName: John Anderson
        customCLIDNameInUnicode: ''
        clidPhoneNumberMode: EXECUTIVE
        customCLIDPhoneNumber: '+14085267208'
    GetSharedLineMemberItem:
      type: object
      required:
      - id
      - port
      - primaryOwner
      - lineType
      - lineWeight
      - hotlineEnabled
      - hotlineDestination
      - allowCallDeclineEnabled
      - memberType
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS85ODhiYTQyOC0zMjMyLTRmNjItYjUyNS1iZDUzZmI4Nzc0MWE
          description: Unique identifier for the member.
        firstName:
          type: string
          example: John
          description: First name of the person or workspace.
        lastName:
          type: string
          example: Doe
          description: Last name of the person or workspace.
        phoneNumber:
          type: string
          example: '2056852221'
          description: Phone number of the person or workspace. Currently, E.164 format is not supported. This will be supported in a future update.
        extension:
          type: string
          example: '1111'
          description: Phone extension of the person or workspace.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of the location.
        esn:
          type: string
          example: '12341111'
          description: Routing prefix plus extension of a person or workspace.
        port:
          type: number
          minimum: 1
          example: 1
          description: Device port number assigned to the person or workspace.
        t38FaxCompressionEnabled `true`:
          type: boolean
          description: T.38 Fax Compression setting. Valid only for ATA Devices. Overrides user-level compression options.
        primaryOwner:
          type: string
          example: 'true'
          description: If `true`, the person or workspace is the owner of the device. Points to the primary line/port of the device.
        lineType:
          $ref: '#/components/schemas/LineType'
          description: Indicates if the line is acting as a primary line or a shared line for this device.
        lineWeight:
          type: number
          minimum: 1
          example: 1
          description: Number of lines that have been configured for the person on the device.
        hostIP:
          type: string
          example: 198.168.0.1
          description: Registration home IP for the line port.
        remoteIP:
          type: string
          example: 198.168.0.2
          description: Registration remote IP for the line port.
        hotlineEnabled:
          type: boolean
          example: true
          description: Configure this line to automatically call a predefined number whenever taken off-hook. Once enabled, the line can only make calls to the predefined number set in `hotlineDestination`.
        hotlineDestination:
          type: string
          example: '1234'
          description: Preconfigured number for the hotline. Required only if `hotlineEnabled` is set to `true`.
        allowCallDeclineEnabled:
          type: boolean
          example: true
          description: Set how a device behaves when a call is declined. When set to `true`, a call decline request is extended to all endpoints on the device. When set to `false`, a call decline request is only declined at the current endpoint.
        lineLabel:
          type: string
          example: share line label
          description: Device line label.
        memberType:
          $ref: '#/components/schemas/UserType'
          description: Indicates if the member is of type `PEOPLE` or `PLACE`.
        location:
          $ref: '#/components/schemas/location'
          description: Location object containing a unique identifier for the location and its name.
