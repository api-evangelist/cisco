            mode:
              type: string
              enum:
              - 'off'
              - 'on'
              - upcoming
              description: The planned maintenance mode for the workspace
            startTime:
              type: string
              example: '2026-10-01T00:00:00.000Z'
              description: The start of the planned maintenance period.
            endTime:
              type: string
              example: '2026-10-02T00:00:00.000Z'
              description: The end of the planned maintenance period.
            message:
              type: string
              description: A custom message describing the planned maintenance.
      example:
        id: Y2lzY29zcGFyazovL3VzL1BMQUNFUy81MTAxQjA3Qi00RjhGLTRFRjctQjU2NS1EQjE5QzdCNzIzRjc
        orgId: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8xZWI2NWZkZi05NjQzLTQxN2YtOTk3NC1hZDcyY2FlMGUxMGY
        locationId: YL34GrT...
        workspaceLocationId: YL34GrT...
        floorId: Y2lzY29z...
        displayName: SFO-12 Capanina
        capacity: 5
        sipAddress: ''
    Device:
      type: object
      required:
      - created
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9ERVZJQ0UvNTEwMUIwN0ItNEY4Ri00RUY3LUI1NjUtREIxOUM3QjcyM0Y3
          description: A unique identifier for the device.
        displayName:
          type: string
          example: SFO12-3-PanHandle
          description: A friendly name for the device.
        placeId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS83MTZlOWQxYy1jYTQ0LTRmZWQtOGZjYS05ZGY0YjRmNDE3ZjU
          description: The `placeId` field has been deprecated. Please use `workspaceId` instead.
        workspaceId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS83MTZlOWQxYy1jYTQ0LTRmZWQtOGZjYS05ZGY0YjRmNDE3ZjU
          description: The workspace associated with the device.
        personId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS83MTZlOWQxYy1jYTQ0LTRmZWQtOGZjYS05ZGY0YjRmNDE3ZjU
          description: The person associated with the device.
        orgId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
          description: The organization associated with the device.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DeviceCapabilities'
          description: The capabilities of the device.
          example:
          - xapi
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/DevicePermissions'
          description: The permissions the user has for this device. For example, `xapi` means this user is entitled to using the `xapi` against this device.
          example:
          - xapi:readonly
          - xapi:all
        connectionStatus:
          $ref: '#/components/schemas/DeviceConnectionStatus'
        product:
          type: string
          example: Cisco Webex DX80
          description: The product name. A display friendly version of the device's `model`.
        type:
          type: string
          example: roomdesk
          description: The product type.
        tags:
          type: array
          items:
            type: string
            example: First Tag, Second Tag
          description: Tags assigned to the device.
          example:
          - First Tag
          - Second Tag
        ip:
          type: string
          example: 100.110.120.130
          description: The current IP address of the device.
        activeInterface:
          $ref: '#/components/schemas/NetworkConnectivityType'
        mac:
          type: string
          example: 11:22:33:44:AA:FF
          description: The unique address for the network adapter.
        primarySipUrl:
          type: string
          example: sample_device@sample_workspacename.orgname.org
          description: The primary SIP address to dial this device.
        sipUrls:
          example:
          - sample_device@sample_workspacename.orgname.org
          - another_device@sample_workspacename.orgname.org
          type: array
          items:
            type: string
            example: sample_device@sample_workspacename.orgname.org, another_device@sample_workspacename.orgname.org
          description: All SIP addresses to dial this device.
        serial:
          type: string
          example: FOC1923NVVN
          description: Serial number for the device.
        software:
          type: string
          example: RoomOS 2018-06-01 608dcdbb6e1
          description: The operating system name data and version tag.
        upgradeChannel:
          type: string
          example: beta
          description: The upgrade channel the device is assigned to.
        created:
          type: string
          example: '2016-04-21T17:00:00.000Z'
          description: The date and time that the device was registered, in ISO8601 format.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
          description: The location associated with the device.
        workspaceLocationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
          description: The workspace location associated with the device. Deprecated, prefer `locationId`.
        errorCodes:
          example:
          - sipprofileregistration
          type: array
          items:
            type: string
            example: sipprofileregistration
          description: Error codes coming from the device.
        firstSeen:
          type: string
          example: '2021-02-24T09:08:38.822Z'
          description: Timestamp of the first time device sent a status post.
        lastSeen:
          type: string
          example: '2023-08-15T14:04:00.444Z'
          description: Timestamp of the last time device sent a status post.
        managedBy:
          $ref: '#/components/schemas/ManagedBy'
        devicePlatform:
          $ref: '#/components/schemas/DevicePlatform'
        plannedMaintenance:
          type: object
          description: The planned maintenance for the device.
          properties:
            mode:
              type: string
              enum:
              - 'off'
              - 'on'
              - upcoming
              description: The planned maintenance mode for the device
    WorkspaceCreationRequest:
      type: object
      required:
      - displayName
      properties:
        displayName:
          type: string
          example: SFO-12 Capanina
          description: A friendly name for the workspace.
        orgId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8xZWI2NWZkZi05NjQzLTQxN2YtOTk3NC1hZDcyY2FlMGUxMGY
          description: '`OrgId` associated with the workspace. Only admin users of another organization (such as partners) may use this parameter.'
        locationId:
          type: string
          example: YL34GrT...
          description: Location associated with the workspace. Must be provided when the `floorId` is set.
        workspaceLocationId:
          type: string
          example: YL34GrT...
          description: Legacy workspace location ID associated with the workspace. Prefer `locationId`.
        floorId:
          type: string
          example: Y2lzY29z...
          description: Floor associated with the workspace.
        capacity:
          type: number
          example: 5
          description: How many people the workspace is suitable for. If set, must be 0 or higher.
        type:
          type: string
          enum:
          - notSet
          - focus
          - huddle
          - meetingRoom
          - open
          - desk
          - other
          description: "The type that best describes the workspace.\n * `notSet` - No workspace type set.\n * `focus` - High concentration.\n * `huddle` - Brainstorm/collaboration.\n * `meetingRoom` - Dedicated meeting space.\n * `open` - Unstructured agile.\n * `desk` - Individual.\n * `other` - Unspecified.\n"
        sipAddress:
          type: string
          description: The `sipAddress` field can only be provided when calling type is `thirdPartySipCalling`.
        calling:
          type: object
          properties:
            type:
              type: string
              enum:
              - freeCalling
              - hybridCalling
              - webexCalling
              - webexEdgeForDevices
              - thirdPartySipCalling
              - none
              description: "The calling type that is supported on the workspace.\n * `freeCalling` - Free Calling (Default).\n * `hybridCalling` - Hybrid Calling.\n * `webexCalling` - Webex Calling.\n * `webexEdgeForDevices` - Webex Edge For Devices.\n * `thirdPartySipCalling` - Third-party SIP URI.\n * `none` - No Calling.\n"
            webexCalling:
              type: object
              properties:
                phoneNumber:
                  type: string
                  example: '+12145654032'
                  description: End user phone number.
                extension:
                  type: string
                  example: '28278'
                  description: End user extension.
                locationId:
                  type: string
                  example: Y2lzY29g4...
                  description: Calling location ID.
                licenses:
                  type: array
                  items:
                    type: string
                    example: Y2lzY29g4...1,Y2lzY29g4...2,Y2lzY29g4...n
                  description: A list of Webex Calling License IDs. If multiple license IDs are provided, the oldest suitable one will be applied.
              description: The `webexCalling` object only applies when calling type is `webexCalling`.
          description: Calling.
        calendar:
          type: object
          properties:
            type:
              type: string
              example: microsoft
            emailAddress:
              type: string
              example: workspace@example.com
              description: Workspace email address. Will not be set when the calendar type is `none`.
            resourceGroupId:
              type: string
              example: Y2lzY29zcGFyazovL3VybjpURUFNOk5vcndheS9SRVNPVVJDRV9HUk9VUC9jOGFiMDJhNC01NjI5LTRiNTctOGUyNy03ZDZkZjJlN2YzNzA=
              description: The `ResourceGroup` ID is associated with the workspace and is only applicable for on-premise MICROSOFT calendar.
          description: Workspace calendar configuration requires a `type` (`microsoft`, `google`, or `none`), an `emailAddress`, and a `resourceGroupId`. The default is `none`.
        notes:
          type: string
          example: this is a note
          description: Notes associated to the workspace.
        hotdeskingStatus:
          type: string
          enum:
          - 'on'
          - 'off'
          description: "Hot desking status of the workspace.\n * `on` - Workspace supports hotdesking.\n * `off` - Workspace does not support hotdesking.\n"
        deviceHostedMeetings:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: Set to `true` to enable or `false` to disable.
            siteUrl:
              type: string
              example: '''example.webex.com'''
              description: The Webex site for device hosting meetings.
          description: To enable device hosted meetings, set a Webex `siteUrl` and the `enabled` flag to `true`.
        supportedDevices:
          type: string
          enum:
          - collaborationDevices
          - phones
          description: "The supported devices for the workspace. Default is `collaborationDevices`.\n * `collaborationDevices` - Workspace supports collaboration devices.\n * `phones` - Workspace supports MPP phones.\n"
        indoorNavigation:
          type: object
          properties:
            url:
              type: string
              description: URL of a map locating the workspace.
          description: Indoor navigation configuration.
    NetworkConnectivityType:
      type: string
      enum:
      - wired
      description: The current network connectivity for the device.
      example: wired
