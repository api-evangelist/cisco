        schema:
          type: string
      - name: start
        in: query
        description: Start at the zero-based offset in the list of jobs. Default is 0.
        example: '0'
        schema:
          type: number
      - name: max
        in: query
        description: Limit the number of jobs returned to this maximum count. Default is 2000.
        example: '100'
