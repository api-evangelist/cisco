components:
  schemas:
    OrgCallNotificationObject:
      type: object
      properties:
        emergencyCallNotificationEnabled:
          type: boolean
          example: true
          description: When true sends an email to the specified email address when a call is made to emergency services.
        allowEmailNotificationAllLocationEnabled:
          type: boolean
          example: true
          description: Send an emergency call notification email for all locations.
        emailAddress:
          type: string
          example: callback@gmail.com
          description: When `emergencyCallNotificationEnabled` is true, the emergency notification email is sent to the specified email address.
    GetWorkspaceCallbackNumberObject:
      type: object
      properties:
        selected:
          $ref: '#/components/schemas/ECBNSelectionType'
          description: Selected number type to configure emergency call back.
        directLineInfo:
          type: object
          properties:
            phoneNumber:
              type: string
              example: '18164196065'
              description: The callback phone number that is associated with the direct line.
            firstName:
              type: string
              example: backUpworkspace
              description: The first name of the user.
            lastName:
              type: string
              example: .
              description: The last name of the user.
            effectiveLevel:
              $ref: '#/components/schemas/ECBNDirectLineEffectiveLevelType'
              description: The source from which the emergency calling line ID (CLID) is selected for an actual emergency call, applying fallback rules as necessary.
            effectiveValue:
              type: string
              example: '18164196065'
              description: The field contains the valid ECBN number at the location level, or the user's main number if valid, defaulting to the location's main number if both are unavailable.
            quality:
              $ref: '#/components/schemas/ECBNQualityType'
              description: Used to represent whether a number is a recommended ECBN.
          description: Data relevant to the ECBN for this user/location/virtual line/hunt group.
        locationECBNInfo:
          type: object
          properties:
            phoneNumber:
              type: string
              example: '18164196065'
              description: The callback phone number that is associated with the location's ECBN configuration.
            lastName:
              type: string
              example: .
              description: The last name of the user or location member.
            effectiveLevel:
              $ref: '#/components/schemas/ECBNDirectLineEffectiveLevelType'
              description: The source from which the emergency calling line ID (CLID) is selected for an actual emergency call, applying fallback rules as necessary.
            effectiveValue:
              type: string
              example: '18164196065'
              description: The field contains the valid ECBN number at the location level, or the user's main number if valid, defaulting to the location's main number if both are unavailable.
            quality:
              $ref: '#/components/schemas/ECBNQualityType'
              description: Used to represent whether a number is a recommended ECBN.
            firstName:
              type: string
              example: backUpworkspace
              description: The first name of the user, location member, or group name.
          description: Data relevant to the user/place/virtual line/hunt group selected for ECBN for this location.
        locationMemberInfo:
          type: object
          properties:
            phoneNumber:
              type: string
              example: '18164196065'
              description: The callback phone number that is associated with member configured for the location ECBN.
            firstName:
              type: string
              example: backUpworkspace
              description: The first name of the user.
            lastName:
              type: string
              example: .
              description: The last name of the user or location member.
            memberId:
              type: string
              example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9QTEFDRS8wY2VlYjFmYy04ZmEyLTQ5OGEtYWM3Ni02N2MyZGQ3MGQ2ZGY=
              description: Member ID of user/place/virtual line/hunt group within the location.
            effectiveLevel:
              $ref: '#/components/schemas/LocationMemberInfoEffectiveLevelType'
              description: The source from which the emergency calling line ID (CLID) is selected for an actual emergency call, applying fallback rules as necessary.
            effectiveValue:
              type: string
              example: '18164196065'
              description: The field contains the valid ECBN number at the location level, or the user's main number if valid, defaulting to the location's main number if both are unavailable.
            quality:
              $ref: '#/components/schemas/ECBNQualityType'
              description: Used to represent whether a number is a recommended ECBN.
            memberType:
              $ref: '#/components/schemas/MemberType'
              description: Type of the member.
          description: Data relevant to the user/place/virtual line/hunt group selected for ECBN.
        defaultInfo:
          type: object
          properties:
            effectiveValue:
              type: string
              example: '18164196068'
              description: The field contains the ECBN number.
            quality:
              $ref: '#/components/schemas/ECBNQualityType'
              description: Used to represent whether a number is a recommended ECBN.
          description: Gives Emergency Callback Number effective value when none of the above is assigned or some other value is set behind the scene.
        elinEnabled:
          type: boolean
          example: false
          description: Indicates whether this workspace is allowed to use an Emergency Location Identification Number (ELIN) for emergency calls made from one of its devices.
    PutLocationCallNotificationObject:
      type: object
      properties:
        emergencyCallNotificationEnabled:
          type: boolean
          example: true
          description: When true sends an email to the specified email address when a call is made from this location to emergency services.
        emailAddress:
          type: string
          example: callback@gmail.com
          description: Sends an email to this email address when a call is made from this location to emergency services and `emergencyCallNotificationEnabled` is true.
    ComplianceStatusResponseRedSkyClientLocation:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2E4Mjg5NzIyLTFiODAtNDFiNy05Njc4LTBlNzdhZThjMTA5OA
          description: Unique identifier for the location.
        name:
          type: string
          example: MainOffice
          description: Name of the location.
    ComplianceStatusLocationStatusObject:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/GetComplianceStatusResponseLocationStateEnum'
          description: Configuration stage that was last completed for the location in the request. The order of precedence is `LOCATION_SETUP`, `ALERTS`, `NETWORK_ELEMENTS`, `ROUTING_ENABLE`.
        count:
          type: number
          example: 2
          description: Total count of the `locations` list.
        locations:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceStatusResponseRedSkyClientLocation'
          description: Object that contains the `id` and the `name` for the location in the request.
    MemberType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      description: " * `PEOPLE` - Indicates the associated member is a person.\n * `PLACE` - Indicates the associated member is a workspace.\n"
    CreateBuildingRequest:
      type: object
      required:
      - alertingEmail
      properties:
        alertingEmail:
          type: string
          example: test@cisco.com
          description: Email that is used to create alerts in RedSky. At least one email is mandatory.
        address:
          $ref: '#/components/schemas/AddressObject'
          description: Contains address information for the building.
    PutWorkspaceECBNObject:
      type: object
      properties:
        selected:
          $ref: '#/components/schemas/CallBackSelectedPatch'
          description: The source from which the emergency calling line ID (CLID) is selected for an actual emergency call.
        locationMemberId:
