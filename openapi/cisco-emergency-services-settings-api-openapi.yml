      summary: Update RedSky Service Settings
      operationId: UpdateRedSkyServiceSettings
      description: 'Update the RedSky service settings.


        The Enhanced Emergency (E911) Service for Webex Calling provides dynamic location support and a network that routes emergency calls to Public Safety Answering Points (PSAP) around the US, its territories, and Canada. E911 services are provided in conjunction with a RedSky account.


        Updating the RedSky service settings requires a full administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - Emergency Services Settings
      parameters:
      - name: orgId
        in: query
        description: Update E911 settings for the organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              enabled: true
              companyId: a5e5808f-34ac-4ed0-b8f3-2416bc4cb785
              secret: qwEr4%2d
              externalTenantEnabled: true
              email: test@cisco.com
              password: Test@123
            schema:
              $ref: '#/components/schemas/RedSkyServiceSettingsObject'
      x-operation-id-source: normalized
      x-operation-id-original: Update RedSky Service Settings
