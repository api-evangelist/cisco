      summary: Login to a RedSky Admin Account
      operationId: LoginToARedSkyAdminAccount
      description: 'Login to Redsky for an existing account admin user to retrieve the `companyId` and verify the status of `externalTenantEnabled`. The password provided will not be stored.


        The enhanced emergency (E911) service for Webex Calling provides an emergency service designed for organizations with a hybrid or nomadic workforce. It provides dynamic location support and a network that routes emergency calls to Public Safety Answering Points (PSAP) around the US, its territories, and Canada.


        Logging in requires a full administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - Emergency Services Settings
      parameters:
      - name: orgId
        in: query
        description: Login to a RedSky account for the organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi84NzU2ZjkwZS1iZDg4LTRhOTQtOGZiZC0wMzM2NzhmMDU5ZjM
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              email: test@cisco.com
              password: Test@123
              redSkyOrgId: 610af8f4-a4ed-4be3-ae6f-efcdcd4895a8
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-operation-id-source: normalized
      x-operation-id-original: Login to a RedSky Admin Account
