      summary: Configure Barge-In Settings
      operationId: configureBargeInSettings
      description: 'Configure person''s Barge-In settings.


        The Barge-In feature enables you to use a Feature Access Code (FAC) to answer a call that was directed to another subscriber, or barge-in on the call if it was already answered. Barge-In can be used across locations.


        This API requires a user auth token with a scope of `spark:telephony_config_write`.'
      tags:
      - Beta Settings Features For Barge-In
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              enabled: true
              toneEnabled: true
            schema:
              $ref: '#/components/schemas/BargeInPut'
components:
  schemas:
    BargeInInfo:
      type: object
      required:
      - enabled
      - toneEnabled
      properties:
        enabled:
          type: boolean
          example: true
          description: Indicates if the Barge In feature is enabled.
        toneEnabled:
          type: boolean
          description: Indicates that a stutter dial tone will be played when a virtual line is barging in on the active call.
    BargeInPut:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
          description: Set to enable or disable the Barge In feature.
        toneEnabled:
          type: boolean
          description: Set to enable or disable a stutter dial tone being played when a virtual line is barging in on the active call.
  securitySchemes:
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearerAuth:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
