      summary: List Locations
      operationId: listLocations
      description: 'List locations for an organization.


        * Use query parameters to filter the result set by location name, ID, or organization.


        * Long result sets will be split into pages.


        * Searching and viewing locations in your organization requires an administrator or location administrator auth token with any of the following scopes: `spark-admin:locations_read`, `spark-admin:people_read` or `spark-admin:device_read`.'
      tags:
      - Locations
      parameters:
      - name: name
        in: query
        description: List locations whose name contains this string (case-insensitive).
        example: Denver
        schema:
          type: string
      - name: id
        in: query
        description: List locations by ID.
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2M5N2VlMDQ5LTM1OWItNGM3OC04NDU0LTA1OGMyZWRlMjU2Mw
        schema:
          type: string
      - name: orgId
        in: query
        description: List locations in this organization. Only admin users of another organization (such as partners) may use this parameter.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: max
        in: query
        description: Limit the maximum number of location in the response.
        example: 100
        schema:
          type: number
          default: 500
    post:
