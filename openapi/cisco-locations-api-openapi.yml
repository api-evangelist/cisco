    PostCommonLocationObject:
      type: object
      required:
      - name
      - timeZone
      - preferredLanguage
      - announcementLanguage
      - address
      properties:
        name:
          type: string
          example: Denver
          description: The name of the location. Supports up to 256 characters, but locations enabled for Webex Calling are limited to 80 characters maximum.
        timeZone:
          type: string
          example: America/Chicago
          description: Time zone associated with this location, refer to this link (https://developer.webex.com/docs/api/guides/webex-for-broadworks-developers-guide#webex-meetings-site-timezone) for format.
        preferredLanguage:
          type: string
          example: en_us
          description: Default email language.
        announcementLanguage:
          type: string
          example: fr_fr
          description: Location's phone announcement language.
        address:
          type: object
          required:
          - address1
          - city
          - state
          - postalCode
          - country
          properties:
            address1:
              type: string
              example: 123 Some St.
              description: Address 1
            address2:
              type: string
              example: Suite 456
              description: Address 2
            city:
              type: string
              example: Supercity
              description: City
            state:
              type: string
              example: Goodstate
              description: State code
            postalCode:
              type: string
              example: '12345'
              description: Postal Code
            country:
              type: string
              example: US
              description: ISO-3166 2-Letter Country Code.
          description: The address of the location.
        latitude:
          type: string
          example: '12.935784'
          description: Latitude
        longitude:
          type: string
          example: '77.697332'
          description: Longitude
        notes:
          type: string
          example: 123 Some St. Denver Location
          description: Notes
    FloorCreationRequest:
      type: object
      required:
      - floorNumber
      properties:
        floorNumber:
          type: number
          example: -1
          description: The floor number.
        displayName:
          type: string
          example: The basement
          description: The floor display name.
    FloorUpdateRequest:
      type: object
      required:
      - floorNumber
      properties:
        floorNumber:
          type: number
          example: 1
          description: The floor number.
        displayName:
          type: string
          example: My custom name
          description: The floor display name.
    FloorCollectionResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Floor'
          description: An array of floor objects.
    Location:
      type: object
      description: Location associated with the hot desking member.
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Unique identifier for the location.
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzJiNDkyZmZkLTRjNGItNGVmNS04YzAzLWE1MDYyYzM4NDA5Mw
        name:
          type: string
          description: Name of the location.
          example: Main Office
