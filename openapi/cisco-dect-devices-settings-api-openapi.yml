      summary: Create a DECT Network
      operationId: CreateADECTNetwork
      description: 'Create a multi-cell DECT network for a given location.


        DECT networks enable wireless communication for DECT devices within a location, allowing multiple base stations to provide coverage across a larger area.


        Creating a DECT network requires a full or location administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - DECT Devices Settings
      parameters:
      - name: locationId
        in: path
        description: Create a DECT network in this location.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0RFQ1RfREVWX05FVC81NmRiMjRkMy03YTdhLTQwYTItOWFjOS1iMjMzMjc3OTIxTrd
        schema:
          type: string
      - name: orgId
        in: query
        description: Create a DECT network in this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: test-dect
              displayName: test-dect
              model: DMS Cisco DBS210
              defaultAccessCodeEnabled: true
              defaultAccessCode: '1551'
            schema:
              $ref: '#/components/schemas/CreateDECTNetwork'
      x-operation-id-source: normalized
      x-operation-id-original: Create a DECT Network
