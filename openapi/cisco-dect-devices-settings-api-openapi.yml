      summary: Update DECT Network Debug Level
      operationId: UpdateDECTNetworkDebugLevel
      description: 'Update the debug level for a DECT network.


        The debug level controls the verbosity of logging for the DECT network. Setting it to `DEBUG` enables detailed diagnostic logging, while `STANDARD` provides normal operational logging.


        This API requires a full or location administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - DECT Devices Settings
      parameters:
      - name: locationId
        in: path
        description: Location containing the DECT network.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2E4Mjg5NzIyLTFiODAtNDFiNy05Njc4LTBlNzdhZThjMTA5OA
        schema:
          type: string
      - name: dectNetworkId
        in: path
        description: Update debug level for the specified DECT network.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0RFQ1RfREVWX05FVC9iNWNhZWVkMi0yYTJlLTQ0NTQtYjU3Yy1jMWFhMTk4MTBiMDk
