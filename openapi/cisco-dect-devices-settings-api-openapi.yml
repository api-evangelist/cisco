          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9jODhiZGIwNC1jZjU5LTRjMjMtODQ4OC00NTNhOTE3ZDFlMlm
          description: ID of the member on line1 of the handset. Members can be PEOPLE or PLACE.
        line2MemberId:
          type: string
