          description: ID of the member on line2 of the handset. Members can be PEOPLE, PLACE, or VIRTUAL_LINE.
        customDisplayName:
          type: string
          example: handsetDisplayName
          description: Custom display name on the handset.
    AvailableMembersResponse:
      type: object
