      summary: Get Phone Numbers for an Organization with Given Criteria
      operationId: GetPhoneNumbersForAnOrganizationWithGivenCriteria
      description: 'List all the phone numbers for the given organization along with the status and owner (if any).


        Numbers can be standard, service, or mobile. Both standard and service numbers are PSTN numbers.

        Service numbers are considered high-utilization or high-concurrency phone numbers and can be assigned to features like auto-attendants, call queues, and hunt groups.

        Phone numbers can be linked to a specific location, be active or inactive, and be assigned or unassigned.

        The owner of a number is the person, workspace, or feature to which the number is assigned.

        Only a person can own a mobile number.


        Retrieving this list requires a full or read-only administrator or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - Numbers
      parameters:
      - name: orgId
        in: query
        description: List numbers for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: locationId
        in: query
        description: Return the list of phone numbers for this location within the given organization. The maximum length is 36.
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1
        schema:
          type: string
      - name: max
        in: query
        description: Limit the number of phone numbers returned to this maximum count. The default is 2000.
        example: 5
        schema:
          type: integer
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching phone numbers. The default is 0.
        example: 0
        schema:
          type: integer
      - name: phoneNumber
        in: query
        description: Search for this `phoneNumber`.
        example: '+12056852221'
        schema:
          type: string
      - name: available
        in: query
        description: Search among the available phone numbers. This parameter cannot be used along with the `numberType` parameter when set to `EXTENSION`.
        example: true
        schema:
          type: boolean
      - name: assigned
        in: query
        description: Return the list of phone numbers that are assigned to an owner when set to `true`. When set to `false`, returns the list of phone numbers that are unassigned. This parameter cannot be used along with the `numberType` parameter when set to `EXTENSION`.
        example: true
        schema:
          type: boolean
      - name: order
        in: query
        description: Sort the list of phone numbers based on the following:`lastName`,`dn`,`extension`. Sorted by number and extension in ascending order.
        example: lastName-asc
        schema:
          type: string
      - name: ownerName
        in: query
        description: Return the list of phone numbers that are owned by the given `ownerName`. Maximum length is 255.
        example: Mark
        schema:
          type: string
      - name: ownerId
        in: query
        description: Returns only the matched number/extension entries assigned to the feature with the specified UUID or `broadsoftId`.
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80M2QzYjY4ZC04MjkwLTRmMzctOTM2NS03MmNhMTcxMzRiODM
        schema:
          type: string
      - name: ownerType
        in: query
        description: 'Returns the list of phone numbers of the given `ownerType`. Possible input values:'
        example: PEOPLE
        schema:
          type: string
          enum:
          - PEOPLE
          - PLACE
          - AUTO_ATTENDANT
          - CALL_QUEUE
          - PAGING_GROUP
          - HUNT_GROUP
          - VOICE_MESSAGING
          - BROADWORKS_ANYWHERE
          - CONTACT_CENTER_LINK
          - ROUTE_LIST
          - VOICEMAIL_GROUP
          - VIRTUAL_LINE
      - name: extension
        in: query
        description: Returns the list of phone numbers with the given extension.
        example: '000'
        schema:
          type: string
      - name: numberType
        in: query
        description: 'Returns the filtered list of phone numbers that contain a given type of number. `numberType` set to `EXTENSION` cannot be used along with the `available`, `assigned`, or `state` query parameters. Possible input values:'
        example: NUMBER
        schema:
          type: string
          enum:
          - NUMBER
          - EXTENSION
      - name: phoneNumberType
        in: query
        description: 'Returns the filtered list of phone numbers of the given `phoneNumberType`. Response excludes any extensions without numbers. Possible input values:'
        example: PRIMARY
        schema:
          type: string
          enum:
          - PRIMARY
          - ALTERNATE
          - FAX
          - DNIS
          - Default
      - name: state
        in: query
        description: 'Returns the list of phone numbers with the matching state. Response excludes any extensions without numbers. Possible input values:'
        example: ACTIVE
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - Default
      - name: details
        in: query
        description: Returns the overall count of the phone numbers along with other details for a given organization.
        example: true
        schema:
          type: boolean
      - name: tollFreeNumbers
        in: query
        description: Returns the list of toll-free phone numbers.
        example: true
        schema:
          type: boolean
      - name: restrictedNonGeoNumbers
        in: query
        description: Returns the list of restricted non-geographical numbers.
        example: true
        schema:
          type: boolean
      - name: includedTelephonyTypes
        in: query
        description: Returns the list of phone numbers that are of given `includedTelephonyTypes`. By default, if this query parameter is not provided, it will list both PSTN and Mobile Numbers. Possible input values are PSTN_NUMBER or MOBILE_NUMBER.
        example: PSTN_NUMBER
        schema:
          type: string
      - name: serviceNumber
        in: query
        description: Returns the list of service phone numbers.
        example: true
        schema:
          type: boolean
      - name: reservedNumber
        in: query
