      summary: List Manage Numbers Job Errors
      operationId: ListManageNumbersJobErrors
      description: 'Lists all error details of Manage Numbers job. This will not list any errors if `exitCode` is `COMPLETED`. If the status is `COMPLETED_WITH_ERRORS` then this lists the cause of failures.


        List of possible Errors:


        + BATCH-1017021 - Failed to move because it is an inactive number.


        + BATCH-1017022 - Failed to move because the source location and target location have different CCP providers.


        + BATCH-1017023 - Failed because it is not an unassigned number.


        + BATCH-1017024 - Failed because it is a main number.


        + BATCH-1017027 - Manage Numbers Move Operation is not supported.


        + BATCH-1017031 - Hydra request is supported only for single number move job.


        This API requires a full or read-only administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - Numbers
      parameters:
      - name: jobId
        in: path
        description: Retrieve the error details for this `jobId`.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0pPQl9JRC84YTI0ZjM5NC1lMTdjLTRiMTYtOTU3Ni0zNzA3YjY5YmU3Mzc
        schema:
          type: string
      - name: orgId
        in: query
        description: Retrieve list of jobs for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85MTE1NDM1Ny1iZWQxLTQ1ZDUtYWE4Zi00ZTUwYzBkZWNmMzM
        schema:
          type: string
      - name: start
        in: query
        description: Specifies the error offset from the first result that you want to fetch.
        example: 0
        schema:
          type: integer
      - name: max
        in: query
        description: Specifies the maximum number of records that you want to fetch.
        example: 100
        schema:
          type: integer
          default: 2000
      x-operation-id-source: normalized
      x-operation-id-original: List Manage Numbers Job errors
components:
  schemas:
    NumberStateOptions:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      description: " * `ACTIVE` - The number is activated and has calling capability.\n * `INACTIVE` - A number is not yet activated and has no calling capability.\n"
    stepExecutionStatusesObject:
      type: object
      required:
      - id
      - lastUpdated
      - statusMessage
      - name
      - timeElapsed
      properties:
        id:
          type: number
          example: 3624681
          description: Unique identifier that identifies each step in a job.
        startTime:
          type: string
          example: '2023-05-30T13:04:00.469Z'
          description: The date and time with seconds, the step execution has started in UTC format.
        endTime:
          type: string
          example: '2023-05-30T13:04:03.245Z'
          description: The date and time with seconds, the step execution has ended in UTC format.
        lastUpdated:
          type: string
          example: '2023-05-30T13:04:03.574Z'
          description: The date and time with seconds, the step has last updated in UTC format.
        statusMessage:
          type: string
          enum:
          - STARTING
          - STARTED
          - COMPLETED
          - FAILED
          - UNKNOWN
          - ABANDONED
          description: "Displays status for a step.\n * `STARTING` - Job has started.\n * `STARTED` - Job is in progress.\n * `COMPLETED` - Job has completed.\n * `FAILED` - Job has failed.\n * `UNKNOWN` - Job status is unknown.\n * `ABANDONED` - Job has been abandoned (manually stopped).\n"
        exitCode:
          type: string
          enum:
          - UNKNOWN
          - COMPLETED
          - FAILED
          - STOPPED
          - COMPLETED_WITH_ERRORS
          - COMPLETED_WITH_PENDING_ORDERS
          description: "Exit Code for a step.\n * `UNKNOWN` - Job is in progress.\n * `COMPLETED` - Job has completed successfully.\n * `FAILED` - Job has failed.\n * `STOPPED` - Job has been stopped.\n * `COMPLETED_WITH_ERRORS` - Job has completed with errors.\n * `COMPLETED_WITH_PENDING_ORDERS` - Job has completed with pending number orders.\n"
        name:
          type: string
          example: moveusersvalidateAndMove
          description: Step name.
        timeElapsed:
          type: string
          example: PT2.752S
          description: Time lapsed in seconds since the job execution started.
    NumberOwnerType:
      type: string
      enum:
      - PLACE
      - PEOPLE
      - VIRTUAL_LINE
      - AUTO_ATTENDANT
      - CALL_QUEUE
      - GROUP_PAGING
      - HUNT_GROUP
      - VOICE_MESSAGING
      - OFFICE_ANYWHERE
      - CONTACT_CENTER_LINK
      - CONTACT_CENTER_ADAPTER
      - ROUTE_LIST
      - VOICEMAIL_GROUP
      - COLLABORATE_BRIDGE
      description: " * `PLACE` - PSTN phone number's owner is a workspace.\n * `PEOPLE` - PSTN phone number's owner is a person.\n * `VIRTUAL_LINE` - PSTN phone number's owner is a Virtual Profile.\n * `AUTO_ATTENDANT` - PSTN phone number's owner is an auto-attendant.\n * `CALL_QUEUE` - PSTN phone number's owner is a call queue.\n * `GROUP_PAGING` - PSTN phone number's owner is a group paging.\n * `HUNT_GROUP` - PSTN phone number's owner is a hunt group.\n * `VOICE_MESSAGING` - PSTN phone number's owner is a voice messaging.\n * `OFFICE_ANYWHERE` - PSTN phone number's owner is a Single Number Reach.\n * `CONTACT_CENTER_LINK` - PSTN phone number's owner is a Contact Center link.\n * `CONTACT_CENTER_ADAPTER` - PSTN phone number's owner is a Contact Center adapter.\n * `ROUTE_LIST` - PSTN phone number's owner is a route list.\n * `VOICEMAIL_GROUP` - PSTN phone number's owner is a voicemail group.\n * `COLLABORATE_BRIDGE` - PSTN phone number's owner is a collaborate bridge.\n"
    MoveNumberValidationError:
      type: object
      properties:
        trackingId:
          type: string
          description: Unique identifier to track the HTTP requests.
        error:
          $ref: '#/components/schemas/ErrorObject'
    ErrorObject:
      type: object
      properties:
        key:
          type: string
          description: HTTP error code.
        message:
          type: array
          items:
            $ref: '#/components/schemas/ErrorMessageObject'
          description: Message string with further error information.
    NumbersPost:
      type: object
      required:
      - phoneNumbers
      properties:
        phoneNumbers:
          type: array
          items:
            type: string
          description: List of phone numbers that need to be added.
        numberType:
          $ref: '#/components/schemas/NumberTypeOptions'
          description: The type of the number. Required for `MOBILE` number type.
        numberUsageType:
          $ref: '#/components/schemas/NumberUsageTypeOptions'
          description: The type of usage expected for the number.
        state:
          $ref: '#/components/schemas/NumberStateOptions'
          description: The state of the number. By default, the state of a number is set to `ACTIVE` for DID and toll-free numbers only. Mobile numbers will be activated upon assignment to a user.
        subscriptionId:
          type: string
          description: The `subscriptionId` to be used for the mobile number order.
        carrierId:
          type: string
          format: uuid
          description: The `carrierId` to be used for the mobile number order.
