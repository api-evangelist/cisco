      summary: Validate Phone Numbers
      operationId: ValidatePhoneNumbers
      description: 'Validate the list of phone numbers in an organization. Each phone number''s availability is indicated in the response.


        Each location has a set of phone numbers that can be assigned to people, workspaces, or features. Phone numbers must follow the E.164 format for all countries, except for the United States, which can also follow the National format. Active phone numbers are in service.


        Validating a phone number in an organization requires a full administrator or location administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - Numbers
      parameters:
      - name: orgId
        in: query
        description: Organization of the Route Group.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              example1:
                value:
                  phoneNumbers:
                  - '+12145557861'
              example2:
                value:
                  phoneNumbers:
                  - '+12145559000'
                  - '+12145553567'
            schema:
              $ref: '#/components/schemas/ValidateNumbersPostRequest'
      x-operation-id-source: normalized
      x-operation-id-original: Validate phone numbers
