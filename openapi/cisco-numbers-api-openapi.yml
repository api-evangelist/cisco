      summary: Manage Number State in a Location
      operationId: ManageNumberStateInALocation
      description: 'Activate or deactivate the specified set of phone numbers in a location for an organization.


        Each location has a set of phone numbers that can be assigned to people, workspaces, or features. Phone numbers must follow the E.164 format.


        Active phone numbers are in service. A mobile number is activated when assigned to a user. This API will not activate or deactivate mobile numbers.


        Managing phone number state in a location requires a full administrator auth token with a scope of `spark-admin:telephony_config_write`.


        This API is only supported for non-integrated PSTN connection types of Local Gateway (LGW) and Non-integrated CCP.'
      tags:
      - Numbers
      parameters:
      - name: locationId
        in: path
        description: '`LocationId` to which numbers should be added.'
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzM2ZTFlM2Y1LWJhODEtNDRiNC05ZGQ1LWIyMmVlNGY1MDIyZA
        schema:
          type: string
      - name: orgId
        in: query
        description: Organization of the Route Group.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              phoneNumbers:
              - '+12145557861'
              - '+12145551321'
              action: DEACTIVATE
            schema:
              $ref: '#/components/schemas/NumbersRequest'
      x-operation-id-source: normalized
      x-operation-id-original: Manage Number State in a location
