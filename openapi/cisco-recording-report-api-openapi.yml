components:
  schemas:
    MeetingRecordingArchivePollAnswerSummary:
      type: object
      properties:
        totalRespondents:
          type: number
          example: 10
          description: The total number of people who selected this answer.
        isCorrect:
          type: boolean
          example: true
          description: Whether the answer is correct.
        text:
          type: string
          example: Yes, I do.
          description: The text of the answer.
        voteUsers:
          type: array
          items:
            $ref: '#/components/schemas/MeetingRecordingArchiveUser'
          description: The voters among users.
    MeetingRecordingArchiveUser:
      type: object
      properties:
        correlationId:
          type: number
          example: 28208023
          description: An internal ID that is associated with each join.
        displayName:
          type: string
          example: John Andersen
          description: Display name for the meeting participant.
        email:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting participant.
    MeetingRecordingArchiveQAAnswer:
      type: object
      properties:
        responseMode:
          type: string
          example: private
          description: The answer's response mode.
        displayName:
          type: string
          example: John Andersen
          description: The name of the person who answered the question.
        correlationId:
          type: number
          example: 10947662
          description: An internal ID that is associated with the answer's each join.
        email:
          type: string
          example: alex.green@example.com
          description: The email of the person who answered the question.
        answerTime:
          type: string
          example: '2021-07-06T09:52:34Z'
          description: The date and time the question answered in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format.
        text:
          type: string
          example: Yes, I am.
          description: The text of the answer.
    MeetingRecordingArchivePollRespondent:
      type: object
      properties:
        correlationId:
          type: number
          example: 28208023
          description: An internal ID that is associated with the respondent's each join.
        displayName:
