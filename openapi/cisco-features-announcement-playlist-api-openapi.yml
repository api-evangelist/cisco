components:
  schemas:
    LocationObject:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1Njc4OTAxMjM0NTY3ODkw
          description: The ID of the location.
        name:
          type: string
          example: San Jose
          description: The name of the location.
    PutPlaylistAssignedLocation:
      type: object
      required:
      - locationIds
      properties:
        locationIds:
          type: array
          items:
            type: string
            example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi81ZTk3MzFlNy1iOWQ0LTRmMWQtYjYyMi05NDgwMDhhMjkzMzM, Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi81ZTk3MzFlNy1iOWQ0LTRmMWQtYjYyMi05NDgwMDhhMjkzMzM
          description: Array of location IDs with which the playlist is associated.
    PlaylistObject:
      type: object
      description: Basic playlist metadata available for announcement selection.
      required:
      - id
      - name
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC9iYzZjOTYwYi01ZDJjLTRiM2QtYjRlZC0wNWY1ZmFhMTJjZjA
          description: A unique identifier for the playlist.
        name:
          type: string
          example: testingAnnouncementPlaylist
          description: Unique name for the playlist.
    PlaylistAssignedLocationResponse:
      type: object
      required:
      - id
      - locations
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC9iYzZjOTYwYi01ZDJjLTRiM2QtYjRlZC0wNWY1ZmFhMTJjZjA
          description: Unique identifier of the playlist.
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationObject'
          description: Array of locations with which the playlist is associated.
    PutAnnouncementPlaylistObject:
      type: object
      properties:
        name:
          type: string
          example: testingHydraAnnouncementPlaylistWithTwoFiles
          description: Unique name for the announcement playlist.
        announcementIds:
          type: array
          items:
            type: string
            example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC8yMTkxMDhmNC1iMGVjLTRkNTMtODMzYy1kNTE1NWE4OWQzZTk,Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC8zY2I2Y2Q1MS02Zjk3LTRiMmYtYTA0Yy04MjRmOGQ2NjQyYTU
          description: Array of `announcementIds` associated with the playlist.
    PostAnnouncementPlaylistObject:
      type: object
      required:
      - name
      - announcementIds
      properties:
        name:
          type: string
          example: testingHydraAnnouncementPlaylistWithTwoFiles
          description: Unique name for the announcement playlist.
        announcementIds:
          type: array
          items:
            type: string
            example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC8yMTkxMDhmNC1iMGVjLTRkNTMtODMzYy1kNTE1NWE4OWQzZTk,Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC8zY2I2Y2Q1MS02Zjk3LTRiMmYtYTA0Yy04MjRmOGQ2NjQyYTU
          description: Array of `announcementIds` associated with the playlist.
    AnnouncementPlaylistGetResponse:
      type: object
      required:
      - id
      - name
      - lastUpdated
      - fileSize
      - fileCount
      - announcements
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC9iYzZjOTYwYi01ZDJjLTRiM2QtYjRlZC0wNWY1ZmFhMTJjZjA
          description: Unique identifier of the playlist.
        name:
          type: string
          example: testingAnnouncementPlaylist
          description: Unique name of the playlist.
        lastUpdated:
          type: string
          example: '2024-03-06T07:06:36.396Z'
          description: Last updated timestamp (in UTC format) of the playlist.
        fileSize:
          type: string
          example: '356'
          description: Size of the files in kilobytes.
        fileCount:
          type: string
          example: '3'
          description: Number of files in the playlist.
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/AnnouncementObject'
          description: List of announcement details associated with playlist.
    AnnouncementPlaylistResponseWithId:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC9jNzAwNmI4ZC1kYmQ3LTQ3YjctOWQ0Ny05ZDJkMWEzYmY1Yzc
          description: Unique identifier of the announcement playlist.
    AnnouncementObject:
      type: object
      required:
      - id
      - name
      - fileSize
      - mediaFileType
      - lastUpdated
      - level
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC8zMjAxNjRmNC1lNWEzLTQxZmYtYTMyNi02N2MwOThlNDFkMWQ
          description: Unique identifier of the announcement.
        name:
          type: string
          example: Public_Announcement
          description: Name of the announcement.
        fileName:
          type: string
          example: Sample_Greetings_file.wav
          description: File name of the uploaded binary announcement greeting.
        fileSize:
          type: string
          example: '356'
          description: Size of the file in kilobytes.
        mediaFileType:
          type: string
          example: WAV
          description: Media file type of the announcement file.
        lastUpdated:
          type: string
          example: '2023-06-13T18:39:53.651Z'
          description: Last updated timestamp (in UTC format) of the announcement.
        level:
          type: string
          enum:
          - ORGANIZATION
          description: The level at which this playlist exists.
  securitySchemes:
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearerAuth:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
