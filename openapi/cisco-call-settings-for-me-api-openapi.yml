        content:
          application/json:
            example:
              enabled: true
              notifications:
                enabled: true
                destination: julie@example.com
                smsDestination: '+12025551212'
              sendAllCalls:
                enabled: true
              sendBusyCalls:
                enabled: false
                greeting: DEFAULT
              sendUnansweredCalls:
                enabled: false
                greeting: CUSTOM
                numberOfRings: 3
              transferToNumber:
                enabled: false
              emailCopyOfMessage:
                enabled: false
                emailId: julie@example.com
            schema:
              $ref: '#/components/schemas/VoicemailPut'
