      - Call Settings For Me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/preferredAnswerEndpoint'
              example:
                id: Y2lzY29z...
                type: DEVICE
                name: Cisco 8865 (Phone in reception area)
