    ServicesEnum:
      type: string
      example: Authentication
      enum:
      - Anonymous Call Rejection
      - Authentication
      - Call Forwarding Always
      - Call Forwarding Busy
      - Call Forwarding No Answer
      - Call Notify
      - Calling Line ID Delivery Blocking
      - Do Not Disturb
      - Intercept User
      - Last Number Redial
      - Priority Alert
      - Call Return
      - Selective Call Acceptance
      - Call Forwarding Selective
      - Selective Call Rejection
      - Simultaneous Ring Personal
      - Voice Messaging User
      - Alternate Numbers
      - Shared Call Appearance 35
      - Speed Dial 100
      - Directed Call Pickup
      - Directed Call Pickup with Barge-in
      - External Calling Line ID Delivery
      - Internal Calling Line ID Delivery
      - Call Waiting
      - Barge-in Exempt
      - Push to Talk
      - Basic Call Logs
      - Hoteling Host
      - Hoteling Guest
      - Multiple Call Arrangement
      - Busy Lamp Field
      - Three-Way Call
      - Call Transfer
      - Privacy
      - Fax Messaging
      - N-Way Call
      - Call Forwarding Not Reachable
      - Connected Line Identification Presentation
      - Connected Line Identification Restriction
      - BroadWorks Anywhere
      - Music On Hold User
      - Call Center Monitoring
      - BroadWorks Mobility
      - Call Recording
      - Executive
      - Client License 17
      - Client License 18
      - Flexible Seating Guest
      - Personal Assistant
      - Sequential Ring
      - Call Block
      description: " * `Anonymous Call Rejection` - When enabled, blocks all incoming calls from unidentified or blocked caller IDs.\n * `Authentication` - Requires the user to enter a password before making a call.\n * `Call Forwarding Always` - Forwards all incoming calls to another number.\n * `Call Forwarding Busy` - Forwards incoming calls to another number when the user is on another call.\n * `Call Forwarding No Answer` - Forwards incoming calls to another number when the user does not answer.\n * `Call Notify` - Notifies the user of incoming calls.\n * `Calling Line ID Delivery Blocking` - Blocks the delivery of the user's caller ID to the recipient.\n * `Do Not Disturb` - Blocks all incoming calls.\n * `Intercept User` - Allows the user to intercept another user's calls.\n * `Last Number Redial` - Redials the last number called.\n * `Priority Alert` - Alerts the user of incoming calls with a distinctive ring.\n * `Call Return` - Returns the last call received.\n * `Selective Call Acceptance` - Accepts only calls from a list of pre-approved numbers.\n * `Call Forwarding Selective` - Forwards calls from a list of pre-approved numbers.\n * `Selective Call Rejection` - Rejects calls from a list of pre-approved numbers.\n * `Simultaneous Ring Personal` - Rings multiple numbers at the same time.\n * `Voice Messaging User` - Allows the user to access voicemail.\n * `Alternate Numbers` - Allows the user to have multiple numbers.\n * `Shared Call Appearance 35` - Allows the user to share a call appearance with another user.\n * `Speed Dial 100` - Allows the user to dial a number by pressing a single key.\n * `Directed Call Pickup` - Allows the user to pick up a call directed to another user.\n * `Directed Call Pickup with Barge-in` - Allows the user to pick up a call directed to another user and join the call.\n * `External Calling Line ID Delivery` - Displays the caller's ID on the user's phone.\n * `Internal Calling Line ID Delivery` - Displays the caller's ID on the user's phone.\n * `Call Waiting` - Alerts the user of incoming calls when they are on another call.\n * `Barge-in Exempt` - Prevents other users from barging in on the user's calls.\n * `Push to Talk` - Allows the user to push a button to talk.\n * `Basic Call Logs` - Logs the user's call history.\n * `Hoteling Host` - Allows the user to host a hoteling session.\n * `Hoteling Guest` - Allows the user to join a hoteling session.\n * `Multiple Call Arrangement` - Allows the user to have multiple calls at the same time.\n * `Busy Lamp Field` - Allows the user to monitor the status of another user's phone.\n * `Three-Way Call` - Allows the user to have a three-way call.\n * `Call Transfer` - Allows the user to transfer a call.\n * `Privacy` - Allows the user to keep their number private.\n * `Fax Messaging` - Allows the user to send and receive faxes.\n * `N-Way Call` - Allows the user to have an N-way call.\n * `Call Forwarding Not Reachable` - Forwards calls when the user is not reachable.\n * `Connected Line Identification Presentation` - Displays the caller's ID on the user's phone.\n * `Connected Line Identification Restriction` - Prevents the caller's ID from being displayed on the user's phone.\n * `BroadWorks Anywhere` - Allows the user to make calls from any phone.\n * `Music On Hold User` - Allows the user to listen to music while on hold.\n * `Call Center Monitoring` - Allows the user to monitor a call center.\n * `BroadWorks Mobility` - Allows the user to use BroadWorks Mobility.\n * `Call Recording` - Allows the user to record calls.\n * `Executive` - Allows the user to have an executive assistant.\n * `Client License 17` - Allows the user to use client license 17.\n * `Client License 18` - Allows the user to use client license 18.\n * `Flexible Seating Guest` - Allows the user to be a flexible seating guest.\n * `Personal Assistant` - Allows the user to have a personal assistant.\n * `Sequential Ring` - Allows the user to have a sequential ring.\n * `Call Block` - Allows the user to block calls.\n"
