                  type: boolean
                  example: true
                  description: '"Always" call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for "Always" call forwarding.
                ringReminderEnabled:
                  type: boolean
                  description: If `true`, a brief tone will be played on the virtual line's phone when a call has been forwarded.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Enables and disables sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
              description: Settings for forwarding all incoming calls to the destination you choose.
            busy:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '"Busy" call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for "Busy" call forwarding.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Enables and disables sending incoming to the destination number's voicemail if the destination is an internal phone number and that number has the voicemail service enabled.
              description: Settings for forwarding all incoming calls to the destination you chose while the phone is in use or the virtual line is busy.
            noAnswer:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '"No Answer" call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for "No Answer" call forwarding.
                numberOfRings:
                  type: number
