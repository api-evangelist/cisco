      summary: Create Single Number Reach For a Person
      operationId: CreateSingleNumberReachForAPerson
      description: 'Create a single number reach for a person in an organization.


        Single number reach allows you to setup your work calls ring any phone number. This means that your office phone, mobile phone, or any other designated devices can ring at the same time, ensuring you don''t miss important calls.


        Creating a single number reach for a person requires a full administrator or location administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - 'Features: Single Number Reach'
      parameters:
      - name: personId
        in: path
        description: Unique identifier for the person.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1BFUlNPTi8wMDAwNWUwMC01M2I0LTQwYzMtYTdhZC01NjUwZmRkZGQ1M2M
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              phoneNumber: '+17011558169'
              enabled: true
              name: myNumber
              doNotForwardCallsEnabled: false
              answerConfirmationEnabled: false
            schema:
              $ref: '#/components/schemas/PostSingleNumberReachObject'
      x-operation-id-source: normalized
      x-operation-id-original: Create Single Number Reach For a Person
