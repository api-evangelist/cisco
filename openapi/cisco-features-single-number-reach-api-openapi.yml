components:
  schemas:
    SingleNumberReachPrimaryAvailableNumberObject:
      type: object
      required:
      - phoneNumber
      - state
      - isMainNumber
      - tollFreeNumber
      - telephonyType
      - isServiceNumber
      properties:
        phoneNumber:
          type: string
          example: '+12056350001'
          description: A unique identifier for the PSTN phone number.
        state:
          $ref: '#/components/schemas/STATE'
          description: Phone number's state.
        isMainNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is used as a location CLID.
        tollFreeNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a toll-free number.
        telephonyType:
          $ref: '#/components/schemas/TelephonyType'
          description: The telephony type for the number.
        isServiceNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a service number; otherwise, it is a standard number. Service numbers are high-utilization or high-concurrency PSTN phone numbers that are neither mobile nor toll-free.
    SingleNumberReachPrimaryAvailableNumberListGetObject:
      type: object
      required:
      - phoneNumbers
      properties:
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/SingleNumberReachPrimaryAvailableNumberObject'
          description: Array of phone numbers.
    SingleNumberReachNumberPatchRequestObject:
      type: object
      required:
      - phoneNumber
      - enabled
      - name
      properties:
        phoneNumber:
          type: string
          example: '+17011558169'
          description: Personal phone number used as single Number Reach.
        enabled:
          type: boolean
          example: true
          description: A flag to enable or disable single Number Reach phone number.
        name:
          type: string
          example: myNumber
          description: Name of the single number reach phone number entry.
        doNotForwardCallsEnabled:
          type: boolean
          description: If enabled, the call forwarding settings of provided phone Number will not be applied.
        answerConfirmationEnabled:
          type: boolean
          description: If enabled, the call recepient will be prompted to press a key before being connected.
    PostSingleNumberReachObject:
      type: object
      required:
      - phoneNumber
      - enabled
      - name
      properties:
        phoneNumber:
          type: string
          example: '+17011558169'
          description: Personal phone number used as single Number Reach.
        enabled:
          type: boolean
          example: true
          description: A flag to enable or disable single Number Reach.
        name:
          type: string
          example: myNumber
          description: Name of the single number reach phone number entry.
        doNotForwardCallsEnabled:
          type: boolean
          description: If enabled, the call forwarding settings of provided phone Number will not be applied.
        answerConfirmationEnabled:
          type: boolean
          description: If enabled, the call recepient will be prompted to press a key before being connected.
    TelephonyType:
      type: string
      enum:
      - PSTN_NUMBER
      description: ' * `PSTN_NUMBER` - The object is a PSTN number.

        '
    GetSingleNumberReachObject:
      type: object
      required:
      - enabled
      - numbers
