      summary: Get Voicemail Settings
      operationId: GetVoicemailSettings
      description: 'Retrieve the organization''s voicemail settings.


        Organizational voicemail settings determines what voicemail features a person can configure and automatic message expiration.


        Retrieving organization''s voicemail settings requires a full, user or read-only administrator or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
