components:
  schemas:
    GetCallCaptionsObject:
      type: object
      required:
      - orgClosedCaptionsEnabled
      - orgTranscriptsEnabled
      properties:
        orgClosedCaptionsEnabled:
          type: boolean
          example: true
          description: Organization-level closed captions are enabled or disabled.
        orgTranscriptsEnabled:
          type: boolean
          example: true
          description: Organization-level transcripts are enabled or disabled.
    UpdateCallCaptionsObject:
      type: object
      properties:
        orgClosedCaptionsEnabled:
          type: boolean
          example: true
          description: Enable or disable organization-level closed captions.
        orgTranscriptsEnabled:
          type: boolean
          example: true
          description: Enable or disable organization-level transcripts.
    OrganizationStatusGetObject:
      type: object
      required:
      - isLargeOrg
      - largeOrgThresholdPercentage
      properties:
        isLargeOrg:
          type: boolean
          example: true
          description: '`true` if the organization is categorized as large organization.'
        largeOrgThresholdPercentage:
          type: integer
          example: 90
          description: The threshold percentage represents the percentage of the threshold reached to categorize an organization as a large organization.
    AudioAnnouncementFileGetObject:
      type: object
      required:
      - id
      - fileName
      - mediaFileType
      - level
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FVVE9fQVRURU5EQU5UL2QzVjBPWFIxWjJkM2FFQm1iR1Y0TWk1amFYTmpieTVqYjIw
          description: A unique identifier for the announcement.
        fileName:
          type: string
          example: AUDIO_FILE.wav
          description: Audio announcement file name.
        mediaFileType:
          type: string
          enum:
          - WAV
          description: "Audio announcement file type.\n * `WAV` - WAV File Extension.\n"
        level:
          type: string
          enum:
          - ORGANIZATION
          - LOCATION
          description: "Audio announcement file type location.\n * `ORGANIZATION` - Specifies this audio file is configured across the organization.\n * `LOCATION` - Specifies this audio file is configured across the location.\n"
    GetVoicemailSettingsObject:
      type: object
      example:
        messageExpiryEnabled: false
        numberOfDaysForMessageExpiry: 10
        strictDeletionEnabled: false
        voiceMessageForwardingEnabled: true
        voicePortalAccessVMDepositEnabled: true
      required:
      - messageExpiryEnabled
      - numberOfDaysForMessageExpiry
      - strictDeletionEnabled
      - voiceMessageForwardingEnabled
      properties:
        messageExpiryEnabled:
          type: boolean
          example: false
          description: When enabled, you can set the deletion conditions for expired messages.
        numberOfDaysForMessageExpiry:
          type: number
          example: 10
          description: Number of days after which messages expire.
        strictDeletionEnabled:
          type: boolean
          example: false
          description: When enabled, all read and unread voicemail messages will be deleted based on the time frame you set. When disabled, all unread voicemail messages will be kept.
        voiceMessageForwardingEnabled:
          type: boolean
          example: true
          description: When enabled, people in the organization can configure the email forwarding of voicemails.
        voicePortalAccessVMDepositEnabled:
          type: boolean
          example: true
          description: This field allows the callers to access the voice portal by pressing the * key during the voicemail deposit or after sending a message.
    GetVoicemailRulesObject:
      type: object
      properties:
        defaultVoicemailPinRules:
          type: object
          properties:
            blockRepeatedPatternsEnabled:
              type: boolean
              example: true
              description: If enabled, the passcode cannot contain repeated patterns. For example, 121212 and 123123.
            blockRepeatedDigits:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: If enabled, checks for sequence of the same digit being repeated.
                max:
                  type: number
                  example: 3
                  description: Maximum number of repeated digit sequence allowed. The minimum value is 1. The maximum value is 6.
              description: Settings to prevent single digits from being repeated in the passcode. For example, with a maximum value of 3, 111222 is allowed but 112222 is not allowed since it contains a repeated digit sequence longer than 3.
            blockContiguousSequences:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: If enabled, passcode should not contain a numerical sequence.
                numberOfAscendingDigits:
                  type: number
                  example: 3
                  description: 'Specifies the maximum length of an ascending numerical sequence allowed. The minimum value is 2. The maximum value is 5. Example: If this value is set to 3, then 123856 is allowed, but 123485 is not allowed (since the ascending sequence 1234 exceeds 3 digits).'
                numberOfDescendingDigits:
                  type: number
                  example: 3
                  description: 'Specifies the maximum length of a descending numerical sequence allowed. The minimum value is 2. The maximum value is 5. Example: If this value is set to 3, then 321856 is allowed, but 432185 is not allowed (since the descending sequence 4321 exceeds 3 digits).'
              description: Settings for not allowing numerical sequence in passcode (for example, 012345 or 987654).
            length:
              type: object
              properties:
                min:
                  type: number
                  example: 6
                  description: The minimum value is 2. The maximum value is 15.
                max:
                  type: number
                  example: 30
                  description: The minimum value is 3. The maximum value is 30.
              description: Length of the passcode.
            defaultVoicemailPinEnabled:
              type: boolean
              example: true
              description: If enabled, the default voicemail passcode can be set.
          description: Default voicemail passcode requirements.
        expirePasscode:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: If enabled, passcode expires after the number of days specified.
            numberOfDays:
              type: number
              example: 180
              description: Number of days for password expiry. The minimum value is 15. The maximum value is 180.
          description: Settings for passcode expiry.
        changePasscode:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: If enabled, set minimum number of days between passcode changes.
            numberOfDays:
              type: number
              example: 180
              description: Number of days between passcode changes. The minimum value is 1. The maximum value is 7.
          description: Settings for passcode changes.
        blockPreviousPasscodes:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: If enabled, set how many of the previous passcodes are not allowed to be re-used.
            numberOfPasscodes:
              type: number
              example: 10
              description: Number of previous passcodes. The minimum value is 1. The maximum value is 10.
          description: Settings for previous passcode usage.
    Language:
      type: object
      required:
      - name
      - code
      properties:
        name:
          type: string
          example: English
          description: Language name.
        code:
          type: string
          example: en_us
          description: Language code.
    GetMusicOnHoldObject:
      type: object
      required:
      - mohEnabled
      - mohLocationEnabled
      - greeting
      properties:
        mohEnabled:
          type: boolean
          example: true
          description: Music on hold enabled or disabled for the workspace.
        mohLocationEnabled:
          type: boolean
          example: true
          description: Music on hold enabled or disabled for the location. The music on hold setting returned in the response is used only when music on hold is enabled at the location level. When `mohLocationEnabled` is false and `mohEnabled` is true, music on hold is disabled for the workspace. When `mohLocationEnabled` is true and `mohEnabled` is false, music on hold is turned off for the workspace. In both cases, music on hold will not be played.
        greeting:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "Greeting type for the workspace.\n * `DEFAULT` - Play music configured at location level.\n * `CUSTOM` - Play previously uploaded custom music when call is placed on hold or parked.\n"
        audioAnnouncementFile:
          $ref: '#/components/schemas/AudioAnnouncementFileGetObject'
          description: Announcement Audio File details when greeting is selected to be `CUSTOM`.
    UpdateMusicOnHoldObject:
      type: object
      properties:
        defaultOrgMoh:
          type: string
          example: '''OPUS'' or ''LEGACY'''
          description: 'Default org level Music on Hold option, can be one of two options: Choose between Opus Number 1 (Music On Hold used in other Cisco products like UCM) and existing legacy Music On Hold.'
    PutVoicemailSettingsObject:
      type: object
      required:
      - messageExpiryEnabled
      - numberOfDaysForMessageExpiry
      properties:
        messageExpiryEnabled:
          type: boolean
          description: Set to `true` to enable voicemail deletion and set the deletion conditions for expired messages.
        numberOfDaysForMessageExpiry:
          type: number
          example: 10
          description: Number of days after which messages expire.
        strictDeletionEnabled:
          type: boolean
          description: Set to `true` to delete all read and unread voicemail messages based on the time frame you set. Set to `false` to keep all the unread voicemail messages.
        voiceMessageForwardingEnabled:
          type: boolean
          example: true
          description: Set to `true` to allow people to configure the email forwarding of voicemails.
        voicePortalAccessVMDepositEnabled:
          type: boolean
          example: true
          description: This field allows the callers to access the voice portal by pressing the * key during the voicemail deposit or after sending a message.
    PutVoicemailRulesObject:
      type: object
      properties:
        defaultVoicemailPinEnabled:
          type: boolean
          description: Set to `true` to enable the default voicemail passcode.
        defaultVoicemailPin:
          type: string
          example: '147852'
          description: Default voicemail passcode.
        expirePasscode:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: Set to `true` to expire passcode after the number of days specified.
            numberOfDays:
              type: number
              example: 180
              description: Number of days for password expiry. The minimum value is 15. The maximum value is 100.
          description: Settings for passcode expiry.
        changePasscode:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: Set to `true` to change the minimum number of days between passcode changes.
            numberOfDays:
              type: number
              example: 180
              description: Number of days between passcode changes. The minimum value is 1. The maximum value is 7.
          description: Settings for passcode changes.
        blockPreviousPasscodes:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: Set to `true` to specify how many of the previous passcode are not allowed to be re-used.
            numberOfPasscodes:
              type: number
              example: 10
              description: Number of previous passcodes. The minimum value is 1. The maximum value is 10.
          description: Settings for previous passcode usage.
  securitySchemes:
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearerAuth:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
