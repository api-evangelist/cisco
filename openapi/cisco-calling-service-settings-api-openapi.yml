      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required:
                - languages
                properties:
                  languages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Language'
                    description: Array of Languages.
              example:
                languages:
                - name: English
                  code: en_us
