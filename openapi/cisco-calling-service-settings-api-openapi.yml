      - Calling Service Settings
      parameters:
      - name: orgId
        in: query
        description: Retrieve voicemail settings for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
