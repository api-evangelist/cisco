      summary: Read the List of Announcement Languages
      operationId: ReadTheListOfAnnouncementLanguages
      description: 'List all languages supported by Webex Calling for announcements and voice prompts.


        Retrieving announcement languages requires a full or read-only administrator or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - Calling Service Settings
      parameters:
      - name: ttsLanguage
        in: query
        description: Filter languages by TTS support.
        required: false
        schema:
          type: boolean
