      summary: Modify Monitoring Settings for a Person
      operationId: modifyMonitoringSettingsPerson
      description: 'Modifies the monitoring settings of the person.

        Monitors the line status of specified people, places, virtual lines or call park extension. The line status indicates if a person, place or virtual line is on a call and if a call has been parked on that extension. Maximum 50 monitored elements.


        This API requires a full or user administrator or location administrator auth token with the `spark-admin:people_write` scope.'
      tags:
      - Person Call Settings
      parameters:
      - name: personId
        in: path
        description: Unique identifier for the person.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8xMWEzZjk5MC1hNjg5LTQ3N2QtYmU2Yi03MTIwMDI1ZDhhYmI
        schema:
          type: string
      - name: orgId
        in: query
        description: ID of the organization in which the person resides. Only admin users of another organization (such as partners) may use this parameter, as the default is the same organization as the token used to access the API.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              enableCallParkNotification: true
              monitoredElements:
              - id: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8xYjhkYjA4YS0wY2JlLTRlZDctOThmMy05ZThlZjBhOGI2N2E
                type: MEMBER
              - id: Y2lzY29zcGFyazovL3VzL0NBTExfUEFSS19FWFRFTlNJT04vZmJjNzlkNzAtMjM5Zi00YjIyLWE2YTAtZjAwNWFmOGNlMjA0
                type: CALL_PARK_EXTENSION
              - id: Y2lzY29zcGFyazovL3VzL0NBTExfUEFSS19FWFRFTlNJT04vZmJjNzlkNzAtMjM5Zi00YjIyLWE2YTAtZjAwNWFmOGNlMjA0
                type: SPEED_DIAL
              - lineKeyLabel: Sr Manager
                phoneNumber: '+19075552859'
            schema:
              $ref: '#/components/schemas/UserMonitoringPatch'
components:
  schemas:
    PeopleOrPlaceOrVirtualLineType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      - VIRTUAL_LINE
      description: " * `PEOPLE` - Person or list of people.\n * `PLACE` - Workspace that is not assigned to a specific person such as for a shared device in a common area.\n * `VIRTUAL_LINE` - Virtual line or list of virtual lines.\n"
    MonitoringSettingsGet:
      type: object
      description: Monitoring settings for a person including available entries count.
      required:
      - callParkNotificationEnabled
      - availableEntriesCount
      - monitoredElements
      properties:
        callParkNotificationEnabled:
          type: boolean
          example: true
          description: Indicates whether call park notification is enabled.
        availableEntriesCount:
          type: integer
          example: 5
          description: Indicates additional number of entries that can be stored (more than the number of entries listed).
        monitoredElements:
          type: array
          items:
            $ref: '#/components/schemas/GetMonitoredElementsObject'
          description: Settings of monitored elements, which can be a person, place, virtual line, or call park extension.
    GetMonitoredElementsObject:
      type: object
      description: Monitored element details, which can be a member, call park extension, or speed dial.
      properties:
        member:
          type: object
          description: Monitored person, workspace, or virtual line.
          required:
          - id
          - numbers
          - location
          - locationId
          properties:
            id:
              type: string
              example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS85OWNlZjRmYS03YTM5LTQ1ZDItOTNmNi1jNjA5YTRiMjgzODY
              description: The identifier of the monitored person, workspace, or virtual line.
            lastName:
              type: string
              example: Nelson
              description: Last name of the monitored member (Virtual Line or User). For Workspace, this field is not applicable.
            firstName:
              type: string
              example: John
              description: First name of the monitored member (Virtual Line or User). For Workspace, this field is not applicable.
            displayName:
              type: string
              example: John Nelson
              description: The display name of the monitored person, workspace, or virtual line.
            lineKeyLabel:
              type: string
              example: Manager
              description: This is a custom line key label configured for the Member.
            type:
              $ref: '#/components/schemas/PeopleOrPlaceOrVirtualLineType'
              description: Indicates whether the monitored element is a person, workspace, or virtual line.
            email:
              type: string
              example: john.nelson@gmail.com
              description: The email address of the monitored person.
            numbers:
              type: array
              items:
                $ref: '#/components/schemas/MonitoredNumberObject'
              description: The list of phone numbers containing only the primary number for the monitored person, workspace or virtual line.
            location:
              type: string
              example: Dallas
              description: The name of the location where the monitored person, workspace, or virtual line is situated.
            locationId:
              type: string
              example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzZhZjk4ZGViLWVlZGItNGFmYi1hMDAzLTEzNzgyYjdjODAxYw
              description: The ID of the location.
        callparkextension:
          type: object
          description: Monitored call park extension.
          required:
          - id
          - location
          - locationId
          properties:
            id:
              type: string
              example: Y2lzY29zcGFyazovL3VzL0NBTExfUEFSS19FWFRFTlNJT04vZTdlZDdiMDEtN2E4Ni00NDEwLWFlODMtOWJmODMzZGEzNzQy
              description: The identifier of the call park extension.
            name:
              type: string
              example: Dallas-Test
              description: The name used to describe the call park extension.
            lineKeyLabel:
              type: string
              example: Manager
              description: This is a custom line key label configured for the Call Park Extension.
            extension:
              type: string
              example: '4001'
              description: The extension number for the call park extension.
            routingPrefix:
              type: string
              example: '1234'
              description: Routing prefix of the location.
            esn:
              type: string
              example: '12344001'
              description: Routing prefix plus extension of the Call Park Extension. If routing prefix is not configured for the location, esn will be same as extension.
            location:
              type: string
              example: Dallas
              description: The location name where the call park extension is.
            locationId:
              type: string
              example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzZhZjk4ZGViLWVlZGItNGFmYi1hMDAzLTEzNzgyYjdjODAxYw
              description: The ID of the location.
        speedDial:
          $ref: '#/components/schemas/MonitoredElementSpeedDial'
          description: Speed dial configured as a monitored element.
    MonitoredElementSpeedDial:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80NDVkMzMzMC1mNjE3LTExZWItOWQyZS01NzViODE3ZGE2NmE
          description: The identifier of the speed dial.
        displayName:
          type: string
          example: John Brown
          description: The display name of the speed dial.
        type:
          type: string
          enum:
          - PEOPLE
          - PLACE
          - VIRTUAL_LINE
          description: "The type of the speed dial.\n * `PEOPLE` - Object is a user.\n * `PLACE` - Object is a workspace.\n * `VIRTUAL_LINE` - Object is a virtual line.\n"
        lineKeyLabel:
          type: string
          example: Manager
          description: Customizable line key label for speed dial.
        phoneNumber:
          type: string
          example: '+19075552859'
          description: The phone number of the speed dial.
        location:
          type: string
          example: Richardson
          description: The location name where the speed dial is.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1
          description: The ID for the location.
    MonitoredNumberObject:
      type: object
      description: Phone number details of a monitored person, workspace, or virtual line.
      properties:
        external:
          type: string
          example: '+19845551088'
          description: External phone number of the monitored person, workspace or virtual line.
        extension:
          type: string
          example: '1088'
          description: Extension number of the monitored person, workspace or virtual line.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of location.
        esn:
          type: string
          example: '12341088'
          description: Routing prefix + extension of a person or workspace.
        primary:
          type: boolean
          example: true
          description: Indicates whether phone number is a primary number.
    UserMonitoringPatch:
      type: object
      properties:
        enableCallParkNotification:
          type: boolean
          example: true
          description: Call park notification is enabled or disabled.
        monitoredElements:
          type: array
          maxItems: 50
          items:
            type: string
          description: Array of ID strings of monitored elements. Maximum 50 elements.
  securitySchemes:
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearerAuth:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
