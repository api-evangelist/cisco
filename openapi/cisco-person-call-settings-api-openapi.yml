      summary: Retrieve a Person's Monitoring Settings
      operationId: getMonitoringSettingsPerson
      description: 'Retrieve the monitoring settings for a person, which show specified people, places, virtual lines, or call park extensions that are being monitored.

        Monitors the line status, indicating if a person, place, or virtual line is on a call and if a call has been parked on that extension.


        This API requires a full, user, or read-only administrator or location administrator auth token with a scope of `spark-admin:people_read`.'
      tags:
      - Person Call Settings
      parameters:
      - name: personId
        in: path
        description: Unique identifier for the person.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8xMWEzZjk5MC1hNjg5LTQ3N2QtYmU2Yi03MTIwMDI1ZDhhYmI
        schema:
          type: string
      - name: orgId
        in: query
        description: ID of the organization in which the person resides. Only admin users of another organization (such as partners) may use this parameter, as the default is the same organization as the token used to access the API.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
    put:
