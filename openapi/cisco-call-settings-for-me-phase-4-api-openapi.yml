        ringEnabled:
          type: boolean
          example: true
          description: When set to `true` simultaneous ringing is enabled for calls that meet this criteria. Criteria with `ringEnabled` set to `false` take priority.
    SimultaneousRingNumberPut:
      type: object
      properties:
        phoneNumber:
          type: string
          example: '+19075552859'
          description: Phone number set for simultaneous ring.
        answerConfirmationEnabled:
