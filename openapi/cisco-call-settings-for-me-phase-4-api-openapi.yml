components:
  schemas:
    SimultaneousRingPut:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
          description: Simultaneous Ring is enabled or not.
        doNotRingIfOnCallEnabled:
          type: boolean
          example: true
          description: When set to `true`, the configured phone numbers won't ring when you are on a call.
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/SimultaneousRingNumberPut'
          description: Enter up to 10 phone numbers to ring simultaneously when you receive an incoming call.
          example:
          - phoneNumber: '+19075552859'
            answerConfirmationEnabled: true
        criteriasEnabled:
          type: boolean
          example: true
          description: Controls whether the criteria for simultaneous ring are enabled.
    CallsFromType:
      type: string
      enum:
      - ANY_PHONE_NUMBER
      - SELECT_PHONE_NUMBERS
      description: " * `ANY_PHONE_NUMBER` - The Schedule applies to any phone number.\n * `SELECT_PHONE_NUMBERS` - Indicates the schedule applies to select phone number defined in the `phoneNumbers` property.\n"
    SimultaneousRingCriteriaGet:
      type: object
      required:
      - id
      - callsFrom
      - anonymousCallersEnabled
      - unavailableCallersEnabled
      - ringEnabled
      example:
        id: Y2lzY29zcGFyazovL3VzL0NSSVRFUklBLzg2NTAxZDFlLTg1MWMtNDgwYi1hZmE2LTA5MTU4NzQ3NzdmZQ
        scheduleName: Business Vacation
        scheduleType: holidays
        scheduleLevel: LOCATION
        callsFrom: SELECT_PHONE_NUMBERS
        anonymousCallersEnabled: true
        unavailableCallersEnabled: true
        phoneNumbers:
        - '+19075552859'
        - '+19186663950'
        ringEnabled: true
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NSSVRFUklBLzg2NTAxZDFlLTg1MWMtNDgwYi1hZmE2LTA5MTU4NzQ3NzdmZQ
          description: Unique identifier for criteria.
        scheduleName:
          type: string
          example: Business Vacation
          description: Name of the schedule which determines when the simultaneous ring is in effect.
        scheduleType:
          $ref: '#/components/schemas/ScheduleType'
        scheduleLevel:
          $ref: '#/components/schemas/ScheduleLevel'
        callsFrom:
          $ref: '#/components/schemas/CallsFromType'
        anonymousCallersEnabled:
          type: boolean
          example: true
          description: When `true`, the criteria applies to calls from anonymous callers.
        unavailableCallersEnabled:
          type: boolean
          example: true
          description: When `true`, the criteria applies to calls from unavailable callers.
        phoneNumbers:
          type: array
          items:
            type: string
            example: '+19075552859'
          description: The list of phone numbers that will checked against incoming calls for a match.
          example:
          - '+19075552859'
          - '+19186663950'
        ringEnabled:
          type: boolean
          example: true
          description: When set to `true` simultaneous ringing is enabled for calls that meet this criteria. Criteria with `ringEnabled` set to `false` take priority.
    ScheduleType:
      type: string
      enum:
      - businessHours
      - holidays
      description: " * `businessHours` - The schedule type that specifies the business or working hours during the day.\n * `holidays` - The schedule type that specifies the day when your organization is not open.\n"
    GuestCallingNumbersGet:
      type: object
      required:
      - phoneNumbers
      example:
        phoneNumbers:
        - phoneNumber: '+12065551212'
          state: ACTIVE
          isMainNumber: false
        - phoneNumber: '+12065551213'
          state: INACTIVE
          isMainNumber: true
      properties:
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/GuestCallingNumber'
          description: List of phone numbers available for guest calling.
          example:
          - phoneNumber: '+12065551212'
            state: ACTIVE
            isMainNumber: false
    GuestCallingNumber:
      type: object
      required:
      - phoneNumber
      - state
      - isMainNumber
      properties:
        phoneNumber:
          type: string
          example: '+12065551212'
          description: Phone number available for guest calling.
        state:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          description: " * `ACTIVE` - Phone number is in the active state.\n * `INACTIVE` - Phone number is in the inactive state.\n"
          example: ACTIVE
        isMainNumber:
          type: boolean
          example: false
          description: Indicates whether this is the location's main number.
    SimultaneousRingCriteriaPost:
      type: object
      required:
      - scheduleName
      - scheduleType
      - scheduleLevel
      - callsFrom
      - ringEnabled
      properties:
        scheduleName:
          type: string
          example: Business Vacation
