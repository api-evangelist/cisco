        scheduleLevel:
          $ref: '#/components/schemas/ScheduleLevel'
        callsFrom:
          $ref: '#/components/schemas/CallsFromType'
        anonymousCallersEnabled:
          type: boolean
          example: true
          description: When `true`, the criteria applies to calls from anonymous callers. Value for this attribute is required if `callsFrom` is `SELECT_PHONE_NUMBERS`.
        unavailableCallersEnabled:
          type: boolean
          example: true
          description: When `true`, the criteria applies to calls from unavailable callers. Value for this attribute is required if `callsFrom` is `SELECT_PHONE_NUMBERS`.
        phoneNumbers:
          type: array
          items:
            type: string
            example: '+19064441748'
          description: The list of phone numbers that will checked against incoming calls for a match. Value for this attribute is required if `callsFrom` is `SELECT_PHONE_NUMBERS`.
          example:
