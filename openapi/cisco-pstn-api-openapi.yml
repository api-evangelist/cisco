                  displayName: Premises-based PSTN
                  pstnServices:
                  - GEOGRAPHIC_NUMBERS
                - id: Y2lzY29zcGFyazovL3VzL1BTVE5fQ09OTkVDVElPTi9kMDk0MTc4Zi04MThlLTQ1YmMtYjEwMS1hOGRkNDhjMTM5MjE
                  displayName: SI CCP Bandwidth
                  pstnServices:
                  - GEOGRAPHIC_NUMBERS
