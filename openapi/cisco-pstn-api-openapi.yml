                    - address1: 3487 Chase Ave
                      address2: Apt 112
                      city: Miami Beach
                      state: FL
                      postalCode: '33140'
                      country: US
                      meta:
                        houseNumber: '3487'
                        streetName: Chase Ave
                        country: US
                        state: FL
                        city: Miami Beach
                        zipCode: '33140'
                        latitude: '25.8131'
                        longitude: '-80.1300'
                addressWithErrorsExample:
