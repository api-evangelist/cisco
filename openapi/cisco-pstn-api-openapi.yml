components:
  schemas:
    SetUpPSTNLocationConnectionObject:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfUElDS1VQL1kyRnNiRkJwWTJ0MWNERT0
          description: A unique identifier for the connection. This is required for non-integrated CCP.
        premiseRouteType:
          type: string
          example: TRUNK
          description: Premise route type. The possible types are TRUNK and ROUTE_GROUP. This is required for the local gateway.
        premiseRouteId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1RSVU5LLzUxZGU0ODljLWFhNjAtNGMyNS05YWY2LWNjNGNiMTcxNzMxZg
          description: Premise route ID. This refers to either a Trunk ID or a Route Group ID and is required for the local gateway.
    PSTNType:
      type: string
      enum:
      - LOCAL_GATEWAY
      - NON_INTEGRATED_CCP
      - INTEGRATED_CCP
      - CISCO_PSTN
      description: " * `LOCAL_GATEWAY` - PSTN connection type for a premises-based connection.\n * `NON_INTEGRATED_CCP` - PSTN connection type for a Non-Integrated Cloud Connected PSTN connection.\n * `INTEGRATED_CCP` - PSTN connection type for an Integrated Cloud Connected PSTN connection. Updating the location with this connection type is currently not supported using the API.\n * `CISCO_PSTN` - PSTN connection type for a Cisco PSTN connection. Updating the location with this connection type is currently not supported using the API.\n"
    ConnectionOptionsResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfUElDS1VQL1kyRnNiRkJwWTJ0MWNERT0
          description: A unique identifier for the connection.
        displayName:
          type: string
          example: Premises-based PSTN
          description: The display name of the PSTN connection.
        pstnServices:
          type: array
          items:
            $ref: '#/components/schemas/PSTNServiceType'
          description: The PSTN services available for this connection.
    ModifyNumbersActionOrderNumber:
      type: object
      required:
      - number
      - status
      - usage
      properties:
        number:
          type: string
          description: Phone number.
        status:
          type: string
          description: 'Number-level action status.


            - `SUCCESS` — The action completed successfully for the number.

            - `FAILED` — The action failed for the number.

            - `PENDING` — The action is still being processed for the number.'
          enum:
          - SUCCESS
          - FAILED
          - PENDING
        usage:
          type: string
          description: 'Final number usage type.


            - `NONE` — Standard number usage.

            - `SERVICE` — Service number usage.

            - `ELIN` — Emergency Location Identification Number usage.'
          enum:
          - NONE
          - SERVICE
          - ELIN
        errors:
          type: array
          description: Validation or execution errors for this number.
          items:
            $ref: '#/components/schemas/ModifyNumbersActionError'
    ModifyNumberAction:
      type: string
      enum:
      - modifyElin
      - modifyStandard
      - modifyService
      description: 'Supported number usage actions.


        - `modifyElin` — Change the number usage to ELIN (Emergency Location Identification Number).

        - `modifyStandard` — Change the number usage to standard, which supports regular calling.

        - `modifyService` — Change the number usage to service, which is intended for calling features such as Auto Attendant, Call Queue, Hunt Groups, or Webex Contact Center.'
    AddressLookupErrorObject:
      type: object
      description: Object containing details about an error encountered during address lookup.
      properties:
        code:
          type: string
          description: Error code.
          example: PMP4004
        title:
          type: string
          description: Error title.
          example: INVALID_STREET_ADDRESS
        detail:
          type: string
          description: Detailed error message.
          example: The street address provided is invalid.
    ModifyNumbersGetResponse:
      type: object
      required:
      - phoneNumbers
      properties:
        phoneNumbers:
          type: array
          description: All eligible modifiable numbers within the server-side candidate window, returned in a single non-paginated response.
          items:
            $ref: '#/components/schemas/ModifiableNumber'
      example:
        phoneNumbers:
        - phoneNumber: '+14155551234'
          state: ACTIVE
          isServiceNumber: false
          tollFreeNumber: false
          mainNumber: false
          isELIN: true
          isReservedNumber: false
          telephonyType: PSTN_NUMBER
    ConnectionResponse:
      type: object
      required:
      - id
      - pstnConnectionType
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfUElDS1VQL1kyRnNiRkJwWTJ0MWNERT0
          description: A unique identifier for the connection.
        displayName:
          type: string
          example: Premises-based PSTN
          description: The display name of the PSTN connection.
        pstnServices:
          type: array
          items:
            $ref: '#/components/schemas/PSTNServiceType'
          description: The PSTN services available for this connection.
        pstnConnectionType:
          $ref: '#/components/schemas/PSTNType'
          description: The PSTN connection type set for the location.
        routeType:
          $ref: '#/components/schemas/PremiseRouteType'
          description: Premise route type. This is required if connection type is LOCAL_GATEWAY.
        routeId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1RSVU5LL2Y1YTU4MzAwLTVmZTYtNGNjMS1hODA3LTRlN2E5OTMzN2Q0ZA
          description: Premise route ID. This refers to either a Trunk ID or a Route Group ID. This field is optional but required if the connection type is LOCAL_GATEWAY.
    AllowedServiceTypesFromHydra:
      type: string
      enum:
      - MOBILE_NUMBERS
      description: ' * `MOBILE_NUMBERS` - PSTN service type for mobile numbers.

        '
    PremiseRouteType:
      type: string
      enum:
      - ROUTE_GROUP
      - TRUNK
      description: " * `ROUTE_GROUP` - A route group has been selected for premises-based PSTN.\n * `TRUNK` - A trunk group has been selected for premises-based PSTN.\n"
    EmergencyAddressObject:
      type: object
      description: Object containing emergency address details.
      properties:
        address1:
          type: string
          example: 3487 Chase Ave
          description: Primary street information for the emergency address.
        address2:
          type: string
          example: Apt 112
          description: Apartment number or any other secondary information for the emergency address.
        city:
          type: string
          example: Miami Beach
          description: City for the emergency address.
        state:
          type: string
          example: FL
          description: State or Province or Region for the emergency address.
        postalCode:
          type: string
          example: '33140'
          description: Postal code for the emergency address.
        country:
          type: string
          example: US
          description: Country for the emergency address.
    PSTNServiceType:
      type: string
      enum:
      - GEOGRAPHIC_NUMBERS
      - TOLLFREE_NUMBERS
      - BUSINESS_TEXTING
      - CONTACT_CENTER
      - SERVICE_NUMBERS
      - NON_GEOGRAPHIC_NUMBERS
      - MOBILE_NUMBERS
      description: " * `GEOGRAPHIC_NUMBERS` - PSTN service type for geographic numbers.\n * `TOLLFREE_NUMBERS` - PSTN service type for toll-free numbers.\n * `BUSINESS_TEXTING` - PSTN service type for business texting.\n * `CONTACT_CENTER` - PSTN service type for contact center services.\n * `SERVICE_NUMBERS` - PSTN service type for service numbers.\n * `NON_GEOGRAPHIC_NUMBERS` - PSTN service type for non-geographic numbers.\n * `MOBILE_NUMBERS` - PSTN service type for mobile numbers.\n"
    ConnectionOptionsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionOptionsResponse'
          description: The list of PSTN connection options available for this location.
    ModifyNumbersActionOrder:
      type: object
      required:
      - orderId
      - status
      - numbers
      properties:
        orderId:
          type: string
          description: Order identifier in Webex format.
          example: Y2lzY29zcGFyazovL3VzL09SREVSL2E2NGM5OWM0LTk4MDItNGY0YS04ZWMwLTUzMjIwZDhmZWFiYw
        status:
          type: string
          description: 'Order status.


            - `PENDING` — The order is waiting to be processed.

            - `PARTIAL` — The order completed with only some number actions succeeding.

            - `COMPLETE` — The order completed successfully.

            - `PROVISIONED` — The requested number changes were successfully provisioned.

            - `ERROR` — The order failed.'
          enum:
          - PENDING
          - PARTIAL
          - COMPLETE
          - PROVISIONED
          - ERROR
        numbers:
          type: array
          description: Results for the phone numbers included in the order.
          items:
            $ref: '#/components/schemas/ModifyNumbersActionOrderNumber'
        errors:
          type: array
          description: Validation or provisioning errors associated with the order.
          items:
            $ref: '#/components/schemas/ModifyNumbersActionError'
    ModifyNumbersActionRequest:
      type: object
      required:
      - numbers
      properties:
        numbers:
          type: array
          description: Phone numbers to process.
          minItems: 1
          items:
            type: string
            example: '+14155551234'
    ModifyNumbersActionResponse:
      type: object
      required:
      - orders
      properties:
        orders:
          type: array
          description: Number action orders created by the request.
          items:
            $ref: '#/components/schemas/ModifyNumbersActionOrder'
      example:
        orders:
        - orderId: Y2lzY29zcGFyazovL3VzL09SREVSL2E2NGM5OWM0LTk4MDItNGY0YS04ZWMwLTUzMjIwZDhmZWFiYw
          status: PROVISIONED
          numbers:
          - number: '+14155551234'
            status: SUCCESS
            usage: ELIN
    ModifyNumbersActionError:
      type: object
      required:
      - errorCode
      properties:
        number:
          type: string
          description: Phone number associated with the error.
        errorType:
          type: string
          description: Category of the error, such as `VERIFICATION` or `FAILED`.
        errorCode:
          type: string
          description: Stable machine-readable error code, such as `ERR.V.TRM.TMN60045`.
        errorTitle:
          type: string
          description: Stable symbolic title associated with the error code, such as `NUMBER_HAS_BUSINESS_TEXTING`.
        errorMessage:
          type: string
          description: Human-readable explanation of the error. Defaults to the message associated with `errorCode` and may contain more specific runtime detail.
    SuggestedEmergencyAddressObject:
      type: object
      description: Object containing suggested address details.
      properties:
        address1:
          type: string
          example: 3487 Chase Ave
          description: Primary street information for the emergency address.
        address2:
          type: string
          example: Apt 112
          description: Apartment number or any other secondary information for the emergency address.
        city:
          type: string
          example: Miami Beach
          description: City for the emergency address.
        state:
          type: string
          example: FL
          description: State or Province or Region for the emergency address.
        postalCode:
          type: string
          example: '33140'
          description: Postal code for the emergency address.
        country:
          type: string
          example: US
          description: Country for the emergency address.
        meta:
          type: object
          description: Additional metadata for the emergency address.
          additionalProperties:
            type: string
          example:
            houseNumber: '3487'
            streetName: Chase Ave
            country: US
            state: FL
            city: Miami Beach
            zipCode: '33140'
            latitude: '55.21913'
            longitude: '-118.80616'
        errors:
          type: array
          description: List of errors encountered during address validation. Returned only when the input address was corrected and a suggested address was provided. Each error describes a specific issue with the original input.
          items:
            $ref: '#/components/schemas/AddressLookupErrorObject'
          example:
          - code: PMP4004
            title: INVALID_STREET_ADDRESS
            detail: The street address provided is invalid.
    ModifiableNumber:
      type: object
      required:
      - phoneNumber
      - isServiceNumber
      - tollFreeNumber
      - mainNumber
      - isELIN
      - isReservedNumber
      - telephonyType
      properties:
        phoneNumber:
          type: string
          description: Phone number in E.164 format.
        state:
          type:
          - string
          - 'null'
          description: 'Phone number state.


            - `ACTIVE` — The phone number is active.

            - `INACTIVE` — The phone number is inactive.'
          enum:
          - ACTIVE
          - INACTIVE
        isServiceNumber:
          type: boolean
          description: Indicates whether this is a service number.
        tollFreeNumber:
          type: boolean
          description: Indicates whether this is a toll-free number.
        mainNumber:
          type: boolean
          description: Indicates whether this is the location main number.
        isELIN:
          type: boolean
          description: Indicates whether this number is currently an ELIN.
        isReservedNumber:
          type: boolean
          description: Indicates whether this is a reserved number.
        telephonyType:
          type: string
          description: 'Telephony type.


            - `PSTN_NUMBER` — A standard PSTN number.

            - `MOBILE_NUMBER` — A mobile telephone number.'
          enum:
          - PSTN_NUMBER
          - MOBILE_NUMBER
  securitySchemes:
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearerAuth:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
