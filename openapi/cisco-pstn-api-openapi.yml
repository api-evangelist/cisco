  /telephony/pstn/locations/{locationId}/numbers/availableNumbers:
    get:
      summary: Get Modifiable Numbers
      operationId: getModifiableNumbers
      description: 'Retrieve modifiable numbers for a location based on action type.


        The required `action` query parameter specifies the operation used to identify eligible numbers.


        This endpoint does not support pagination. Up to a configurable server-side maximum of candidate numbers (default 2000) are retrieved and filtered for eligibility, and all eligible numbers within that candidate window are returned in a single response.


        A phone number''s usage type determines how it is used within a Webex Calling location. `STANDARD` numbers support regular calling and can be assigned to people, workspaces, or features. `SERVICE` numbers support services such as Auto Attendant, Call Queue, Hunt Groups, and Webex Contact Center. `ELIN` (Emergency Location Identification Number) numbers provide emergency services with accurate caller information and support callbacks to the person or workspace that initiated the emergency call, including people with extension-only lines.


        Viewing number availability requires an administrator auth token with a scope of `spark-admin:telephony_pstn_read`.'
      tags:
      - PSTN
      parameters:
      - name: locationId
        in: path
        required: true
        description: Location identifier in Webex format.
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzM2ZTFlM2Y1LWJhODEtNDRiNC05ZGQ1LWIyMmVlNGY1MDIyZA
        schema:
          type: string
      - name: action
        in: query
        required: true
        description: Action type for modifiable numbers.
        schema:
          $ref: '#/components/schemas/ModifyNumberAction'
        example: modifyElin
      - name: orgId
        in: query
        required: false
        description: Organization ID. If not specified, uses the organization from the OAuth token.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyNumbersGetResponse'
              example:
                phoneNumbers:
                - phoneNumber: '+14155551234'
                  state: ACTIVE
                  isServiceNumber: false
                  tollFreeNumber: false
                  mainNumber: false
                  isELIN: true
                  isReservedNumber: false
                  telephonyType: PSTN_NUMBER
        '400':
          description: 'Bad Request: Invalid or missing action value.'
        '401':
          description: 'Unauthorized: Authentication credentials were missing or incorrect.'
        '403':
          description: 'Forbidden: The request is understood, but access is not allowed.'
        '404':
          description: 'Not Found: Location not found or feature not enabled.'
        '429':
          description: 'Too Many Requests: The request was rate-limited.'
        '500':
          description: 'Internal Server Error: Unexpected server-side failure.'
  /telephony/pstn/locations/{locationId}/numbers:
    post:
      summary: Perform Numbers Action
      operationId: performNumbersAction
      description: 'Perform number usage action for the specified list of numbers. The required `action` query parameter specifies the operation to apply to the numbers in the request body. The API supports modifying number usage between STANDARD/SERVICE/ELIN.


        A phone number''s usage type determines how it is used within a Webex Calling location. `STANDARD` numbers support regular calling and can be assigned to people, workspaces, or features. `SERVICE` numbers support services such as Auto Attendant, Call Queue, Hunt Groups, and Webex Contact Center. `ELIN` (Emergency Location Identification Number) numbers provide emergency services with accurate caller information and support callbacks to the person or workspace that initiated the emergency call, including people with extension-only lines.


        Executing number actions requires an administrator auth token with a scope of `spark-admin:telephony_pstn_write`.'
      tags:
      - PSTN
      parameters:
      - name: locationId
        in: path
        required: true
        description: Location identifier in Webex format.
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzM2ZTFlM2Y1LWJhODEtNDRiNC05ZGQ1LWIyMmVlNGY1MDIyZA
        schema:
          type: string
      - name: action
        in: query
        required: true
        description: Action to execute.
        schema:
          $ref: '#/components/schemas/ModifyNumberAction'
        example: modifyElin
      - name: orgId
        in: query
        required: false
        description: Organization ID. If not specified, uses the organization from the OAuth token.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyNumbersActionRequest'
            example:
              numbers:
              - '+14155551234'
              - '+14155555678'
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyNumbersActionResponse'
              example:
                orders:
