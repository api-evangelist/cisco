        schema:
          type: string
      - name: addressId
        in: path
        description: Unique identifier for the emergency address that will be updated.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0VNRVJHRU5DWV9BRERSRVNTLzhiMjdlM2JiLWY5Y2EtNDkyYi05YWM5LWVkZGEzN2EwY2IzZA
        schema:
          type: string
      - name: orgId
        in: query
