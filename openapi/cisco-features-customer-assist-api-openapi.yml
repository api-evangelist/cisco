        Returns people with a Webex Calling Professional license across all locations visible to the caller''s authorization. Workspaces and virtual lines are not included.


        Calls from call queues are routed to assigned agents based on configuration. An agent can be assigned to one or more call queues and can be managed by supervisors.


        Retrieving this list requires a full, read-only or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - 'Features: Customer Assist'
      parameters:
      - name: locationId
        in: query
        description: The location ID of the call queue. Temporary mandatory query parameter, used for performance reasons only and not a filter.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
        schema:
          type: string
      - name: orgId
        in: query
        description: List available agents for this organization. If omitted, uses the organization associated with the OAuth token.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: hasCxEssentials
        in: query
        description: Filter agents by Customer Assist license status. When `true`, returns only agents with Customer Assist license. When `false`, returns only agents with Customer Experience Basic license. When omitted, returns all eligible agents regardless of license type.
