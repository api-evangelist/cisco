      summary: Create a Selective Call Forwarding Rule for a Hunt Group
      operationId: createHuntGroupSelectiveCallForwardingRule
      description: 'Create a Selective Call Forwarding Rule for the designated Hunt Group.


        A selective call forwarding rule for a hunt group allows calls to be forwarded or not forwarded to the designated number, based on the defined criteria.


        Note that the list of existing call forward rules is available in the hunt group''s call forwarding settings.


        Creating a selective call forwarding rule for a hunt group requires a full administrator or location administrator auth token with a scope of `spark-admin:telephony_config_write`.


        **NOTE**: The Call Forwarding Rule ID will change upon modification of the Call Forwarding Rule name.'
      tags:
      - 'Features:  Hunt Group'
      parameters:
      - name: locationId
        in: path
        description: Location in which this hunt group exists.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
        schema:
          type: string
      - name: huntGroupId
        in: path
        description: Create the rule for this hunt group.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0hVTlRfR1JPVVAvYUhaaFpUTjJNRzh5YjBBMk5EazBNVEk1Tnk1cGJuUXhNQzVpWTJ4a0xuZGxZbVY0TG1OdmJRPT0
        schema:
          type: string
      - name: orgId
        in: query
        description: Create the hunt group rule for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: New Selective Rule
              holidaySchedule: HolidayScheduleOne
              businessSchedule: BusinessScheduleTwo
