      summary: Switch Mode for Call Forwarding Settings for a Hunt Group
      operationId: switchHuntGroupCallForwardingMode
      description: 'Switches the current operating mode of the `Hunt Group` to the mode as per normal operations.


        Operating modes allow call forwarding to be configured based on predefined schedules, enabling different routing behaviors during business hours, after hours, or holidays.


        Switching operating mode for a `hunt group` requires a full, or location administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - 'Features:  Hunt Group'
      parameters:
      - name: locationId
        in: path
        description: '`Location` in which this `hunt group` exists.'
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2E4Mjg5NzIyLTFiODAtNDFiNy05Njc4LTBlNzdhZThjMTA5OA
        schema:
          type: string
      - name: huntGroupId
        in: path
        description: Switch operating mode to normal operations for this `hunt group`.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0hVTlRfR1JPVVAvMzk1ODc4ZGEtZmZmZS00YTI2LWJlOTctMjdhZmZmOTgxYTIy
        schema:
          type: string
      - name: orgId
        in: query
        description: Switch operating mode as per normal operations for the `hunt group` from this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example: {}
            schema:
              type: object
              properties: {}
components:
  schemas:
    DirectLineCallerIdNameObject:
      type: object
      properties:
        selection:
          $ref: '#/components/schemas/SelectionObject'
          description: The selection of the direct line caller ID name. Defaults to `DISPLAY_NAME`.
        customName:
          type: string
          example: Hakim Smith
          description: The custom direct line caller ID name. Required if `selection` is set to `CUSTOM_NAME`.
      description: Settings for the direct line caller ID name to be shown for this workspace.
    PostPersonPlaceVirtualLineHuntGroupObject:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80NDVkMzMzMC1mNjE3LTExZWItOWQyZS01NzViODE3ZGE1NmE
          description: ID of person, workspace or virtual line.
        weight:
          type: string
          example: '50'
          description: Weight of person, workspace or virtual line. Only applied when call policy is `WEIGHTED`.
    ListHuntGroupObject:
      type: object
      required:
      - id
      - name
      - locationName
      - locationId
      - enabled
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0hVTlRfR1JPVVAvYUhaaFpUTjJNRzh5YjBBMk5EazBNVEk1Tnk1cGJuUXhNQzVpWTJ4a0xuZGxZbVY0TG1OdmJRPT0
          description: A unique identifier for the hunt group.
        name:
          type: string
          example: '5714328359'
          description: Unique name for the hunt group.
        locationName:
          type: string
          example: WXCSIVDKCPAPIC4S1
          description: Name of the location for the hunt group.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
          description: ID of location for hunt group.
        phoneNumber:
          type: string
          example: '+15558675309'
          description: Primary phone number of the hunt group.
        extension:
          type: string
          example: '7781'
          description: Primary phone extension of the hunt group.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of location.
        esn:
          type: string
          example: '12347781'
          description: Routing prefix + extension of a person or workspace.
        enabled:
          type: boolean
          example: true
          description: Whether or not the hunt group is enabled.
    NumberOwnerType:
      type: string
      enum:
      - PLACE
      - PEOPLE
      - VIRTUAL_LINE
      - AUTO_ATTENDANT
      - CALL_QUEUE
      - GROUP_PAGING
      - HUNT_GROUP
      - VOICE_MESSAGING
      - OFFICE_ANYWHERE
      - CONTACT_CENTER_LINK
      - CONTACT_CENTER_ADAPTER
      - ROUTE_LIST
      - VOICEMAIL_GROUP
      - COLLABORATE_BRIDGE
      description: " * `PLACE` - PSTN phone number's owner is a workspace.\n * `PEOPLE` - PSTN phone number's owner is a person.\n * `VIRTUAL_LINE` - PSTN phone number's owner is a Virtual Profile.\n * `AUTO_ATTENDANT` - PSTN phone number's owner is an auto-attendant.\n * `CALL_QUEUE` - PSTN phone number's owner is a call queue.\n * `GROUP_PAGING` - PSTN phone number's owner is a group paging.\n * `HUNT_GROUP` - PSTN phone number's owner is a hunt group.\n * `VOICE_MESSAGING` - PSTN phone number's owner is a voice messaging.\n * `OFFICE_ANYWHERE` - PSTN phone number's owner is a Single Number Reach.\n * `CONTACT_CENTER_LINK` - PSTN phone number's owner is a Contact Center link.\n * `CONTACT_CENTER_ADAPTER` - PSTN phone number's owner is a Contact Center adapter.\n * `ROUTE_LIST` - PSTN phone number's owner is a route list.\n * `VOICEMAIL_GROUP` - PSTN phone number's owner is a voicemail group.\n * `COLLABORATE_BRIDGE` - PSTN phone number's owner is a collaborate bridge.\n"
    CreateHuntGroupObject:
      type: object
      required:
      - name
      - callPolicies
      - agents
      - enabled
      properties:
        name:
          type: string
          example: 5558675309-Group
          description: Unique name for the hunt group.
        phoneNumber:
          type: string
          example: '+15558675309'
          description: Primary phone number of the hunt group. Either phone number or extension are required.
        extension:
          type: string
          example: '7781'
          description: Primary phone extension of the hunt group. Either phone number or extension are required.
        languageCode:
          type: string
          example: en-US
          description: Language code.
        firstName:
          type: string
          example: Hakim
          description: First name to be shown when calls are forwarded out of this hunt group. Defaults to `.`. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        lastName:
          type: string
          example: Smith
          description: Last name to be shown when calls are forwarded out of this hunt group. Defaults to the phone number if set, otherwise defaults to call group name. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        timeZone:
          type: string
          example: America/Chicago
          description: Time zone for the hunt group.
        callPolicies:
          $ref: '#/components/schemas/PostHuntGroupCallPolicyObject'
          description: Policy controlling how calls are routed to agents.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/PostPersonPlaceVirtualLineHuntGroupObject'
          description: People, workspaces and virtual lines that are eligible to  receive calls.
        enabled:
          type: boolean
          example: true
          description: Whether or not the hunt group is enabled.
        huntGroupCallerIdForOutgoingCallsEnabled:
          type: boolean
          example: true
          description: Enable the hunt group to be used as the caller ID when the agent places outgoing calls. When set to true the hunt group's caller ID will be used.
        directLineCallerIdName:
          $ref: '#/components/schemas/DirectLineCallerIdNameObject'
          description: Settings for the direct line caller ID name to be shown for this hunt group.
        dialByName:
          type: string
          example: Hakim Smith
          description: The name to be used for dial by name functions.  Characters of `%`,  `+`, `\`, `"` and Unicode characters are not allowed.
    GetHuntGroupObject:
      type: object
      required:
      - id
      - name
      - enabled
      - distinctiveRing
      - alternateNumbers
