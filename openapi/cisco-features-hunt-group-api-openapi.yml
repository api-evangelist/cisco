              callsTo:
                numbers: []
              forwardTo:
                selection: FORWARD_TO_SPECIFIED_NUMBER
                phoneNumber: '+12056350001'
              enabled: true
            schema:
              $ref: '#/components/schemas/CreateForwardingRuleObject'
