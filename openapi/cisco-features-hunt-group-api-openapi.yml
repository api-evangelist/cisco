    HuntPolicySelection:
      type: string
      enum:
      - CIRCULAR
      - REGULAR
      - SIMULTANEOUS
      - UNIFORM
      - WEIGHTED
      description: " * `CIRCULAR` - This option cycles through all agents after the last agent that took a call. It sends calls to the next available agent. This is supported for `SKILL_BASED`.\n * `REGULAR` - Send the call through the queue of agents in order, starting from the top each time. This is supported for `SKILL_BASED`.\n * `SIMULTANEOUS` - Sends calls to all agents at once\n * `UNIFORM` - Sends calls to the agent that has been idle the longest. If they don't answer, proceed to the next agent who has been idle the second longest, and so on until the call is answered. This is supported for `SKILL_BASED`.\n * `WEIGHTED` - Sends calls to idle agents based on percentages you assign to each agent (up to 100%).\n"
    CallForwardRulesGet:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfRk9SV0FSRElOR19TRUxFQ1RJVkVfUlVMRS9kR1Z6ZEZKMWJHVTA
          description: Unique ID for the rule.
        name:
          type: string
          example: My Rule
          description: Unique name of rule.
        callFrom:
          type: string
          example: Any private Number,2025551212
          description: Comma-separated list of incoming call numbers that, when matched, will not be forwarded. A Limit of 12 numbers is allowed. Use `Any private Number` in the comma-separated value to indicate rules that match incoming calls from a private number. Use `Any unavailable number` in the comma-separated value to match incoming calls from an unavailable number.
        callsTo:
          type: string
          example: Primary
          description: Comma-separated list of the types of numbers being matched for incoming call destination.
        forwardTo:
          type: string
          example: '2025557736'
          description: Number to which calls will be forwarded if the rule is of type "Forward To" and the incoming call is matched.
        enabled:
          type: boolean
          example: true
          description: Reflects if rule is enabled.
    ModesPatch:
      type: object
      required:
      - normalOperationEnabled
      - id
      - forwardTo
      properties:
        normalOperationEnabled:
          type: boolean
          example: true
          description: Normal operation is enabled or disabled.
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09QRVJBVElOR19NT0RFL2JiOTc1OTcxLTBjZWYtNDdhNi05Yzc5LTliZWFjY2IwYjg4Mg
          description: The ID of the operating mode.
        forwardTo:
          type: object
          required:
          - selection
          properties:
            selection:
              type: string
              enum:
              - FORWARD_TO_DEFAULT_NUMBER
              - FORWARD_TO_SPECIFIED_NUMBER
              - DO_NOT_FORWARD
              description: "The selection for forwarding.\n * `FORWARD_TO_DEFAULT_NUMBER` - When the rule matches, forward to the destination for the hunt group.\n * `FORWARD_TO_SPECIFIED_NUMBER` - When the rule matches, forward to the destination for this rule.\n * `DO_NOT_FORWARD` - When the rule matches, do not forward to another number.\n"
            destination:
              type: string
              example: '+19705550006'
              description: The destination for forwarding. Required when the selection is set to `FORWARD_TO_SPECIFIED_NUMBER`.
            destinationVoicemailEnabled:
              type: boolean
              description: Sending incoming calls to voicemail is enabled/disabled when the destination is an internal phone number and that number has the voicemail service enabled.
          description: Forward to settings.
    GetForwardingRuleObject:
      type: object
      required:
      - name
      - id
      - callsFrom
      - callsTo
      properties:
        name:
          type: string
          example: New Selective Rule
          description: Unique name for the selective rule in the hunt group.
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfRk9SV0FSRElOR19TRUxFQ1RJVkVfUlVMRS9kR1Z6ZEZKMWJHVTA
          description: Unique ID for the rule.
        enabled:
          type: boolean
          example: true
          description: Reflects if rule is enabled.
        holidaySchedule:
          type: string
          example: HolidayScheduleOne
          description: Name of the location's holiday schedule which determines when this selective call forwarding rule is in effect.
        businessSchedule:
          type: string
          example: BusinessScheduleTwo
          description: Name of the location's business schedule which determines when this selective call forwarding rule is in effect.
        forwardTo:
          type: object
          required:
          - selection
          properties:
            selection:
              type: string
              enum:
              - FORWARD_TO_DEFAULT_NUMBER
              - FORWARD_TO_SPECIFIED_NUMBER
              - DO_NOT_FORWARD
              description: "Controls what happens when the rule matches.\n * `FORWARD_TO_DEFAULT_NUMBER` - When the rule matches, forward to the destination for the hunt group.\n * `FORWARD_TO_SPECIFIED_NUMBER` - When the rule matches, forward to the destination for this rule.\n * `DO_NOT_FORWARD` - When the rule matches, do not forward to another number.\n"
            phoneNumber:
              type: string
              example: '+15558675309'
              description: Phone number used if selection is `FORWARD_TO_SPECIFIED_NUMBER`.
          description: Controls what happens when the rule matches including the destination number for the call forwarding.
        callsFrom:
          type: object
          required:
          - selection
          - customNumbers
          properties:
            selection:
              type: string
              enum:
              - ANY
              - CUSTOM
              description: "If `CUSTOM`, use `customNumbers` to specify which incoming caller ID values cause this rule to match. `ANY` means any incoming call matches assuming the rule is in effect based on the associated schedules.\n * `ANY` - Rule matches for calls from any number.\n * `CUSTOM` - Rule matches based on the numbers and options in `customNumbers`.\n"
            customNumbers:
              type: object
              required:
              - privateNumberEnabled
              - unavailableNumberEnabled
              properties:
                privateNumberEnabled:
                  type: boolean
                  description: Match if caller ID indicates the call is from a private number.
                unavailableNumberEnabled:
                  type: boolean
                  description: Match if caller ID is unavailable.
                numbers:
                  type: array
                  items:
                    type: string
                  description: Array of number strings to be matched against incoming caller ID.
              description: Custom rules for matching incoming caller ID information.
          description: Settings related to the rule matching based on incoming caller ID.
        callsTo:
          type: object
          properties:
            numbers:
              type: array
              items:
                $ref: '#/components/schemas/CallForwardingNumbers'
              description: Array of numbers to be matched against the calling destination number.
          description: Settings related to the rule matching based on the destination number.
