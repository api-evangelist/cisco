    GetHuntGroupCallPolicyObject:
      type: object
      required:
      - policy
      - noAnswer
      properties:
        policy:
          $ref: '#/components/schemas/HuntPolicySelection'
          description: Call routing policy used to dispatch calls to agents.
        waitingEnabled:
          type: boolean
          example: true
          description: If `false`, then the option is treated as "Advance when busy". The hunt group won't ring agents when they're on a call and advances to the next agent. If a hunt group agent has call waiting enabled and the call is advanced to them, the call waits until that hunt group agent isn't busy.
        groupBusyEnabled:
          type: boolean
          example: true
          description: When `true`, the hunt group busy status will be set to busy. All new calls will get busy treatment. If `busyRedirect` is enabled, the calls are routed to the destination specified in `busyRedirect`.
        allowMembersToControlGroupBusyEnabled:
          type: boolean
          example: true
          description: When `true`, agents can change the hunt group busy status.
        noAnswer:
          type: object
          required:
          - nextAgentEnabled
          - nextAgentRings
          - forwardEnabled
          - numberOfRings
          - systemMaxNumberOfRings
          - destinationVoicemailEnabled
          properties:
            nextAgentEnabled:
              type: boolean
              example: true
              description: If enabled, advance to next agent after the `nextAgentRings` has occurred.
            nextAgentRings:
              type: number
              example: 3
              description: Number of rings before call will be forwarded if unanswered and `nextAgentEnabled` is true.
            forwardEnabled:
              type: boolean
              description: If `true`, forwards unanswered calls to the destination after the number of rings occurs.
            destination:
              type: string
              example: '2225551212'
              description: Destination if `forwardEnabled` is True.
            numberOfRings:
              type: number
              example: 15
              description: Number of rings before forwarding calls if `forwardEnabled` is true.
            systemMaxNumberOfRings:
              type: number
              example: 15
              description: System-wide maximum number of rings allowed for `numberOfRings` setting.
            destinationVoicemailEnabled:
              type: boolean
              description: If `destinationVoicemailEnabled` is true, enables and disables sending incoming to destination number's voicemail if the destination is an internal phone number and that number has the voicemail service enabled.
          description: Settings for when the call into the hunt group is not answered.
        busyRedirect:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: If `true`, calls are diverted to a defined phone number when all agents are busy, or when the hunt group busy status is set to busy.
            destination:
              type: string
              example: '2225551212'
              description: Destination for busy redirect.
            destinationVoicemailEnabled:
              type: boolean
              description: The enabled or disabled state of sending diverted incoming calls to the `destination` number's voicemail if the `destination` is an internal phone number and that number has the voicemail service enabled.
          description: Settings for sending calls to a specified destination when all agents are busy or when the hunt group busy status is set to busy.
        businessContinuityRedirect:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
              description: If `true`, unreachable, unanswered calls are diverted to a defined phone number. For persons with only a mobile device, calls won't be diverted if there is a network outage.
            destination:
              type: string
              example: '2225551212'
              description: Destination for business continuity redirect.
            destinationVoicemailEnabled:
              type: boolean
              description: The enabled or disabled state of sending diverted incoming calls to the `destination` number's voicemail if the `destination` is an internal phone number and that number has the voicemail service enabled.
          description: Settings for sending calls to a specified destination if the phone is not connected to the network for any reason, such as a power outage, failed internet connection, or wiring problem.
    CallForwardSettingsGet:
      type: object
      required:
      - callForwarding
      properties:
        callForwarding:
          type: object
          required:
          - always
          - selective
          properties:
            always:
              type: object
              required:
              - enabled
              - ringReminderEnabled
              - destinationVoicemailEnabled
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '`Always` call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for "Always" call forwarding.
                ringReminderEnabled:
                  type: boolean
                  description: If `true`, a brief tone will be played on the person's phone when a call has been forwarded.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Indicates enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
              description: Settings for forwarding all incoming calls to the destination you choose.
            selective:
              type: object
              required:
              - enabled
              - ringReminderEnabled
              - destinationVoicemailEnabled
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '`Busy` call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for `Busy` call forwarding.
                ringReminderEnabled:
                  type: boolean
                  description: If `true`, a brief tone will be played on the person's phone when a call has been forwarded.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Indicates enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
              description: Selectively forward calls to a designated number, depending on criteria rules. You'll need to have at least one rule for forwarding applied for call forwarding to be active.
            rules:
              type: array
              items:
                $ref: '#/components/schemas/CallForwardRulesGet'
              description: Rules for selectively forwarding calls.
            operatingModes:
              type: object
              required:
              - enabled
              - currentOperatingModeId
              - exceptionType
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: Operating modes are enabled or disabled.
                currentOperatingModeId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL09QRVJBVElOR19NT0RFL2JiOTc1OTcxLTBjZWYtNDdhNi05Yzc5LTliZWFjY2IwYjg4Mg
                  description: The ID of the current operating mode.
                exceptionType:
                  type: string
                  enum:
                  - MANUAL_SWITCH_BACK
                  - AUTOMATIC_SWITCH_BACK_EARLY_START
                  - AUTOMATIC_SWITCH_BACK_EXTENSION
                  - AUTOMATIC_SWITCH_BACK_STANDARD
                  description: "The exception type.\n * `MANUAL_SWITCH_BACK` - The mode was switched to or extended by the user for manual switch back and runs as an exception until the user manual switches the feature back to normal operation or a different mode.\n * `AUTOMATIC_SWITCH_BACK_EARLY_START` - The mode was switched to by the user before its start time and runs as an exception until its end time is reached at which point it automatically switches the feature back to normal operation.\n * `AUTOMATIC_SWITCH_BACK_EXTENSION` - The current mode was extended by the user before its end time and runs as an exception until the extension end time (mode's end time + extension of up to 12 hours) is reached at which point it automatically switches the feature back to normal operation.\n * `AUTOMATIC_SWITCH_BACK_STANDARD` - The mode will remain the current operating mode for the feature until its normal end time is reached.\n"
                modes:
                  type: array
                  items:
                    $ref: '#/components/schemas/ModesGet'
                  description: Operating modes.
              description: Settings related to operating modes.
          description: Settings related to `Always`, `Busy`, and `No Answer` call forwarding.
    TelephonyType:
      type: string
      enum:
      - PSTN_NUMBER
      description: ' * `PSTN_NUMBER` - The object is a PSTN number.

        '
    AlternateNumbersWithPattern:
      type: object
      required:
      - phoneNumber
      properties:
        phoneNumber:
          type: string
          example: '+12225555309'
          description: Alternate phone number for the hunt group.
        ringPattern:
          $ref: '#/components/schemas/RingPatternObject'
          description: Ring pattern for when this alternate number is called. Only available when `distinctiveRing` is enabled for the hunt group.
    SelectionObject:
      type: string
      enum:
      - CUSTOM_NAME
      - DISPLAY_NAME
      description: " * `DISPLAY_NAME` - When this option is selected, `displayName` is to be shown for this workspace.\n * `CUSTOM_NAME` - When this option is selected, `customName` is to be shown for this workspace."
    ModesGet:
      type: object
      required:
      - normalOperationEnabled
      - id
      - name
      - type
      - level
      - forwardTo
      properties:
        normalOperationEnabled:
          type: boolean
          example: true
          description: Normal operation is enabled or disabled.
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09QRVJBVElOR19NT0RFL2JiOTc1OTcxLTBjZWYtNDdhNi05Yzc5LTliZWFjY2IwYjg4Mg
          description: The ID of the operating mode.
        name:
          type: string
          example: Day
          description: The name of the operating mode.
        type:
          type: string
          enum:
          - NONE
          - SAME_HOURS_DAILY
          - DIFFERENT_HOURS_DAILY
          - HOLIDAY
          description: "The type of the operating mode.\n * `NONE` - The operating mode is not scheduled.\n * `SAME_HOURS_DAILY` - Single time duration for Monday-Friday and single time duration for Saturday-Sunday.\n * `DIFFERENT_HOURS_DAILY` - Individual time durations for every day of the week.\n * `HOLIDAY` - Holidays which have date durations spanning multiple days, as well as an optional yearly recurrence by day or date.\n"
        level:
          type: string
          enum:
          - LOCATION
          - ORGANIZATION
          description: "The level of the operating mode.\n * `LOCATION` - The operating mode is at the location level.\n * `ORGANIZATION` - The operating mode is at the organization level.\n"
        forwardTo:
          type: object
          required:
          - selection
          - destination
          - destinationVoicemailEnabled
          - defaultDestination
          - defaultDestinationVoicemailEnabled
          - defaultForwardToSelection
          properties:
            selection:
              type: string
              enum:
              - FORWARD_TO_DEFAULT_NUMBER
              - FORWARD_TO_SPECIFIED_NUMBER
              - DO_NOT_FORWARD
              description: "The selection for forwarding.\n * `FORWARD_TO_DEFAULT_NUMBER` - When the rule matches, the mode's own default forwarding selection is to be applied.\n * `FORWARD_TO_SPECIFIED_NUMBER` - When the rule matches, forward to the destination.\n * `DO_NOT_FORWARD` - When the rule matches, do not forward to another number.\n"
            destination:
              type: string
              example: '+19705550006'
              description: The destination for forwarding. Required when the selection is set to `FORWARD_TO_SPECIFIED_NUMBER`.
            destinationVoicemailEnabled:
              type: boolean
              description: Sending incoming calls to voicemail is enabled/disabled when the destination is an internal phone number and that number has the voicemail service enabled.
            defaultDestination:
              type: string
              example: '00000'
              description: The operating mode's destination.
            defaultDestinationVoicemailEnabled:
              type: boolean
              description: The operating mode's destination voicemail enabled.
            defaultForwardToSelection:
              type: string
              enum:
              - FORWARD_TO_SPECIFIED_NUMBER
              - DO_NOT_FORWARD
              description: "The operating mode's forward to selection.\n * `FORWARD_TO_SPECIFIED_NUMBER` - When the rule matches, forward to the destination.\n * `DO_NOT_FORWARD` - When the rule matches, do not forward to another number.\n"
          description: Forward to settings.
    STATE:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      description: " * `ACTIVE` - Phone number is in the active state.\n * `INACTIVE` - Phone number is in the inactive state.\n"
    CallForwardRulesSet:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfRk9SV0FSRElOR19TRUxFQ1RJVkVfUlVMRS9kR1Z6ZEZKMWJHVTA
          description: Unique ID for the rule.
        enabled:
          type: boolean
          example: true
          description: Reflects if rule is enabled.
    DirectLineCallerIdNameObjectForPut:
      type: object
      properties:
        selection:
          $ref: '#/components/schemas/SelectionObject'
